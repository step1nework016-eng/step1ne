<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>預約面談時段｜Step1ne 德仁管理顧問</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--bg:#ffffff;--line:#dfe4ec;--tx:#16202e;--tx2:#4d5c72;--tx3:#7c8899;
      --ac:#2f5fd8;--ac-soft:#eef3ff;--soft:#f6f8fb;--sans:-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.7}
.top{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{height:34px;width:auto;display:block}
.top .brand{font-size:13px;color:var(--tx3)}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 64px}
h1{font-size:23px;margin:0 0 6px}
.lead{color:var(--tx2);font-size:13.5px;margin:0 0 20px}
.sect{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}

/* ── ① 月曆：真的月曆格子，只負責「看這個月哪裡有開放時段」，
   本身不能點——選擇動作交給下面的週卡片，避免格子太小點不準。 */
.monthhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthhead b{font-size:15px}
.mnav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.mnav:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.mnav:disabled{opacity:.3;cursor:default}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.wdrow span{text-align:center;font-size:10.5px;color:var(--tx3);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mcell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12.5px;color:var(--tx3);position:relative}
.mcell.has{color:var(--tx);font-weight:600;background:var(--ac-soft)}
.mcell.has::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.mcell.today{outline:1.5px solid var(--ac);outline-offset:-1.5px}
.mcell.inwk{background:var(--ac);color:#fff}
.mcell.inwk::after{background:#fff}

/* ── ② 週卡片：選完月份後，實際可點的是這一排——只列這個月裡
   有開放時段的週，卡片顯示日期範圍＋總位數。 */
.weekstrip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:thin}
.weekstrip::-webkit-scrollbar{height:5px}
.weekstrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.wkcard{flex:0 0 auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  cursor:pointer;padding:9px 14px;text-align:center;font-family:inherit}
.wkcard b{display:block;font-size:13px}
.wkcard span{display:block;font-size:10.5px;color:var(--ac);font-weight:700;margin-top:3px}
.wkcard:hover{border-color:var(--ac)}
.wkcard.on{border-color:var(--ac);background:var(--ac)}
.wkcard.on b{color:#fff}
.wkcard.on span{color:#dbe6ff}

/* ── ③ 日期卡片：選完週之後，那一週裡有開放時段的日子。 */
.datestrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.datestrip::-webkit-scrollbar{height:5px}
.datestrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.daycard{flex:0 0 auto;width:68px;border:1.5px solid var(--line);border-radius:14px;
  background:#fff;cursor:pointer;padding:10px 4px 9px;text-align:center;
  font-family:inherit;transition:border-color .12s,background .12s}
.daycard .mon{font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.02em}
.daycard .num{font-size:22px;font-weight:800;color:var(--tx);line-height:1.15;margin:1px 0}
.daycard .wd{font-size:11px;color:var(--tx3)}
.daycard .cnt{margin-top:6px;font-size:10px;color:var(--ac);font-weight:700;
  background:var(--ac-soft);border-radius:20px;padding:2px 0}
.daycard.today .wd{color:var(--ac)}
.daycard:hover{border-color:var(--ac)}
.daycard.on{border-color:var(--ac);background:var(--ac)}
.daycard.on .mon,.daycard.on .wd{color:#dbe6ff}
.daycard.on .num{color:#fff}
.daycard.on .cnt{background:rgba(255,255,255,.22);color:#fff}

/* ── ④ 時段格子：不變，選完日期後出現。 */
.timehead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 10px}
.timehead b{font-size:14.5px}
.timehead span{font-size:11.5px;color:var(--tx3)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{padding:10px 6px;border:1px solid var(--line);border-radius:9px;background:#fff;
      font-size:13px;cursor:pointer;text-align:center;font-family:inherit;color:var(--tx);margin:0}
.slot:hover{border-color:var(--ac)}
.slot.on{border-color:var(--ac);background:#f3f7ff;color:var(--ac);font-weight:600}
.slot small{display:block;font-size:10px;color:var(--tx3);margin-top:2px}

.divider{border:0;border-top:1px solid var(--line);margin:14px 0}
.msg{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:13.5px;display:none;line-height:1.6}
.msg.err{display:block;background:#fdecea;border:1px solid #f3c2bc;color:#a5312a}
.msg.warn{display:block;background:#fff8e6;border:1px solid #f0dca8;color:#7a5a12}
.go{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;
    padding:15px;border-radius:10px;font-size:16px;font-weight:600;margin-top:16px}
.note{background:var(--soft);border:1px solid var(--line);border-radius:9px;
      padding:12px 14px;font-size:11.5px;color:var(--tx2);line-height:1.65;margin-top:14px}
</style>

<div class="top">
  <img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問">
  <span class="brand">德仁管理顧問</span>
</div>
<div class="wrap"><div id="app">載入中…</div></div>

<script>
const API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
const T = new URLSearchParams(location.search).get('t') || '';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const W = ['日','一','二','三','四','五','六'];
const todayStr = new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);

async function boot(){
  const app = document.getElementById('app');
  if(!T){ app.innerHTML='<h1>連結無效</h1><p class="lead">請用我們寄給您的信件裡的連結進入。</p>'; return; }
  let info, sl;
  try{
    info = await (await fetch(API+'/assessment/'+encodeURIComponent(T))).json();
    sl   = await (await fetch(API+'/slots')).json();
  }catch{ app.innerHTML='<h1>連線失敗</h1><p class="lead">請稍後再試一次。</p>'; return; }
  if(!info.ok){ app.innerHTML='<h1>連結無效</h1><p class="lead">'+esc(info.error||'')+'</p>'; return; }

  app.innerHTML = `
    <h1>預約面談時段</h1>
    <p class="lead">${esc(info.name||'')} 您好，您應徵的「${esc(info.job_title||'')}」已經通過顧問評估。<br>
      目前面談室有其他候選人正在進行中，請選一個方便的時段，我們會在時間到之前提醒您。</p>
    <div class="sect">
      <div id="monthbox"></div>
      <div id="weekbox"></div>
      <div id="datebox"></div>
      <div id="timebox"></div>
      <div class="msg" id="bmsg"></div>
    </div>
    <div class="note">面談大約 20–30 分鐘，由 AI 面談助理阿財進行。
      需要改時間的話，直接回覆我們寄給您的信就可以。</div>`;
  renderCalendar(sl.slots||[]);
}

// ── 資料整理：時段 → 依日期分組 → 依「週日開始的那一天」分週 → 依「YYYY-MM」分月 ──
let byDay = {};       // '2026-08-14' -> [{t,left,full}]
let weekOf = {};      // '2026-08-14' -> '2026-08-09'（那一週的週日）
let monthList = [];   // ['2026-08', ...] 有開放時段的月份，由早到晚
let monthIdx = 0;
let selectedWeek = null;
let selectedDay = null;

// ⚠️ 純日期字串（'YYYY-MM-DD'）的星期幾／日期加減，一律用 Date.UTC() 直接建構，
// 不要再用 new Date(d+'T00:00:00+08:00')——那個寫法會先轉成 UTC 再讀 getUTCDay()／
// getUTCDate()，凌晨時段跨日就少算一天，算出來的星期幾永遠差一天（真實案例：
// 2026-08-16 其實是週日，畫面卻一直顯示週六）。
function utcDate(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m-1, dd)); }
function wdIdx(d){ return utcDate(d).getUTCDay(); }
function addDays(d, n){ const dt = utcDate(d); dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); }

function sundayOf(d){
  const dt = utcDate(d);
  dt.setUTCDate(dt.getUTCDate() - dt.getUTCDay());
  return dt.toISOString().slice(0,10);
}

function renderCalendar(slots){
  const monthbox = document.getElementById('monthbox');
  if(!slots.length){ monthbox.innerHTML='<p class="lead">目前沒有可預約的時段，我們會另外寄信跟您安排。</p>'; return; }

  byDay = {}; weekOf = {};
  slots.forEach(s=>{
    const [d,t]=s.slot_at.split(' ');
    (byDay[d]=byDay[d]||[]).push({t,left:s.left,full:s.slot_at});
    weekOf[d] = sundayOf(d);
  });

  const months = Array.from(new Set(Object.keys(byDay).map(d=>d.slice(0,7)))).sort();
  monthList = months;
  monthIdx = 0;
  renderMonth();
}

function renderMonth(){
  const ym = monthList[monthIdx];
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(Date.UTC(y, m-1, 1));
  const startPad = first.getUTCDay();               // 這個月 1 號是週幾，前面要留幾格空白
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();

  let cells = '';
  for(let i=0;i<startPad;i++) cells += '<div class="mcell"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const d = `${ym}-${String(day).padStart(2,'0')}`;
    const has = !!byDay[d];
    const isToday = d === todayStr;
    cells += `<div class="mcell${has?' has':''}${isToday?' today':''}" data-d="${d}">${day}</div>`;
  }

  document.getElementById('monthbox').innerHTML = `
    <div class="monthhead">
      <button class="mnav" onclick="shiftMonth(-1)" ${monthIdx<=0?'disabled':''}>‹</button>
      <b>${y}年${m}月</b>
      <button class="mnav" onclick="shiftMonth(1)" ${monthIdx>=monthList.length-1?'disabled':''}>›</button>
    </div>
    <div class="wdrow">${W.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="mgrid">${cells}</div>`;

  renderWeeks(ym);
}

function shiftMonth(delta){
  const next = monthIdx + delta;
  if(next < 0 || next >= monthList.length) return;
  monthIdx = next;
  renderMonth();
}

function renderWeeks(ym){
  // 這個月裡，有開放時段的日子各自屬於哪一週（週日起算），彙整成週卡片。
  const daysInMonth = Object.keys(byDay).filter(d => d.startsWith(ym)).sort();
  const weeks = [];   // [{sunday, days:[...]}]
  const seen = new Set();
  daysInMonth.forEach(d=>{
    const wk = weekOf[d];
    if(seen.has(wk)) return;
    seen.add(wk);
    // 一週的完整日期範圍用「週日這天」往後推 6 天算週六，只是拿來當卡片標籤，
    // 不影響底下日期卡片只會列出「這個月、且真的有開放時段」的日子。
    const satLabel = addDays(wk, 6).slice(5).replace('-','/');
    weeks.push({ sunday: wk, label: `${wk.slice(5).replace('-','/')} - ${satLabel}` });
  });
  weeks.sort((a,b)=>a.sunday.localeCompare(b.sunday));

  const weekbox = document.getElementById('weekbox');
  if(!weeks.length){
    weekbox.innerHTML = '';
    document.getElementById('datebox').innerHTML = '';
    document.getElementById('timebox').innerHTML = '';
    return;
  }
  weekbox.innerHTML = `<div class="weekstrip">${weeks.map((w,i)=>{
    const cnt = Object.keys(byDay).filter(d=>weekOf[d]===w.sunday)
      .reduce((a,d)=>a+byDay[d].reduce((x,s)=>x+s.left,0),0);
    return `<button class="wkcard" data-wk="${w.sunday}" onclick="pickWeek('${w.sunday}')">
      <b>${w.label}</b><span>${cnt} 位</span>
    </button>`;
  }).join('')}</div>`;

  pickWeek(weeks[0].sunday);
}

function pickWeek(sunday){
  selectedWeek = sunday;
  document.querySelectorAll('.wkcard').forEach(el=>el.classList.toggle('on', el.dataset.wk===sunday));
  // 月曆格子上，把這一週的 7 天框出來，讓「選了哪一週」在月曆上看得到。
  const wkDays = Array.from({length:7}, (_,i)=>addDays(sunday, i));
  document.querySelectorAll('.mcell[data-d]').forEach(el=>{
    el.classList.toggle('inwk', wkDays.includes(el.dataset.d) && !!byDay[el.dataset.d]);
  });

  const days = Object.keys(byDay).filter(d=>weekOf[d]===sunday).sort();
  const datebox = document.getElementById('datebox');
  datebox.innerHTML = `<div class="datestrip">${days.map(d=>{
    const [,mo,dd] = d.split('-');
    const totalLeft = byDay[d].reduce((a,x)=>a+x.left,0);
    const isToday = d === todayStr;
    return `<button class="daycard${isToday?' today':''}" data-day="${d}" onclick="pickDay('${d}')">
      <div class="mon">${Number(mo)}月</div>
      <div class="num">${Number(dd)}</div>
      <div class="wd">${isToday?'今天':'週'+W[wdIdx(d)]}</div>
      <div class="cnt">${totalLeft} 位</div>
    </button>`;
  }).join('')}</div>`;

  pickDay(days[0]);
}

function pickDay(d){
  selectedDay = d;
  document.querySelectorAll('.daycard').forEach(el=>el.classList.toggle('on', el.dataset.day===d));

  const list = byDay[d] || [];
  const timebox = document.getElementById('timebox');
  timebox.innerHTML = `
    <hr class="divider">
    <div class="timehead"><b>${d.slice(5).replace('-','/')}（週${W[wdIdx(d)]}）可選時段</b><span>${list.length} 個時段</span></div>
    <div class="slots">${list.map(x=>
      `<button class="slot" onclick="book(this,'${x.full}')">${x.t}<small>剩 ${x.left} 位</small></button>`
    ).join('')}</div>`;
}

async function book(btn,slot){
  document.querySelectorAll('.slot').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); btn.disabled=true;
  const msg=document.getElementById('bmsg'); msg.className='msg';
  let r;
  try{
    r = await (await fetch(API+'/book',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({token:T,slot_at:slot})})).json();
  }catch{ msg.className='msg err'; msg.textContent='預約失敗，請再試一次。'; btn.disabled=false; return; }
  if(!r.ok){
    msg.className='msg warn'; msg.textContent=r.error||'預約失敗';
    if(r.slots) renderCalendar(r.slots);
    return;
  }
  document.getElementById('monthbox').style.display='none';
  document.getElementById('weekbox').style.display='none';
  document.getElementById('datebox').style.display='none';
  document.getElementById('timebox').innerHTML =
    `<p class="lead">已為您預約 <b>${esc(r.slot_at)}</b>。<br>
     我們會在時間到之前寄信提醒您，屆時用信裡的連結進入面談室即可。</p>`;
}
boot();
</script>
