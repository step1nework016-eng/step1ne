<!--
  上傳履歷（正式版，2026-10-28 從 /resume-upload-beta/ 搬上來；beta 網址保留，之前寄出的連結照樣能用）
  所有職缺通用、不經過阿財面談：顧問用 Email 或 LINE 把這頁連結給人選，人選填姓名／Email／職缺／履歷就送出。
  網址：/resume-upload/（通用）、/resume-upload/?job=<slug>（自動帶入職類＋職缺，人選仍可改）。
  ?src=email|line 標記連結從哪裡來（後台按鈕產生的連結會帶）。
  ?by=<顧問 id> 是給連結的顧問（2026-10-27）：新人選自動指派給他；後端對不上 consultants 就忽略。
  職類跟職缺清單直接讀官網 /jobs/ 的職缺卡片（data-cat ＋ 卡片標題），再拿掉 /jobs-closed 回報已關閉的——
  跟職缺專區用同一套分類與中文名稱（CAT_LABEL 抄自 jobs/index.html），data-cat 空白的歸「其他」。
  後端：POST /resume-upload（step1ne-public-worker）。只建應徵資料，不建面談、不寄面談邀請。
  正式版之後才搬到 /resume-upload/。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上傳履歷｜Step1ne 德仁管理顧問</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--bg:#f6f8fb;--card:#ffffff;--line:#dfe4ec;--tx:#16202e;--tx2:#4d5c72;--tx3:#7c8899;
      --ac:#2f5fd8;--ac-soft:#eaf0ff;--rd:#c0392b;--ok:#1e7a4f;--ok-soft:#eef8f2;
      --sans:-apple-system,"Noto Sans TC","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.65;-webkit-text-size-adjust:100%}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center}
.top img{height:34px;width:auto;display:block}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--tx2);font-size:14.5px;margin:0 0 16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.f{display:block;margin-top:12px}
.f:first-child{margin-top:0}
.f>span{display:block;font-size:14.5px;font-weight:600;margin-bottom:6px}
.f>span em{font-style:normal;color:var(--rd);margin-left:2px}
.f small{display:block;color:var(--tx3);font-size:12.5px;margin-top:5px}
input[type=text],input[type=email],input[type=url],select{width:100%;min-height:46px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--tx);font-size:16px;font-family:inherit}
select:disabled{background:#f1f3f7;color:var(--tx3)}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,95,216,.18)}
.bad input,.bad select,.bad .pick{border-color:var(--rd)!important}
.err{color:var(--rd);font-size:13px;margin:6px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:#eef1f5;margin-bottom:12px}
.tab{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--tx2);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:var(--ac);box-shadow:0 1px 3px rgba(22,32,46,.12)}
.tab:focus-visible,.go:focus-visible,.pick:focus-visible,.lnk:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:96px;padding:14px;
  border:1.5px dashed #b9c4d6;border-radius:12px;background:var(--ac-soft);color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.pick b{font-size:15.5px;color:var(--ac)}
.pick small{color:var(--tx2);font-size:12.5px}
.pick svg{width:26px;height:26px;color:var(--ac)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.chosen{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.chosen span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.hint{font-size:13px;color:var(--tx2);margin:8px 0 0}
.hint b{color:#b4552e}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--tx2);margin:16px 4px 0;cursor:pointer}
.consent input{width:22px;height:22px;margin-top:1px;flex:0 0 22px}
.go{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:18px;border:0;border-radius:12px;
  background:var(--ac);color:#fff;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;background:#fdecea;border:1px solid #f3c2bc;color:#a5312a;white-space:pre-line}
.done{background:var(--ok-soft);border:1px solid #cfe9da;border-radius:14px;padding:20px 18px;margin-top:8px}
.done h2{margin:0 0 6px;font-size:19px;color:var(--ok)}
.done p{margin:0;color:var(--tx2);font-size:14.5px}
.done a{color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top"><a href="/"><img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問"></a></header>
<main class="wrap">
  <div id="formArea">
    <h1>上傳履歷</h1>
    <p class="lead">填好下面四項就送出，不用另外做測驗或面談。</p>
    <form id="F" novalidate>
      <div class="sec">
        <label class="f" data-k="name"><span>姓名<em aria-hidden="true">*</em></span>
          <input type="text" name="name" maxlength="40" autocomplete="name" required></label>
        <label class="f" data-k="email"><span>Email<em aria-hidden="true">*</em></span>
          <input type="email" name="email" maxlength="120" autocomplete="email" inputmode="email" required>
          <small>之後的職缺消息會寄到這個信箱</small></label>
      </div>

      <div class="sec">
        <label class="f" data-k="cat"><span>想應徵的職類<em aria-hidden="true">*</em></span>
          <select name="cat" id="cat" required><option value="">讀取職缺中⋯</option></select></label>
        <label class="f" data-k="job"><span>職缺<em aria-hidden="true">*</em></span>
          <select name="job" id="job" required disabled><option value="">請先選職類</option></select>
          <small id="jobHint"></small></label>
      </div>

      <div class="sec" data-k="resume" id="resumeSec">
        <div class="f" style="margin-top:0"><span>履歷<em aria-hidden="true">*</em></span></div>
        <div class="tabs" role="tablist" aria-label="交履歷的方式">
          <button type="button" class="tab" role="tab" id="t-file" aria-controls="p-file" aria-selected="true" data-t="file">上傳檔案</button>
          <button type="button" class="tab" role="tab" id="t-url" aria-controls="p-url" aria-selected="false" tabindex="-1" data-t="url">貼雲端連結</button>
        </div>
        <div role="tabpanel" id="p-file" aria-labelledby="t-file">
          <button type="button" class="pick" id="pick">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <b>選擇履歷檔</b><small>PDF 或 Word（.pdf、.doc、.docx），8MB 以內</small></button>
          <input type="file" id="file" class="vh" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" tabindex="-1" aria-hidden="true">
          <div class="chosen" id="chosen" hidden><span id="chosenName"></span><button type="button" class="lnk" id="unpick">換一個</button></div>
        </div>
        <div role="tabpanel" id="p-url" aria-labelledby="t-url" hidden>
          <label class="f" style="margin-top:0"><span class="vh">履歷的雲端連結</span>
            <input type="url" name="resume_url" id="url" inputmode="url" maxlength="500" placeholder="https://drive.google.com/file/d/…"></label>
          <p class="hint"><b>要貼「檔案」的分享連結，不能貼資料夾連結</b>（網址裡有 /folders/ 的就是資料夾）。分享設定要開「知道連結的任何人都能檢視」。Google Drive、Dropbox、OneDrive、104 公開履歷連結都可以。</p>
        </div>
      </div>

      <label class="consent" data-k="consent"><input type="checkbox" name="ok"> <span>我同意 Step1ne 用這些資料聯絡我、推薦適合的職缺。不會未經同意轉給任何公司。</span></label>
      <button type="submit" class="go" id="send">送出履歷</button>
      <div class="msg" id="msg" role="alert" hidden></div>
    </form>
  </div>

  <div id="doneArea" hidden>
    <div class="done" tabindex="-1" id="doneBox">
      <h2>履歷收到了，謝謝！</h2>
      <p id="doneText">有適合的機會會再用 Email 或電話跟您聯繫。也可以先逛逛 <a href="/jobs/">其他職缺</a>。</p>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var API = 'https://step1ne-public-worker.aiagentg888.workers.dev';
  var MAX = 8 * 1024 * 1024;
  // 跟 /jobs/ 職缺專區同一份分類名稱（jobs/index.html 的 CAT_LABEL），順序也一樣；data-cat 空白的歸「其他」
  var CAT_LABEL = {
    finance: '財務・會計', it: '資訊・軟體', operations: '營運・供應鏈',
    construction: '營建・工程', semiconductor: '半導體・電子', overseas: '海外外派', service: '客服・行政',
    hospitality: '餐旅・接待', media: '媒體・社群', tech: '科技・AI', sales: '業務・客戶開發'
  };
  var OTHER = '_other';
  var Q = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var F = $('F');
  var JOBS = [];          // [{ slug, title, cat }]
  var mode = 'file', picked = null;
  function ga(n, p) { try { gtag('event', n, Object.assign({ page_path: location.pathname }, p || {})); } catch (e) {} }

  // ── 職缺清單：讀 /jobs/ 卡片，拿掉已關閉的 ──
  function opt(v, t) { var o = document.createElement('option'); o.value = v; o.textContent = t; return o; }
  function loadJobs() {
    var closedP = fetch(API + '/jobs-closed').then(function (r) { return r.json(); }).catch(function () { return null; });
    return fetch('/jobs/').then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var seen = {};
      [].slice.call(doc.querySelectorAll('a.job[href^="/jobs/"]')).forEach(function (a) {
        var m = (a.getAttribute('href') || '').match(/^\/jobs\/([^/]+)\/?$/);
        var t = a.querySelector('.job-title');
        if (!m || !t || seen[m[1]]) return;
        seen[m[1]] = 1;
        var c = a.getAttribute('data-cat') || '';
        JOBS.push({ slug: m[1], title: t.textContent.trim(), cat: CAT_LABEL[c] ? c : OTHER });
      });
      return closedP;
    }).then(function (cl) {
      var closed = {};
      ((cl && cl.closed) || []).forEach(function (s) { closed[s] = 1; });
      JOBS = JOBS.filter(function (j) { return !closed[j.slug]; });
    });
  }
  function fillCats() {
    var sel = $('cat'); sel.innerHTML = '';
    sel.appendChild(opt('', '請選擇'));
    var has = {};
    JOBS.forEach(function (j) { has[j.cat] = (has[j.cat] || 0) + 1; });
    Object.keys(CAT_LABEL).forEach(function (k) { if (has[k]) sel.appendChild(opt(k, CAT_LABEL[k])); });
    sel.appendChild(opt(OTHER, '其他'));
  }
  function fillJobs(cat) {
    var sel = $('job'); sel.innerHTML = '';
    if (!cat) { sel.appendChild(opt('', '請先選職類')); sel.disabled = true; return; }
    sel.disabled = false;
    sel.appendChild(opt('', '請選擇'));
    JOBS.filter(function (j) { return j.cat === cat; }).forEach(function (j) { sel.appendChild(opt(j.slug, j.title)); });
    sel.appendChild(opt('other', '還不確定／其他職缺'));
  }
  $('cat').addEventListener('change', function () { fillJobs(this.value); clearBad('cat'); $('jobHint').textContent = ''; });
  $('job').addEventListener('change', function () { clearBad('job'); });

  function boot() {
    loadJobs().catch(function () {}).then(function () {
      fillCats();
      var want = Q.get('job');
      if (want) {
        var j = JOBS.filter(function (x) { return x.slug === want; })[0];
        if (j) { $('cat').value = j.cat; fillJobs(j.cat); $('job').value = j.slug; ga('resume_upload_prefill', { job: j.slug }); }
        else $('jobHint').textContent = '連結裡的職缺目前沒有開放了，可以改選其他職缺，或選「還不確定／其他職缺」。';
      }
      if (!JOBS.length) $('jobHint').textContent = '職缺清單暫時讀不到，可以選「其他」→「還不確定／其他職缺」照樣送出。';
    });
  }

  // ── 履歷：上傳檔案／貼連結 兩個分頁 ──
  function setMode(m, focus) {
    mode = m;
    [].slice.call(document.querySelectorAll('.tab')).forEach(function (b) {
      var on = b.getAttribute('data-t') === m;
      b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    $('p-file').hidden = m !== 'file'; $('p-url').hidden = m !== 'url';
    clearBad('resume');
  }
  [].slice.call(document.querySelectorAll('.tab')).forEach(function (b, i, all) {
    b.addEventListener('click', function () { setMode(b.getAttribute('data-t')); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault(); setMode(all[(i + 1) % all.length].getAttribute('data-t'), true);
    });
  });
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    clearBad('resume');
    if (!f) return;
    if (!/\.(pdf|docx?)$/i.test(f.name)) { this.value = ''; showBad('resume', '檔案要是 PDF 或 Word（.pdf、.doc、.docx）。手機裡是截圖的話，可以改貼雲端連結。'); return; }
    if (f.size > MAX) { this.value = ''; showBad('resume', '檔案超過 8MB，可以改用「貼雲端連結」。'); return; }
    picked = f;
    $('chosenName').textContent = f.name;
    $('chosen').hidden = false; $('pick').hidden = true;
    ga('resume_upload_file_picked', {});
  });
  $('unpick').addEventListener('click', function () {
    picked = null; $('file').value = ''; $('chosen').hidden = true; $('pick').hidden = false; $('pick').focus();
  });

  // ── 驗證與送出 ──
  function box(k) { return F.querySelector('[data-k=' + k + ']'); }
  function clearBad(k) { var b = box(k); if (!b) return; b.classList.remove('bad'); var e = b.querySelector('.err'); if (e) e.remove(); }
  function showBad(k, text) {
    var b = box(k); if (!b) return;
    clearBad(k); b.classList.add('bad');
    var p = document.createElement('p'); p.className = 'err'; p.textContent = text; b.appendChild(p);
  }
  ['name', 'email'].forEach(function (k) { F.elements[k].addEventListener('input', function () { clearBad(k); }); });
  $('url').addEventListener('input', function () { clearBad('resume'); });
  F.elements.ok.addEventListener('change', function () { clearBad('consent'); });

  function validate() {
    var bad = [];
    var name = F.elements.name.value.trim(), email = F.elements.email.value.trim();
    if (!name) bad.push(['name', '請填姓名']);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) bad.push(['email', email ? 'Email 格式不對，請再檢查一次' : '請填 Email']);
    if (!$('cat').value) bad.push(['cat', '請選職類']);
    else if (!$('job').value) bad.push(['job', '請選職缺（不確定可以選「還不確定／其他職缺」）']);
    if (mode === 'file' && !picked) bad.push(['resume', '請選一個履歷檔，或改用「貼雲端連結」']);
    if (mode === 'url') {
      var u = $('url').value.trim();
      if (!u) bad.push(['resume', '請貼上履歷的雲端連結，或改用「上傳檔案」']);
      else if (!/^https?:\/\//i.test(u)) bad.push(['resume', '連結要是 https:// 開頭的網址']);
      else if (/drive\.google\.com\/drive\/folders\//i.test(u)) bad.push(['resume', '這是「資料夾」連結，系統讀不到裡面的履歷。請改貼單一檔案的分享連結，或直接上傳檔案。']);
    }
    if (!F.elements.ok.checked) bad.push(['consent', '請勾選同意']);
    return bad;
  }
  function readB64(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { rej(new Error('read')); };
      r.readAsDataURL(f);
    });
  }
  function catLabel() { var c = $('cat').value; return c === OTHER ? '其他' : (CAT_LABEL[c] || ''); }

  F.addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('msg'); msg.hidden = true;
    ['name', 'email', 'cat', 'job', 'resume', 'consent'].forEach(clearBad);
    var bad = validate();
    if (bad.length) {
      bad.forEach(function (x) { showBad(x[0], x[1]); });
      var first = box(bad[0][0]);
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var el = first.querySelector('input,select,button'); if (el) try { el.focus({ preventScroll: true }); } catch (er) {}
      ga('resume_upload_blocked', { field: bad[0][0] });
      return;
    }
    var btn = $('send'); btn.disabled = true; btn.textContent = '送出中⋯';
    var body = {
      name: F.elements.name.value.trim(), email: F.elements.email.value.trim(),
      job_slug: $('job').value, cat_label: catLabel(), consent: true,
      src: Q.get('src') || '', by: Q.get('by') || '', utm_source: Q.get('utm_source') || '', utm_medium: Q.get('utm_medium') || '',
      utm_campaign: Q.get('utm_campaign') || '', utm_content: Q.get('utm_content') || '', referrer: document.referrer || ''
    };
    var ready = mode === 'file'
      ? readB64(picked).then(function (b64) { body.resume_b64 = b64; body.resume_name = picked.name; body.resume_mime = picked.type || ''; })
      : Promise.resolve(body.resume_url = $('url').value.trim());
    ready.then(function () {
      return fetch(API + '/resume-upload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) {
        if (d.field && box(d.field === 'resume' ? 'resume' : d.field)) showBad(d.field, d.error || '送出失敗');
        msg.textContent = d.error || '送出失敗，請再試一次。'; msg.hidden = false;
        btn.disabled = false; btn.textContent = '送出履歷';
        ga('resume_upload_server_block', { field: d.field || '' });
        return;
      }
      ga('resume_upload_done', { method: mode, updated: d.updated ? 1 : 0 });
      $('formArea').hidden = true; $('doneArea').hidden = false;
      window.scrollTo(0, 0); $('doneBox').focus();
    }).catch(function () {
      msg.textContent = '網路連線不穩，請確認網路後再按一次。'; msg.hidden = false;
      btn.disabled = false; btn.textContent = '送出履歷';
    });
  });

  boot();
})();
</script>
