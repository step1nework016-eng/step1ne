<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>我的案子｜顧問後台</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#8a6100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:22px 0 80px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.who select{font:inherit;font-size:15px;font-weight:700;padding:9px 34px 9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8d95' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 14px center;appearance:none;color:var(--ink);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{position:relative;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:7px 15px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.72}
.tab .fl{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.tab.on .fl{background:#fff;color:var(--bad)}
.c{background:#fff;border:1px solid var(--line);border-left:3px solid transparent;border-radius:12px;padding:13px 15px;margin-bottom:9px}
.c.stale{border-left-color:var(--bad);background:#fffdfc}
.c .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.c .nm{font-weight:700;font-size:15px}
.c .hl{font-size:13px;color:var(--ink2)}
.c .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.c .con{font-size:12.5px;color:var(--ink2);margin-top:5px;font-variant-numeric:tabular-nums}
.c .con a{color:var(--gold);text-decoration:none}
.age{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink2);white-space:nowrap}
.age.hot{background:#fdecea;border-color:#f3cdc7;color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.acts select{font:inherit;font-size:12.5px;padding:5px 26px 5px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;appearance:none;cursor:pointer;color:var(--ink2)}
a.lk{color:var(--gold);text-decoration:none;font-size:12.5px;font-weight:600}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink3)}
.note{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.7}
.mg{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.mg summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2)}
.mg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mg input{font:inherit;font-size:14px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;flex:1 1 160px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:6px 15px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.clist{font-size:13px;color:var(--ink2);margin-top:10px}
.clist div{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.clist .off{opacity:.5}

/* 點開卡片後的人選檔案。做成從右邊滑出的抽屜而不是跳頁——
   這一頁的用途是一件一件掃過去，跳走就等於中斷。 */
.c{cursor:pointer}
.c:hover{border-color:#dcd2bf}
.dmask{position:fixed;inset:0;background:rgba(20,22,26,.5);z-index:80;display:flex;justify-content:flex-end}
.dwrap{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.12)}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;z-index:2}
.dhead .nm{font-size:19px;font-weight:700}
.edbtn{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--ink2);border-radius:999px;padding:4px 13px}
.edbtn:hover{border-color:var(--gold);color:var(--gold)}
.dhead .x{margin-left:8px;font:inherit;font-size:22px;line-height:1;background:none;border:0;cursor:pointer;color:var(--ink3);padding:0 4px}
.dbody{padding:16px 20px 60px}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:11px}
.sec h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink3);white-space:nowrap}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv a{color:var(--gold);text-decoration:none}
.bar{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.stp{flex:1 1 0;min-width:56px;text-align:center;position:relative}
.dot{width:11px;height:11px;border-radius:50%;background:#e4ddcf;margin:0 auto 5px;position:relative;z-index:1}
.stp.done .dot{background:var(--ok)}
.stp.now .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(166,124,61,.18)}
.stp:not(:first-child):before{content:"";position:absolute;left:-50%;top:5px;width:100%;height:1px;background:#e4ddcf}
.stp.done:before,.stp.now:before{background:var(--ok)}
.stp .lb{font-size:11px;line-height:1.35;color:var(--ink3)}
.stp.now .lb{color:var(--gold);font-weight:700}
.stp.done .lb{color:var(--ink2)}
.rpt{font-size:13.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow-y:auto;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.rpt.open{max-height:none}
.more{font:inherit;font-size:12.5px;font-weight:600;color:var(--gold);background:none;border:0;cursor:pointer;padding:6px 0 0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--soft);color:var(--ink2)}
.pill.ok{background:#e8f5ee;border-color:#bfe0cd;color:var(--ok)}
.pill.warn{background:#fdf3e0;border-color:#efdcb6;color:var(--warn)}
.pill.bad{background:#fdecea;border-color:#f3cdc7;color:var(--bad)}
.edl{display:block;font-size:11.5px;color:var(--ink3);margin:9px 0 3px;font-weight:600}
.edi{width:100%;font:inherit;font-size:13.5px;padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.edi:focus{outline:2px solid rgba(166,124,61,.35);outline-offset:1px;border-color:var(--gold)}
.ntv{font-size:13.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2)}
#notesec{border-left:3px solid var(--gold)}
#notesec h4{display:flex;align-items:center;gap:10px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.d{color:var(--bad);border-color:#f0d4cf}
.btn .to{display:block;font-size:10.5px;font-weight:400;opacity:.62;margin-top:1px}
.btn.on .to{opacity:.8}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>我的案子</b>
    <nav>
      <a href="/consultant/overview/">總覽</a>
      <a href="/consultant/pipeline/" class="on">我的案子</a>
      <a href="/consultant/sourced/">人才池</a>
      <a href="/consultant/reports/">初篩報告</a>
    </nav>
  </div></header>
  <main class="wrap">
    <div class="note">
      這張表照「<b>球現在在誰手上</b>」分，不是照資料表分。
      左邊紅線＝<b>卡太久了</b>（各關的天數門檻不一樣，游標移到天數上會顯示）。
      同一個人被推到兩家客戶，就是兩件事、各算一列。
    </div>
    <div class="who">
      <select id="owner" aria-label="顧問"></select>
      <span id="sum" class="mut"></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="list" class="mut">載入中…</div>
    <div id="drawer"></div>

    <details class="mg">
      <summary>顧問名單設定</summary>
      <div class="clist" id="clist"></div>
      <div class="row">
        <input id="newc" placeholder="新顧問名字" autocomplete="off">
        <button class="btn p" id="addc" type="button">新增顧問</button>
      </div>
      <p class="mut" style="margin:8px 0 0">
        顧問只能停用、不能刪除——離職後他經手過的人選紀錄還是要查得到。
      </p>
    </details>
  </main>
</div>

<script>
var API='https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY='s1ne_admin_tok';
var tok=localStorage.getItem(KEY)||'';
var $=function(i){return document.getElementById(i)};
function api(p,o){o=o||{};o.headers=Object.assign({authorization:'Bearer '+tok},o.headers||{});
  return fetch(API+p,o).then(function(r){return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// 分頁名稱刻意用顧問講話的方式寫，不用系統詞（不是 sourced / placement）——
// 這頁的目的是「早上打開就知道今天先做哪一件」。
var TABS=[
  {k:'to_contact',   lb:'要我接觸', kind:'sourced',     hint:'找到人了，還沒發第一封信'},
  {k:'waiting_reply',lb:'等對方回', kind:'sourced',     hint:'信發了，人還沒回'},
  {k:'to_review',    lb:'等我看報告',kind:'application',hint:'阿財談完了，還沒決定推不推'},
  {k:'client_side',  lb:'客戶手上', kind:'placement',   hint:'已送件，等客戶安排／回覆'},
  {k:'closing',      lb:'快成交',   kind:'placement',   hint:'錄取到報到之間'},
  {k:'done',         lb:'已收尾',   kind:'placement',   hint:'成交或結案，只供回頭查'}
];
var DATA=null, CUR='to_review', OWNER=localStorage.getItem('s1ne_pipe_owner')||'all', CONS=[];

function ownerSel(cur,kind,id){
  var o='<option value="">未指派</option>';
  CONS.forEach(function(c){ if(!c.is_active&&c.id!==cur)return;
    o+='<option value="'+esc(c.id)+'"'+(cur===c.id?' selected':'')+'>'+esc(c.display_name)+'</option>'; });
  return '<select data-kind="'+kind+'" data-id="'+esc(id)+'" class="ow">'+o+'</select>';
}

function card(r,tab){
  var th=(DATA.thresholds||{})[tab.k];
  var age=r.age_days==null?'':(r.age_days+' 天');
  var hot=r.stale?' hot':'';
  var title=th?('卡 '+r.age_days+' 天，這一關超過 '+th+' 天就該動'):'';
  var sub=[];
  if(r.headline)sub.push(esc(r.headline));
  if(r.company)sub.push(esc(r.company));
  if(r.job_title||r.job_slug)sub.push(esc(r.job_title||r.job_slug));
  if(r.client_company||r.client_name)sub.push('→ '+esc(r.client_company||r.client_name));
  var con=[];
  if(r.email)con.push('<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>');
  if(r.phone)con.push('<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>');
  // 2026-08-26 拿掉「跳去初篩報告頁」那類連結——整張卡片點下去就直接
  // 在這頁開檔案（含報告全文）。換頁會打斷「一件一件掃過去」這件事。
  var lk='<span class="lk">點卡片看完整資料 →</span>';
  return '<div class="c'+(r.stale?' stale':'')+'" data-kind="'+tab.kind+'" data-id="'+esc(r.id)+'" data-nm="'+esc(r.name||'')+'">'
    +'<div class="top"><span class="nm">'+esc(r.name||'（未填姓名）')+'</span>'
    + (r.grade?'<span class="hl">'+esc(r.grade)+'</span>':'')
    + (age?'<span class="age'+hot+'" title="'+esc(title)+'">'+age+'</span>':'')
    +'</div>'
    + (sub.length?'<div class="meta">'+sub.join('・')+'</div>':'')
    + (con.length?'<div class="con">'+con.join('　')+'</div>':'')
    +'<div class="acts">'+ownerSel(r.owner,tab.kind,r.id)+lk+'</div>'
    +'</div>';
}

// ─── 點卡片打開的人選檔案 ───────────────────────────────
// 顧問點下去要看到的是「這個人是誰、談過什麼、現在卡在哪」，
// 而不是被丟去另一頁再找一次。初篩報告全文直接顯示在這裡。
function esc2(s){return esc(s)}
function kvRow(k,v){return v?'<dt>'+esc(k)+'</dt><dd>'+v+'</dd>':''}
function fmtDate(s){return s?esc(String(s).slice(0,16)):''}

function bar(steps){
  return '<div class="bar">'+steps.map(function(s){
    return '<div class="stp'+(s.now?' now':(s.done?' done':''))+'">'
      +'<div class="dot"></div><div class="lb">'+esc(s.lb)+'</div></div>';
  }).join('')+'</div>';
}

var DEC={forwarded:['已推薦給客戶','ok'],need_more:['需補問','warn'],rejected:['顧問婉拒','bad']};
// 主動開發人選的狀態流。跟人才池頁用同一組值、同一支端點，不是另一套。
var SRC_ACTS=[
  {k:'shortlisted',lb:'挑出來',   to:'要我接觸', cls:''},
  {k:'contacted',  lb:'我聯絡了', to:'等對方回', cls:''},
  {k:'replied',    lb:'他回覆了', to:'要我接觸', cls:''},
  {k:'rejected',   lb:'不合適',   to:'已收尾',   cls:'d'},
];
var SRC_LB={new:'待挑選',shortlisted:'已挑出',contacted:'已接觸',replied:'有回覆',
            rejected:'不合適',converted:'已轉應徵者'};
// 每個狀態現在會出現在哪一關——畫面上直接講，顧問不用自己記對應關係。
var SRC_TAB={new:'要我接觸',shortlisted:'要我接觸',replied:'要我接觸',
             contacted:'等對方回',rejected:'已收尾',converted:'等我看報告'};
// 「不合適」一定要選原因。用固定選項不是自由輸入——這份資料是要累積起來
// 看出「該調整什麼」的，自由文字寫法太散（地點太遠／通勤問題／在南部其實
// 是同一件事），統計不出東西。跟人才池頁同一組。
// 可以從卡片上直接改的欄位。刻意不含 raw_json／分數／等第／狀態／負責顧問——
// 前三個是爬蟲與評分的產出，手改會讓「AI 判斷準不準」的統計失真；
// 後兩個各自有專屬端點（婉拒必填原因、指派要驗顧問存在）。
var SRC_FIELDS=[
  ['name','姓名'],['headline','現職職稱'],['company','公司'],['location','地點'],
  ['email','Email'],
  ['linkedin_url','LinkedIn'],['github_url','GitHub'],['source_url','來源頁'],
  // 固定欄位永遠不夠用——Cake、104、個人網站、作品集、部落格都可能出現。
  // 一行一個網址，前面可以加標籤（「個人網站：https://…」），沒加的話
  // 系統會從網域自己認（cake.me → Cake 履歷）。
  ['other_links','其他管道（一行一個網址，例：Cake、104、個人網站、作品集）','area'],
  ['skills','技能'],
];
// 應徵者開放的欄位比人才池窄——這是本人自己填的，顧問只該修正明顯的輸入錯誤，
// 不是重寫他的申請。期望待遇與可到職有開放，因為電訪之後常有更新。
var APP_FIELDS=[
  ['name','姓名'],['email','Email'],['phone','電話'],
  ['expected_salary','期望待遇'],['available_date','可到職'],['location_ok','地點'],
  ['resume_url','履歷連結'],
];
var SRC_REASONS=['地點不行','資歷差太多','職類根本不對','找不到聯絡方式','已有工作或沒意願','其他'];
// 跟「初篩報告」頁同一組動作、同一支端點——這頁按了等於在那頁按過了，
// 不是另外一套流程。app_status 也要跟著送，不然人選的狀態會停在舊值。
var DECIDE_OPTS=[
  {k:'forwarded', lb:'推薦給客戶', s:'passed',   cls:'p'},
  {k:'need_more', lb:'需補問',     s:'reported', cls:''},
  {k:'rejected',  lb:'婉拒',       s:'rejected', cls:'d'},
];
// 手動指定進度用的選項。screening／confirm 不給選——那是推薦給客戶之前的
// 內部流程，由系統自己判斷，顧問手動往回設只會讓客戶那邊看到進度倒退。
var STAGE_OPTS=[
  {key:'stage1',lb:'第一階段'},{key:'stage2',lb:'第二階段'},
  {key:'stage3',lb:'第三階段'},{key:'stage4',lb:'第四階段'},
  {key:'offer',lb:'錄取'},{key:'onboard',lb:'報到'},{key:'care',lb:'到職關懷'},
  {key:'backup',lb:'備選'},
];

// 履歷區塊。三個來源合在一起看：顧問上傳的檔、顧問記的連結（104／雲端）、
// 以及他後來真的來應徵時自己傳的那一份。
// 履歷檔存在 D1 裡、要帶權杖才拿得到，所以不能直接 <a href> ——
// 權杖進網址會留在瀏覽器紀錄與 referer，而這是個資。
function dlFile(fid, el){
  var t=el.textContent; el.textContent='下載中…';
  fetch(API+'/admin/file/'+encodeURIComponent(fid),{headers:{authorization:'Bearer '+tok}})
  .then(function(rs){
    if(!rs.ok)throw new Error(rs.status===404?'這個檔案不在系統裡（可能已被清掉）':'下載失敗');
    var fn='resume', cd=rs.headers.get('content-disposition')||'';
    var m=cd.match(/filename\*=UTF-8''([^;]+)/);
    if(m)try{fn=decodeURIComponent(m[1])}catch(e){}
    return rs.blob().then(function(bl){
      var u=URL.createObjectURL(bl), a2=document.createElement('a');
      a2.href=u; a2.download=fn; document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},2000);
      el.textContent=t;
    });
  }).catch(function(e){ el.textContent=t; alert(e.message||'下載失敗'); });
}

// 顧問備註。放在卡片最上面、預設就看得到——這是顧問自己寫給自己（跟同事）
// 看的東西：打過電話講了什麼、對方什麼時候方便、要注意什麼。
// 藏在「修正資料」的表單裡等於沒有，因為那要先按編輯才展開。
// 管道連結。沒給標籤就從網域認一個看得懂的名字——顧問要的是
// 「這是他的 Cake」而不是一長串網址。
var CH_HOSTS=[
  [/cake\.me/i,'Cake 履歷'],[/104\./i,'104'],[/1111\./i,'1111'],[/yourator/i,'Yourator'],
  [/linkedin\./i,'LinkedIn'],[/github\./i,'GitHub'],[/facebook\.|fb\.com/i,'Facebook'],
  [/instagram\./i,'Instagram'],[/threads\./i,'Threads'],[/medium\.|hackmd|ithome/i,'技術文章'],
  [/behance|dribbble/i,'作品集'],[/youtube\.|youtu\.be/i,'YouTube'],
];
function chLink(url, label){
  var lb=label;
  if(!lb){
    for(var i=0;i<CH_HOSTS.length;i++){ if(CH_HOSTS[i][0].test(url)){ lb=CH_HOSTS[i][1]; break; } }
    if(!lb){ try{ lb=new URL(url).hostname.replace(/^www\./,''); }catch(e){ lb='連結'; } }
  }
  return '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(lb)+'</a>';
}

function noteBlock(txt){
  var t = String(txt || '').trim();
  return '<div class="sec" id="notesec"><h4>顧問備註'

    + '<div id="ntview" class="ntv">' + (t ? esc(t) : '<span class="mut">還沒有備註。打過電話、聊過什麼、要注意什麼都寫這裡。</span>') + '</div>'
    + '<div id="ntbox" hidden>'

    + '<div class="acts"><button class="btn p" id="ntsave" type="button">儲存</button>'
    + '<button class="btn" id="ntcancel" type="button">取消</button>'

}

function drawerHtml(d){
  if(d.kind==='sourced'){
    var s=d.sourced||{};

    if(s.linkedin_url)links.push(chLink(s.linkedin_url,'LinkedIn'));
    if(s.github_url)links.push(chLink(s.github_url,'GitHub'));
    if(s.source_url)links.push(chLink(s.source_url,'來源頁'));
    // 自由欄位：一行一個。可以只貼網址（自動認名稱），也可以「標籤：網址」。
    String(s.other_links||'').split('\n').forEach(function(ln){
      ln=ln.trim(); if(!ln)return;
      var i=ln.search(/https?:\/\//);
      if(i<0)return;                                  // 沒有網址的那行跳過
      var url=ln.slice(i).trim();
      var lb=ln.slice(0,i).replace(/[：:\-–—\s]+$/,'').trim();
      links.push(chLink(url, lb));

    // 可編輯欄位放最前面。爬回來的資料常常有錯或缺（公司名帶著括號註解、

      +(s.bio?'<div class="sec"><h4>簡介</h4><div class="rpt" style="border:0;margin:0;padding:0">'+esc(s.bio)+'</div></div>':'')

      +'</select>'

      +'<div class="acts" style="margin-bottom:10px">'
      +DECIDE_OPTS.map(function(o4){

      +'</p></div>';
  }
  return h;
}

function openCard(kind,id,name){
  var dw=$('drawer');
  dw.innerHTML='<div class="dmask"><div class="dwrap">'
    +'<div class="dhead"><span class="nm">'+esc(name||'')+'</span>'
    +'<button class="edbtn" id="edtop" type="button" hidden>✎ 編輯</button>'
    +'<button class="x" type="button">×</button></div>'
    +'<div class="dbody" id="dbody"><p class="mut">載入中…</p></div></div></div>';
  function close(){dw.innerHTML=''}
  dw.querySelector('.x').onclick=close;
  dw.querySelector('.dmask').onclick=function(e){if(e.target===this)close()};
  document.addEventListener('keydown',function k(e){
    if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  api('/admin/pipeline/detail?kind='+encodeURIComponent(kind)+'&id='+encodeURIComponent(id))
  .then(function(d){
    if(!d.ok){$('dbody').innerHTML='<p class="mut">讀不到這筆資料：'+esc(d.error||'')+'</p>';return}
    $('dbody').innerHTML=drawerHtml(d);
    var m=$('rptmore');
    if(m)m.onclick=function(){var e=$('rpt');e.classList.toggle('open');
      m.textContent=e.classList.contains('open')?'收合 ▴':'展開全文 ▾'};
    // ── 進度調整（一家一組）──
    Array.prototype.forEach.call($('dbody').querySelectorAll('.stggo'),function(b){
      b.onclick=function(){
        var sel=$('dbody').querySelectorAll('.stgsel')[Number(b.dataset.i)];
        if(!sel||!sel.value)return alert('先選一個階段');
        b.disabled=true;
        api('/admin/set-manual-stage',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({application_id:sel.dataset.a, stage:sel.value,
                               company_id:sel.dataset.c||null, by:'consultant:pipeline'})})
        .then(function(r){ b.disabled=false;
          if(!r.ok)return alert(r.error||'更新失敗');
          openCard(kind,id,name); load();   // 抽屜跟後面的列表都要跟著更新
        }).catch(function(){b.disabled=false;alert('連線失敗')});
      };
    });
    Array.prototype.forEach.call($('dbody').querySelectorAll('.stgclr'),function(b){
      b.onclick=function(){
        if(!confirm('清除手動指定？進度會退回系統自己算出來的位置。'))return;
        api('/admin/set-manual-stage',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({application_id:b.dataset.a, stage:null,
                               company_id:b.dataset.c||null, by:'consultant:pipeline'})})
        .then(function(r){ if(!r.ok)return alert(r.error||'失敗'); openCard(kind,id,name); load(); });
      };
    });

    // ── 初篩決定（跟報告頁同一支端點、同一筆資料）──
    Array.prototype.forEach.call($('dbody').querySelectorAll('.decbtn'),function(b){
      b.onclick=function(){
        b.disabled=true;
        api('/admin/decide-report',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({id:b.dataset.r, decision:b.dataset.k,
                               app_id:b.dataset.a, app_status:b.dataset.s})})
        .then(function(r){ b.disabled=false;
          if(!r.ok)return alert(r.error||'更新失敗');
          openCard(kind,id,name); load();
        }).catch(function(){b.disabled=false;alert('連線失敗')});
      };
    });
    Array.prototype.forEach.call($('dbody').querySelectorAll('.clrdec'),function(b){
      b.onclick=function(){
        if(!confirm('清除這筆決定？會回到「還沒決定推不推」。'))return;
        api('/admin/clear-decision',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({id:b.dataset.r})})
        .then(function(r){ if(!r.ok)return alert(r.error||'失敗'); openCard(kind,id,name); load(); });
      };
    });

    // ── 顧問備註 ──
    var ne=$('ntedit');
    if(ne)ne.onclick=function(){
      var box=$('ntbox'), v=$('ntview');
      var open = box.hidden;
      box.hidden = !open; v.hidden = open;
      if(open){ var t=$('ntinput'); t.focus();
        // 游標放到最後面，不要蓋掉既有內容——備註幾乎都是往下加一行
        t.setSelectionRange(t.value.length, t.value.length); }
    };
    var nc=$('ntcancel');
    if(nc)nc.onclick=function(){ $('ntbox').hidden=true; $('ntview').hidden=false; };
    var ns=$('ntsave');
    if(ns)ns.onclick=function(){
      var val=$('ntinput').value;
      var target = kind==='sourced' ? (d.sourced||{}) : (d.application||{});
      if(!target.id){ $('ntmsg').textContent='這筆沒有可以存備註的對象'; return; }
      ns.disabled=true; $('ntmsg').textContent='儲存中…';
      var url = kind==='sourced' ? '/admin/sourced/update' : '/admin/application/update';
      api(url,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:target.id, note:val})})
      .then(function(r){ ns.disabled=false;
        if(!r.ok){ $('ntmsg').textContent=r.error||'儲存失敗'; return; }
        openCard(kind,id,name);
      }).catch(function(){ ns.disabled=false; $('ntmsg').textContent='連線失敗'; });
    };

    // ── 編輯欄位 ──
    function toggleEdit(open){
      var box=$('edbox'), tg=$('edtog');
      if(!box)return;
      box.hidden = (open===undefined) ? !box.hidden : !open;
      if(tg)tg.textContent = box.hidden ? '編輯 ✎' : '收起';
      if(!box.hidden){
        $('edsec').scrollIntoView({block:'start',behavior:'smooth'});
        var f=box.querySelector('.edi'); if(f)setTimeout(function(){f.focus()},250);
      }
    }
    var tg=$('edtog');
    if(tg)tg.onclick=function(){ toggleEdit(); };
    // 標頭那顆。標頭是 sticky 的，捲到哪裡都看得到——顧問想改東西不用先找到區塊。
    var top=$('edtop');
    if(top && $('edsec')){ top.hidden=false; top.onclick=function(){ toggleEdit(true); }; }
    var cn=$('edcancel');
    if(cn)cn.onclick=function(){ openCard(kind,id,name); };
    var sv=$('edsave');
    if(sv)sv.onclick=function(){
      var body={id: (kind==='sourced' ? (d.sourced||{}).id : (d.application||{}).id)};
      // 只送真的有改的欄位——整包送過去的話，兩個顧問同時開同一張卡片時，
      // 後存的那個會把前一個的修改整批蓋掉。
      var changed=0;
      Array.prototype.forEach.call($('dbody').querySelectorAll('.edi'),function(el){
        var f=el.dataset.f, cur=(d.sourced||d.application||{})[f];
        if(String(el.value)!==String(cur==null?'':cur)){ body[f]=el.value; changed++; }
      });
      if(!changed){ $('edmsg').textContent='沒有改到東西'; return; }
      sv.disabled=true; $('edmsg').textContent='儲存中…';
      var url = kind==='sourced' ? '/admin/sourced/update' : '/admin/application/update';
      api(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ sv.disabled=false;
        if(!r.ok){ $('edmsg').textContent=r.error||'儲存失敗'; return; }
        openCard(kind,id,body.name||name); load();
      }).catch(function(){ sv.disabled=false; $('edmsg').textContent='連線失敗'; });
    };

    // ── 履歷：上傳檔案 / 貼連結 / 下載 ──
    var sid = (d.sourced||{}).id;
    var fi=$('resfile'), ub=$('upres');
    if(ub && fi){
      ub.onclick=function(){ fi.click(); };
      fi.onchange=function(){
        var f=fi.files && fi.files[0]; if(!f)return;
        // 5MB 以上先擋——D1 是切塊存的，太大的檔上傳會很慢而且常常中途失敗，
        // 與其讓顧問等三分鐘再看到錯誤，不如當場說清楚。
        if(f.size > 5*1024*1024) return alert('檔案超過 5MB，請先壓縮或改存連結');
        ub.disabled=true; ub.textContent='上傳中…';
        var rd=new FileReader();
        rd.onload=function(){
          var b64=String(rd.result).split(',')[1];
          api('/admin/sourced/resume',{method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({id:sid, pdf_b64:b64, filename:f.name, mime:f.type||'application/pdf'})})
          .then(function(r){ ub.disabled=false;
            if(!r.ok){ub.textContent='上傳履歷檔';return alert(r.error||'上傳失敗')}
            openCard(kind,id,name);
          }).catch(function(){ub.disabled=false;ub.textContent='上傳履歷檔';alert('連線失敗')});
        };
        rd.readAsDataURL(f);
      };
    }
    var uu=$('upurl');
    if(uu)uu.onclick=function(){
      var cur=(d.sourced||{}).resume_url||'';
      var v=prompt('貼上 104 履歷或雲端履歷的網址：\n（連結會過期，有檔案的話還是建議上傳檔案）', cur);
      if(v===null)return;
      api('/admin/sourced/resume',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:sid, resume_url:v.trim()})})
      .then(function(r){ if(!r.ok)return alert(r.error||'失敗'); openCard(kind,id,name); });
    };
    Array.prototype.forEach.call($('dbody').querySelectorAll('.dlres2'),function(a){
      a.onclick=function(ev){ ev.preventDefault(); dlFile(a.dataset.f, a); };
    });

    // ── 應徵連結 ──
    var ij=$('invjob');
    if(ij){
      // 只列還開著的職缺——已結束招募的發出去，人選點進來會被擋，
      // 那個體驗比沒收到連結還糟。
      api('/admin/jobs').then(function(r){
        if(!r.ok)return;
        (r.jobs||[]).filter(function(j){return (j.status||'open')!=='closed' && j.status!=='client_draft' && j.status!=='pending_review'})
          .forEach(function(j){
            var o3=document.createElement('option');
            o3.value=j.slug; o3.textContent=j.title||j.slug;
            ij.appendChild(o3);
          });
      });
    }
    var ig=$('invgo');
    if(ig)ig.onclick=function(){
      if(!ij.value)return alert('先選一個職缺');
      ig.disabled=true;
      api('/admin/sourced/invite',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:sid, job_slug:ij.value})})
      .then(function(r){ ig.disabled=false;
        if(!r.ok)return alert(r.error||'產生失敗');
        openCard(kind,id,name);
      }).catch(function(){ig.disabled=false;alert('連線失敗')});
    };
    var ic=$('invcopy');
    if(ic)ic.onclick=function(){
      navigator.clipboard.writeText($('invurl').textContent).then(function(){
        ic.textContent='已複製'; setTimeout(function(){ic.textContent='複製連結'},1500);
      });
    };
    var inw=$('invnew');
    if(inw)inw.onclick=function(){
      var slug=prompt('換成哪一個職缺？填職缺代碼（slug）：', (d.sourced||{}).invite_job_slug||'');
      if(!slug)return;
      api('/admin/sourced/invite',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:sid, job_slug:slug.trim()})})
      .then(function(r){ if(!r.ok)return alert(r.error||'失敗'); openCard(kind,id,name); });
    };

    // ── 主動開發人選的狀態按鈕 ──
    Array.prototype.forEach.call($('dbody').querySelectorAll('.srcact'),function(b){
      b.onclick=function(){
        var k=b.dataset.k;
        if(k==='rejected'){
          // 婉拒一定要選原因。固定選項不是自由輸入——這份資料是要累積起來
          // 看出「該調整什麼」的，自由文字統計不出東西。
          var msg='為什麼不合適？輸入編號：\n'
            + SRC_REASONS.map(function(r,i){return (i+1)+'. '+r}).join('\n');
          var pick=prompt(msg,'1');
          if(pick===null)return;
          var reason=SRC_REASONS[Number(pick)-1];
          if(!reason)return alert('請輸入 1–'+SRC_REASONS.length);
          return srcSet(b, k, reason);
        }
        srcSet(b, k, null);
      };
    });
    function srcSet(b, status, reason){
      b.disabled=true;
      api('/admin/sourced/status',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:b.dataset.i, status:status, reason:reason})})
      .then(function(r){ b.disabled=false;
        if(!r.ok)return alert(r.error||'更新失敗');
        openCard(kind,id,name); load();
      }).catch(function(){b.disabled=false;alert('連線失敗')});
    }

    var dl=$('dlres');
    if(dl)dl.onclick=function(ev){
      ev.preventDefault();
      var t=dl.textContent; dl.textContent='下載中…';
      fetch(API+'/admin/file/'+encodeURIComponent(dl.dataset.f),
            {headers:{authorization:'Bearer '+tok}})
      .then(function(rs){
        if(!rs.ok)throw new Error(rs.status===404?'這個檔案不在系統裡（可能已被清掉）':'下載失敗');
        var fn='resume';
        var cd=rs.headers.get('content-disposition')||'';
        var mt=cd.match(/filename\*=UTF-8''([^;]+)/);
        if(mt)try{fn=decodeURIComponent(mt[1])}catch(e){}
        return rs.blob().then(function(b){
          var u=URL.createObjectURL(b), el=document.createElement('a');
          el.href=u; el.download=fn; document.body.appendChild(el); el.click();
          el.remove(); setTimeout(function(){URL.revokeObjectURL(u)},2000);
          dl.textContent=t;
        });
      }).catch(function(e){dl.textContent=t;alert(e.message||'下載失敗')});
    };
  }).catch(function(){$('dbody').innerHTML='<p class="mut">連線失敗</p>'});
}

function renderTabs(){
  $('tabs').innerHTML=TABS.map(function(t){
    var n=(DATA.counts||{})[t.k]||0, s=(DATA.stale||{})[t.k]||0;
    return '<button class="tab'+(CUR===t.k?' on':'')+'" data-k="'+t.k+'" title="'+esc(t.hint)+'">'
      +esc(t.lb)+'<span class="n">'+n+'</span>'
      +(s?'<span class="fl">'+s+'</span>':'')+'</button>';
  }).join('');
  Array.prototype.forEach.call($('tabs').children,function(b){
    b.onclick=function(){CUR=b.dataset.k;renderTabs();renderList()};
  });
}

function renderList(){
  var tab=TABS.filter(function(t){return t.k===CUR})[0];
  var rows=(DATA.tabs||{})[CUR]||[];
  if(!rows.length){
    $('list').innerHTML='<div class="empty">這一關目前沒有案子。<br><span class="mut">'+esc(tab.hint)+'</span></div>';
    return;
  }
  $('list').innerHTML=rows.map(function(r){return card(r,tab)}).join('');
  Array.prototype.forEach.call($('list').querySelectorAll('.c'),function(el){
    el.onclick=function(e){
      // 卡片上的下拉、連結要照常運作，不要被「點卡片開檔案」吃掉
      if(e.target.closest('select,a,button'))return;
      openCard(el.dataset.kind,el.dataset.id,el.dataset.nm);
    };
  });
  Array.prototype.forEach.call($('list').querySelectorAll('select.ow'),function(s){
    s.onchange=function(){
      var prev=s.dataset.prev||'';
      s.disabled=true;
      api('/admin/set-owner',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({kind:s.dataset.kind,id:s.dataset.id,owner:s.value||null})})
      .then(function(d){ s.disabled=false;
        if(!d.ok){alert(d.error||'指派失敗');s.value=prev;return}
        // 指派給別人之後，這一列就不該再留在「我的」畫面上——重載才不會誤導
        if(OWNER!=='all')load();
      }).catch(function(){s.disabled=false;alert('連線失敗')});
    };
    s.dataset.prev=s.value;
  });
}

function renderSum(){
  var c=DATA.counts||{}, s=DATA.stale||{};
  var act=(c.to_contact||0)+(c.waiting_reply||0)+(c.to_review||0)+(c.client_side||0)+(c.closing||0);
  var fl=(s.to_contact||0)+(s.waiting_reply||0)+(s.to_review||0)+(s.client_side||0)+(s.closing||0);
  $('sum').innerHTML='進行中 <b>'+act+'</b> 件'+(fl?'，其中 <b style="color:#c0392b">'+fl+'</b> 件卡太久':'');
}

function renderConsultants(){
  $('owner').innerHTML='<option value="all">全部顧問</option>'
    + CONS.filter(function(c){return c.is_active}).map(function(c){
        return '<option value="'+esc(c.id)+'">'+esc(c.display_name)+'</option>'}).join('')
    + '<option value="unassigned">未指派</option>';
  $('owner').value=OWNER;
  $('clist').innerHTML=CONS.map(function(c){
    return '<div class="'+(c.is_active?'':'off')+'"><b>'+esc(c.display_name)+'</b>'
      +'<span class="mut">'+esc(c.id)+'</span>'
      +'<button class="btn" style="margin-left:auto" data-t="'+esc(c.id)+'" data-a="'+(c.is_active?0:1)+'" data-n="'+esc(c.display_name)+'">'
      +(c.is_active?'停用':'重新啟用')+'</button></div>';
  }).join('');
  Array.prototype.forEach.call($('clist').querySelectorAll('button'),function(b){
    b.onclick=function(){
      api('/admin/consultants',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:b.dataset.t,display_name:b.dataset.n,is_active:Number(b.dataset.a)})})
      .then(function(d){ if(!d.ok)return alert(d.error||'失敗'); loadConsultants(); });
    };
  });
}

function loadConsultants(){
  return api('/admin/consultants').then(function(d){
    if(!d.ok)return; CONS=d.consultants||[]; renderConsultants();
  });
}

function load(){
  $('gate').hidden=true;$('app').hidden=false;
  return api('/admin/pipeline?owner='+encodeURIComponent(OWNER)).then(function(d){
    if(!d.ok){$('list').innerHTML='<div class="mut">讀取失敗</div>';return}
    DATA=d; renderTabs(); renderSum(); renderList();
  }).catch(function(){$('list').innerHTML='<div class="mut">連線失敗</div>'});
}

$('owner').onchange=function(){OWNER=this.value;localStorage.setItem('s1ne_pipe_owner',OWNER);load()};
$('addc').onclick=function(){
  var n=$('newc').value.trim(); if(!n)return;
  api('/admin/consultants',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({display_name:n})})
  .then(function(d){ if(!d.ok)return alert(d.error||'失敗'); $('newc').value=''; loadConsultants(); });
};
$('newc').addEventListener('keydown',function(e){if(e.key==='Enter')$('addc').click()});

function boot(){
  if(tok){loadConsultants().then(load);return}
  $('gate').hidden=false;
  $('enter').onclick=function(){
    tok=$('tok').value.trim(); if(!tok)return;
    api('/admin/consultants').then(function(d){
      if(!d.ok){$('gerr').hidden=false;$('gerr').textContent='權杖不正確';return}
      localStorage.setItem(KEY,tok); CONS=d.consultants||[]; renderConsultants(); load();
    });
  };
  $('tok').addEventListener('keydown',function(e){if(e.key==='Enter')$('enter').click()});
}
boot();
</script>
<script defer src="/consultant/_shell.js"></script>
</html>
