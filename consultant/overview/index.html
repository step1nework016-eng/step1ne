<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>招募總覽｜顧問後台</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#8a6100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:22px 0 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px}
.card .sub{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 120px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink3)}
.kpi.act{background:#fdecea;border-color:#f3c9c2}
.kpi.act .n{color:var(--bad)}
.kpi.warn{background:#fff6e0;border-color:#f0d48a}
.kpi.warn .n{color:var(--warn)}
.fn{display:flex;flex-direction:column;gap:10px}
.fnrow{display:flex;align-items:center;gap:8px}
.fnrow .lb{width:74px;font-size:12.5px;flex:none;color:var(--ink2);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnrow .track{flex:1;min-width:30px;background:var(--soft);border-radius:999px;height:26px;position:relative;overflow:hidden}
.fnrow .bar{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--gold);
  min-width:22px;transition:width .5s ease}
.fnrow .bar.g{background:#e5dcc8}
.fnrow .vn{flex:none;width:44px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.fnrow .pc{flex:none;width:60px;text-align:right;font-size:11.5px;color:var(--ink3)}
@media(max-width:420px){.fnrow .lb{width:56px;font-size:11.5px}.fnrow .pc{width:44px}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--ink3);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px}
.pill.red{background:#fdecea;border-color:#f3c9c2;color:var(--bad);font-weight:700}
.empty{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;color:var(--ink2)}
a.q{color:var(--gold);text-decoration:none}
.explain{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:10px;padding:9px 12px;
  background:var(--soft);border-radius:10px}
.kpi .ic{font-size:17px;line-height:1;margin-bottom:3px}
.badge-acc{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;
  padding:14px 16px}
.badge-acc .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok)}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>招募總覽</b>
    <nav>
      <a href="/consultant/overview/" class="on">總覽</a>
      <a href="/consultant/reports/">初篩報告</a>
      <a href="/consultant/jobs/">招募職缺</a>
      <a href="/consultant/expertise/">職缺題庫</a>
      <a href="/consultant/social-post/">顧問社群</a>
    </nav>
  </div></header>
  <main class="wrap">
    <div class="card">
      <h2>現在手上有多少事</h2>
      <div class="sub">紅色的是等你動手的，點數字看名單</div>
      <div class="kpis" id="kpis">載入中…</div>
    </div>

    <div class="card">
      <h2>漏斗卡在哪</h2>
      <div class="sub">依顧問實際記錄的進度事件統計，不是系統狀態</div>
      <div class="fn" id="funnel">載入中…</div>
    </div>

    <div class="card">
      <h2>阿財準不準</h2>
      <div class="sub">這一段是拿去跟客戶證明「AI 沒把人看錯」的依據</div>
      <div id="acc">載入中…</div>
    </div>

    <div class="card">
      <h2>各職缺進度</h2>
      <div id="byjob">載入中…</div>
    </div>

    <div class="card" id="todocard" hidden>
      <h2>等你按判斷的人選</h2>
      <div class="sub">面談報告已產出，但你還沒告訴系統你同不同意。按一下就能累積上面那個準確率</div>
      <div id="todo"></div>
    </div>
  </main>
</div>

<script>
var API='https://step1ne-backoffice-worker.aiagentg888.workers.dev';
var KEY='s1ne_admin_tok';
var tok=localStorage.getItem(KEY)||'';
var $=function(i){return document.getElementById(i)};
function api(p, o) {
  o = o || {};
  o.headers = Object.assign({ authorization: 'Bearer ' + tok }, o.headers || {});
  return fetch(API + p, o).then(function (r) {
    if (r.status === 401) { var e401 = new Error('權杖不正確'); e401.status = 401; throw e401; }
    return r.text().then(function (t) {
      var d = null;
      try { d = JSON.parse(t); } catch (x) { /* 不是 JSON——多半是 CF 的錯誤頁 */ }
      if (!r.ok) {
        var err = new Error('HTTP ' + r.status);
        err.status = r.status;
        err.serverError = d && d.error ? d.error : null;
        err.body = d ? null : String(t).slice(0, 200);
        throw err;
      }
      if (d === null) { var ep = new Error('回傳格式不是 JSON'); ep.body = String(t).slice(0, 200); throw ep; }
      return d;
    });
  });
}
// ── 錯誤訊息不要一律說「連線失敗」 ──
// 2026-09-08：顧問按「產生電洽前準備」看到「連線失敗」，實際上網路好好的，
// 真正的錯是後端 D1_ERROR: no such column: report_id。前端把所有失敗都寫成
// 同一句話，等於把診斷資訊丟掉，只能靠工程師去翻 worker log 才知道發生什麼事。
//
// apiFail() 依實際情況給不同訊息：後端有回錯誤就照實顯示，
// HTTP 非 2xx 顯示狀態碼，真的連不上才說連線失敗。
function apiFail(e) {
  if (!e) return apiFail(e);
  if (e.status === 401 || /權杖/.test(e.message || '')) return '權杖不正確，請重新輸入';
  if (e.serverError) return '伺服器回報：' + String(e.serverError).slice(0, 120);
  if (e.status) return '伺服器錯誤 ' + e.status + (e.body ? '：' + String(e.body).slice(0, 100) : '');
  if (e.name === 'TypeError') return '連線失敗（連不到伺服器，檢查網路）';
  return String(e.message || e).slice(0, 120);
}

function kpi(v,l,cls,ic){return '<div class="kpi '+(cls||'')+'">'+(ic?'<div class="ic">'+ic+'</div>':'')+'<div class="n">'+v+'</div><div class="l">'+l+'</div></div>'}

function load(){
  $('gate').hidden=true;$('app').hidden=false;
  api('/admin/overview').then(function(d){
    if(!d.ok){$('kpis').innerHTML='<div class="mut">讀取失敗</div>';return}
    render(d);
  }).catch(function(e){$('kpis').innerHTML='<div class="mut">連線失敗</div>'});
}
function boot(){
  if(tok) return load();
  $('gate').hidden=false;
  $('enter').onclick=function(){
    tok=$('tok').value.trim(); if(!tok) return;
    api('/admin/overview').then(function(d){
      if(!d.ok){$('gerr').hidden=false;$('gerr').textContent='權杖不正確';return}
      localStorage.setItem(KEY,tok);load();
    });
  };
  $('tok').addEventListener('keydown',function(e){if(e.key==='Enter')$('enter').click()});
}
boot();
</script>
<script defer src="/consultant/_shell.js"></script>
</html>
