<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>人才池｜顧問後台</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#8a6100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:22px 0 60px}
.note{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.7}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.c .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c .nm{font-weight:700;font-size:15px}
.c .hl{font-size:13px;color:var(--ink2)}
.c .meta{font-size:12.5px;color:var(--ink3);margin-top:2px}
.c .sk{font-size:12px;color:var(--ink2);margin-top:6px}
.sc{margin-left:auto;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.d{color:var(--bad);border-color:#f0d4cf}
a.lk{color:var(--gold);text-decoration:none;font-size:12.5px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--ink3)}
.rmask{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;}
.rcard{background:#fff;border-radius:16px;padding:20px 22px;max-width:360px;width:100%;}
.rbtn{display:block;width:100%;text-align:left;margin-bottom:8px;}
.sbar{display:flex;gap:8px;margin-bottom:12px}
.sbar input{flex:1;font:inherit;font-size:14px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff}
.pager{display:flex;gap:8px;justify-content:center;margin-top:14px}
.cat{font-size:12.5px}
.gs{font-size:11px;color:var(--warn);margin-left:5px}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>人才池</b>
    <nav>
      <a href="/consultant/overview/">總覽</a>
      <a href="/consultant/sourced/" class="on">人才池</a>
      <a href="/consultant/reports/">初篩報告</a>
      <a href="/consultant/jobs/">職缺分類</a>
    </nav>
  </div></header>
  <main class="wrap">
    <div class="note">
      這裡是<b>主動開發爬回來的人</b>，不是應徵者——他們沒有投履歷、也還沒同意個資利用，
      所以跟正式應徵者分開放，不會混進漏斗統計。<br>
      流程是：<b>挑出值得談的 → 顧問接觸 → 對方有意願 → 才轉成應徵者發面談連結</b>。
      ⚠️ 沒有回覆意願之前，不要把人轉成應徵者。
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="sbar">
      <input id="q" type="search" placeholder="搜尋姓名、職稱、公司、技能…" autocomplete="off">
      <button class="btn p" id="go">搜尋</button>
      <button class="btn" id="clr">清除</button>
    </div>
    <div class="tabs" id="cats"></div>
    <div class="tabs" id="filters"></div>
    <div id="cnt" class="mut" style="margin-bottom:8px"></div>
    <div id="list" class="mut">載入中…</div>
    <div id="pager" class="pager"></div>
  </main>
</div>

<script>
var API='https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY='s1ne_admin_tok';
var tok=localStorage.getItem(KEY)||'';
var $=function(i){return document.getElementById(i)};
var ST='new', Q='', CAT='', SRC='', HAS='', PAGE=0;
function api(p,o){o=o||{};o.headers=Object.assign({authorization:'Bearer '+tok},o.headers||{});
  return fetch(API+p,o).then(function(r){return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var LB={new:'待挑選',shortlisted:'已挑出',contacted:'已接觸',replied:'有回覆',
        rejected:'不合適',converted:'已轉應徵者',all:'全部'};

function chip(label,n,on,attr){
  return '<button class="tab cat'+(on?' on':'')+'" '+attr+'>'+esc(label)+(n!=null?' '+n:'')+'</button>';
}
function render(d){
  var cnt={}; (d.counts||[]).forEach(function(c){cnt[c.status]=c.n});
  // 分類（用他自己的職稱／技能判斷；沒寫的用「當初為哪個職缺撈的」回推，卡片上會標「推測」）
  $('cats').innerHTML = chip('全部類別',null,!CAT,'data-c=""')
    + (d.cats||[]).map(function(c){return chip(c.k,c.n,CAT===c.k,'data-c="'+esc(c.k)+'"')}).join('');
  $('filters').innerHTML = chip('不限來源',null,!SRC,'data-s2=""')
    + (d.srcs||[]).map(function(c){return chip(c.k,c.n,SRC===c.k,'data-s2="'+esc(c.k)+'"')}).join('')
    + chip('有 email',null,HAS==='email','data-h="email"')
    + chip('有 LinkedIn',null,HAS==='linkedin','data-h="linkedin"');
  var tot=d.total||0, size=d.size||60, pg=d.page||0;
  $('cnt').textContent = tot ? ('符合 '+tot+' 位，顯示第 '+(pg*size+1)+'–'+Math.min(tot,(pg+1)*size)+' 位') : '';
  var pages=Math.ceil(tot/size);
  $('pager').innerHTML = pages>1
    ? '<button class="btn" id="prev"'+(pg<=0?' disabled':'')+'>← 上一頁</button>'
      +'<span class="mut" style="align-self:center">第 '+(pg+1)+' / '+pages+' 頁</span>'
      +'<button class="btn" id="next"'+(pg>=pages-1?' disabled':'')+'>下一頁 →</button>'
    : '';
  if($('prev'))$('prev').onclick=function(){PAGE--;load()};
  if($('next'))$('next').onclick=function(){PAGE++;load()};
  $('tabs').innerHTML=['new','shortlisted','contacted','replied','converted','rejected','all']
    .map(function(k){
      var n=k==='all'?Object.keys(cnt).reduce(function(a,b){return a+cnt[b]},0):(cnt[k]||0);
      return '<button class="tab'+(k===ST?' on':'')+'" data-s="'+k+'">'+LB[k]+' '+n+'</button>';
    }).join('');
  var rows=d.rows||[];
  if(!rows.length){$('list').innerHTML='<div class="empty">'
    +((Q||CAT||SRC||HAS)?'沒有符合這些條件的人。<br><span class="mut">換個關鍵字，或按「清除」看全部。</span>'
      :'這一區目前沒有人。<br><span class="mut">爬蟲跑完會自動把人送進「待挑選」。</span>')
    +'</div>';$('pager').innerHTML='';return}
  $('list').innerHTML=rows.map(function(r){
    var links=[];
    if(r.linkedin_url)links.push('<a class="lk" href="'+esc(r.linkedin_url)+'" target="_blank" rel="noopener">LinkedIn</a>');
    if(r.github_url)links.push('<a class="lk" href="'+esc(r.github_url)+'" target="_blank" rel="noopener">GitHub</a>');
    if(r.source_url&&!links.length)links.push('<a class="lk" href="'+esc(r.source_url)+'" target="_blank" rel="noopener">來源</a>');
    var catTag = r.category
      ? '<span class="sc">'+esc(r.category)
        +(r.cat_src==='searched'?'<span class="gs">推測</span>':'')+'</span>' : '';
    return '<div class="c"><div class="top"><span class="nm">'+esc(r.name||'（無姓名）')+'</span>'
      +'<span class="hl">'+esc(r.headline||'')+'</span>'+catTag+'</div>'
      +'<div class="meta">'+[esc(r.company),esc(r.location),esc(r.source)].filter(Boolean).join('　·　')
      +(links.length?'　·　'+links.join('　'):'')+'</div>'
      +(r.skills?'<div class="sk">'+esc(r.skills)+'</div>':'')
      +'<div class="acts">'
      +(r.status!=='shortlisted'?'<button class="btn p" onclick="mv(\''+r.id+'\',\'shortlisted\')">挑出來</button>':'')
      +(r.status!=='contacted'?'<button class="btn" onclick="mv(\''+r.id+'\',\'contacted\')">已接觸</button>':'')
      +(r.status!=='replied'?'<button class="btn" onclick="mv(\''+r.id+'\',\'replied\')">他有回覆</button>':'')
      +'<button class="btn d" onclick="mv(\''+r.id+'\',\'rejected\')">不合適</button>'
      +'</div></div>';
  }).join('');
}
// 標記不合適時要選原因。用固定選項不是自由輸入——
// 這份資料是要累積起來看出「該調整什麼」的，
// 自由文字寫法太散（地點太遠／通勤問題／在南部其實同一件事），統計不出東西。
var REJECT_REASONS=['地點不行','資歷差太多','職類根本不對','找不到聯絡方式','已有工作或沒意願','其他'];
function mv(id,st){
  if(st==='rejected'){ askReason(id); return; }
  send(id,st,null);
}
function askReason(id){
  var box=$('reasonBox');
  box.innerHTML='<div class="rmask"><div class="rcard">'
    +'<h3 style="margin:0 0 4px;font-size:16px;">為什麼不合適？</h3>'
    +'<p style="margin:0 0 12px;color:#6b6e77;font-size:13px;">'
    +'選一個就好。累積幾筆之後，系統會依這些原因調整下一次要怎麼找人。</p>'
    +REJECT_REASONS.map(function(r){
        return '<button class="btn rbtn" data-r="'+r+'">'+r+'</button>';}).join('')
    +'<div style="margin-top:12px;"><button class="btn" id="rCancel">取消</button></div>'
    +'</div></div>';
  box.style.display='block';
  box.querySelectorAll('.rbtn').forEach(function(b){
    b.onclick=function(){ box.style.display='none'; send(id,'rejected',b.dataset.r); };
  });
  $('rCancel').onclick=function(){ box.style.display='none'; };
}
function send(id,st,reason){
  api('/admin/sourced/status',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({id:id,status:st,reason:reason})}).then(function(d){
      if(!d.ok){alert(d.error||'更新失敗');return} load();
    });
}
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return; ST=b.dataset.s; PAGE=0; load();
});
$('cats').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return; CAT=b.dataset.c||''; PAGE=0; load();
});
$('filters').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return;
  if(b.dataset.h!=null){ HAS = (HAS===b.dataset.h?'':b.dataset.h); }
  else { SRC=b.dataset.s2||''; }
  PAGE=0; load();
});
$('go').onclick=function(){Q=$('q').value.trim();PAGE=0;load()};
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('clr').onclick=function(){Q='';CAT='';SRC='';HAS='';PAGE=0;$('q').value='';load()};
function load(){
  $('gate').hidden=true;$('app').hidden=false;
  var qs='/admin/sourced?status='+encodeURIComponent(ST)
    +'&page='+PAGE
    +(Q?'&q='+encodeURIComponent(Q):'')
    +(CAT?'&cat='+encodeURIComponent(CAT):'')
    +(SRC?'&source='+encodeURIComponent(SRC):'')
    +(HAS?'&has='+encodeURIComponent(HAS):'');
  api(qs).then(function(d){
    if(!d.ok){$('list').innerHTML='<div class="mut">讀取失敗</div>';return} render(d);
  }).catch(function(){$('list').innerHTML='<div class="mut">連線失敗</div>'});
}
function boot(){
  if(tok)return load();
  $('gate').hidden=false;
  $('enter').onclick=function(){
    tok=$('tok').value.trim(); if(!tok)return;
    api('/admin/sourced').then(function(d){
      if(!d.ok){$('gerr').hidden=false;$('gerr').textContent='權杖不正確';return}
      localStorage.setItem(KEY,tok);load();
    });
  };
  $('tok').addEventListener('keydown',function(e){if(e.key==='Enter')$('enter').click()});
}
boot();
</script>
<script defer src="/consultant/_shell.js"></script>
</html>
