<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>顧問人選追蹤｜顧問後台</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
/* 沿用 consultant/pipeline 既有視覺語言＋Phase 1 demo（consultant/pipeline-preview）
   驗證過的版面，這是正式版，接真實 /admin/pipeline/tracker 等端點。 */
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#8a6100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:22px 0 80px}

.funnel-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 16px 8px;margin-bottom:18px}
.funnel-title{font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:.06em;margin-bottom:14px}
.funnel{max-width:420px;margin:0 auto}
.funnel-seg{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.funnel-seg:last-child{border-bottom:0}
/* 梯形只當「這關人數比例」的裝飾指示條，固定高度、不扛文字——文字永遠在
   自己的深色字上，不會有梯形太窄時文字疊到背景上看不見的問題。 */
.funnel-indicator{width:64px;height:28px;flex:0 0 auto;background:var(--soft);border-radius:4px;overflow:hidden}
.funnel-indicator .shape{height:100%;background:linear-gradient(90deg,var(--gold),#c99a4f);border-radius:4px}
.funnel-seg:nth-child(2) .shape{filter:brightness(.94)}
.funnel-seg:nth-child(3) .shape{filter:brightness(.88)}
.funnel-seg:nth-child(4) .shape{filter:brightness(.82)}
.funnel-seg:nth-child(5) .shape{filter:brightness(.8)}
.funnel-seg:nth-child(6) .shape{filter:brightness(.76)}
.funnel-seg .txt{display:flex;align-items:baseline;gap:8px;color:var(--ink);min-width:0}
.funnel-seg .txt b{font-size:18px;font-variant-numeric:tabular-nums;line-height:1.1;flex:0 0 auto}
.funnel-seg .txt span{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.who select{font:inherit;font-size:15px;font-weight:700;padding:9px 34px 9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8d95' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 14px center;appearance:none;color:var(--ink);cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .lb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.hot .v{color:var(--bad)}

.pipes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.pipe{font:inherit;font-weight:700;font-size:14px;text-align:left;border-radius:12px;padding:12px 18px;cursor:pointer;background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.pipe.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pipe .n{display:block;font-weight:400;font-size:11.5px;opacity:.72;margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{position:relative;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:7px 15px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.72}
.tabsSel{display:none;width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px 34px 10px 15px;border:1px solid var(--line);border-radius:999px;background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8d95' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 14px center;appearance:none;color:var(--ink);cursor:pointer;margin-bottom:14px}
@media (max-width:640px){.tabs{display:none}.tabsSel{display:block}}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{font:inherit;font-size:13.5px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;flex:1 1 220px;min-width:160px;background:#fff}
.viewsw{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.viewsw button{font:inherit;font-size:13px;font-weight:600;border:0;background:#fff;color:var(--ink2);padding:7px 16px;cursor:pointer}
.viewsw button.on{background:var(--ink);color:#fff}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:6px 15px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.d{color:var(--bad);border-color:#f0d4cf}

.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
/* checkpoint 直欄內容只有 ✓／—／短字，不用跟人選/職缺欄一樣寬的留白，
   9 個直欄疊起來才不會遠遠超出螢幕寬度、又完全沒有能看出來可以橫向捲動的
   提示——這正是 Jacky 那次「表格式其他欄位整個消失」回報的真正原因：
   表格真的比視窗寬，但看起來像斷尾，不像可以捲。 */
th.narrow,td.narrow{padding:10px 8px;text-align:center;white-space:normal;max-width:78px}
th.narrow{font-size:11px;line-height:1.3}
.tbl-wrap{position:relative}
.tbl-wrap:after{content:"";position:absolute;top:0;right:0;bottom:0;width:18px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9))}
th{color:var(--ink3);font-size:12px;font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
.stagecell{text-align:center;color:var(--ink3);font-variant-numeric:tabular-nums}
.stagecell.now{color:var(--gold);font-weight:700}
.stagecell.done{color:var(--ok);font-weight:700}
.nmwrap{display:inline-flex;align-items:center;gap:5px}
.nmwrap .dupflag{color:var(--warn);cursor:help}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.b-undecided{background:#fdf0d8;color:#8a5a1a}
.b-forward{background:#dff2e3;color:#1f6b34}
.b-more{background:#e6eefb;color:#24528f}
.b-no{background:#f2e6e6;color:#8a3333}
.b-notstart{background:#f0efec;color:#6b6e77}

.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;min-width:0}
.dash-card:hover{border-color:var(--gold)}
.dash-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-card-meta{font-size:11.5px;color:var(--ink3);margin-top:8px}
.dash-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.dash-card-foot .hint{color:var(--gold);font-weight:600}

.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink3)}

.dmask{position:fixed;inset:0;background:rgba(20,22,26,.5);z-index:80;display:none;justify-content:flex-end}
.dmask.show{display:flex}
.dwrap{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.12)}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;z-index:2}
.dhead .nm{font-size:19px;font-weight:700}
.edbtn{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--ink2);border-radius:999px;padding:4px 13px}
.dhead .x{margin-left:8px;font:inherit;font-size:22px;line-height:1;background:none;border:0;cursor:pointer;color:var(--ink3);padding:0 4px}
.dbody{padding:16px 20px 60px}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:11px}
.sec h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink3);display:flex;align-items:center;gap:10px}
.sec .subhint{font-size:11.5px;color:var(--ink3);font-weight:400;letter-spacing:0;margin:-4px 0 8px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink3);white-space:nowrap}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv a{color:var(--gold);text-decoration:none}
.bar{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.stp{flex:1 1 0;min-width:56px;text-align:center;position:relative;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;background:#e4ddcf;margin:0 auto 5px;position:relative;z-index:1}
.stp.done .dot{background:var(--ok)}
.stp.now .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(166,124,61,.18)}
.stp:not(:first-child):before{content:"";position:absolute;left:-50%;top:5px;width:100%;height:1px;background:#e4ddcf}
.stp.done:before,.stp.now:before{background:var(--ok)}
.stp .lb{font-size:11px;line-height:1.35;color:var(--ink3)}
.stp.now .lb{color:var(--gold);font-weight:700}
.stp.done .lb{color:var(--ink2)}
.rpt{font-size:13.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow-y:auto;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.rpt.open{max-height:none}
.more{font:inherit;font-size:12.5px;font-weight:600;color:var(--gold);background:none;border:0;cursor:pointer;padding:6px 0 0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--soft);color:var(--ink2)}
.pill.ok{background:#e8f5ee;border-color:#bfe0cd;color:var(--ok)}
.pill.warn{background:#fdf3e0;border-color:#efdcb6;color:var(--warn)}
.pill.bad{background:#fdecea;border-color:#f3cdc7;color:var(--bad)}
.edl{display:block;font-size:11.5px;color:var(--ink3);margin:9px 0 3px;font-weight:600}
.edi{width:100%;font:inherit;font-size:13.5px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
select.edi{appearance:none;background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8d95' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 12px center}
.ntv{font-size:13.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2)}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>顧問人選追蹤</b>
    <button id="tutBtn" type="button" style="font:inherit;font-weight:700;font-size:12.5px;background:#fff;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:5px 14px;margin-left:10px;cursor:pointer">？使用教學</button>
    <nav>
      <a href="/consultant/reports/">阿財面談實況</a>
      <a class="on" href="#">顧問人選追蹤</a>
    </nav>
  </div></header>

  <main class="wrap">
    <div class="funnel-wrap" id="funnelWrap"></div>
    <div class="who">
      <select id="ownerSel" aria-label="顧問"></select>
      <span class="mut" id="ownerHint"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="pipes" id="pipes"></div>
    <div class="tabs" id="tabs"></div>
    <select class="tabsSel" id="tabsSel" aria-label="篩選階段"></select>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋姓名／Email／電話">
      <button class="btn p" id="ncOpen" type="button" style="white-space:nowrap">＋新增人選</button>
      <div class="viewsw">
        <button id="vTable" class="on" type="button">表格式</button>
        <button id="vCard" type="button">卡片式</button>
      </div>
    </div>
    <div id="listWrap"><div class="empty">載入中…</div></div>
  </main>
</div>

<div class="dmask" id="dmask"><div class="dwrap" id="dwrap"></div></div>
<div class="dmask" id="ncMask"><div class="dwrap" id="ncWrap"></div></div>
<div class="dmask" id="noteMask"><div class="dwrap" style="width:min(420px,100%)" id="noteWrap"></div></div>
<div class="dmask" id="callMask"><div class="dwrap" style="width:min(460px,100%)" id="callWrap"></div></div>
<div class="dmask" id="tutMask"><div class="dwrap" style="width:min(520px,100%)" id="tutWrap"></div></div>
<div class="dmask" id="cfMask"><div class="dwrap" style="width:min(480px,100%)" id="cfWrap"></div></div>
<div class="dmask" id="rptMask">
  <div class="dwrap" style="width:min(760px,100%)">
    <div class="dhead"><span class="nm">報告預覽</span><button class="x" id="rptMaskClose" type="button">×</button></div>
    <iframe id="rptFrame" style="width:100%;height:calc(100% - 53px);border:0"></iframe>
  </div>
</div>

<script>
var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY = 's1ne_admin_tok';
var tok = localStorage.getItem(KEY) || '';
var $ = function (i) { return document.getElementById(i); };
function api(p, o) {
  o = o || {}; o.headers = Object.assign({ authorization: 'Bearer ' + tok }, o.headers || {});
  return fetch(API + p, o).then(function (r) { return r.json(); });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }
function parseExtra(s) { try { return JSON.parse(s || '[]'); } catch (e) { return []; } }

var DEC = { forwarded: { lb: '已轉客戶', cls: 'b-forward' }, need_more: { lb: '需補問', cls: 'b-more' }, rejected: { lb: '不推薦', cls: 'b-no' } };
// 2026-09-01 全面改版：兩層式導覽——顧問先選管道（主動開發／正式應徵／顧問履歷庫／
// 全部人選），再選該管道底下的階段。原本 7 個分頁攤平在同一排，選項會不會出現
// 都不一樣，Jacky 反映「每個tab能選的又不一樣，看了要先理解很久」；分成兩層後，
// 同一時間只會看到同一種邏輯的分頁，不會混。
//   主動開發：待開發接觸→等對方回（冷開發，還沒轉正式應徵）
//   正式應徵：等人選填完→等我決定→客戶面談階段（自己應徵或顧問手動新增，統一
//            共用；「等我決定」跟「待審核硬性條件」合併，用 hardGateBadge() 徽章
//            區分，不獨立分頁——理由跟舊版一致）
//   顧問履歷庫：已結案＋預備區合併——人選本身沒有消失，只是目前沒有進行中的媒合，
//          不分管道，兩邊的人選都可能落在這裡（沒有子分頁）
// state.tab 還是原本那個「後端 tab 值」（fill/decide/client/to_contact/
// waiting_reply/pool），filtered() 的篩選邏輯完全不用改，只有上面這層導覽UI改變。
var PIPES = [
  { k: 'sourced', lb: '主動開發', subs: [
      { k: 'to_contact', lb: '待開發接觸' },
      { k: 'waiting_reply', lb: '等對方回' },
    ] },
  { k: 'formal', lb: '正式應徵', subs: [
      { k: 'fill', lb: '等人選填完' },
      { k: 'decide', lb: '等我決定' },
      { k: 'client', lb: '客戶面談階段' },
    ] },
];
var TABS = [{ k: '', lb: '全部' }]
  .concat(PIPES[0].subs, PIPES[1].subs, [{ k: 'pool', lb: '顧問履歷庫' }]);
var CARDS = [];
var state = { pipe: 'all', tab: '', view: 'table', q: '', owner: safeGet('s1ne_pp_owner2') || 'all' };
function pipeOf(tabKey) {
  if (tabKey === '') return 'all';
  if (tabKey === 'pool') return 'pool';
  for (var i = 0; i < PIPES.length; i++) if (PIPES[i].subs.some(function (s) { return s.k === tabKey; })) return PIPES[i].k;
  return 'all';
}
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// tab 是後端 /admin/pipeline/tracker 直接算好回傳的（含主動開發的
// 待開發接觸／等對方回兩關），前端不再自己猜一套——這正是「初篩報告」跟
// 「我的案子」原本各算各的才會兜不起來的老問題，這次只留一份算法。
// 2026-09-01：sourced 卡片改看真正的 status，不是只看 tab——shortlisted 跟
// replied 本來都落在同一個 tab（待開發接觸），畫面上完全看不出「對方回信了」
// 這件事，選了「他回覆了」看起來像繞回原點。現在後端真的回傳 status 了，
// 這裡對應到真正不同的徽章文字。
var SRC_STATUS_LABEL = {
  new: '待開發接觸', shortlisted: '待開發接觸', contacted: '等對方回',
  replied: '已回覆待評估', standby: '預備區',
};
// 2026-09-01 加：screening 併進 to_review 之後，用這個徽章區分「硬性條件
// 檢查」（客觀勾選，通常很快）跟「面談後決定」（要讀完報告的主觀判斷）——
// 兩種工作性質不同，合併成一個 tab 後靠這個標籤讓顧問還是分得出來，
// 不用另外分頁才能各自批次處理。
function hardGateBadge(c) {
  return c.hard_gate ? '<span class="badge b-undecided" style="margin-left:4px">硬性條件審核</span>' : '';
}
function stageLabelOf(c) {
  if (c.kind === 'sourced') {
    var lb = SRC_STATUS_LABEL[c.status] || (c.tab === 'to_contact' ? '待開發接觸' : '等對方回');
    return { lb: lb, cls: c.status === 'replied' ? 'b-undecided' : (c.status === 'standby' ? 'b-notstart' : 'b-notstart') };
  }
  if (c.closed) return { lb: '已結案', cls: 'b-no' };
  if (c.hard_gate) return { lb: '待審核', cls: 'b-undecided' };
  if (c.decision && DEC[c.decision]) return DEC[c.decision];
  var now = (c.steps || []).find(function (s) { return s.now; });
  if (now) return { lb: now.lb, cls: 'b-forward' };
  return { lb: '—', cls: 'b-notstart' };
}
function tabCount(k) {
  var base = ownerScoped();
  if (!k) return base.length;
  return base.filter(function (c) { return c.tab === k; }).length;
}
function ownerScoped() { return CARDS; } // owner 篩選已經在後端 API 做了，這裡不用再篩一次
function filtered() {
  var q = state.q.trim().toLowerCase();
  // ⚠️ 2026-09-01 修：q.replace(/\D/g,'') 對「陳其寬」這種完全沒有數字的搜尋字
  // 會清成空字串，'' .indexOf('') 永遠 >= 0，導致電話比對這個 fallback 對任何
  // 純文字搜尋都回傳 true——等於搜尋姓名/信箱完全沒作用（每一筆都「符合」）。
  // 只有 q 本身真的含數字時才比對電話。
  var qDigits = q.replace(/\D/g, '');
  return ownerScoped().filter(function (c) {
    if (state.tab && c.tab !== state.tab) return false;
    if (!q) return true;
    return (c.name || '').toLowerCase().indexOf(q) >= 0
      || (c.email || '').toLowerCase().indexOf(q) >= 0
      || (qDigits && (c.phone || '').replace(/\D/g, '').indexOf(qDigits) >= 0);
  });
}

function renderFunnel() {
  var base = ownerScoped();
  var stages = [
    ['顧問接觸中', base.length],
    ['AI阿財面談完畢', base.filter(function (c) { return c.ai_done; }).length],
    ['顧問評估中', base.filter(function (c) { return c.evaluated; }).length],
    ['已推送客戶', base.filter(function (c) { return c.pushed; }).length],
    ['已錄取', base.filter(function (c) { return (c.steps || []).some(function (s) { return s.key === 'offer' && (s.done || s.now); }); }).length],
    ['已到職', base.filter(function (c) { return (c.steps || []).some(function (s) { return s.key === 'onboard' && (s.done || s.now); }); }).length],
  ];
  var max = Math.max(1, stages[0][1]);
  var ratios = stages.map(function (s) { return Math.max(0.06, s[1] / max); });
  // ⚠️ 2026-09-01 修：原本文字是白色、疊在梯形色塊「上面」，梯形窄的關卡
  // （比如已推送客戶只有 7/114）視覺寬度很窄，但文字容器還是滿版寬——文字
  // 超出梯形範圍的那段等於「白字疊在米白色底色上」，人眼幾乎看不到，就是
  // Jacky 手機上看到的「字被吃掉」。改成文字固定在自己的淺色底條上（永遠
  // 深色字、永遠看得清楚），漏斗改成橫向長條（寬度按比例縮放）純當裝飾指示，
  // 不再扛文字，寬度縮放本身就足夠表達「一關比一關窄」的漏斗意義。
  $('funnelWrap').innerHTML = '<div class="funnel-title">招募漏斗</div><div class="funnel">' +
    stages.map(function (s, i) {
      var pct = max ? Math.round(s[1] / max * 100) : 0;
      return '<div class="funnel-seg">' +
        '<div class="funnel-indicator"><div class="shape" style="width:' + Math.round(ratios[i] * 100) + '%"></div></div>' +
        '<div class="txt"><b>' + s[1] + '</b><span>' + esc(s[0]) + (i > 0 ? '　·　' + pct + '%' : '') + '</span></div></div>';
    }).join('') + '</div>';
}
function renderStats() {
  renderFunnel();
  var items = TABS.slice(1).map(function (t) { return [t.lb, tabCount(t.k)]; });
  $('stats').innerHTML = items.map(function (it) {
    return '<div class="stat' + (it[1] > 0 && (it[0] === '等我決定' || it[0] === '待審核（硬性條件）') ? ' hot' : '') + '">' +
      '<div class="lb">' + it[0] + '</div><div class="v">' + it[1] + '</div></div>';

}
function pipeCount(pk) {
  if (pk === 'all') return tabCount('');
  if (pk === 'pool') return tabCount('pool');
  var grp = PIPES.filter(function (p) { return p.k === pk; })[0];

}
function renderPipes() {
  var groups = [{ k: 'all', lb: '全部人選' }, { k: 'sourced', lb: '主動開發' }, { k: 'formal', lb: '正式應徵' }, { k: 'pool', lb: '顧問履歷庫' }];

      else state.tab = PIPES.filter(function (p) { return p.k === state.pipe; })[0].subs[0].k;
      renderPipes(); renderTabs(); renderList();

}
function renderTabs() {
  var grp = PIPES.filter(function (p) { return p.k === state.pipe; })[0];
  var subs = grp ? grp.subs : [];
  if (!subs.length) { $('tabs').innerHTML = ''; $('tabsSel').innerHTML = ''; return; }
  $('tabs').innerHTML = subs.map(function (t) {
    return '<button type="button" class="tab' + (state.tab === t.k ? ' on' : '') + '" data-k="' + t.k + '">' + t.lb + '<span class="n">' + tabCount(t.k) + '</span></button>';
  }).join('');
  Array.prototype.forEach.call($('tabs').querySelectorAll('.tab'), function (b) {

  var sel = $('tabsSel');
  sel.innerHTML = subs.map(function (t) { return '<option value="' + t.k + '"' + (state.tab === t.k ? ' selected' : '') + '>' + t.lb + '（' + tabCount(t.k) + '）</option>'; }).join('');

    Array.prototype.forEach.call(el.querySelectorAll('.inlineStageSel'), function (sel) {

        '<span class="badge ' + st.cls + '">' + st.lb + '</span></div>' +

// 萬用階段——這是 Jacky 在 Phase 1 demo 定案、正式版漏做的那顆：一個下拉
// 涵蓋人選整個生命週期（已面談還沒決定／已決定推不推／客戶端各階段／
// 已結案），對應到表格式的每一欄，不是只有「這個客戶目前卡在第幾關」。
// 只涵蓋主要（第一個）客戶——多客戶推派的其他家，各自進度用上面每個
// placement 自己的階段下拉調整，不會被這顆萬用選單誤動到。
// 2026-09-01 改：原本分組（已面談還沒決定／已決定推不推／客戶端流程／結束）
// 是顧問內部視角，跟企業用人單位需求表（portal/index.html TABLE_COLS）看到的
// 5 個欄位（顧問階段／用人單位／面試階段／錄取／報到）完全是兩套說法,
// 顧問選的時候看不出來選了會讓企業那邊哪一格變什麼——這就是「一目瞭然」的缺口。
// 改成直接照企業端欄位名稱分組，選項旁邊就是答案，不用自己在心裡對應。
// ⚠️ 對應關係抄自 portal/index.html 的 TABLE_COLS／currentInterviewStage，
// 那邊改了這裡也要跟著改，不要各自維護一份。
var CLIENT_COL_OF_STAGE = {
  confirm: '顧問階段', stage1: '面試階段', stage2: '面試階段', stage3: '面試階段',
  offer: '錄取', onboard: '報到',
};
// stage4／screening／care／backup 目前 portal 端沒有對應欄位（面試階段只收
// stage1~stage3，見 portal/index.html 的 INTERVIEW_STAGE_OPTS）——選了這些，
// 企業用人單位需求表上不會有任何變化，顧問要知道這件事，不是被蒙在鼓裡。
// 2026-09-01 抽出來的共用函式——抽屜裡的萬用階段下拉、跟表格列內嵌的萬用
// 階段下拉，呼叫的是同一支。兩種介面顧問都在測，選哪個定案前先讓兩邊都能用，
// 不要為了「先做一個」就把邏輯寫死在某一個介面裡，之後要拆會很痛。
function applyUniversalStage(c, appId, v, afterFn) {
  var primaryPl = (c.placements || [])[0] || null;
  if (v === 'to_review') {
    if (!c.report_id) { afterFn(); return; }
    api('/admin/clear-decision', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.report_id }) })
      .then(afterFn);
  } else if (v.indexOf('dec:') === 0) {
    var k = v.slice(4);
    api('/admin/decide-report', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: c.report_id, decision: k, app_id: appId,
        app_status: k === 'forwarded' ? 'passed' : (k === 'rejected' ? 'rejected' : 'reported'), by: '顧問' }) })
      .then(afterFn);
  } else if (v.indexOf('stage:') === 0) {
    api('/admin/set-manual-stage', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ application_id: appId, stage: v.slice(6), company_id: primaryPl ? primaryPl.company_id : null, by: '顧問' }) })
      .then(afterFn);
  } else if (v === 'closed') {
    // 2026-09-01 改：Jacky 要求先移除「要不要順便通知候選人」這個彈窗——結案
    // 一律只記內部（CLOSED_INTERNAL），不發婉拒通知，之後要重新開放通知再改。
    var reason = prompt('結案原因（會存內部記錄）：');
    if (reason === null) { afterFn(); return; }
    api('/admin/mark-closed', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ application_id: appId, notify: false, reason: reason }) })
      .then(function (r) {
        if (!r.ok) { alert(r.message || r.error || '結案失敗'); afterFn(); return; }
        afterFn();
      });
  }
}

function universalStageOptionsHtml(c, primaryPl) {
  var cur = 'to_review';
  if (c.closed) cur = 'closed';
  else if (c.decision === 'forwarded') cur = 'dec:forwarded';
  else if (c.decision === 'need_more') cur = 'dec:need_more';
  else if (c.decision === 'rejected') cur = 'dec:rejected';
  else if (primaryPl) {
    var now = (primaryPl.steps || []).find(function (s) { return s.now; });
    if (now) cur = 'stage:' + now.key;
  }
  // 依「會反映到企業端哪一格」分組；找不到對應欄位的，全部歸進
  // 「企業端看不到（內部用）」，不要讓顧問誤以為選了企業那邊就會動。
  var byCol = {};   // 企業端欄位名 -> [{k,lb}]
  var internal = [{ k: 'to_review', lb: '等我決定' }];
  if (primaryPl) {
    (primaryPl.steps || []).forEach(function (s) {
      var col = CLIENT_COL_OF_STAGE[s.key];
      var opt = { k: 'stage:' + s.key, lb: s.lb };
      if (col) { (byCol[col] = byCol[col] || []).push(opt); }
      else { internal.push(opt); }
    });
  }
  internal.push({ k: 'dec:need_more', lb: '需補問' }, { k: 'dec:rejected', lb: '不推薦' }, { k: 'closed', lb: '已結案' });

  var groups = [];
  if (primaryPl) groups.push({ grp: '→ 企業端『用人單位』欄', opts: [{ k: 'dec:forwarded', lb: '已轉客戶（推進企業）' }] });
  ['顧問階段', '面試階段', '錄取', '報到'].forEach(function (col) {
    if (byCol[col]) groups.push({ grp: '→ 企業端『' + col + '』欄' + (primaryPl ? '（' + primaryPl.client_name + '）' : ''), opts: byCol[col] });
  });
  groups.push({ grp: '企業端看不到（內部用，選了不會反映到用人需求表）', opts: internal });

  return groups.map(function (g) {
    return '<optgroup label="' + esc(g.grp) + '">' + g.opts.map(function (o) {
      return '<option value="' + o.k + '"' + (o.k === cur ? ' selected' : '') + '>' + esc(o.lb) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
}

// 2026-09-01 改：「他回覆了」原本 to 寫死跟「挑出來」同一個字（待開發接觸），
// 選了看起來像繞回起點，其實後端 status 有真的往前走（contacted→replied），
// 只是沒有自己的名字。現在給它獨立的名字，並加「先留著（預備區）」——
// 談過、目前沒缺，不等於不合適，不該被迫在「不合適」跟「無限等對方回」二選一。
var SRC_ACTS = [
  { k: 'shortlisted', lb: '挑出來', to: '待開發接觸' },
  { k: 'contacted', lb: '我聯絡了', to: '等對方回' },
  { k: 'replied', lb: '他回覆了', to: '已回覆待評估' },
  { k: 'standby', lb: '先留著', to: '預備區' },
  { k: 'rejected', lb: '不合適', to: '已收尾' },
];
var SRC_REASONS = ['地點不行', '資歷差太多', '職類根本不對', '找不到聯絡方式', '已有工作或沒意願', '其他'];

// 主動開發、還沒轉正式應徵的人選，資料形狀（sourced_candidates）跟一般
// application 卡差很多，沒有報告/進度條/推派客戶這些概念，用簡化版抽屜。
// 2026-09-01 改：跟 openDrawer()（已應徵的完整卡）統一結構——
// 「目前進度」永遠是第一個 section（狀態在哪、下一步能做什麼），
// 「基本資料」永遠第二，順序固定，顧問不管從哪個分頁點進來看到的
// 都是同一套版面，不用每次重新適應「這張卡怎麼跟剛剛那張長得不一樣」。
// 徽章改叫 stageLabelOf(c)，不要自己另外算一份（那正是 replied 顯示
// 錯誤的原因——這裡本來繞過了 stageLabelOf，自己寫死 tab 三元判斷）。
function openSourcedDrawer(c) {
  var st = stageLabelOf(c);
  var html = '<div class="dhead"><span class="nm">' + esc(c.name) + '</span>' +
    '<span class="badge ' + st.cls + '">' + st.lb + '</span>' +
    '<button class="x" id="dclose" type="button">×</button></div><div class="dbody">' +
    '<div class="sec"><h4>目前進度</h4><p class="mut" style="margin:0 0 10px">這位人選還在人才庫，尚未推送給任何客戶——選下面的動作決定下一步。</p><div class="acts">' +
    SRC_ACTS.map(function (a) { return '<button class="btn srcact" data-k="' + a.k + '" type="button">' + a.lb + '<span class="mut" style="display:block;font-size:10.5px">→ ' + a.to + '</span></button>'; }).join('') +
    '</div></div>' +
    '<div class="sec"><h4>基本資料</h4><dl class="kv">' +
    '<dt>姓名</dt><dd>' + esc(c.name) + '</dd>' +
    '<dt>Email</dt><dd>' + (c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : '<span class="mut">沒有</span>') + '</dd>' +
    '<dt>電話</dt><dd>' + (c.phone ? '<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '<span class="mut">還沒有</span>') + '</dd>' +
    '<dt>現職</dt><dd>' + esc(c.job_title || '—') + '</dd>' +
    '<dt>來源</dt><dd>' + esc(c.source_channel || '—') + '</dd>' +
    '<dt>負責顧問</dt><dd>' + ownerAssignSelect(c.owner) + '</dd>' +
    '</dl></div>' +
    '<div class="sec"><h4>電洽紀錄，轉為正式應徵<span class="subhint">顧問直接把電洽內容打進來，跳過連結自己填——會建立正式應徵紀錄，之後就能在「正式應徵」管道推薦給客戶。</span></h4>' +
    '<label class="edl" style="margin-top:0">應徵職缺</label><select class="edi" id="convJob"><option value="">選一個職缺…</option></select>' +
    '<label class="edl">電洽內容</label><textarea class="edi" id="convNotes" rows="4" placeholder="打字轉錄這次通話重點，或直接貼逐字稿"></textarea>' +
    '<div id="convDz" style="border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink3);cursor:pointer;margin-top:6px">或拖曳電洽紀錄檔案（doc/docx/txt/md/html/pdf/excel）</div>' +
    '<div class="mut" id="convFileMsg" style="margin-top:4px"></div>' +
    '<label class="edl" style="margin-top:10px;display:flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="convConsent" style="width:auto">已取得本人同意，可以建立應徵紀錄</label>' +
    '<div class="acts"><button class="btn p" id="convGo" type="button">送出，轉為正式應徵</button><span class="mut" id="convMsg"></span></div></div>' +
    '<div class="sec"><h4>發應徵連結給他</h4>' +
    (c.invite_token
      ? '<dl class="kv"><dt>已產生</dt><dd class="mut">' + esc(String(c.invite_at || '').slice(0, 16)) + '</dd>' +
        '<dt>職缺</dt><dd>' + esc(c.invite_job_slug || '') + '</dd>' +
        '<dt>連結</dt><dd id="invurl" style="overflow-wrap:anywhere">https://step1ne.com/apply/?inv=' + esc(c.invite_token) + '</dd></dl>' +
        '<div class="acts"><button class="btn p" id="invcopy" type="button">複製連結</button>' +
        '<button class="btn" id="invnew" type="button">換一個職缺</button></div>'
      : '<p class="mut" style="margin:0 0 9px">還沒產生。產生後把連結傳給他，他點進去只要填測驗就能跟阿財面談。</p>' +
        '<div class="acts"><select class="edi" id="invjob" style="max-width:220px"><option value="">選一個職缺…</option></select>' +
        '<button class="btn p" id="invgo" type="button">產生連結</button></div>') +
    '</div>' +
    // 2026-09-02 加：主動開發的人選也要能做客戶版履歷。這批人還沒面談過，
    // 除了姓名/現職/現居地/技能，其餘欄位全部要顧問手動填——跟正式應徵那邊
    // 共用同一個彈窗(openClientFormalModal)，用 kind='sourced' 分流資料來源。
    '<div class="sec"><h4>客戶版履歷</h4>' +
    '<div class="acts"><button class="btn p" id="clientFormalBtn" type="button">📄 製作客戶版履歷</button></div></div>' +
    '</div>';
  $('dwrap').innerHTML = html;
  $('dmask').classList.add('show');
  $('dclose').onclick = closeDrawer;
  wireOwnerAssign('sourced', c.sourced_id, function () { closeDrawer(); loadCards(); });
  var ij = $('invjob');
  if (ij) {
    api('/admin/jobs').then(function (r) {
      (r.results || r.jobs || []).filter(function (j) { return (j.status || 'open') !== 'closed' && j.status !== 'client_draft' && j.status !== 'pending_review'; })
        .forEach(function (j) { var o = document.createElement('option'); o.value = j.slug; o.textContent = j.title || j.slug; ij.appendChild(o); });
    });
  }
  // 2026-09-01 加：主動開發的人選一直卡在人才庫，因為唯一的「下一步」是
  // 生連結叫他自己填——顧問電洽完想直接把內容打進去、跳過連結，之前完全
  // 沒有入口。呼叫跟 TG「電洽新增人選」同一支端點（source_kind:'sourced'），
  // 送出後這個人選會多一筆正式應徵紀錄，落進「正式應徵」管道，不再卡在
  // 主動開發裡出不來。
  var cj = $('convJob');
  if (cj) {
    api('/admin/jobs').then(function (r) {
      (r.results || r.jobs || []).filter(function (j) { return (j.status || 'open') !== 'closed' && j.status !== 'client_draft' && j.status !== 'pending_review'; })
        .forEach(function (j) { var o = document.createElement('option'); o.value = j.slug; o.textContent = (j.company_display_name ? j.company_display_name + '・' : '') + (j.title || j.slug); cj.appendChild(o); });
    });
  }
  var convFile = null;
  var cdz2 = $('convDz');
  if (cdz2) {
    cdz2.onclick = function () { var inp = document.createElement('input'); inp.type = 'file'; inp.onchange = function () { if (inp.files[0]) { convFile = inp.files[0]; $('convFileMsg').textContent = '已選擇：' + convFile.name; } }; inp.click(); };
    cdz2.ondragover = function (e) { e.preventDefault(); cdz2.style.borderColor = 'var(--gold)'; };
    cdz2.ondragleave = function () { cdz2.style.borderColor = 'var(--line)'; };
    cdz2.ondrop = function (e) { e.preventDefault(); cdz2.style.borderColor = 'var(--line)'; if (e.dataTransfer.files[0]) { convFile = e.dataTransfer.files[0]; $('convFileMsg').textContent = '已選擇：' + convFile.name; } };
  }
  var cg = $('convGo');
  if (cg) cg.onclick = function () {
    if (!cj.value) { $('convMsg').textContent = '請選一個職缺'; return; }
    if (!$('convConsent').checked) { $('convMsg').textContent = '請先勾選已取得本人同意'; return; }
    var text = $('convNotes').value.trim();
    // 2026-09-01 改：原本要求一定要有電洽內容或檔案才能送出，Jacky 反映
    // 「暫時沒有電洽內容就轉不了正式應徵」——後端其實不強制這個，是前端自己
    // 卡太緊。放行：沒填電洽內容一樣能建立應徵紀錄，只是不會觸發AI產報告
    // （沒有面談過/沒有電洽內容，本來就沒東西可以產報告），之後在人選卡片
    // 用「📞記錄新的通話」補上就會觸發。
    if (!text && !convFile && !confirm('目前沒有電洽內容，送出後不會產生初篩報告——之後要在人選卡片補上電洽內容才會產生。確定先建立應徵紀錄嗎？')) return;
    cg.disabled = true;
    var send = function (fileB64, fileName, fileMime) {
      api('/admin/pipeline/manual-forward', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ source_kind: 'sourced', source_id: c.sourced_id, job_slug: cj.value,
          call_notes: text || undefined, call_notes_file_b64: fileB64, call_notes_file_name: fileName, call_notes_file_mime: fileMime,
          consent_confirmed: true, by: '顧問' }) })
      .then(function (r) { cg.disabled = false; if (!r.ok) { $('convMsg').textContent = r.error || '送出失敗'; return; } closeDrawer(); loadCards(); });
    };
    if (convFile) { var reader = new FileReader(); reader.onload = function () { send(reader.result.split(',')[1], convFile.name, convFile.type); }; reader.readAsDataURL(convFile); }
    else send(null, null, null);
  };
  var ig = $('invgo');
  if (ig) ig.onclick = function () {
    if (!ij.value) { alert('先選一個職缺'); return; }
    ig.disabled = true;
    api('/admin/sourced/invite', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: c.sourced_id, job_slug: ij.value }) })
    .then(function (r) { ig.disabled = false; if (!r.ok) { alert(r.error || '產生失敗'); return; } closeDrawer(); loadCards(function () { openDrawer(c.sourced_id, 'sourced'); }); })
    .catch(function () { ig.disabled = false; alert('連線失敗'); });
  };
  var ic = $('invcopy');
  if (ic) ic.onclick = function () {
    navigator.clipboard.writeText($('invurl').textContent).then(function () { ic.textContent = '已複製'; setTimeout(function () { ic.textContent = '複製連結'; }, 1500); });
  };
  var inw = $('invnew');
  if (inw) inw.onclick = function () {
    var slug = prompt('換成哪一個職缺？填職缺代碼（slug）：', c.invite_job_slug || '');
    if (!slug) return;
    api('/admin/sourced/invite', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: c.sourced_id, job_slug: slug.trim() }) })
    .then(function (r) { if (!r.ok) { alert(r.error || '失敗'); return; } closeDrawer(); loadCards(function () { openDrawer(c.sourced_id, 'sourced'); }); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('.srcact'), function (b) {
    b.onclick = function () {
      var status = b.dataset.k, reason = null;
      if (status === 'rejected') {
        reason = prompt('選一個不合適的原因：\n' + SRC_REASONS.join('　'));
        if (!reason || SRC_REASONS.indexOf(reason) === -1) { alert('請輸入清單裡的其中一個原因'); return; }
      }
      api('/admin/sourced/status', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: c.sourced_id, status: status, reason: reason }) })
      .then(function (r) { if (!r.ok) { alert(r.error || '失敗'); return; } closeDrawer(); loadCards(); });
    };
  });
  var cfb2 = $('clientFormalBtn');
  if (cfb2) cfb2.onclick = function () { openClientFormalModal(c.sourced_id, 'sourced'); };
}

function openDrawer(appId, kind) {
  var c = kind === 'sourced'
    ? CARDS.find(function (x) { return x.kind === 'sourced' && x.sourced_id === appId; })
    : CARDS.find(function (x) { return x.application_id === appId; });
  if (!c) return;
  if (c.kind === 'sourced') { openSourcedDrawer(c); return; }
  var st = stageLabelOf(c);
  var extra = parseExtra(c.resume_extra_files);
  var html = '<div class="dhead"><span class="nm">' + esc(c.name) + '</span>' +
    '<span class="badge ' + st.cls + '">' + st.lb + '</span>' + hardGateBadge(c) +
    '<button class="edbtn" id="edtog" type="button">編輯 ✎</button>' +
    '<button class="x" id="dclose" type="button">×</button></div><div class="dbody">';

  if (c.dup_notice) {
    html += '<div class="sec" style="border-left:3px solid var(--warn);background:#fdf6e9">' +
      '<h4 style="color:var(--warn)">⚠ 疑似同一人</h4><p style="margin:0;font-size:13px;color:var(--ink2)">' + esc(c.dup_notice) + '</p></div>';
  }

  // 2026-09-01 全面改：原本這裡是一顆「萬用階段」下拉，把顧問內部狀態（等我
  // 決定／需補問／不推薦／已結案）跟客戶端每一格（顧問階段／面試階段／錄取／
  // 報到）全部塞進同一個分組選單，選項多達十幾個，顧問要先猜「選這個會讓
  // 企業端哪一格變什麼」——這正是 Jacky 反映「資訊太多、沒有前後邏輯」的
  // 源頭。改成三塊，跟示範用的 candidate_card_final.html 對齊：
  //   1. 自動狀態（阿財初審／顧問確認）——唯讀，不用顧問手動設，跟客戶端portal
  //      的判斷同一套邏輯（有面談結束或有報告決定就算完成）。
  //   2. 推薦給客戶——每一筆各自一張卡（公司＋職缺＋這筆自己的階段下拉＋
  //      移除），按「＋推薦給客戶／職缺」新增，送出當下客戶端立刻看到
  //      「顧問階段：已完成」，不用另外操作。
  //   3. 需補問／不推薦／已結案——原本混在萬用下拉裡的內部動作，改成小按鈕列
  //      在最下面，需補問／不推薦本來就有「初篩」區塊的推薦/需補問/婉拒按鈕
  //      可以用（見下面 report_md 區塊），這裡只留「標記已結案」這個萬用下拉
  //      唯一沒有其他入口的動作。
  var autoConfirmDone = !!c.decision;
  var autoScreenDone = !!(c.ai_done || c.evaluated);
  html += '<div class="sec"><h4>目前進度</h4>' +
    '<div style="display:flex;gap:16px;margin-bottom:14px;font-size:13px;color:var(--ink2)">' +
    '<span>' + (autoScreenDone ? '✓' : '○') + ' 阿財初審' + (autoScreenDone ? '' : '（進行中）') + '</span>' +
    '<span>' + (autoConfirmDone ? '✓' : '○') + ' 顧問確認' + (autoConfirmDone ? '' : '（等決定）') + '</span>' +
    '</div>' +
    '<div style="font-size:13px;font-weight:700;margin-bottom:8px">推薦給客戶</div>' +
    (c.placements || []).map(function (pl, i) {
      // 2026-09-01 加：每個 placement 自己的「顧問不推薦」——掛在這一組
      // （人選＋這家客戶）底下，不是整個人選都不推薦，也不擋之後重新推薦。
      var nr = pl.advisor_not_recommended_at
        ? '<div class="notrec" style="margin-top:6px;padding:8px 10px;border-radius:8px;background:#fdf1ef;color:var(--bad);font-size:12.5px">' +
            '⚠ 顧問不推薦（' + esc(pl.advisor_not_recommended_reason || '') + '）　' +
            '<button type="button" class="btn notrecClear" data-cid="' + esc(pl.company_id) + '" style="font-size:11.5px;padding:2px 8px;margin-left:4px">取消不推薦</button></div>'
        : '<button type="button" class="btn notrecSet" data-cid="' + esc(pl.company_id) + '" style="font-size:11.5px;padding:3px 10px;margin-top:6px;color:var(--bad)">標不推薦（這家客戶這個職缺）</button>';
      // 2026-09-01 加：client_rejected_at 資料早就接進來了，但沒有畫出來——
      // 顧問看不到「用人單位已經婉拒」這件事，只能靠客戶端那句一次性 Telegram
      // 通知，漏看就等於不知道。這裡補上顯示，跟顧問自己的「不推薦」用同一種
      // 視覺語言，但清楚寫明是客戶婉拒的，不要讓兩者混在一起看不出差別。
      var cr = pl.client_rejected_at
        ? '<div class="notrec" style="margin-top:6px;padding:8px 10px;border-radius:8px;background:#fdf1ef;color:var(--bad);font-size:12.5px">' +
            '❌ 用人單位婉拒（' + esc(pl.client_reject_reason || '') + '）　' +
            '<span class="mut" style="font-size:11px">' + esc(String(pl.client_rejected_at).slice(0, 16)) + '</span></div>'
        : '';
      return '<div style="background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:4px">' + esc(pl.client_name) + '<span class="mut" style="font-weight:400;margin-left:8px">✓ 顧問確認</span></div>' +
        bar(pl, appId, i > 0) + cr + nr + '</div>';
    }).join('') +
    (!c.placements || !c.placements.length ? '<p class="mut" style="margin:10px 0">還沒推薦給任何客戶。</p>' : '') +
    '<div style="margin-top:12px"><label class="edl" style="margin-top:0">推去哪家客戶</label><select class="edi" id="fwCompany"><option value="">載入中…</option></select>' +
    '<label class="edl">推去哪個職缺<span class="mut" style="font-weight:400">（送出即代表「顧問確認」，客戶那邊立刻看到這關已完成）</span></label>' +
    '<select class="edi" id="fwJob"><option value="">先選客戶</option></select>' +
    '<div class="acts" style="margin-top:8px"><button class="btn p" id="fwGo" type="button">＋ 推薦給客戶／職缺</button><span class="mut" id="fwMsg"></span></div></div>' +
    '<div class="acts" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">' +
    '<button class="btn d" id="markClosedBtn" type="button" style="font-size:12.5px">標記已結案（進顧問履歷庫）</button></div>' +
    '</div>';

  var primaryPl = (c.placements || [])[0] || null;
  html += '<div class="sec" id="edsec"><h4>基本資料</h4><div id="viewbox"><dl class="kv">' +
    '<dt>姓名</dt><dd>' + esc(c.name) + '</dd>' +

  html += '<div class="sec"><h4>客戶版履歷</h4>' +

  // 用人單位在客戶 portal 更新階段時可以順手留的回饋（面談結束後狀況、

  (c.placements || []).forEach(function (pl) {

        '<div style="white-space:pre-wrap;font-size:13.5px">' + esc(pl.manual_stage_note) + '</div></div>';

  (c.placements || []).forEach(function (pl) {
    html += '<div class="sec"><h4>' + esc(pl.client_name) + '</h4>' +
      '<label class="edl" style="color:var(--warn)">給客戶看的摘要<span class="subhint">常駐顯示在客戶的人選卡片上，蓋著寫，是顧問對這個人的整體推薦理由——不是訊息，沒有時間性</span></label>' +

  });

  // 過往推送企業紀錄——同一個人在其他職缺／客戶的紀錄，唯讀參考，只給顧問

  html += '<div class="sec"><h4>這個人選在其他職缺／客戶的紀錄' +

  // 2026-09-01 加：歷史聯繫紀錄與投遞紀錄——把顧問備註／電洽紀錄／推薦紀錄／

  html += '<div class="sec"><h4>歷史聯繫紀錄與投遞紀錄</h4>' +

    '<div id="timelineBox" class="mut">載入中…</div></div>';

  html += '</div>';
  $('dwrap').innerHTML = html;
  $('dmask').classList.add('show');
  wireDrawer(c, appId);

// 2026-09-01 加：③顧問備註清單、⑥歷史時間軸，都吃新端點 /admin/application/:id/card

var NOTE_TYPE_COLOR = {
  '評估': { bg: '#fdf1de', fg: '#8a6100' }, '聯繫紀錄': { bg: '#fdf1de', fg: '#8a6100' },
  '客戶回饋': { bg: '#fdf1de', fg: '#8a6100' }, '其他': { bg: '#fdf1de', fg: '#8a6100' },
  '電洽紀錄': { bg: '#e3f0fd', fg: '#2a5f8a' }, '推薦紀錄': { bg: '#f1e8fb', fg: '#6a3fa0' },
  '客戶婉拒': { bg: '#fbeaea', fg: '#c0392b' },
  '阿財面談': { bg: '#e3f3e9', fg: '#2f8f5b' },
};
function noteTypeBadge(t) {
  var c = NOTE_TYPE_COLOR[t] || { bg: '#eee7db', fg: 'var(--ink2)' };
  return '<span style="font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:' + c.bg + ';color:' + c.fg + '">' + esc(t) + '</span>';
}
var TL_FILTER = null;
function loadCardExtras(appId) {
  TL_FILTER = null;
  api('/admin/application/' + encodeURIComponent(appId) + '/card').then(function (d) {
    if (!d.ok) return;
    var notesBox = $('notesBox');
    if (notesBox) {
      notesBox.innerHTML = (d.notes || []).length
        ? d.notes.map(function (n) {
            return '<div style="border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-bottom:2px">' +
              '<div style="font-size:11.5px;color:var(--ink3);margin-bottom:2px">' + esc((n.created_at || '').slice(0, 16)) + '　' + noteTypeBadge(n.type) + '</div>' +
              '<div style="font-size:13.5px;white-space:pre-wrap">' + esc(n.content) + '</div></div>';
          }).join('')
        : '<span class="mut">尚未填寫</span>';
    }
    var timeline = d.timeline || [];
    var types = Array.from(new Set(timeline.map(function (t) { return t.type; })));
    var flt = $('tlFilters');
    if (flt) {
      flt.innerHTML = '<span class="tlChip" data-t="" style="cursor:pointer;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff">全部</span>' +
        types.map(function (t) { return '<span class="tlChip" data-t="' + esc(t) + '" style="cursor:pointer">' + noteTypeBadge(t) + '</span>'; }).join('');
      Array.prototype.forEach.call(flt.querySelectorAll('.tlChip'), function (el) {
        el.onclick = function () { TL_FILTER = el.dataset.t || null; renderTimelineBox(timeline); };
      });
    }
    renderTimelineBox(timeline);
  });
}
function renderTimelineBox(timeline) {
  var box = $('timelineBox');
  if (!box) return;
  var rows = TL_FILTER ? timeline.filter(function (t) { return t.type === TL_FILTER; }) : timeline;
  box.innerHTML = rows.length
    ? rows.map(function (t) {
        return '<div style="display:flex;gap:10px;font-size:12.5px;margin-bottom:9px;align-items:flex-start">' +
          '<div style="color:var(--ink3);min-width:78px;padding-top:2px">' + esc((t.time || '').slice(0, 16)) + '</div>' +
          '<div>' + noteTypeBadge(t.type) + '<div style="color:var(--ink2);margin-top:3px">' + esc(t.detail) + '</div></div></div>';
      }).join('')
    : '<span class="mut">還沒有紀錄</span>';
}

function resumeLinksHtml(c, extra) {
  var links = [];
  if (c.resume_file_id) links.push('<a href="#" class="dlres" data-f="' + esc(c.resume_file_id) + '">下載</a>');
  extra.forEach(function (f) { links.push('<a href="#" class="dlres" data-f="' + esc(f.file_id) + '">' + esc(f.filename) + '</a>'); });
  return links.length ? links.join('　') : '<span class="mut">尚未提供</span>';
}
function resumeListHtml(c, extra) {
  var rows = [];
  if (c.resume_file_id) rows.push({ file_id: c.resume_file_id, filename: '主要履歷' });
  extra.forEach(function (f) { rows.push(f); });
  if (!rows.length) return '';
  return '<div style="margin:6px 0">' + rows.map(function (f) {
    return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)">' +
      '<span style="flex:1;overflow-wrap:anywhere">' + esc(f.filename) + '</span>' +
      '<button class="btn d resumeDel" type="button" data-f="' + esc(f.file_id) + '" style="padding:2px 10px;font-size:11.5px">刪除</button></div>';
  }).join('') + '</div>';
}

var SOURCE_CHANNEL_OPTS = ['不指定', '朋友介紹', 'LinkedIn', '104', '1111', 'Threads', 'Facebook', 'Dcard', 'Step1ne官網', 'LINE OA', '人才池/獵頭資料庫', '其他'];
var RESUME_SOURCE_OPTS = ['不指定', '104', '1111', 'LinkedIn', 'CakeResume', '自製履歷', '作品集'];
var FORWARD_COMPANIES_CACHE = null;
var FORWARD_JOBS_CACHE = null;

function wireDrawer(c, appId) {
  $('dclose').onclick = closeDrawer;
  wireOwnerAssign('application', appId, function () { loadAndOpen(appId); });
  $('edtog').onclick = function () {
    var box = $('edbox'), vb = $('viewbox');
    var open = box.hidden; box.hidden = !open; vb.hidden = open;
    $('edtog').textContent = open ? '收起' : '編輯 ✎';
  };
  var cn = $('edcancel'); if (cn) cn.onclick = function () { openDrawer(appId); };
  var sv = $('edsave');
  if (sv) sv.onclick = function () {
    sv.disabled = true; $('edMsg').textContent = '儲存中…';
    var primaryPl = (c.placements || [])[0] || null;
    var lineEl = $('edLine');
    var companyEl = $('edCompany'), titleEl = $('edTitle'), linkedinEl = $('edLinkedin');
    Promise.all([
      api('/admin/application/update', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: appId, name: $('edName').value, email: $('edEmail').value, phone: $('edPhone').value,
          expected_salary: $('edSalary').value, available_date: $('edAvail').value, source_channel: $('edSource').value,
          resume_source: $('edResumeSource').value }) }),
      (lineEl && primaryPl) ? api('/admin/pipeline/forward-detail', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: appId, company_id: primaryPl.company_id, line_id_given: lineEl.value }) }) : Promise.resolve({ ok: true }),
      // 現職公司/職位/LinkedIn 這三個欄位實際存在 sourced_candidates（headline/
      // company/linkedin_url），只有這個人本來是主動開發轉過來的（有 sourced_link_id）
      // 才寫得回去——本人自己應徵或直接跟阿財面談的人選沒有這筆底稿可以寫。
      (companyEl && c.sourced_link_id) ? api('/admin/sourced/update', { method: 'POST', headers: { 'content-type': 'application/json' },

      api('/admin/pipeline/message-client', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: appId, company_id: cid, content: text, by: '顧問' }) })
      .then(function (r) { msg.textContent = r.ok ? '已傳送' : (r.error || '失敗'); if (r.ok) document.querySelector('.msgText[data-cid="' + cid + '"]').value = ''; });

  Array.prototype.forEach.call(document.querySelectorAll('.unfwd'), function (b) {

        body: JSON.stringify({ application_id: appId, company_id: b.dataset.cid }) })
      .then(function () { loadAndOpen(appId); });
    };
  });
  var fwSel = $('fwCompany');
  var fwJobSel = $('fwJob');
  // 2026-09-01 加：職缺清單跟客戶清單各自快取，選了客戶才篩出「這家客戶開的

  // job_slug（見 candidate_forwards.job_slug），不再共用 application 本身
  // 那一個職缺。
  var refreshFwJobs = function () {
    var cid = fwSel.value;
    if (!cid) { fwJobSel.innerHTML = '<option value="">先選客戶</option>'; return; }
    (FORWARD_JOBS_CACHE ? Promise.resolve(FORWARD_JOBS_CACHE) : api('/admin/jobs').then(function (d) { FORWARD_JOBS_CACHE = (d.ok ? d.jobs : []) || []; return FORWARD_JOBS_CACHE; }))
      .then(function (jobs) {
        var pick = jobs.filter(function (j) { return j.company_id === cid && j.status !== 'closed' && j.status !== 'client_draft' && j.status !== 'pending_review'; });
        fwJobSel.innerHTML = pick.length
          ? pick.map(function (j) { return '<option value="' + esc(j.slug) + '">' + esc(j.title || j.slug) + '</option>'; }).join('')
          : '<option value="">（這家客戶目前沒有開放中的職缺）</option>';
      });
  };
  (FORWARD_COMPANIES_CACHE ? Promise.resolve(FORWARD_COMPANIES_CACHE) : api('/admin/portal/companies').then(function (d) { FORWARD_COMPANIES_CACHE = (d.ok ? d.companies : []) || []; return FORWARD_COMPANIES_CACHE; }))
    .then(function (list) {
      fwSel.innerHTML = '<option value="">請選擇…</option>' + list.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.display_name) + '</option>'; }).join('');
      fwSel.onchange = refreshFwJobs;
    });
  $('fwGo').onclick = function () {

    var jobSlug = fwJobSel.value;
    if (!cid) { $('fwMsg').textContent = '請選一家客戶'; return; }

    .then(function (r) { if (!r.ok) { $('fwMsg').textContent = r.error || '失敗'; return; } loadAndOpen(appId); });

    .then(function (jobs) {

// 2026-09-01 加：④電洽內容的輸入動作搬進這個彈窗——不再佔在人選卡片上，
// 卡片只留 AI 整理好的重點。submit 邏輯照舊呼叫既有的 /admin/application/call-note
// （文字＋拖曳上傳都支援，同一套本機排程處理，跟 TG「電洽新增人選」共用管道）。
function closeCallModal() { $('callMask').classList.remove('show'); }
$('callMask').addEventListener('click', function (e) { if (e.target.id === 'callMask') closeCallModal(); });
function openCallModal(appId) {
  $('callWrap').innerHTML =
    '<div class="dhead"><span class="nm">記錄新的通話</span><button class="x" id="callClose" type="button">×</button></div>' +
    '<div class="dbody"><div class="sec">' +
    '<div class="subhint" style="margin:0 0 10px">打字轉錄重點、直接貼逐字稿，或拖曳上傳錄音／文件——送出後AI會整理成重點，只有重點會顯示在人選卡片上。</div>' +
    '<textarea class="edi" id="callText" rows="4" placeholder="打字轉錄這次通話重點，或直接貼逐字稿"></textarea>' +
    '<div id="callDz" style="border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink3);cursor:pointer;margin-top:8px">或拖曳電洽紀錄檔案（doc/docx/txt/md/html/pdf/excel）</div>' +
    '<div class="mut" id="callFileMsg" style="margin-top:4px"></div>' +
    '<div class="acts" style="margin-top:12px"><button class="btn p" id="callGo" type="button">送出，AI整理重點</button></div>' +
    '</div></div>';
  $('callClose').onclick = closeCallModal;
  $('callMask').classList.add('show');
  var callFile = null;
  var cdz = $('callDz');
  cdz.onclick = function () { var inp = document.createElement('input'); inp.type = 'file'; inp.onchange = function () { if (inp.files[0]) { callFile = inp.files[0]; $('callFileMsg').textContent = '已選擇：' + callFile.name; } }; inp.click(); };
  cdz.ondragover = function (e) { e.preventDefault(); cdz.style.borderColor = 'var(--gold)'; };
  cdz.ondragleave = function () { cdz.style.borderColor = 'var(--line)'; };
  cdz.ondrop = function (e) { e.preventDefault(); cdz.style.borderColor = 'var(--line)'; if (e.dataTransfer.files[0]) { callFile = e.dataTransfer.files[0]; $('callFileMsg').textContent = '已選擇：' + callFile.name; } };
  $('callGo').onclick = function () {
    var text = $('callText').value.trim();
    var send = function (fileB64, fileName, fileMime) {
      api('/admin/application/call-note', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: appId, text: text, file_b64: fileB64, file_name: fileName, file_mime: fileMime, by: '顧問' }) })
      .then(function (r) { if (!r.ok) { $('callFileMsg').textContent = r.error || '送出失敗'; return; } closeCallModal(); loadAndOpen(appId); });
    };
    if (callFile) { var reader = new FileReader(); reader.onload = function () { send(reader.result.split(',')[1], callFile.name, callFile.type); }; reader.readAsDataURL(callFile); }
    else send(null, null, null);
  };
}

// 2026-09-01 加：製作客戶版履歷——表格＋大頭貼版，跟既有客戶portal的
// client.html（黑底hero＋光譜圖）是完全不同的另一種輸出格式，兩者並存。
// 「相關經驗」「交通工具」「現況」目前面談規格沒有收集，所以做成必填的
// 手動輸入格，不要用其他欄位瞎猜著填——這是老闆看過落差後定案的做法。
function closeClientFormalModal() { $('cfMask').classList.remove('show'); }
$('cfMask').addEventListener('click', function (e) { if (e.target.id === 'cfMask') closeClientFormalModal(); });
function openClientFormalModal(appId, kind) {
  // 2026-09-02 加 kind：'application'（正式應徵／顧問履歷庫，預設）走
  // applications+reports 那套資料；'sourced'（主動開發）走 sourced_candidates，
  // 通常還沒面談過，多補兩格手動欄位（期望待遇／可到職，這兩格 application
  // 版是資料庫欄位直接帶出，sourced 版完全沒有來源，只能手動填）。
  var apiBase = kind === 'sourced' ? '/admin/sourced/' : '/admin/application/';
  $('cfWrap').innerHTML =
    '<div class="dhead"><span class="nm">製作客戶版履歷</span><button class="x" id="cfClose" type="button">×</button></div>' +
    '<div class="dbody"><div class="sec"><p class="mut" style="margin:0">載入中…</p></div></div>';
  $('cfClose').onclick = closeClientFormalModal;
  $('cfMask').classList.add('show');
  api(apiBase + encodeURIComponent(appId) + '/client-formal-prefill').then(function (pre) {
    if (!pre.ok) {
      $('cfWrap').innerHTML = '<div class="dhead"><span class="nm">製作客戶版履歷</span><button class="x" id="cfClose" type="button">×</button></div>' +
        '<div class="dbody"><div class="sec"><p style="color:#c0392b;margin:0">' + esc(pre.error || '載入失敗') + '</p></div></div>';
      $('cfClose').onclick = closeClientFormalModal;
      return;
    }
    var known = [
      ['姓名', pre.name + (pre.anonymous ? '（匿名版，客戶未簽約）' : '')],
      ['職缺', pre.job_title], ['客戶', pre.client_name],
      ['現居地', pre.residence], ['學歷', pre.education], ['出生年月', pre.age],
      ['兵役', pre.military], ['語言', pre.languages],
      ['期望待遇', pre.expected_salary], ['可到職', pre.available_date],
    ].filter(function (r) { return r[1]; });
    $('cfWrap').innerHTML =
      '<div class="dhead"><span class="nm">製作客戶版履歷</span><button class="x" id="cfClose" type="button">×</button></div>' +
      '<div class="dbody"><div class="sec">' +
      '<div class="subhint" style="margin:0 0 10px">以下欄位已經自動帶出（已過濾內部判斷內容），下面三格面談沒有系統化收集，請手動補上再產生。</div>' +
      '<dl class="kv">' + known.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      '<label class="edl" style="margin-top:10px">現況（必填）</label><textarea class="edi" id="cfState" rows="2" placeholder="例：待業中，最近一份工作為……"></textarea>' +
      '<label class="edl">相關經驗（必填）</label><textarea class="edi" id="cfExp" rows="2" placeholder="例：無 Revit／BIM 實際操作經驗，電訪前已主動查詢資料了解職務內容"></textarea>' +
      '<label class="edl">交通工具</label><input class="edi" id="cfTrans" placeholder="例：輕型機車、普通小型車駕照">' +
      (kind === 'sourced'
        ? '<label class="edl">期望待遇</label><input class="edi" id="cfSalary" placeholder="例：40k（主動開發還沒面談，通常沒有這格資料，可留空）">' +
          '<label class="edl">可到職</label><input class="edi" id="cfAvail" placeholder="例：錄取後隨時可上班">'
        : '') +
      '<label class="edl" style="margin-top:10px;display:flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="cfWantPhoto" style="width:auto">要附上大頭貼</label>' +
      '<div id="cfPhotoBox" hidden style="margin-top:6px"><input type="file" id="cfPhotoFile" accept="image/*"><div class="mut" id="cfPhotoMsg" style="margin-top:4px"></div></div>' +
      '<div class="acts" style="margin-top:12px"><button class="btn p" id="cfGo" type="button">產生履歷</button><span class="mut" id="cfMsg"></span></div>' +
      '</div></div>';
    $('cfClose').onclick = closeClientFormalModal;
    var wantPhoto = $('cfWantPhoto');
    var photoBox = $('cfPhotoBox');
    wantPhoto.onchange = function () { photoBox.hidden = !wantPhoto.checked; };
    var photoDataUrl = null;
    var pf = $('cfPhotoFile');
    if (pf) pf.onchange = function () {
      var f = pf.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { photoDataUrl = reader.result; $('cfPhotoMsg').textContent = '已選擇：' + f.name; };
      reader.readAsDataURL(f);
    };
    $('cfGo').onclick = function () {
      var state = $('cfState').value.trim();
      var exp = $('cfExp').value.trim();
      if (!state || !exp) { $('cfMsg').textContent = '現況跟相關經驗是必填的'; return; }
      if (wantPhoto.checked && !photoDataUrl) { $('cfMsg').textContent = '已勾選要附大頭貼，請先選擇檔案'; return; }
      var btn = $('cfGo');
      btn.disabled = true; $('cfMsg').textContent = '產生中…';
      var body = {
        current_state: state, related_experience: exp, transportation: $('cfTrans').value.trim(),
        photo_b64: wantPhoto.checked ? photoDataUrl : null,
      };
      if (kind === 'sourced') {
        body.expected_salary = $('cfSalary').value.trim();
        body.available_date = $('cfAvail').value.trim();
      }
      api(apiBase + encodeURIComponent(appId) + '/client-formal-report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { $('cfMsg').textContent = r.error || '產生失敗'; return; }
        var w = window.open('', '_blank');
        w.document.write(r.html + '<script>window.onload=function(){window.print()}<\/script>');
        w.document.close();
        closeClientFormalModal();
      });
    };
  });
}

function openNewCandModal() {
  var html = '<div class="dhead"><span class="nm">＋新增人選</span><span class="mut">不是跟阿財面談進來的，顧問自己接觸的人選</span>' +
    '<button class="x" id="ncClose" type="button">×</button></div><div class="dbody"><div class="sec">' +

    '<label class="edl">送去哪個職缺</label><select class="edi" id="ncJob"><option value="">載入中…</option></select>' +
    '<label class="edl">聯絡來源</label><select class="edi" id="ncSource">' + SOURCE_CHANNEL_OPTS.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>' +
    '<label class="edl">履歷來源</label><select class="edi" id="ncResumeSource">' + RESUME_SOURCE_OPTS.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>' +
    '<div id="ncResumeDz" style="border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink3);cursor:pointer;margin-top:6px">拖曳履歷檔案到這裡，或點擊選擇檔案</div>' +
    '<label class="edl" style="margin-top:12px">電洽內容</label><textarea class="edi" id="ncCallText" rows="3" placeholder="這次接觸/電訪的重點"></textarea>' +
    '<label style="display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)">' +
    '<input type="checkbox" id="ncConsent" style="width:auto;margin-top:3px"><span>我確認已經取得本人同意，這筆資料可以提供給客戶</span></label>' +
    '<div class="acts" style="margin-top:12px"><button class="btn p" id="ncGo" type="button">建立這筆人選卡片</button><span class="mut" id="ncMsg"></span></div></div></div>';
  $('ncWrap').innerHTML = html;
  $('ncMask').classList.add('show');
  $('ncClose').onclick = closeNewCand;
  api('/admin/jobs').then(function (d) {
    var jobs = (d.results || d.jobs || []).map(function (j) { return { slug: j.slug, title: (j.company_display_name ? j.company_display_name + ' - ' : '') + j.title }; });
    $('ncJob').innerHTML = '<option value="">選一個職缺…</option>' + jobs.map(function (j) { return '<option value="' + esc(j.slug) + '">' + esc(j.title) + '</option>'; }).join('');
  });
  var ncResumeFile = null;
  var ncDz = $('ncResumeDz');
  ncDz.onclick = function () { var inp = document.createElement('input'); inp.type = 'file'; inp.onchange = function () { if (inp.files[0]) { ncResumeFile = inp.files[0]; ncDz.textContent = '已選擇：' + ncResumeFile.name; } }; inp.click(); };
  ncDz.ondragover = function (e) { e.preventDefault(); ncDz.style.borderColor = 'var(--gold)'; };
  ncDz.ondragleave = function () { ncDz.style.borderColor = 'var(--line)'; };
  ncDz.ondrop = function (e) { e.preventDefault(); ncDz.style.borderColor = 'var(--line)'; if (e.dataTransfer.files[0]) { ncResumeFile = e.dataTransfer.files[0]; ncDz.textContent = '已選擇：' + ncResumeFile.name; } };
  $('ncGo').onclick = function () {

    if (!name) { msg.textContent = '請填姓名'; return; }
    if (!email && !phone) { msg.textContent = '至少要填 Email 或電話其中一個'; return; }
    if (!$('ncJob').value) { msg.textContent = '請選職缺'; return; }
    if (!$('ncConsent').checked) { msg.textContent = '請先確認已取得本人同意'; return; }
    msg.textContent = '建立中…';
    var submit = function (resumeB64, resumeName, resumeMime) {
      api('/admin/pipeline/manual-forward', { method: 'POST', headers: { 'content-type': 'application/json' },

    else submit(null, null, null);
  };
}

var CONSULTANTS = [];
function wireOwnerAssign(kind, id, reload) {
  var sel = document.querySelector('.ownAssign');
  if (!sel) return;
  sel.onchange = function () {
    sel.disabled = true;
    api('/admin/set-owner', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, owner: sel.value || null }) })
    .then(function (r) { sel.disabled = false; if (!r.ok) { alert(r.error || '指派失敗'); return; } reload(); })
    .catch(function () { sel.disabled = false; alert('連線失敗'); });
  };
}
function ownerAssignSelect(cur) {
  var opts = '<option value="">未指派</option>' + CONSULTANTS
    .filter(function (c) { return c.is_active || c.id === cur; })
    .map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === cur ? ' selected' : '') + '>' + esc(c.display_name) + '</option>'; }).join('');
  return '<select class="edi ownAssign" style="max-width:200px">' + opts + '</select>';
}
function renderOwnerSel(consultants) {
  CONSULTANTS = consultants;
  var sel = $('ownerSel');
  sel.innerHTML = '<option value="all">全部顧問</option>' +
    consultants.filter(function (c) { return c.is_active; }).map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.display_name) + '</option>'; }).join('') +
    '<option value="unassigned">未指派</option>';
  sel.value = state.owner;
  $('ownerHint').textContent = state.owner === 'all' ? '目前看全部顧問的案子' : (state.owner === 'unassigned' ? '目前只看未指派顧問的案子' : '');
  sel.onchange = function () { state.owner = sel.value; safeSet('s1ne_pp_owner2', state.owner); loadCards(); };
}

// 2026-09-01 修：原本每次呼叫（包含背景 30 秒自動刷新）都會先把整個列表清空
// 顯示「載入中…」，資料回來才重畫——結果變成畫面每 30 秒閃一次空白，顧問
// 會以為系統壞了。改成只有「listWrap 目前還沒有真正內容」時才顯示載入中
// （第一次打開頁面、或上次讀取失敗留下錯誤訊息時）；背景悄悄刷新時直接
// 等資料回來才換畫面，中間不會有空白這一幕。
function loadCards(cb) {
  if (!CARDS.length) $('listWrap').innerHTML = '<div class="empty">載入中…</div>';
  api('/admin/pipeline/tracker?owner=' + encodeURIComponent(state.owner)).then(function (d) {
    if (!d.ok) { $('listWrap').innerHTML = '<div class="empty">讀取失敗：' + esc(d.error || '') + '</div>'; return; }
    CARDS = d.cards || [];
    renderStats(); renderPipes(); renderTabs(); renderList();
    if (cb) cb();
  }).catch(function () { if (!CARDS.length) $('listWrap').innerHTML = '<div class="empty">連線失敗</div>'; });
}

function load() {
  $('gate').hidden = true; $('app').hidden = false;
  api('/admin/consultants').then(function (d) { renderOwnerSel(d.consultants || []); });
  loadCards();
  startAutoRefresh();
}
// 2026-09-01 加：這頁本來只在打開當下抓一次資料，之後不會自己更新——
// 客戶在用人需求表推進階段，顧問這邊除非手動重新整理，不然畫面看到的
// 永遠是打開那一刻的舊快照（9/1 陳其寬、周丞恩兩次都撞到這個，看起來
// 像「沒同步」，其實資料一直是對的，只是畫面沒重抓）。改成背景每 30 秒
// 悄悄重抓一次——只在人選卡片抽屜沒開著的時候做，抽屜開著代表顧問正在
// 看細節/打字，這時候被背景刷新打斷畫面體驗會很差，寧可晚 30 秒更新。
// 2026-09-01 加：30 秒背景刷新沒管分頁到底看不看得到——顧問開著這頁切去
// 別的分頁、甚至整個瀏覽器縮小到背景，還是照樣每 30 秒打一次後端，後端
// 這支端點又是每次都要撈全部人選（見 /admin/pipeline/tracker 那邊的 N+1
// 修復註解），這是今天把 D1 免費方案每日讀取額度打到 2200 萬筆的主因之一。
// 改成用 document.visibilitychange 判斷分頁是否可見，看不到就完全不刷新
// （不是刷新但不 render，是真的不打 API），切回來才立刻補刷一次。
var autoRefreshTimer = null;
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(function () {
    if (document.hidden) return;
    if ($('dmask').classList.contains('show')) return;
    loadCards();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !$('dmask').classList.contains('show')) loadCards();
  });
}
function boot() {
  if (tok) { load(); return; }
  $('gate').hidden = false;
  $('enter').onclick = function () {
    tok = $('tok').value.trim(); if (!tok) return;
    api('/admin/consultants').then(function (d) {
      if (!d.ok) { $('gerr').hidden = false; $('gerr').textContent = '權杖不正確'; return; }
      localStorage.setItem(KEY, tok); load();
    });
  };
  $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
}
boot();
