<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>招募職缺｜顧問後台</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:20px 0 60px}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:16px}
.note b{color:var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:11px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--soft);color:var(--ink3);font-size:12.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
/* ⚠️ 2026-08-26 修版面：這張表有 12 欄（6 個設定欄＋6 個漏斗欄），原本擠在
   1000px 的容器裡，職缺名稱被壓到一行只放得下一個字、按鈕也被迫直向堆疊。
   這一頁是資料表不是文章，容器放寬到 1400px，並給每一欄合理的最小寬度。 */
td.jb{min-width:230px}
td.jb b{display:block;font-size:14.5px;line-height:1.45}
td.jb span{font-size:12px;color:var(--ink3);word-break:break-all}
td.jb .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
td.jb .btns button{margin-top:0!important;white-space:nowrap}
select{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:104px}
.eff{font-size:11.5px;color:var(--ink3);line-height:1.6;white-space:nowrap}
.eff b{color:var(--ink2);font-weight:600}
/* 已關閉的職缺整列淡化，一眼看出它不在招募中。
   ⚠️ 2026-08-26 修：原本連「🔓 重新開放」按鈕也一起淡掉，看起來像不能按的
   停用按鈕（實際上可以按，只是看不出來）。按鈕與狀態文字排除在淡化之外。 */
.closed{opacity:.45}
tr.closed .statustoggle-btn,
tr.closed td.jb span{opacity:1}
tr.closed .statustoggle-btn{font-weight:700;box-shadow:0 0 0 1px rgba(47,143,91,.35)}
.msg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.msg.on{opacity:1}
.msg.err{background:var(--bad)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 240px;min-width:200px;font:inherit;font-size:14px;
 padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}
.bar select{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
 border-radius:10px;background:#fff}
.bar .ck{font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:pointer}
.bar .cnt{font-size:12.5px;color:var(--ink3);margin-left:auto}
tr.sub th{padding-top:0;font-size:11.5px;font-weight:600;text-align:center}
td.fn{text-align:center;font-variant-numeric:tabular-nums;font-size:14px;width:52px}
td.fn.zero{color:#c9c4b8}
td.fn.hi{font-weight:700;color:var(--gold)}
td.fn.wait{font-weight:700;color:#c98a1e}
td.fn.closed{color:var(--ink3)}
td.fn.clk{cursor:pointer;text-decoration:underline;text-underline-offset:3px;
 text-decoration-thickness:1.5px;text-decoration-color:#d9d2c4}
td.fn.clk:hover{background:#fdf6e9}
#mask{position:fixed;inset:0;background:rgba(35,38,45,.45);z-index:40}
#modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(620px,94vw);max-height:86vh;overflow:auto;background:#fff;
 border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);
 position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.mhd b{font-size:15px;flex:1}
.mhd button{border:0;background:#f2efe8;border-radius:9px;width:30px;height:30px;font-size:17px;cursor:pointer}
.lhd{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--soft);
 border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.lhd input{flex:1;font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);
 border-radius:8px;background:#fff}
#lst{max-height:62vh;overflow:auto}
.lr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"a c" "b c" "n n";
 gap:2px 12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.lr:last-child{border-bottom:0}
.lr:hover{background:var(--soft)}
.l1{grid-area:a;display:flex;align-items:center;gap:8px;min-width:0}
.l1 b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .warn{font-size:11px;font-weight:700;color:#8a5a1a;background:#fdf6e9;
 border:1px solid #e8d5ab;border-radius:999px;padding:1px 8px;white-space:nowrap}
.l1 .d{font-size:11px;color:var(--ink3);white-space:nowrap}
.l1 .dc{font-size:11px;color:var(--ok);white-space:nowrap}
.l1 .dc.no{color:#c98a1e;font-weight:700}
.l2{grid-area:b;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{grid-area:n;font-size:12px;color:#7a5a22;background:var(--soft);border-radius:7px;
 padding:5px 9px;margin-top:2px;white-space:normal}
.la{grid-area:c;display:flex;gap:6px;white-space:nowrap}
.la a{font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);
 border-radius:8px;padding:5px 10px;color:var(--ink2);background:#fff}
.la a.go{background:var(--gold);border-color:var(--gold);color:#fff}
@media(max-width:860px){th:nth-child(4),td:nth-child(4){display:none}}

/* 這一頁是 12 欄的資料表，不是文章——容器放寬，讓每一欄有合理寬度。
   其他頁面的 .wrap 不受影響（這段只在這個檔案裡）。 */
@media(min-width:1100px){
  main.wrap{max-width:1400px}
  td.jb{min-width:250px}
  .eff{white-space:normal;min-width:150px}
}
/* 螢幕再小一點時表格可以橫向捲，不要硬擠到破版 */
@media(min-width:761px) and (max-width:1099px){
  .tablewrap{overflow-x:auto}
  table{min-width:1040px}
}

/* 手機版：表格改卡片。原本 9 欄硬塞會橫向溢出，漏斗只看得到第一欄。 */
@media(max-width:760px){
  table{border:0;background:transparent}
  thead{display:none}
  tbody,tr,td{display:block;width:auto}
  tr{background:#fff;border:1px solid var(--line);border-radius:14px;
     padding:14px 15px;margin-bottom:11px}
  td{border:0;padding:0}
  td.jb{margin-bottom:11px}
  td.jb b{font-size:15.5px;line-height:1.5}
  td.jb span{font-size:11.5px;word-break:break-all}
  /* 兩個下拉並排 */
  tr>td:nth-child(2),tr>td:nth-child(3){display:inline-block;width:calc(50% - 4px);vertical-align:top}
  tr>td:nth-child(2){margin-right:6px}
  tr>td select{width:100%}
  td.eff{display:block !important;font-size:11.5px;color:var(--ink3);
         margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);white-space:normal}
  /* 漏斗現在六格橫排（多了「結案」），帶關卡名稱。
     2026-08-12 從 5 欄變 6 欄，寬度算法要一起改，不然最後一欄會被擠到換行去。 */
  td.fn{display:inline-block;width:calc(16.6% - 4px);text-align:center;margin-top:11px;
        padding:7px 2px;background:var(--soft);border-radius:9px;font-size:14px}
  td.fn+td.fn{margin-left:0.8%}
  td.fn::before{content:attr(data-lb);display:block;font-size:10px;font-weight:600;
                color:var(--ink3);margin-bottom:2px;letter-spacing:0}
  td.fn.zero{background:#f7f5f0}
  td.fn.clk{text-decoration:none;border:1px solid #e8d5ab}
  .bar{gap:8px}
  .bar select{flex:1 1 calc(50% - 4px)}
  .bar .ck{flex:1 1 100%}
  .bar .cnt{margin-left:0}
  .note{font-size:12.5px}
  #modal{width:96vw;max-height:88vh}
  .lr{grid-template-columns:1fr;grid-template-areas:"a" "b" "c";gap:5px}
  .la{margin-top:3px}
}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>招募職缺</b>
    <nav><a href="/consultant/overview/">總覽</a><a href="/consultant/reports/">初篩報告</a><a href="/consultant/jobs/" class="on">招募職缺</a><a href="/consultant/expertise/">職缺題庫</a><a href="/consultant/job-intake/">＋ 新增職缺</a><a href="/consultant/job-draft/">改擬稿</a>　<a href="/consultant/bd/">開發客戶</a>　</nav>
  </div></header>
  <main class="wrap">
    <div class="note">
      <b>客戶對象改了，三件事會一起變</b>：履歷具名或匿名、報告掛不掛 Step1ne 品牌、要不要揭露初談由 AI 進行。<br>
      這些會直接影響已經在跑的面談與報告，<b>改完立即生效</b>，不用重新發布職缺。<br>
      右側漏斗看的是<b>有沒有往下走</b>——20 個應徵但 0 個送到客戶，比 3 個應徵送出 2 個還糟。<br>
      <b style="color:#c98a1e">「初審」那欄有數字＝那些人在等我們決定</b>，不是在等客戶。滑過標題可以看每一關的定義。
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="搜尋職缺名稱、代號、客戶對象⋯" autocomplete="off">
      <select id="fl"><option value="">全部服務線</option>
        <option value="dispatch">人力派遣</option><option value="direct">正職代招</option>
        <option value="executive">中高階獵才</option></select>
      <select id="fr"><option value="">全部客戶對象</option>
        <option value="signed">已簽約客戶</option><option value="unsigned">未簽約客戶</option>
        <option value="private">朋友私人協助</option></select>
      <label class="ck"><input type="checkbox" id="fa"> 只看有人在跑的</label>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th>職缺</th><th>服務線</th><th>客戶對象</th><th title="決定阿財怎麼面：中高階走 20-30 分鐘、沒有題數上限">職級</th>
        <th title="留空＝這個職缺不用驗外語。填了（例：日文）＝阿財開場就會預告、面談中會用這個語言驗證，跟就服法無關，是硬條件">外語驗證</th>
        <th>連動結果</th>
        <th colspan="6" style="text-align:center">漏斗（人）</th></tr>
        <tr class="sub"><th></th><th></th><th></th><th></th><th></th><th></th>
        <th title="填完申請表送出的人">應徵</th>
        <th title="阿財談完、報告已產出，但顧問還沒決定要不要送客戶。卡在這關＝人在等我們">初審</th>
        <th title="從顧問把履歷送給客戶起算，客戶不論面試幾關都算在這一關">客戶面談</th>
        <th title="客戶決定要了、還沒到職（談 offer、辦離職、等報到都在這）">錄取</th>
        <th title="真的上工了，這一關才算成案">到職</th>
        <!-- 2026-08-12 加：結案（客戶不要／人選拒絕）以前完全不落在任何一關，
             畫面上就是憑空消失，看不出「送了多少、掉了多少」。 -->
        <th title="送出去之後客戶不要或人選拒絕，案子停在這裡不會再動">結案</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="mut">載入中⋯</td></tr></tbody>
    </table>
    </div>
  </main>
</div>
<div id="msg" class="msg"></div>
<div id="mask" hidden></div>
<div id="modal" role="dialog" aria-modal="true" hidden>
  <div class="mhd"><b id="mt">—</b><button id="mx" aria-label="關閉">×</button></div>
  <div id="mbody"></div>
</div>

<script>
var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY = 's1ne_admin_tok';
var tok = localStorage.getItem(KEY) || '';
var $ = function (i) { return document.getElementById(i); };

var LINE = { dispatch: '人力派遣', direct: '正職代招', executive: '中高階獵才' };
var REL  = { signed: '已簽約客戶', unsigned: '未簽約客戶', private: '朋友私人協助' };
// 職級跟服務線是兩件事——派遣也會有中高階（派遣的廠長、專案總監）。
// 這一欄決定阿財怎麼面：senior 走 20-30 分鐘、沒有題數上限，其餘走標準流程。
// （2026-08-13 修：這裡原本寫「10 分鐘最多 5 題」，SKILL.md 早就改了，這裡沒跟著改）
var SEN  = { junior: '基層', mid: '一般', senior: '中高階' };
// 客戶對象連動的結果，直接寫在畫面上讓顧問看得到自己改了什麼
var EFFECT = {
  signed:   '具名履歷・掛 Step1ne 品牌・揭露 AI 初談',
  unsigned: '<b>匿名履歷</b>・掛 Step1ne 品牌・不揭露 AI',
  private:  '具名履歷・<b>報告不掛任何品牌</b>・不揭露 AI',
};

// 這個檔案原本沒有任何跳脫函式——其他欄位（姓名、期望待遇）都是系統
// 產生的固定格式，風險低。但 handled_note 是顧問在群組裡的自由文字，
// 直接塞進 innerHTML 會被 < > & 打斷版面，所以這裡另外補一個。
function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ authorization: 'Bearer ' + tok }, opt.headers || {});
  return fetch(API + path, opt).then(function (r) { return r.json(); });
}
function toast(t, err) {
  var m = $('msg'); m.textContent = t; m.className = 'msg on' + (err ? ' err' : '');
  setTimeout(function () { m.className = 'msg'; }, err ? 4000 : 1800);
}
function sel(name, map, val, slug) {
  var s = '<select data-slug="' + slug + '" data-field="' + name + '">';
  if (!val) s += '<option value="">（未設定）</option>';
  for (var k in map) s += '<option value="' + k + '"' + (k === val ? ' selected' : '') + '>' + map[k] + '</option>';
  return s + '</select>';
}
// 漏斗：0 用淡灰，有數字才凸顯——一整排 0 也是資訊（這個缺卡在哪一關）
var STAGE_LB = { applicants:'應徵', screening:'初審', client_stage:'客戶面談',
                 offered:'錄取', onboard:'到職', closed:'結案' };
function n(v, hi, cls, slug, stage) {
  v = v || 0;
  var c = v ? (cls ? ' ' + cls : (hi ? ' hi' : '')) : ' zero';
  var lb = ' data-lb="' + STAGE_LB[stage] + '"';
  if (!v) return '<td class="fn' + c + '"' + lb + '>0</td>';
  return '<td class="fn' + c + ' clk"' + lb + ' data-slug="' + slug + '" data-stage="' + stage + '">' + v + '</td>';
}
function funnel(j) {
  // 初審用琥珀色標出來——那一關卡住代表人在等我們，不是在等客戶
  // 結案不用 hi（不是好事，也不是壞事，是終點）——用灰底文字色跟其他關區分開，
  // 一眼看出「這一欄是終結狀態，不是流程中的一關」。
  return n(j.applicants, false, null, j.slug, 'applicants')
       + n(j.screening, false, 'wait', j.slug, 'screening')
       + n(j.client_stage, true, null, j.slug, 'client_stage')
       + n(j.offered, true, null, j.slug, 'offered')
       + n(j.onboard, true, null, j.slug, 'onboard')
       + n(j.closed, false, 'closed', j.slug, 'closed');
}
var ALL = [];
function filtered() {
  var q = ($('q').value || '').trim().toLowerCase();
  var fl = $('fl').value, fr = $('fr').value, fa = $('fa').checked;
  return ALL.filter(function (j) {
    if (fl && j.service_line !== fl) return false;
    if (fr && j.client_relation !== fr) return false;
    // 「有人在跑的」＝漏斗任何一關還有人，不是只看應徵數
    if (fa && !((j.applicants || 0) + (j.screening || 0) + (j.client_stage || 0)
                + (j.offered || 0) + (j.onboard || 0))) return false;
    if (!q) return true;
    var hay = [j.title, j.slug, j.client_code, j.company_display_name, LINE[j.service_line], REL[j.client_relation]]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}
function apply() {
  var rows = filtered();
  $('cnt').textContent = rows.length === ALL.length
    ? ALL.length + ' 個職缺' : rows.length + ' / ' + ALL.length + ' 個職缺';
  paint(rows);
}
function render(jobs) { ALL = jobs; apply(); }
function paint(jobs) {
  $('rows').innerHTML = jobs.map(function (j) {
    return '<tr class="' + (j.status === 'closed' ? 'closed' : '') + '">'
      + '<td class="jb"><b>' + (j.title || j.slug) + '</b>'
        + (j.company_display_name ? '<span style="color:#a67c3d;font-weight:600;display:block;">' + esc(j.company_display_name) + '</span>' : '')
        + '<span>' + j.slug
        + (j.status === 'closed' ? '　·　已關閉' : '') + '</span>'
        + '<div class="btns">'
        + '<button type="button" class="jd-btn" data-slug="' + j.slug + '" '
        + 'style="font-size:11px;background:#fff;border:1px solid #a67c3d;border-radius:6px;padding:3px 8px;cursor:pointer;color:#a67c3d;font-weight:600;">'
        + '📄 查看／編輯 JD</button>'
        + '<button type="button" class="socpost-btn" data-slug="' + j.slug + '" '
        + 'style="font-size:11px;background:#fff;border:1px solid #eee7db;border-radius:6px;padding:3px 8px;cursor:pointer;color:#4d5563;">'
        + '📱 產生社群貼文</button>'

// 2026-08-17 加：開關職缺——關掉之後網站跟應徵表單會即時擋掉新應徵，
// 阿財不會再面談新的人，已經在談的候選人不受影響；隨時可以再打開。
document.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('.statustoggle-btn');
  if (!btn) return;
  var slug = btn.dataset.slug;
  var next = btn.dataset.cur === 'closed' ? 'open' : 'closed';
  if (next === 'closed' && !confirm('確定要關閉「' + slug + '」嗎？關閉後網站跟應徵表單會馬上擋掉新應徵，已經在談的候選人不受影響，之後可以隨時重新開放。')) return;
  btn.disabled = true;
  api('/admin/jobs/' + encodeURIComponent(slug), {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ status: next }),
  }).then(function (d) {
    btn.disabled = false;
    if (!d.ok) return toast(d.error || '存檔失敗', true);
    var job = ALL.filter(function (j) { return j.slug === slug; })[0];
    if (job) job.status = next;
    toast(next === 'closed' ? '已關閉，新應徵會被擋掉' : '已重新開放');
    apply();
  }).catch(function () { btn.disabled = false; toast('連不上伺服器', true); });

// 標成待產出」，真正產草稿是本機腳本每 15 分鐘掃一次撿去做，所以按下去
// 不會馬上看到結果，要等 Telegram「社群發文審核」那個主題跳出來。
// 2026-08-26 加：選發文帳號。後端一直都支援 account_id（不同顧問各自的
// Threads／LinkedIn 帳號存在 social_accounts，發文時用對應的金鑰），
// 但這顆按鈕沒接上去，直接送出＝不知道要用誰的身分發。改成先選帳號。
var SOCIAL_ACCOUNTS = null;
function loadSocialAccounts() {
  if (SOCIAL_ACCOUNTS) return Promise.resolve(SOCIAL_ACCOUNTS);
  return api('/admin/social-accounts').then(function (d) {
    SOCIAL_ACCOUNTS = (d.ok ? d.accounts : []) || [];
    return SOCIAL_ACCOUNTS;
  }).catch(function () { SOCIAL_ACCOUNTS = []; return SOCIAL_ACCOUNTS; });
}

var PLATFORM_LB = { threads: 'Threads', linkedin: 'LinkedIn', line_community: 'LINE 社群' };

function askSocialAccount(slug, jobTitle) {
  return loadSocialAccounts().then(function (accs) {
    if (!accs.length) return null;
    var box = document.createElement('div');
    box.id = 'socMask';
    box.style.cssText = 'position:fixed;inset:0;background:rgba(35,38,45,.45);z-index:60;'
      + 'display:flex;align-items:center;justify-content:center;padding:16px;';
    box.innerHTML = '<div style="background:#fff;border-radius:16px;width:min(420px,94vw);'
      + 'box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;">'
      + '<div style="padding:16px 18px;border-bottom:1px solid var(--line);">'
      + '<b style="font-size:15px;">用誰的帳號發？</b>'
      + '<div class="mut" style="margin-top:2px;">' + esc(jobTitle || slug) + '</div></div>'
      + '<div style="padding:14px 18px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;">'
      + accs.map(function (a) {
          return '<button type="button" class="socacc" data-id="' + a.id + '" '
            + 'style="text-align:left;font:inherit;font-size:14px;background:#fff;'
            + 'border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;">'
            + '<b>' + esc(a.label) + '</b>'
            + '<span class="mut" style="margin-left:8px;">' + esc(PLATFORM_LB[a.platform] || a.platform) + '</span>'
            + '</button>';
        }).join('')
      + '</div>'
      + '<div style="padding:12px 18px;border-top:1px solid var(--line);text-align:right;">'
      + '<button type="button" id="socCancel" style="font:inherit;font-size:13.5px;background:#f2efe8;'
      + 'border:0;border-radius:9px;padding:8px 16px;cursor:pointer;">取消</button></div></div>';
    document.body.appendChild(box);
    return new Promise(function (resolve) {
      box.addEventListener('click', function (ev) {
        var a = ev.target.closest && ev.target.closest('.socacc');
        if (a) { box.remove(); return resolve(Number(a.dataset.id)); }
        if (ev.target.id === 'socCancel' || ev.target === box) { box.remove(); return resolve(undefined); }
      });
    });
  });
}

document.addEventListener('click', function (e) {

function load() {

function boot() {

document.addEventListener('click', function (e) {

  var job = (ALL.find(function(j){return j.slug===slug;}) || {});

    var cs = d.candidates || [];
    if (!cs.length) return $('mbody').innerHTML = '<p class="mut" style="padding:18px">這一關目前沒有人</p>';
    // ⚠️ 一人一列，不要用卡片。30 個人的話卡片會變成無止境的長捲軸，
    //    而顧問要的是「快速掃過去看誰卡最久」，不是一次讀完每個人的細節。
    var head = '<div class="lhd"><span>' + cs.length + ' 人</span>'
      + (cs.length > 8 ? '<input id="pq" type="search" placeholder="搜尋姓名⋯">' : '')
      + '</div>';
    var rows = cs.map(function (p) {
      var a = [];
      if (p.resume_file_id) a.push('<a href="' + API + '/admin/resume/' + p.id + '?t=' + encodeURIComponent(tok) + '" target="_blank" title="下載履歷">履歷</a>');
      else if (p.resume_url) a.push('<a href="' + p.resume_url + '" target="_blank" rel="noopener" title="開啟履歷連結">履歷↗</a>');
      if (p.report_id) a.push('<a href="' + API + '/admin/report/' + p.report_id + '?t=' + encodeURIComponent(tok) + '" target="_blank" title="面談報告">報告</a>');
      // ⚠️ 要傳報告 id（p.report_id），不是應徵 id（p.id）。
      //    2026-08-12 這裡原本傳的是應徵 id，但 /consultant/reports/ 的深連結
      //    是拿 id 去比對 reports.id——傳錯 id 對不到任何一筆，
      //    頁面就套用預設的「待處置」清單，看起來像連結失效、跳到別的頁面。
      //    還沒產出報告（面談還沒做完）的人沒有東西可以處置，不給這顆按鈕。
      if (p.report_id) {
        a.push('<a href="/consultant/reports/?id=' + encodeURIComponent(p.report_id) + '" target="_blank" title="逐字稿與處置" class="go">處置</a>');
      }
      var wait = (stage === 'screening' && p.days_in >= 2)
        ? '<span class="warn">' + p.days_in + ' 天</span>' : '<span class="d">' + p.days_in + ' 天</span>';
      var meta = [p.expected_salary, p.available_date ? '可到職 ' + p.available_date : '',
                  (p.msgs || 0) + ' 則'].filter(Boolean).join('・');
      // 顧問在「顧問人選回報區」講的最新一句進度（applications.handled_note）。
      // 2026-08-12 加：之前這欄位有寫但沒地方看，顧問講了等於白講。
      var note = p.handled_note ? '<div class="l3">📌 ' + esc(p.handled_note) + '</div>' : '';
      return '<div class="lr" data-n="' + (p.name || '') + '">'
        + '<div class="l1"><b>' + (p.name || '—') + '</b>' + wait
        + (p.decision ? '<span class="dc">' + (DEC[p.decision] || p.decision) + '</span>'
                      : '<span class="dc no">未處置</span>') + '</div>'
        + '<div class="l2">' + meta + '</div>'
        + '<div class="la">' + a.join('') + '</div>' + note + '</div>';
    }).join('');
    $('mbody').innerHTML = head + '<div id="lst">' + rows + '</div>';
    var pq = document.getElementById('pq');
    if (pq) pq.oninput = function () {
      var q = this.value.trim().toLowerCase();

        el.style.display = !q || (el.dataset.n || '').toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });

  });
});

  var wrap = document.getElementById('jdwrap'); if (!wrap) return;
  Array.prototype.forEach.call(wrap.querySelectorAll('.jdtab'), function (b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  var body = document.getElementById('jdTabBody');
  body.innerHTML = tab === 'view' ? jdViewHtml(JD_CUR.spec) : jdEditHtml(JD_CUR.spec);
  if (tab === 'edit') jdWireEdit();
}

function jdWireEdit() {
  var save = document.getElementById('jdSave');
  save.onclick = function () {
    var fields = {}, changed = 0;
    JD_FIELDS.forEach(function (f) {
      var el = document.getElementById('jdf_' + f[0]); if (!el) return;
      var val = f[2] === 'list' ? jdListParse(el.value) : el.value;
      var cur = JD_CUR.spec[f[0]];
      var same = f[2] === 'list'
        ? JSON.stringify(cur || []) === JSON.stringify(val)
        : String(cur || '') === String(val);
      if (same) return;
      fields[f[0]] = val; changed++;
    });
    var msg = document.getElementById('jdSaveMsg');
    if (!changed) { msg.className = 'jdmsg err'; msg.textContent = '沒有改到東西'; return; }
    save.disabled = true; msg.className = 'jdmsg'; msg.textContent = '儲存中…';
    api('/admin/jobs/' + encodeURIComponent(JD_CUR.slug) + '/content', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ fields: fields }),
    }).then(function (d) {
      save.disabled = false;
      if (!d.ok) { msg.className = 'jdmsg err'; msg.textContent = d.error || '儲存失敗'; return; }
      msg.className = 'jdmsg ok'; msg.textContent = '已存檔，最多 15 分鐘內會重新產生頁面並自動上線。';
      Object.assign(JD_CUR.spec, fields);
      toast('JD 已存檔，稍後自動上線');
    }).catch(function () { save.disabled = false; msg.className = 'jdmsg err'; msg.textContent = '連不上伺服器'; });
  };
  var ai = document.getElementById('jdAiGo');
  ai.onclick = function () {
    var note = document.getElementById('jdAiNote').value.trim();
    var msg = document.getElementById('jdAiMsg');
    if (!note) { msg.className = 'jdmsg err'; msg.textContent = '請先寫一句話說要改什麼'; return; }
    ai.disabled = true; msg.className = 'jdmsg'; msg.textContent = '送出中…';
    api('/admin/jobs/' + encodeURIComponent(JD_CUR.slug) + '/ai-request', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ note: note }),
    }).then(function (d) {
      ai.disabled = false;
      if (!d.ok) { msg.className = 'jdmsg err'; msg.textContent = d.error || '送出失敗'; return; }
      msg.className = 'jdmsg ok'; msg.textContent = '已送出，會有人看過重擬結果再套用。';
      document.getElementById('jdAiNote').value = '';
    }).catch(function () { ai.disabled = false; msg.className = 'jdmsg err'; msg.textContent = '連不上伺服器'; });
  };
}

document.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('.jd-btn');
  if (!btn) return;
  jdInjectStyle();
  var slug = btn.dataset.slug;
  var job = (ALL.find(function (j) { return j.slug === slug; }) || {});
  $('mt').textContent = (job.title || slug) + '　·　JD';
  $('mbody').innerHTML = '<div id="jdwrap"><p class="mut">載入中⋯</p></div>';
  $('mask').hidden = false; $('modal').hidden = false;
  api('/admin/jobs/' + encodeURIComponent(slug) + '/content').then(function (d) {
    if (!d.ok) { $('mbody').innerHTML = '<div id="jdwrap"><p class="mut">讀取失敗：' + esc(d.error || '') + '</p></div>'; return; }
    JD_CUR = { slug: slug, spec: d.spec || {} };
    var flags = '';
    if (d.source === 'backfilled_from_intake') {
      flags += '<div class="jdflag">這份內容是從當初的收件單抓來的底稿，還沒有人在這裡存過檔——存一次之後往後都會準。</div>';
    } else if (d.source === 'none') {
      flags += '<div class="jdflag bad">找不到任何舊資料，下面欄位是空的，請直接填。</div>';
    }
    if (d.pending) {
      flags += '<div class="jdflag">⏳ 有一筆改動還在等本機腳本套用（最多 15 分鐘），這段時間看到的網站內容可能還是舊的。</div>';
    }
    if (d.regen_last_error) {
      flags += '<div class="jdflag bad">⚠️ 上一次套用失敗：' + esc(d.regen_last_error).slice(0, 300) + '</div>';
    }
    if (d.ai_request) {
      flags += '<div class="jdflag">🤖 有一筆交給 AI 重擬的請求還在等人處理（' + esc(String(d.ai_requested_at || '').slice(0, 16)) + '）：「' + esc(d.ai_request) + '」</div>';
    }
    $('mbody').innerHTML = '<div id="jdwrap">' + flags
      + '<div class="jdtabs">'
      + '<button type="button" class="jdtab on" data-tab="view">查看</button>'
      + '<button type="button" class="jdtab" data-tab="edit">編輯</button>'
      + '</div><div id="jdTabBody"></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('#jdwrap .jdtab'), function (b) {
      b.onclick = function () { jdRenderTab(b.dataset.tab); };
    });
    jdRenderTab('view');
  }).catch(function () { $('mbody').innerHTML = '<div id="jdwrap"><p class="mut">連不上伺服器</p></div>'; });
});
</script>
