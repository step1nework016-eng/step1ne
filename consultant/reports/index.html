<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初篩報告｜Step1ne 顧問後台</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:#23262d;background:#fbfaf7;line-height:1.7;}
a{color:#a67c3d;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

header{background:#fff;border-bottom:1px solid #eee7db;padding:14px 0;position:sticky;top:0;z-index:20;}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;}
header img{height:30px;}
header b{font-size:15px;}
.mut{color:#8a8d95;font-size:13px;}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 6px;}
input[type=search],select{font:inherit;font-size:15px;border:1px solid #e0d9cb;border-radius:10px;padding:9px 13px;background:#fff;outline:0;min-height:40px;}
input[type=search]{flex:1;min-width:200px;}
input:focus,select:focus{border-color:#a67c3d;box-shadow:0 0 0 3px rgba(166,124,61,.12);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px;}
.tab{font:inherit;font-size:13.5px;font-weight:600;border:1px solid #e0d9cb;background:#fff;color:#4a4d55;border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px;}
.tab.on{background:#f3e2c2;border-color:#d9bd85;color:#7a4e12;}

.row{background:#fff;border:1px solid #eee7db;border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;}
.row:hover{border-color:#d9bd85;}
.row h3{margin:0 0 4px;font-size:16.5px;}
.row .meta{font-size:13px;color:#8a8d95;display:flex;flex-wrap:wrap;gap:12px;}
.row .prev{font-size:13.5px;color:#5a5d64;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;}
.b-undecided{background:#fdf0d8;color:#8a5a1a;}
.b-forward{background:#dff2e3;color:#1f6b34;}
.b-more{background:#e6eefb;color:#24528f;}
.b-no{background:#f2e6e6;color:#8a3333;}
.b-active{background:#e3f0e6;color:#1f6b34;}
.b-notstart{background:#f0efec;color:#6b6e77;}
.b-done{background:#e9e9ef;color:#3d4250;}
.b-norep{background:#fdeeda;color:#9a5a12;}

dialog{border:0;border-radius:18px;padding:0;max-width:900px;width:calc(100% - 32px);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.22);}
dialog::backdrop{background:rgba(20,18,14,.42);}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee7db;padding:16px 22px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}
.dbody{padding:20px 22px 26px;overflow-y:auto;max-height:calc(88vh - 66px);}
.dhead button{border:0;background:#f2efe8;border-radius:10px;width:34px;height:34px;font-size:17px;cursor:pointer;}
pre.rep{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14.5px;background:#fbfaf7;border:1px solid #eee7db;border-radius:12px;padding:18px;margin:0 0 20px;}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;}
.act{font:inherit;font-size:14px;font-weight:600;border:1px solid #e0d9cb;background:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px;}
.act:hover{border-color:#a67c3d;}
.act.on{background:#23262d;color:#fff;border-color:#23262d;}
details.tr{border:1px solid #eee7db;border-radius:12px;background:#fff;padding:0;}
details.tr summary{padding:13px 18px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;}
details.tr summary::-webkit-details-marker{display:none;}
.turn{padding:0 18px 12px;font-size:14.5px;}
.turn b{color:#8a5a1a;}
.turn.me b{color:#3a5f8a;}

.pager{display:flex;gap:10px;justify-content:center;margin:20px 0 40px;}
.pager button{font:inherit;border:1px solid #e0d9cb;background:#fff;border-radius:10px;padding:9px 18px;cursor:pointer;min-height:42px;}
.pager button:disabled{opacity:.4;cursor:default;}
.gate{max-width:420px;margin:16vh auto;background:#fff;border:1px solid #eee7db;border-radius:16px;padding:26px;}
.gate input{width:100%;margin:10px 0 14px;}
.gate button{width:100%;font:inherit;font-size:15px;font-weight:700;background:#a67c3d;color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer;min-height:46px;}
.empty{background:#fff;border:1px solid #eee7db;border-radius:14px;padding:26px;text-align:center;color:#5a5d64;}
.linkbox{background:#fbf7ef;border:1px solid #e6dfd1;border-radius:12px;padding:15px 17px;margin:0 0 18px;}
.linkbox b{display:block;font-size:13.5px;margin-bottom:8px;}
.linkbox .link{background:#fff;border:1px solid #eee7db;border-radius:8px;padding:10px 12px;font-size:12.5px;word-break:break-all;margin:0 0 10px;}
.linkbox button{font:inherit;font-size:13.5px;font-weight:700;background:#23262d;color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;min-height:38px;}
.live{font-size:11.5px;font-weight:700;color:#1f6b34;background:#e3f0e6;border-radius:999px;padding:3px 9px;}
.flags{background:#fff5f3;border:1px solid #f0c9bd;border-radius:12px;padding:15px 17px;margin:0 0 18px;}
.flags b{display:block;font-size:13.5px;color:#8a3a20;margin-bottom:8px;}
.flags p{margin:0 0 7px;font-size:14px;color:#5a3328;}
.flags p:last-child{margin-bottom:0;}
.flags time{font-family:'Space Mono',monospace;font-size:11.5px;color:#a97f70;margin-right:8px;}
.fb{background:#f6f8fb;border:1px solid #d9e2ee;border-radius:12px;padding:14px 17px;margin:0 0 18px;}
.fb b{font-size:13.5px;color:#24528f;}
.fb .em{font-size:20px;margin-left:6px;vertical-align:-3px;}
.fb p{margin:7px 0 0;font-size:14px;color:#3a4a5e;}
.dlbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.dlbar button{font:inherit;font-size:13.5px;font-weight:600;background:#fff;border:1px solid #e0d9cb;
  border-radius:9px;padding:9px 15px;cursor:pointer;min-height:38px;color:#4a4d55;}
.dlbar button:hover{border-color:#a67c3d;color:#8a5a1a;}
button.primary{font:inherit;font-size:13.5px;font-weight:700;background:#a67c3d;color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-height:38px;white-space:nowrap;}
button.primary:hover{background:#8a6531;}
.frm label{display:block;font-size:13px;font-weight:700;color:#4a4d55;margin:16px 0 6px;}
.frm input,.frm select,.frm textarea{width:100%;font:inherit;font-size:15px;border:1px solid #e0d9cb;border-radius:10px;padding:10px 13px;background:#fff;outline:0;}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:#a67c3d;box-shadow:0 0 0 3px rgba(166,124,61,.12);}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.frm .chk{display:flex;align-items:flex-start;gap:9px;margin:18px 0 0;font-size:14px;font-weight:400;color:#3a3d44;cursor:pointer;}
.frm .chk input{width:17px;height:17px;flex:0 0 auto;margin:3px 0 0;accent-color:#a67c3d;}
.frm .note{font-size:12.5px;color:#8a8d95;margin:5px 0 0;line-height:1.7;}
.frm .go{width:100%;margin-top:22px;font-size:15.5px;padding:14px;border-radius:12px;}
.res{background:#f4faf5;border:1px solid #bfe3c8;border-radius:12px;padding:18px;margin:4px 0 0;}
.res b{display:block;margin-bottom:8px;}
.res .link{background:#fff;border:1px solid #d7e6da;border-radius:9px;padding:11px 13px;font-size:13px;word-break:break-all;margin:0 0 12px;}
.res button{font:inherit;font-size:14px;font-weight:700;background:#23262d;color:#fff;border:0;border-radius:9px;padding:11px 20px;cursor:pointer;min-height:42px;}
.err{background:#fff5f3;border:1px solid #f0c9bd;border-radius:10px;padding:12px 14px;font-size:14px;color:#8a3a20;margin:14px 0 0;}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0;">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0;" hidden></p>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="/assets/step1ne-logo.png" alt="Step1ne">
        <b>初篩報告</b>
      </div>
        <nav style="display:flex;gap:8px;flex-wrap:wrap;"><a href="/consultant/reports/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#fff;background:#23262d;border:1px solid #23262d;">初篩報告</a><a href="/consultant/jobs/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#4d5563;background:#fff;border:1px solid #eee7db;">職缺分類</a><a href="/consultant/job-intake/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#4d5563;background:#fff;border:1px solid #eee7db;">＋ 新增職缺</a><a href="/consultant/job-draft/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#4d5563;background:#fff;border:1px solid #eee7db;">改擬稿</a><a href="/consultant/clients/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#4d5563;background:#fff;border:1px solid #eee7db;">客戶名單</a></nav>
      <div class="mut" style="display:flex;align-items:center;gap:14px;">
        <button id="addbtn" type="button" class="primary">＋ 新增候選人</button>
        <span id="tot">—</span><a href="/consultant/bd/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#fff;background:#a67c3d;border:1px solid #a67c3d;">開發客戶</a>　<a href="/consultant/interview-spec/" style="font-size:14px;text-decoration:none;padding:7px 14px;border-radius:999px;color:#4d5563;background:#fff;border:1px solid #eee7db;">面談規格</a>　<a href="#" id="out">登出</a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="bar">
      <input id="q" type="search" placeholder="搜尋姓名、Email，或報告內文…" autocomplete="off">
      <select id="job"><option value="">全部職缺</option></select>
    </div>
    <div class="tabs">
      <button class="tab on" data-s="undecided" type="button">待處置</button>
      <button class="tab" data-s="" type="button">全部</button>
      <button class="tab" data-s="forwarded" type="button">已轉客戶</button>
      <button class="tab" data-s="need_more" type="button">需補問</button>
      <button class="tab" data-s="rejected" type="button">不推薦</button>
      <button class="tab" data-s="__all_sessions" type="button">所有面談紀錄</button>
      <button class="tab" data-s="__screening" type="button">待審核<span id="screen-badge" class="badge b-norep" style="margin-left:6px;" hidden>—</span></button>
    </div>
    <div id="list"></div>
    <div class="pager">
      <button id="prev" type="button">← 上一頁</button>
      <button id="next" type="button">下一頁 →</button>
    </div>
  </div>
</div>

<dialog id="adlg">
  <div class="dhead">
    <div><b>新增候選人</b><div class="mut">顧問自己找到的人。建檔後拿連結，貼到 104 私訊或 LINE 給對方。</div></div>
    <button id="ax" type="button" aria-label="關閉">✕</button>
  </div>
  <div class="dbody frm">
    <div id="aform">
      <label>應徵職缺 <span style="color:#b4552e;">*</span></label>
      <select id="a_job"><option value="">載入中…</option></select>

      <div class="two">
        <div><label>姓名 <span style="color:#b4552e;">*</span></label><input id="a_name" placeholder="王大明"></div>
        <div><label>從哪裡找到的</label><input id="a_channel" placeholder="104／LinkedIn／推薦"></div>
      </div>

      <div class="two">
        <div><label>Email</label><input id="a_email" type="email" placeholder="選填"></div>
        <div><label>電話</label><input id="a_phone" placeholder="選填"></div>
      </div>

      <div class="two">
        <div><label>期望待遇 <span style="color:#b4552e;">*</span></label>
          <input id="a_salary" placeholder="例：50K　不確定就寫「面議」"></div>
        <div><label>可到職日 <span style="color:#b4552e;">*</span></label>
          <input id="a_date" placeholder="例：9/1、一個月、隨時"></div>
      </div>

      <p class="note" style="margin:6px 0 0;">這兩欄留空的話，阿財要在面談中花兩個來回去問——
      而一個來回大約三分鐘。你手上有的資訊先填，省的是面談時間。不確定就寫「面議」「待確認」。</p>

      <label>履歷檔（PDF／Word，8MB 以內）</label>
      <input id="a_file" type="file" accept=".pdf,.doc,.docx">
      <p class="note">兩個都留空也行——但阿財就不能說「您的履歷我看過了」，會改成請對方口頭介紹。</p>

      <label>或履歷雲端連結</label>
      <input id="a_url" placeholder="Google Drive／Dropbox 分享連結">

      <label>備註（只有顧問看得到）</label>
      <textarea id="a_note" rows="2" placeholder="例：從 104 主動應徵，電話聊過對派遣沒問題"></textarea>

      <label class="chk"><input id="a_mail" type="checkbox">
        <span>順便寄一封邀約信給他<br>
        <span class="note">多數情況建議不要——你自己貼到 104 私訊或 LINE，比一封陌生的系統信更容易被讀。</span></span>
      </label>

      <button id="a_go" type="button" class="primary go">建檔並取得面談連結</button>
      <div id="a_err" class="err" hidden></div>
    </div>

    <div id="aok" hidden>
      <div class="res">
        <b>✅ 建檔完成</b>
        <div class="link" id="a_link">—</div>
        <button id="a_copy" type="button">複製連結</button>
        <p class="note" id="a_extra" style="margin-top:12px;"></p>
      </div>
      <button id="a_again" type="button" class="primary go">再新增一位</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dhead">
    <div><b id="dname">—</b><div class="mut" id="dmeta">—</div></div>
    <button id="dx" type="button" aria-label="關閉">✕</button>
  </div>
  <div class="dbody">
    <div id="dfb" class="fb" hidden></div>
    <div id="dflags" class="flags" hidden></div>
    <div id="dlink" class="linkbox" hidden>
      <b>面談連結</b>
      <div class="link" id="dlink_u">—</div>
      <button id="dlink_c" type="button">複製連結</button>
    </div>
    <div id="resumebox" class="linkbox" hidden>
      <b>履歷</b>
      <button id="resume_dl" type="button" hidden>下載履歷檔</button>
      <a id="resume_link" href="#" target="_blank" rel="noopener" hidden>開啟雲端連結</a>
      <span id="resume_none" hidden>沒有履歷（阿財是請對方口頭介紹）</span>
    </div>
    <div class="acts" id="acts"></div>
    <div class="dlbar" id="dlbar" hidden>
      <button id="dl_md" type="button">下載報告（.md）</button>
      <button id="dl_html" type="button">下載報告（HTML）</button>
      <button id="dl_pdf" type="button">下載報告（PDF）</button>
      <button id="dl_tr" type="button">下載逐字稿</button>
      <button id="dl_cp" type="button">複製報告</button>
    </div>
    <pre class="rep" id="drep">載入中…</pre>
    <details class="tr" id="trbox" open>
      <summary>逐字稿　<span id="livetag" class="live" hidden>● 進行中，每 5 秒更新</span></summary>
      <div id="dtr" class="turn"></div>
    </details>
  </div>
</dialog>

<script>
var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY = 's1ne_admin_tok';
var tok = localStorage.getItem(KEY) || '';
var state = 'undecided', offset = 0, LIMIT = 25, total = 0, cur = null;
var $ = function (i) { return document.getElementById(i); };

var LABEL = {
  forwarded: { t: '已轉客戶', c: 'b-forward' },
  need_more: { t: '需補問', c: 'b-more' },
  rejected: { t: '不推薦', c: 'b-no' },
};

function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ authorization: 'Bearer ' + tok }, opt.headers || {});
  return fetch(API + path, opt).then(function (r) {
    if (r.status === 401) { throw new Error('權杖不正確'); }
    return r.json();
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

var IST = {
  not_started: { t: '未開始', c: 'b-notstart' },
  active: { t: '進行中', c: 'b-active' },
  done: { t: '已結束', c: 'b-done' },
};

async function loadSessions() {
  var qs = new URLSearchParams({ limit: LIMIT, offset: offset });
  if ($('q').value.trim()) qs.set('q', $('q').value.trim());
  // ⚠️ 2026-08-11：職缺下拉在「所有面談紀錄」沒反應，因為只有 load() 加了 job，
  //    這條路徑漏了。後端 /admin/sessions 也同時補上收這個參數。
  if ($('job').value) qs.set('job', $('job').value);
  var d;
  try { d = await api('/admin/sessions?' + qs); }
  catch (e) { return gate(e.message); }
  if (!d.ok) return;

  total = d.total;
  $('tot').textContent = total + ' 筆應徵' + ($('job').value ? '（已篩職缺）' : '');
  $('list').innerHTML = d.sessions.length ? '' : '<div class="empty">目前沒有應徵紀錄。</div>';

  d.sessions.forEach(function (r) {
    var st = IST[r.interview_state] || { t: r.interview_state || '—', c: 'b-notstart' };
    // 有對話卻沒報告的最需要有人看一眼——那通常代表收尾或產報告出了問題
    var orphan = r.turns > 0 && !r.report_id;
    var el = document.createElement('div');
    el.className = 'row';
    el.innerHTML =
      '<h3>' + esc(r.name) + '　<span class="badge ' + st.c + '">' + st.t + '</span>' +
      (orphan ? '　<span class="badge b-norep">有對話・無報告</span>' : '') + '</h3>' +
      '<div class="meta"><span>' + esc(r.job_title || r.job_slug) + '</span>' +
      '<span>' + esc((r.created_at || '').slice(0, 16)) + '</span>' +
      '<span>' + (r.turns || 0) + ' 則對話</span>' +
      (r.email ? '<span>' + esc(r.email) + '</span>' : '') +
      (r.phone ? '<span>' + esc(r.phone) + '</span>' : '') + '</div>';
    el.addEventListener('click', function () { openSession(r); });
    $('list').appendChild(el);
  });

  $('prev').disabled = offset === 0;
  $('next').disabled = offset + LIMIT >= total;
}

var liveTimer = null;
function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

function renderTranscript(list) {
  $('dtr').innerHTML = (list || [])
    .filter(function (m) { return m.content !== '（候選人已進入面談室）'; })
    .map(function (m) {
      var me = m.role === 'candidate';
      return '<p class="turn ' + (me ? 'me' : '') + '"><b>' + (me ? '候選人' : '阿財') + '</b>　' +
        '<span style="color:#b3b5bb;font-size:12px;">' + esc((m.created_at || '').slice(11, 16)) + '</span><br>' +
        esc(m.content).replace(/\n/g, '<br>') + '</p>';
    }).join('') || '<p class="turn">（還沒有對話）</p>';
}

// 把文字存成檔案。顧問要把報告轉給客戶，總不能叫他自己反白複製。
function download(name, text, mime) {
  var blob = new Blob([text], { type: (mime || 'text/markdown') + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

// 檔名要能一眼看出是誰、什麼職缺、哪一天——顧問下載十份之後才不會分不清
function safeName(row, kind, ext) {
  var d = (row.interview_ended_at || row.created_at || '').slice(0, 10) || 'undated';
  return [String(row.name || '未命名').replace(/[\\/:*?"<>|]/g, ''),
          String(row.job_slug || ''), kind, d].filter(Boolean).join('_') + '.' + (ext || 'md');
}

// 報告內文本來就是固定的純文字排版（縮排代表層級），不用做完整 markdown 解析，
// 用 <pre> 保留原始排版最不會出錯——顧問要的是「看起來跟後台一樣」，不是漂亮的標題階層。
function reportHtml(row, report) {
  var title = esc(row.name) + ' → ' + esc(row.job_title || row.job_slug);
  var meta = esc((row.interview_started_at || row.created_at || '').slice(0, 16)) +
    ' – ' + esc((row.interview_ended_at || '未結束').slice(0, 16));
  return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">' +
    '<title>初篩報告｜' + title + '</title><style>' +
    'body{font-family:-apple-system,"PingFang TC",sans-serif;max-width:720px;margin:40px auto;' +
    'padding:0 20px;color:#16202e;line-height:1.7}' +
    'h1{font-size:19px;margin:0 0 4px}.meta{color:#7c8899;font-size:13px;margin-bottom:24px}' +
    'pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#f6f8fb;' +
    'border:1px solid #dfe4ec;border-radius:10px;padding:18px 20px}' +
    '@media print{pre{border:none;background:none;padding:0}}' +
    '</style></head><body>' +
    '<h1>初篩報告　' + title + '</h1>' +
    '<div class="meta">Step1ne 德仁管理顧問　·　' + meta + '</div>' +
    '<pre>' + esc(report.content_md || '') + '</pre>' +
    '</body></html>';
}

function transcriptText(row, list) {
  return ['# 面談逐字稿', '',
          `**候選人**：${row.name}`,
          `**職缺**：${row.job_title || row.job_slug}`,
          `**時間**：${row.interview_started_at || row.created_at || ''} – ${row.interview_ended_at || '未結束'}`,
          '', '---', ''].concat(
    (list || []).filter(function (m) { return m.content !== '（候選人已進入面談室）'; })
      .map(function (m) {
        return `### ${(m.created_at || '').slice(11, 16)}　${m.role === 'candidate' ? '候選人' : '阿財'}\n\n${m.content}\n`;
      })).join('\n');
}

var curRow = null, curData = null;

async function openSession(row) {
  cur = null;
  curRow = row; curData = null;
  stopLive();
  // 2026-08-05：Phoebe 遇到標題顯示 undefined、報告區「讀取失敗」，
  // 但用管理員 token 直接打 API 都正常，重現不出來。
  // 先把「是哪一筆、缺什麼」講出來，下次出錯就知道是資料問題還是權限問題。
  if (!row || !row.id) {
    $('dname').textContent = '這筆資料有問題';
    $('dmeta').textContent = '點到的項目沒有 id，請截圖給工程確認（row=' +
      JSON.stringify(row || null).slice(0, 120) + '）';
    $('drep').textContent = '';
    $('dlg').showModal();
    return;
  }
  $('dname').textContent = row.name || '（這筆沒有姓名資料）';
  $('dmeta').textContent = (row.job_title || row.job_slug) + '　' + (row.email || '') + '　' + (row.phone || '');
  $('drep').textContent = '載入中…';
  $('dtr').innerHTML = '';
  $('acts').innerHTML = '';
  $('dlg').showModal();

  var d = await api('/admin/session/' + encodeURIComponent(row.id));
  if (!d.ok) { $('drep').textContent = '讀取失敗'; return; }

  // 候選人自己給的體驗分數。這是唯一能回答「這套值不值得繼續」的訊號——
  // 顧問覺得報告好，跟候選人願不願意做完，是兩件事。
  if (d.feedback) {
    var EM = { 1: '😞', 2: '😕', 3: '😐', 4: '🙂', 5: '😄' };
    $('dfb').hidden = false;
    $('dfb').innerHTML =
      '<b>候選人給的體驗評分：' + d.feedback.rating + ' / 5</b>' +
      '<span class="em">' + (EM[d.feedback.rating] || '') + '</span>' +
      (d.feedback.comment ? '<p>「' + esc(d.feedback.comment) + '」</p>' : '');
  } else {
    $('dfb').hidden = true;
  }

  // 候選人在面談中按過「回報問題」的話，一定要放在最上面——
  // 那是他當下就卡住的訊號，比報告內容急迫得多。
  if ((d.flags || []).length) {
    $('dflags').hidden = false;
    $('dflags').innerHTML = '<b>🆘 候選人回報了 ' + d.flags.length + ' 次問題</b>' +
      d.flags.map(function (f) {
        return '<p><time>' + esc((f.created_at || '').slice(5, 16)) + '</time>' +
          esc(f.reason) + (f.detail ? '　—　' + esc(f.detail) : '') + '</p>';
      }).join('');
  } else {
    $('dflags').hidden = true;
  }

  // 面談連結：顧問建完檔沒複製就關掉視窗時，這是唯一找回來的地方
  if (d.interview_url) {
    $('dlink').hidden = false;
    $('dlink_u').textContent = d.interview_url;
  } else {
    $('dlink').hidden = true;
  }

  // 履歷：上傳的檔案走後端下載端點（要帶 ADMIN_TOKEN，不能用純連結），
  // 貼的雲端連結本身就是公開網址，直接開新分頁就好，不用經過我們的伺服器。
  $('resumebox').hidden = false;
  $('resume_dl').hidden = true;
  $('resume_link').hidden = true;
  $('resume_none').hidden = true;
  if (d.application && d.application.resume_file_id) {
    $('resume_dl').hidden = false;
  } else if (d.application && d.application.resume_url) {
    $('resume_link').hidden = false;
    $('resume_link').href = d.application.resume_url;
  } else {
    $('resume_none').hidden = false;
  }

  $('drep').textContent = d.report
    ? d.report.content_md
    : (row.interview_state === 'active'
        ? '（面談進行中，報告會在結束後產生。下方逐字稿會自動更新。）'
        : (row.turns ? '（這場面談還沒有報告——可能收尾時出錯。逐字稿在下方。）'
                     : '（這位應徵者還沒開始面談。）'));

  curData = d;
  // 只有真的有東西可以下載才顯示那排按鈕
  $('dlbar').hidden = !(d.report || (d.transcript || []).length);
  renderTranscript(d.transcript);

  // 進行中的面談讓顧問看得到即時進度。
  // 5 秒一次夠了——阿財回一則要 30 秒以上，再快只是多打 API。
  if (row.interview_state === 'active') {
    $('livetag').hidden = false;
    liveTimer = setInterval(async function () {
      if (!$('dlg').open) return stopLive();
      try {
        var u = await api('/admin/session/' + encodeURIComponent(row.id));
        if (!u.ok) return;
        renderTranscript(u.transcript);
        if (u.application && u.application.interview_state !== 'active') {
          $('livetag').hidden = true;
          stopLive();
          load();   // 狀態變了，清單也要跟著更新
        }
      } catch (e) { /* 網路瞬斷不用打擾，下一輪會補 */ }
    }, 5000);
  } else {
    $('livetag').hidden = true;
  }
}

// 推薦其他職缺要用的下拉選單，跟「新增候選人」共用同一份 jobs.json，
// 不用另外維護一份職缺清單
var screeningJobsCache = null;
async function getJobsList() {
  if (screeningJobsCache) return screeningJobsCache;
  try {
    var r = await fetch('/apply/jobs.json');
    screeningJobsCache = await r.json();
  } catch (e) { screeningJobsCache = []; }
  return screeningJobsCache;
}

async function loadScreening() {
  document.querySelector('.pager').style.display = 'none';
  var d;
  try { d = await api('/admin/screening'); }
  catch (e) { return gate(e.message); }
  if (!d.ok) return;

  $('tot').textContent = d.pending.length + ' 筆待審核';
  var badge = $('screen-badge');
  if (d.pending.length) { badge.hidden = false; badge.textContent = d.pending.length; }
  else badge.hidden = true;

  if (!d.pending.length) {
    $('list').innerHTML = '<div class="empty">目前沒有待審核的應徵——這些都是有客戶硬性條件的職缺才會出現在這裡。</div>';
    return;
  }

  var jobs = await getJobsList();
  var jobOptions = jobs.map(function (j) {
    return '<option value="' + esc(j.slug) + '">' + esc(j.title) + '</option>';
  }).join('');

  $('list').innerHTML = d.pending.map(function (r) {
    var discLine = r.disc_primary
      ? 'DISC：' + esc(r.disc_primary) + '　(D' + r.disc_d + ' I' + r.disc_i + ' S' + r.disc_s + ' C' + r.disc_c + ')'
      : 'DISC：未測';
    var resumeLine = r.resume_file_id
      ? '<a href="#" class="screen-resume-dl" data-id="' + esc(r.id) + '" style="color:#2f6fed;">下載履歷檔</a>'
      : (r.resume_url ? '<a href="' + esc(r.resume_url) + '" target="_blank" rel="noopener">開啟履歷連結</a>' : '（無履歷）');
    return '<div class="row" style="cursor:default;">' +
      '<h3>' + esc(r.name) + '</h3>' +
      '<div class="meta"><span>' + esc(r.job_title || r.job_slug) + '</span>' +
      '<span>' + esc((r.created_at || '').slice(0, 16)) + '</span>' +
      (r.email ? '<span>' + esc(r.email) + '</span>' : '') +
      (r.expected_salary ? '<span>期望 ' + esc(r.expected_salary) + '</span>' : '') +
      (r.available_date ? '<span>可到職 ' + esc(r.available_date) + '</span>' : '') + '</div>' +
      '<div class="meta"><span>' + discLine + '</span><span>' + resumeLine + '</span></div>' +
      (r.client_screen_conditions
        ? '<div style="background:#fdf3ea;border:1px solid #f0d9bd;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;">' +
          '<b>客戶硬性條件（系統不做判斷，由你評估）：</b><br>' + esc(r.client_screen_conditions) + '</div>'
        : '') +
      (r.note ? '<div class="mut" style="font-size:13px;margin:6px 0;">候選人備註：' + esc(r.note) + '</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;">' +
        '<button type="button" class="screen-approve" data-id="' + esc(r.id) + '" style="background:#2f8f5b;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;">核准，安排面談</button>' +
        '<button type="button" class="screen-decline" data-id="' + esc(r.id) + '" style="background:#b4552e;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;">婉拒</button>' +
        '<select class="screen-redirect-job" data-id="' + esc(r.id) + '" style="border-radius:8px;padding:8px;border:1px solid #ddd;"><option value="">推薦其他職缺…</option>' + jobOptions + '</select>' +
        '<button type="button" class="screen-redirect" data-id="' + esc(r.id) + '" style="background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;">送出推薦</button>' +
      '</div>' +
    '</div>';
  }).join('');

  document.querySelectorAll('.screen-resume-dl').forEach(function (a) {
    a.addEventListener('click', async function (e) {
      e.preventDefault();
      var r = await fetch(API + '/admin/resume/' + encodeURIComponent(this.dataset.id),
        { headers: { authorization: 'Bearer ' + tok } });
      if (!r.ok) return alert('下載失敗');
      var blob = await r.blob();
      var cd = r.headers.get('content-disposition') || '';
      var m = /filename="?([^"]+)"?/.exec(cd);
      var name = m ? decodeURIComponent(m[1]) : 'resume.pdf';
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = name;
      document.body.appendChild(link); link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 0);
    });
  });
  document.querySelectorAll('.screen-approve').forEach(function (b) {
    b.addEventListener('click', async function () {
      if (!confirm('核准後會立即寄面談連結給候選人，確定嗎？')) return;
      this.disabled = true;
      await api('/admin/screen-decide', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: this.dataset.id, decision: 'approved' }),
      });
      loadScreening();
    });
  });
  document.querySelectorAll('.screen-decline').forEach(function (b) {
    b.addEventListener('click', async function () {
      if (!confirm('確定婉拒嗎？系統會在 3 小時後自動寄一封委婉通知信給候選人。')) return;
      this.disabled = true;
      await api('/admin/screen-decide', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: this.dataset.id, decision: 'declined' }),
      });
      loadScreening();
    });
  });
  document.querySelectorAll('.screen-redirect').forEach(function (b) {
    b.addEventListener('click', async function () {
      var id = this.dataset.id;
      var sel = document.querySelector('.screen-redirect-job[data-id="' + id + '"]');
      if (!sel.value) return alert('請先選一個要推薦的職缺');
      if (!confirm('會立即寄「' + sel.options[sel.selectedIndex].textContent + '」的應徵連結給候選人，確定嗎？')) return;
      this.disabled = true;
      await api('/admin/screen-decide', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ application_id: id, decision: 'redirect', redirect_job_slug: sel.value }),
      });
      loadScreening();
    });
  });
}

async function load() {
  document.querySelector('.pager').style.display = '';
  if (state === '__all_sessions') return loadSessions();
  if (state === '__screening') return loadScreening();
  var qs = new URLSearchParams({ state: state, limit: LIMIT, offset: offset });
  if ($('q').value.trim()) qs.set('q', $('q').value.trim());
  if ($('job').value) qs.set('job', $('job').value);
  var d;
  try { d = await api('/admin/reports?' + qs); }
  catch (e) { return gate(e.message); }
  if (!d.ok) return;

  total = d.total;
  $('tot').textContent = total + ' 份報告';

  if ($('job').options.length <= 1 && d.jobs.length) {
    d.jobs.forEach(function (j) {
      var o = document.createElement('option');
      o.value = j.slug; o.textContent = j.title || j.slug;
      $('job').appendChild(o);
    });
  }

  $('list').innerHTML = d.reports.length ? '' :
    '<div class="empty">' + (state === 'undecided'
      ? '沒有待處置的報告。切到「全部」看歷史紀錄。'
      : '沒有符合的報告。') + '</div>';

  // 顧問在群組回報進度後（consultant_reports → placements），
  // 這個 stage 代碼跟後端漏斗查詢用的是同一套，只在畫面上轉成中文。
  var PIPE_LABEL = { SUBMITTED: '已送件', INTERVIEWING: '客戶面談',
                     OFFER_ACCEPTED: '錄取', GUARANTEE: '到職・保證期',
                     CLOSED_LOST: '結案', CLOSED_WON: '結案（成功）' };
  d.reports.forEach(function (r) {
    var lab = LABEL[r.consultant_decision];
    var pipe = PIPE_LABEL[r.pipeline_stage];
    var el = document.createElement('div');
    el.className = 'row';
    el.innerHTML =
      '<h3>' + esc(r.name) + '　<span class="badge ' + (lab ? lab.c : 'b-undecided') + '">' +
      (lab ? lab.t : '待處置') + '</span>' +
      (pipe ? '<span class="badge" style="background:#eef4fd;color:#2f5fd8;">' + esc(pipe) + '</span>' : '') +
      '</h3>' +
      '<div class="meta"><span>' + esc(r.job_title || r.job_slug) + '</span>' +
      '<span>' + esc((r.created_at || '').slice(0, 16)) + '</span>' +
      '<span>' + (r.turns || 0) + ' 則對話</span>' +
      (r.expected_salary ? '<span>期望 ' + esc(r.expected_salary) + '</span>' : '') +
      (r.available_date ? '<span>可到職 ' + esc(r.available_date) + '</span>' : '') + '</div>' +
      '<p class="prev">' + esc((r.preview || '').replace(/\s+/g, ' ')) + '</p>' +
      // 顧問在「顧問人選回報區」講的最新一句進度，寫進 applications.handled_note。
      // 這是 2026-08-12 加的入口——之前這個欄位沒有畫面顯示，顧問講了也等於白講。
      (r.handled_note
        ? '<p class="mut" style="font-size:12.5px;background:#faf8f3;border-radius:8px;padding:7px 10px;margin:6px 0 0;">' +
          '📌 顧問跟進：' + esc(r.handled_note) + '</p>'
        : '');
    el.addEventListener('click', function () { open(r); });
    $('list').appendChild(el);
  });

  $('prev').disabled = offset === 0;
  $('next').disabled = offset + LIMIT >= total;
}

async function open(row) {
  cur = row;
  curRow = null; curData = null;
  stopLive();
  $('dname').textContent = row.name;
  $('dmeta').textContent = (row.job_title || row.job_slug) + '　' + (row.email || '') + '　' + (row.phone || '');
  $('drep').textContent = '載入中…';
  $('dtr').innerHTML = '';
  // 這條路徑（報告列表）沒有面談連結／體驗評分／回報問題可以顯示——
  // 明確清掉，不然會殘留上一次從「全部應徵」那邊點開的舊資料
  $('dlink').hidden = true;
  $('dfb').hidden = true;
  $('dflags').hidden = true;
  $('livetag').hidden = true;
  drawActs(row.consultant_decision);
  $('dlg').showModal();

  var d;
  try {
    d = await api('/admin/report/' + encodeURIComponent(row.id));
  } catch (e) {
    // 權杖不對會走這條（api() 對 401 是 throw 不是回 ok:false）。
    // 原本沒接，會變成畫面卡在「載入中…」，看起來像當掉。
    $('drep').textContent = '讀不到報告：' + (e && e.message ? e.message : '連線失敗') +
      '\n\n如果寫「權杖不正確」，右上角重新輸入 ADMIN_TOKEN 就好。';
    return;
  }
  if (!d.ok) {
    $('drep').textContent = '讀取失敗：' + (d.error || '伺服器沒說原因') +
      '\n（報告 id：' + row.id + '）';
    return;
  }
  $('drep').textContent = d.report.content_md || '（沒有報告內容）';
  $('dtr').innerHTML = (d.transcript || [])
    .filter(function (m) { return m.content !== '（候選人已進入面談室）'; })
    .map(function (m) {
      var me = m.role === 'candidate';
      return '<p class="turn ' + (me ? 'me' : '') + '"><b>' + (me ? '候選人' : '阿財') + '</b>：' +
        esc(m.content).replace(/\n/g, '<br>') + '</p>';
    }).join('') || '<p class="turn">（沒有逐字稿）</p>';

  // 下載按鈕（dl_md/dl_html/dl_pdf/dl_tr/dl_cp）跟履歷按鈕都靠 curRow/curData——
  // 這條路徑本來沒設，之前那幾顆按鈕在「報告」分頁其實是用「全部應徵」留下的舊資料在動，
  // 點了會下載到別人的報告。
  curRow = {
    id: row.app_id, name: row.name, job_slug: row.job_slug, job_title: row.job_title,
    interview_started_at: row.interview_started_at, interview_ended_at: row.interview_ended_at,
    created_at: row.created_at,
  };
  curData = { report: d.report, transcript: d.transcript };
  $('dlbar').hidden = !(d.report || (d.transcript || []).length);

  $('resumebox').hidden = false;
  $('resume_dl').hidden = true;
  $('resume_link').hidden = true;
  $('resume_none').hidden = true;
  if (d.report && d.report.resume_file_id) {
    $('resume_dl').hidden = false;
  } else if (d.report && d.report.resume_url) {
    $('resume_link').hidden = false;
    $('resume_link').href = d.report.resume_url;
  } else {
    $('resume_none').hidden = false;
  }
}

function drawActs(now) {
  var opts = [
    { k: 'forwarded', t: '轉給客戶', s: 'passed' },
    { k: 'need_more', t: '需補問', s: 'reported' },
    { k: 'rejected', t: '不推薦', s: 'rejected' },
  ];
  $('acts').innerHTML = '';
  opts.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'act' + (now === o.k ? ' on' : '');
    b.textContent = o.t;
    b.addEventListener('click', function () { decide(o); });
    $('acts').appendChild(b);
  });
  var n = document.createElement('span');
  n.className = 'mut';
  n.style.cssText = 'align-self:center;margin-left:6px;';
  // 記下處置才有辦法回頭比對 AI 判準準不準，這是這個按鈕真正的用途
  n.textContent = now ? '已處置' : '處置後才能回頭校正 AI 的判準';
  $('acts').appendChild(n);
}

async function decide(o) {
  if (!cur) return;
  var d = await api('/admin/decide-report', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: cur.id, decision: o.k, app_id: cur.app_id, app_status: o.s }),
  });
  if (d.ok) { cur.consultant_decision = o.k; drawActs(o.k); load(); }
}

function gate(msg) {
  $('app').hidden = true; $('gate').hidden = false;

$('dl_md').addEventListener('click', function () {

  download(safeName(curRow, '初篩報告'), curData.report.content_md);
});
$('dl_html').addEventListener('click', function () {
  if (!curData || !curData.report) return alert('這場面談還沒有報告');
  download(safeName(curRow, '初篩報告', 'html'), reportHtml(curRow, curData.report), 'text/html');
});
$('dl_pdf').addEventListener('click', function () {
  // 瀏覽器沒有內建「存成 PDF」的 API，開新視窗印出來、由使用者在列印對話框選
  // 「另存為 PDF」是最不用額外套件、最不容易壞的做法。
  if (!curData || !curData.report) return alert('這場面談還沒有報告');
  var w = window.open('', '_blank');
  if (!w) return alert('瀏覽器擋了跳出視窗，請允許彈出視窗後再試一次');
  // ⚠️ 不要用 w.addEventListener('load', ...) 叫 print()。
  // 2026-08-05 Phoebe 回報「只有 PDF 下不了，其他都可以」——原因就是這個：
  // document.write 寫進去的內容，load 事件多半在我們掛監聽之前就已經觸發完了，
  // 那個 callback 永遠不會跑，所以視窗開了、內容也在，但列印對話框不會出現。
  // 改成把 print 寫進頁面本身的 onload，由那份文件自己觸發，時序上不會錯過。
  var html = reportHtml(curRow, curData.report);
  html = html.replace('</body>',
    '<scr' + 'ipt>window.onload=function(){window.focus();window.print();};</scr' + 'ipt></body>');
  w.document.write(html);
  w.document.close();
  // 保險：有些瀏覽器對 document.write 的頁面不觸發 onload，補一次直接呼叫。
  // 印兩次不會怎樣（第二次對話框已經開著），印不出來才是問題。
  setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 600);
});
$('dl_tr').addEventListener('click', function () {
  if (!curData) return;
  download(safeName(curRow, '逐字稿'), transcriptText(curRow, curData.transcript));
});
$('dl_cp').addEventListener('click', function () {
  if (!curData || !curData.report) return alert('這場面談還沒有報告');
  var b = this;
  navigator.clipboard.writeText(curData.report.content_md).then(function () {
    b.textContent = '已複製 ✓';
    setTimeout(function () { b.textContent = '複製報告'; }, 1800);
  });
});

$('resume_dl').addEventListener('click', async function () {
  if (!curRow) return;
  var b = this;
  b.disabled = true; b.textContent = '下載中…';
  try {
    var r = await fetch(API + '/admin/resume/' + encodeURIComponent(curRow.id),
      { headers: { authorization: 'Bearer ' + tok } });
    if (!r.ok) throw new Error('下載失敗（' + r.status + '）');
    var blob = await r.blob();
    // Content-Disposition 裡的檔名是後端存的原始檔名，比自己亂猜副檔名準
    var cd = r.headers.get('content-disposition') || '';
    var m = /filename="?([^"]+)"?/.exec(cd);
    var name = m ? decodeURIComponent(m[1]) : safeName(curRow, '履歷', 'pdf');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  } catch (e) {
    alert(e.message || '下載失敗');
  } finally {
    b.disabled = false; b.textContent = '下載履歷檔';
  }
});

// ── 新增候選人（顧問自己找到的人）──
var jobsLoaded = false;


function readB64(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function fillJobs() {
  if (jobsLoaded) return;
  // 職缺清單直接讀官網表單用的那份，跟線上刊登的職缺同步，不會對不起來
  try {
    var r = await fetch('/apply/jobs.json');
    var list = await r.json();
    $('a_job').innerHTML = '<option value="">請選擇</option>' +
      list.map(function (j) {
        return '<option value="' + esc(j.slug) + '">' + esc(j.title) + '</option>';
      }).join('');
    jobsLoaded = true;
  } catch (e) {
    $('a_job').innerHTML = '<option value="">讀取職缺失敗，請手動重整</option>';
  }
}

function resetAdd() {
  ['a_name', 'a_channel', 'a_email', 'a_phone', 'a_salary', 'a_date', 'a_url', 'a_note']
    .forEach(function (i) { $(i).value = ''; });
  $('a_job').value = ''; $('a_file').value = ''; $('a_mail').checked = false;
  $('a_err').hidden = true; $('aform').hidden = false; $('aok').hidden = true;
}

$('addbtn').addEventListener('click', function () {
  resetAdd(); fillJobs(); $('adlg').showModal();
});
$('ax').addEventListener('click', function () { $('adlg').close(); });
$('a_again').addEventListener('click', resetAdd);

$('a_go').addEventListener('click', async function () {
  var err = $('a_err');
  err.hidden = true;
  var miss = [];
  if (!$('a_name').value.trim()) miss.push('姓名');
  if (!$('a_job').value) miss.push('應徵職缺');
  if (!$('a_salary').value.trim()) miss.push('期望待遇');
  if (!$('a_date').value.trim()) miss.push('可到職日');
  if (miss.length) {
    err.hidden = false;
    err.textContent = '這幾欄要填：' + miss.join('、') + '（不確定就寫「面議」或「待確認」）';
    return;
  }
  var name = $('a_name').value.trim(), job = $('a_job').value;
  var btn = this;
  btn.disabled = true; btn.textContent = '建檔中…';
  try {
    var body = {
      name: name, job_slug: job,
      channel: $('a_channel').value.trim() || null,
      email: $('a_email').value.trim() || null,
      phone: $('a_phone').value.trim() || null,
      expected_salary: $('a_salary').value.trim() || null,
      available_date: $('a_date').value.trim() || null,
      resume_url: $('a_url').value.trim() || null,
      note: $('a_note').value.trim() || null,
      send_mail: $('a_mail').checked,
    };
    var f = $('a_file').files[0];
    if (f) {
      // 不用在瀏覽器抽文字——Worker 會把 base64 切塊存進 D1，8MB 以內都收。
      // 試過 pdf.js，中文 PDF 的字型對應不完整，抽出來夾了大量空位元組、內容殘缺；
      // 同一份檔案本機 pdftotext 抽卻是乾淨的。所以原檔完整存下來、交給本機抽才對。
      if (f.size > 8 * 1024 * 1024) throw new Error('履歷檔超過 8MB，請改貼雲端連結');
      btn.textContent = '上傳中…';
      body.resume_b64 = await readB64(f);
      body.resume_name = f.name;
      body.resume_mime = f.type;
    }
    if (body.send_mail && !body.email) throw new Error('要寄信就得填 Email');

    var d = await api('/admin/create-candidate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!d.ok) throw new Error(d.error || '建檔失敗');

    $('aform').hidden = true; $('aok').hidden = false;
    $('a_link').textContent = d.url;
    $('a_extra').textContent =
      (d.has_resume ? '履歷已上傳，阿財面談前會先讀過。'
        : '⚠️ 沒有履歷，阿財不會說「您的履歷我看過了」，會改成請對方口頭介紹。') +
      (d.mailed ? '　邀約信已寄出。' : (body.send_mail ? '　⚠️ 邀約信寄送失敗，請自行轉達連結。' : ''));
    if (state === '__all_sessions') load();
  } catch (e) {
    err.hidden = false; err.textContent = e.message || '建檔失敗';
  } finally {
    btn.disabled = false; btn.textContent = '建檔並取得面談連結';
  }
});

    b.textContent = '已複製 ✓';
    setTimeout(function () { b.textContent = '複製連結'; }, 1800);

});

if (tok) { $('app').hidden = false; load(); } else { gate(''); }
