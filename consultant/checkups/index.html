<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>阿福・履歷健檢紀錄｜顧問後台</title>
<link rel="icon" href="/assets/favicon.ico">
<script defer src="/consultant/_shell.js"></script>
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:20px 0 60px}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:16px}
.note b{color:var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:11px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);color:var(--ink3);font-size:12.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-block;white-space:nowrap}
.pill.reported{background:#e7f4ec;color:var(--ok)}
.pill.talking{background:#fdf6e9;color:#c98a1e}
.pill.new{background:#eef1f8;color:var(--ink3)}
.pill.fail{background:#fdf7f6;color:#8a2b20}
.nums{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.nums b{color:var(--ink2)}
.cnt{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
a.rpt{font-size:13px;color:var(--gold);text-decoration:none;font-weight:700}
a.rpt:hover{text-decoration:underline}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>阿福・履歷健檢紀錄</b>
    <nav>
      <a href="/consultant/jobs/">職缺分類</a>
      <a href="/consultant/reports/">初篩報告</a>
      <a href="/consultant/clients/">客戶名單</a>
      <a href="/consultant/bd/">開發客戶</a>
      <a href="/consultant/checkups/" class="on">阿福健檢</a>
      <a href="/consultant/line-bindings/">LINE 綁定</a>
    </nav>
  </div></header>
  <main class="wrap">
    <div class="note">
      這頁列出所有透過 <b>step1ne.com/checkup/</b> 送出的 AI 履歷健檢申請——
      這是阿福（跟阿財完全分開的獨立人格與資料表），<b>沒有應徵任何職缺</b>，
      是本人主動來問自己的市場價值。「報告」欄有連結的代表報告已經產出，
      本人可以用同一組對談連結自己下載；沒有連結的代表對話還在進行、
      或報告排版失敗需要人工查看（Telegram 系統回報那組頻道會有錯誤通知）。
    </div>
    <div class="cnt" id="cnt"></div>
    <table>
      <thead><tr>
        <th>姓名</th><th>現職</th><th>產業</th><th>狀態</th><th>三個關鍵數字</th>
        <th>報告</th><th>建立時間</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="mut">載入中⋯</td></tr></tbody>
    </table>
  </main>
</div>
<div id="msg" class="mut" style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%)"></div>

<script>
var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY = 's1ne_admin_tok';
var tok = localStorage.getItem(KEY) || '';
var $ = function (i) { return document.getElementById(i); };

function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

function api(path) {
  return fetch(API + path, { headers: { authorization: 'Bearer ' + tok } }).then(function (r) { return r.json(); });
}

var STATE_PILL = {
  new: '<span class="pill new">剛送出，還沒開始對談</span>',
  talking: '<span class="pill talking">對談中／待人工查看</span>',
  reported: '<span class="pill reported">報告已產出</span>',
};

function row(c) {
  var pill = STATE_PILL[c.status] || '<span class="pill new">' + esc(c.status || '未知') + '</span>';
  // 報告排版失敗時 status 會停在 talking，但 report_at 是空的——跟「還在聊」區分不出來，
  // 用 chat_state 補一個提示：對話已經結束（done）但沒有報告，就是卡住了。
  if (c.status === 'talking' && c.chat_state === 'done' && !c.report_at) {
    pill = '<span class="pill fail">對話已結束但報告沒產出，需人工查看</span>';
  }
  var nums = ['led_headcount', 'budget_scale', 'crowdfunding_raised']
    .map(function (k) {
      var v = c[k];
      var label = { led_headcount: '帶人', budget_scale: '預算', crowdfunding_raised: '募資' }[k];
      return '<div><b>' + label + '：</b>' + (v ? esc(v) : '—') + '</div>';
    }).join('');
  var rpt = (c.report_at && c.chat_token)
    ? '<a class="rpt" target="_blank" rel="noopener" href="' + API + '/checkup-chat/' + esc(c.chat_token) + '/report">查看報告 →</a>'
    : '<span class="mut">—</span>';
  return '<tr>'
    + '<td>' + esc(c.name) + '</td>'
    + '<td>' + (c.current_title ? esc(c.current_title) : '<span class="mut">—</span>') + '</td>'
    + '<td>' + (c.current_industry ? esc(c.current_industry) : '<span class="mut">—</span>') + '</td>'
    + '<td>' + pill + '</td>'
    + '<td class="nums">' + nums + '</td>'
    + '<td>' + rpt + '</td>'
    + '<td>' + esc(c.created_at || '') + '</td>'
    + '</tr>';
}

function load() {
  api('/admin/checkups').then(function (d) {
    if (!d.ok) { localStorage.removeItem(KEY); return boot(); }
    $('gate').hidden = true; $('app').hidden = false;
    var rows = d.rows || [];
    $('cnt').textContent = rows.length + ' 筆';
    $('rows').innerHTML = rows.map(row).join('')
      || '<tr><td colspan="7" class="mut" style="text-align:center;padding:26px">還沒有人送出過健檢申請</td></tr>';
  }).catch(function () { $('rows').innerHTML = '<tr><td colspan="7" class="mut">讀取失敗</td></tr>'; });
}
function boot() {
  if (tok) return load();
  $('gate').hidden = false;
  $('enter').onclick = function () {
    tok = $('tok').value.trim();
    if (!tok) return;
    api('/admin/checkups').then(function (d) {
      if (!d.ok) { $('gerr').hidden = false; $('gerr').textContent = '權杖不正確'; return; }
      localStorage.setItem(KEY, tok); load();
    });
  };
  $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
}
boot();
</script>
</html>
