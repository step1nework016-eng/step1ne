<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>阿財準不準｜顧問後台</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#8a6100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.gate input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px}
.mut{color:var(--ink3);font-size:13px}
main{padding:22px 0 60px}
.note{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.7}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.k b{display:block;font-size:24px;line-height:1.3}
.k span{color:var(--ink3);font-size:12.5px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.c .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c .nm{font-weight:700;font-size:15px}
.c .hl{font-size:13px;color:var(--ink2)}
.c .meta{font-size:12.5px;color:var(--ink3);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.d{color:var(--bad);border-color:#f0d4cf}
.done{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 11px}
a.lk{color:var(--gold);text-decoration:none;font-size:12.5px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--ink3)}
.old{color:var(--warn);font-weight:600}
</style>

<div id="gate" class="gate" hidden>
  <b>顧問後台</b>
  <p class="mut" style="margin:6px 0 0">需要存取權杖。這組權杖等同密碼，不要外傳。</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="enter" type="button">進入</button>
  <p id="gerr" class="mut" style="color:#b4552e;margin:12px 0 0" hidden></p>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="/assets/step1ne-logo.png" alt="Step1ne"><b>阿財準不準</b>
    <nav>
      <a href="/consultant/overview/">總覽</a>
      <a href="/consultant/reports/">初篩報告</a>
      <a href="/consultant/kpi/" class="on">阿財準不準</a>
      <a href="/consultant/sourced/">人才池</a>
    </nav>
  </div></header>
  <main class="wrap">
    <div class="note">
      每一位談完的人，你自己會不會推給用人單位？<b>回填這一題，才算得出阿財準不準。</b><br>
      以前只有報告推到 Telegram 的當下那三個按鈕能按，訊息被蓋掉就沒有第二次機會——
      所以這裡把<b>所有談完的人</b>都列出來，隨時可以補。<br>
      ⚠️ 只問你的判斷、不問原因：多問一個欄位就會少一半的人願意按。
    </div>
    <div class="kpi" id="kpi"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list" class="mut">載入中…</div>
  </main>
</div>

<script>
var API='https://step1ne-recruit-api.aiagentg888.workers.dev';
var KEY='s1ne_admin_tok';
var tok=localStorage.getItem(KEY)||'';
var $=function(i){return document.getElementById(i)};
var ST='pending', DATA=null;
function api(p,o){o=o||{};o.headers=Object.assign({authorization:'Bearer '+tok},o.headers||{});
  return fetch(API+p,o).then(function(r){return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
  var s=DATA.stats||{}, rows=DATA.rows||[];
  // 樣本不到 5 筆就不顯示百分比。
  // 一個樣本的 100% 不是統計，是誤導——那個數字會被拿去跟客戶說「AI 沒把人看錯」。
  var rateHtml = s.rate==null
    ? '<b style="font-size:17px;color:#8a6100">還不能算</b><span>回填滿 5 位才會顯示準確率（目前 '+(s.done||0)+' 位）</span>'
    : '<b>'+s.rate+'%</b><span>阿財判值得轉、你實際會推</span>';
  $('kpi').innerHTML =
     '<div class="k">'+rateHtml+'</div>'
    +'<div class="k"><b>'+(s.done||0)+'</b><span>已回填</span></div>'
    +'<div class="k"><b>'+(s.pending||0)+'</b><span>還沒回填</span></div>'
    +'<div class="k"><b>'+(s.total||0)+'</b><span>談完總數</span></div>';

  $('tabs').innerHTML=[['pending','還沒回填 '+(s.pending||0)],['done','已回填 '+(s.done||0)],['all','全部 '+(s.total||0)]]
    .map(function(k){return '<button class="tab'+(k[0]===ST?' on':'')+'" data-s="'+k[0]+'">'+k[1]+'</button>'}).join('');

  var show=rows.filter(function(r){
    return ST==='all' || (ST==='pending' ? !r.consultant_call : !!r.consultant_call);
  });
  if(!show.length){$('list').innerHTML='<div class="empty">'
    +(ST==='pending'?'全部都回填完了 👍':'這一區還沒有資料')+'</div>';return}
  $('list').innerHTML=show.map(function(r){
    var days=r.days!=null?r.days:'';
    var old = (r.days>=7 && !r.consultant_call) ? ' <span class="old">放了 '+days+' 天</span>' : '';
    return '<div class="c"><div class="top">'
      +'<span class="nm">'+esc(r.name||'（無姓名）')+'</span>'
      +'<span class="hl">'+esc(r.job_title||r.job_slug||'')+'</span>'
      +(r.consultant_call?'<span class="done">'+esc(r.consultant_call)+'</span>':'')+'</div>'
      +'<div class="meta">報告 '+esc((r.report_at||'').slice(0,10))+'　·　'
      +'<a class="lk" href="/consultant/reports/?id='+encodeURIComponent(r.id)+'">看報告</a>'+old+'</div>'
      +'<div class="acts">'
      +['會推','再看看','不推'].map(function(v){
          var on=r.consultant_call===v;
          return '<button class="btn'+(v==='會推'?' p':'')+(v==='不推'?' d':'')+'"'
            +(on?' disabled style="opacity:.45"':'')
            +' onclick="setv(\''+r.id+'\',\''+v+'\')">'+v+'</button>';
        }).join('')
      +'</div></div>';
  }).join('');
}
function setv(id,v){
  api('/admin/kpi/set',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({id:id,verdict:v})}).then(function(d){
      if(!d.ok){alert(d.error||'更新失敗');return} load();
    });
}
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return; ST=b.dataset.s; render();
});
function load(){
  $('gate').hidden=true;$('app').hidden=false;
  api('/admin/kpi/pending').then(function(d){
    if(!d.ok){$('list').innerHTML='<div class="mut">讀取失敗</div>';return}
    DATA=d; render();
  }).catch(function(){$('list').innerHTML='<div class="mut">連線失敗</div>'});
}
function boot(){
  if(tok)return load();
  $('gate').hidden=false;
  $('enter').onclick=function(){
    tok=$('tok').value.trim(); if(!tok)return;
    api('/admin/kpi/pending').then(function(d){
      if(!d.ok){$('gerr').hidden=false;$('gerr').textContent='權杖不正確';return}
      localStorage.setItem(KEY,tok);load();
    });
  };
  $('tok').addEventListener('keydown',function(e){if(e.key==='Enter')$('enter').click()});
}
boot();
</script>
<script defer src="/consultant/_shell.js"></script>
</html>
