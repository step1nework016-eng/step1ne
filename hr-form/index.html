<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>人事資料表</title>
<style>
:root{--navy:#1E3A5F;--blue:#2563EB;--ink2:#0D2673;--green:#15803D;--amber:#B45309;--red:#B91C1C;--bg:#F8FAFC;--ink:#0F172A;--muted:#475569;--line:#CBD5E1;--soft:#E9EEF5}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:#fff}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}header .r{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:10px;min-height:48px}header b{font-weight:500}
header button{background:none;border:0;color:#fff;font:inherit;font-size:14px;min-height:44px;padding:0 4px;text-decoration:underline;cursor:pointer}
.bar{height:4px;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%;background:#4ADE80}
main{flex:1;padding:16px}.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--soft);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
h1{font-size:20px;margin:0 0 6px;color:var(--navy)}h2{font-size:16px;margin:22px 0 8px;color:var(--navy)}p{margin:6px 0}.muted{color:var(--muted);font-size:14px}
.btn{flex:1;min-height:48px;border-radius:10px;border:0;background:var(--blue);color:#fff;font:500 16px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;cursor:pointer;padding:8px 12px}.btn.g{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ok{background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:14px;min-height:44px;padding:0;text-decoration:underline;cursor:pointer;text-align:left}
.f{margin-bottom:16px}label.t,.t{display:block;font-weight:500;font-size:15px;margin-bottom:4px}.t em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
input[type=text],input[type=tel],input[type=email],input[type=date],input.code{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:16px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink2);background:#fff}
input.bad{border-color:var(--red);background:#FEF2F2}.hint{font-size:13px;color:var(--muted);margin-top:3px}.warn{font-size:13px;color:var(--amber);margin-top:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:15px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);cursor:pointer}.opt[aria-pressed=true]{background:#EFF6FF;border-color:var(--blue);color:var(--blue);font-weight:500}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}.chk input{width:22px;height:22px;flex:none}
details{border:1px solid var(--soft);border-radius:10px;padding:0 12px;margin-bottom:10px}summary{min-height:44px;display:flex;align-items:center;font-weight:500;color:var(--navy);cursor:pointer}details[open]{padding-bottom:6px}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}.box.a{background:#FFF7ED;border:1px solid #FDBA74}.box.g{background:#F0FDF4;border:1px solid #86EFAC}.box.b{background:var(--soft)}
.consent{font-size:13.5px;line-height:1.7;background:var(--bg);border:1px solid var(--soft);border-radius:10px;padding:12px;max-height:46vh;overflow:auto;white-space:pre-wrap}
.saved{font-size:13px;color:#BBF7D0}.list button{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:48px;background:#fff;border:0;border-bottom:1px solid var(--soft);font:15px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;text-align:left;padding:8px 2px;cursor:pointer;color:var(--ink)}.list .no{color:var(--red);font-size:13px;flex:none}.list .yes{color:var(--green);font-size:13px;flex:none}
canvas.pg{width:100%;display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff}
.tabs{display:flex;gap:6px;margin:8px 0 14px}.tabs button{flex:1;min-height:46px;border:1px solid var(--line);border-radius:8px;background:#fff;font:15px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;cursor:pointer;color:var(--ink)}.tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
.sig{position:relative;border:1.5px dashed var(--line);border-radius:10px;height:190px;background:#fff}.sig canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:10px}.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:#94A3B8;pointer-events:none}
.photo{display:flex;gap:12px;align-items:center}.photo img{width:88px;height:112px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
input.mask{-webkit-text-security:disc}.tag{display:inline-block;font-size:12px;font-weight:500;border-radius:99px;padding:0 8px;margin-left:6px;background:#FFEDD5;color:#9A3412}.sec{border:1px solid var(--soft);border-radius:10px;padding:12px;margin-bottom:12px}.sec h2{margin:0 0 10px}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft);font-size:14px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app" id="app"><main><p class="muted">載入中…</p></main></div>
<script src="/hr-form/pdf.min.js"></script>
<script src="/hr-form/app.js"></script></body></html>
