<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-DNPMMRDEC0');
// 全站唯一的 CTA 是 LINE 連結，把點擊送成事件才知道哪一頁真的帶得到人。
// 用事件委派掛在 document 上，之後新增頁面或改版都不用再動這段。
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href*="lin.ee"]');
  if (!a) return;
  gtag('event', 'line_cta_click', {
    page_path: location.pathname,
    link_text: (a.textContent || '').trim().slice(0, 60)
  });
});
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選擇面談時段｜Step1ne 德仁管理顧問</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--bg:#ffffff;--line:#dfe4ec;--tx:#16202e;--tx2:#4d5c72;--tx3:#7c8899;
      --ac:#2f5fd8;--soft:#f6f8fb;--sans:-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.7}
.top{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{height:34px;width:auto;display:block}
.top .brand{font-size:13px;color:var(--tx3)}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 64px}
h1{font-size:23px;margin:0 0 6px}
.lead{color:var(--tx2);font-size:13.5px;margin:0 0 20px}
.sect{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;
     padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
     cursor:pointer;background:#fff}
.opt:hover{border-color:var(--ac)}
.opt.on{border-color:var(--ac);background:#f3f7ff}
.opt .when{font-weight:700;font-size:15px}
.opt .fmt{font-size:12.5px;color:var(--tx3);margin-top:3px}
.opt .pick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on .pick{border-color:var(--ac);background:var(--ac);
  box-shadow:inset 0 0 0 3px #fff}
.go{display:block;width:100%;text-align:center;background:var(--ac);color:#fff;text-decoration:none;
    padding:15px;border-radius:10px;font-size:16px;font-weight:600;margin-top:16px;border:0;
    cursor:pointer;font-family:inherit}
.go:disabled{background:#c3cede;cursor:default}
.msg{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:13.5px;display:none;line-height:1.6}
.msg.err{display:block;background:#fdecea;border:1px solid #f3c2bc;color:#a5312a}
.note{background:var(--soft);border:1px solid var(--line);border-radius:9px;
      padding:12px 14px;font-size:11.5px;color:var(--tx2);line-height:1.65;margin-top:14px}
</style>

<div class="top">
  <img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問">
  <span class="brand">德仁管理顧問</span>
</div>
<div class="wrap"><div id="app">載入中…</div></div>

<script>
const API = 'https://step1ne-public-worker.aiagentg888.workers.dev';
const T = new URLSearchParams(location.search).get('t') || '';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// ⚠️ 2026-08-14 修：星期幾原本用 new Date(d+'T00:00:00+08:00').getUTCDay() 算，
// 會先換算成 UTC 再讀，凌晨跨日就少算一天，永遠差一天（真實案例：2026-08-16
// 明明是週日，畫面卻顯示週六）。改成直接把年月日拆成整數用 Date.UTC() 建構。
const W=['日','一','二','三','四','五','六'];
function weekdayLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  return W[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
}
function fmtWhen(s){
  // slot_at 格式 'YYYY-MM-DD HH:MM'
  const [d,t]=s.split(' ');
  return d+`（週${weekdayLabel(d)}） ${t||''}`;
}

let picked = null;

async function boot(){
  const app = document.getElementById('app');
  if(!T || T.length < 20){ app.innerHTML='<h1>連結無效</h1><p class="lead">請用顧問寄給您的連結進入。</p>'; return; }
  let info;
  try{
    info = await (await fetch(API+'/appointment/'+encodeURIComponent(T))).json();
  }catch{ app.innerHTML='<h1>連線失敗</h1><p class="lead">請稍後再試一次。</p>'; return; }
  if(!info.ok){ app.innerHTML='<h1>連結無效</h1><p class="lead">'+esc(info.error||'')+'</p>'; return; }

  if(info.status === 'confirmed'){
    // 視訊連結存在原本的 slots 裡（每個時段各自的），已確認的話要從裡面撈出對應那筆
    const confirmedSlot = (info.slots||[]).find(s => s.slot_at === info.confirmed_slot);
    const mu = confirmedSlot && confirmedSlot.meeting_url;
    app.innerHTML = `
      <h1>面談時間已確認</h1>
      <p class="lead">${esc(info.name||'')} 您好，您的面談時間如下：</p>
      <div class="sect"><b>${esc(fmtWhen(info.confirmed_slot))}</b>
        ${mu ? `<div class="fmt" style="margin-top:8px"><a href="${esc(mu)}" target="_blank" rel="noopener">📹 點此加入視訊面談</a></div>` : ''}</div>
      <div class="note">如需調整，請直接聯繫您的顧問。</div>`;
    return;
  }

  app.innerHTML = `
    <h1>選擇面談時段</h1>
    <p class="lead">${esc(info.name||'')} 您好，您應徵的「${esc(info.job_title||'')}」顧問已經安排好面談，
      請選一個方便的時段：</p>
    ${info.note ? `<div class="note">${esc(info.note)}</div>` : ''}
    <div class="sect"><div id="optbox"></div></div>
    <button class="go" id="submitbtn" disabled>確認這個時段</button>
    <div class="msg" id="bmsg"></div>`;
  renderOptions(info.slots || []);
  document.getElementById('submitbtn').addEventListener('click', submit);
}

function renderOptions(slots){
  const box = document.getElementById('optbox');
  if(!slots.length){ box.innerHTML='<p class="lead">目前沒有可選的時段，請直接聯繫顧問。</p>'; return; }
  box.innerHTML = slots.map((s,i)=>`
    <div class="opt" data-i="${i}" onclick="selectOpt(${i})">
      <div>
        <div class="when">${esc(fmtWhen(s.slot_at))}</div>
        ${s.format ? `<div class="fmt">${esc(s.format)}${s.meeting_url ? '　📹 視訊連結（選定後提供）' : ''}</div>` : ''}
      </div>
      <div class="pick"></div>
    </div>`).join('');
  window.__slots = slots;
}

function selectOpt(i){
  picked = window.__slots[i];
  document.querySelectorAll('.opt').forEach((el,idx)=>el.classList.toggle('on', idx===i));
  document.getElementById('submitbtn').disabled = false;
}

async function submit(){
  if(!picked) return;
  const btn = document.getElementById('submitbtn');
  btn.disabled = true; btn.textContent = '送出中…';
  const msg = document.getElementById('bmsg'); msg.className='msg';
  let r;
  try{
    r = await (await fetch(API+'/appointment/'+encodeURIComponent(T)+'/confirm',{
      method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({slot_at: picked.slot_at})
    })).json();
  }catch{
    msg.className='msg err'; msg.textContent='送出失敗，請再試一次。';
    btn.disabled=false; btn.textContent='確認這個時段'; return;
  }
  if(!r.ok){
    msg.className='msg err'; msg.textContent=r.error||'送出失敗';
    btn.disabled=false; btn.textContent='確認這個時段'; return;
  }
  // 額外多告訴 GA4 一次「預約面談成功」，不影響上面已經存進資料庫的邏輯。
  try{
    gtag('event', 'appointment_submit', { form_name: 'appointment', slot_at: picked.slot_at });
  }catch(e){ /* GA4 掛了也不能擋住預約流程 */ }
  document.getElementById('app').innerHTML = `
    <h1>已確認！</h1>
    <p class="lead">面談時間：<b>${esc(fmtWhen(picked.slot_at))}</b></p>
    ${picked.meeting_url ? `<div class="sect"><a href="${esc(picked.meeting_url)}" target="_blank" rel="noopener">📹 點此加入視訊面談</a></div>` : ''}
    <div class="note">顧問已經收到通知，會再跟您確認細節。</div>`;
}
boot();
</script>
