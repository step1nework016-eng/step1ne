<!--
  補交履歷（2026-10-12）
  面談室入口（public worker /chat/:token）遇到「還沒收到履歷」會擋下，給兩條路：用 LINE 傳，或來這頁補。
  Jacky 硬規則：阿財開始面談前一定要有履歷（或履歷資訊）。網址 /resume/?t=<chat_token>，token 就是憑證。
  後端：GET/POST /apply/resume/:token（step1ne-public-worker）。履歷三條路的畫面共用 /assets/resume-step.js。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>補上履歷｜Step1ne 德仁管理顧問</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#dfe4ec;--tx:#16202e;--tx2:#4d5c72;--tx3:#7c8899;
      --ac:#2f5fd8;--rd:#c0392b;--soft:#f6f8fb;
      --sans:-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.7;-webkit-text-size-adjust:100%}
.top{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{height:34px;width:auto;display:block}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 64px}
h1{font-size:22px;margin:0 0 6px}
.lead{color:var(--tx2);font-size:14px;margin:0 0 20px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  color:var(--tx);font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,95,216,.15)}
.go{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:18px;border:0;border-radius:12px;
  background:var(--ac);color:#fff;font:inherit;font-size:16.5px;font-weight:700;text-decoration:none;cursor:pointer}
.go:disabled{opacity:.6}
.go:focus-visible{outline:3px solid #16202e;outline-offset:2px}
.msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;background:#fdecea;border:1px solid #f3c2bc;color:#a5312a}
.ok{background:#eef8f2;border:1px solid #cfe9da;color:#1e7a4f;border-radius:12px;padding:14px 16px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top"><a href="/"><img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問"></a></header>
<main class="wrap">
  <h1>補上履歷，就能開始面談</h1>
  <p class="lead" id="lead">讀取中⋯</p>
  <div id="area" hidden>
    <div id="resumeStep"></div>
    <button type="button" class="go" id="send">送出履歷</button>
    <div class="msg" id="msg" role="alert" hidden></div>
  </div>
  <div id="done" hidden>
    <p class="ok" id="doneText">履歷收到了。</p>
    <a class="go" id="enter" href="#">進入面談</a>
  </div>
</main>

<script src="/assets/resume-step.js"></script>
<script>
const API = 'https://step1ne-public-worker.aiagentg888.workers.dev';
const T = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
function ga(n, p) { try { gtag('event', n, Object.assign({ page_path: location.pathname }, p || {})); } catch (e) {} }
const enterUrl = '/interview/?t=' + encodeURIComponent(T);
$('enter').href = enterUrl;

function showDone(text) {
  $('area').hidden = true;
  $('doneText').textContent = text;
  $('done').hidden = false;
  $('enter').focus();
}

let RS = null;
async function boot() {
  if (T.length < 32) { $('lead').textContent = '連結不完整，請從面談頁或信裡的連結進來。'; return; }
  let d;
  try { d = await (await fetch(API + '/apply/resume/' + encodeURIComponent(T))).json(); }
  catch (e) { $('lead').textContent = '網路連線不穩，請確認網路後重新整理。'; return; }
  if (!d.ok) { $('lead').textContent = d.error || '找不到這筆應徵，連結可能已失效。'; return; }
  $('lead').textContent = (d.job_title ? '應徵職缺：' + d.job_title + '。' : '') +
    'AI 阿財會先讀過履歷再開始面談，選一種方式交就好。';
  if (d.has_resume) { showDone('履歷已經收到了，可以開始面談。'); return; }
  $('area').hidden = false;
  RS = S1Resume.mount($('resumeStep'), {
    api: API, track: ga,
    onChange: () => {
      const st = RS && RS.getState();
      $('send').hidden = !!(st && st.method === 'line');   // LINE 那條不用按送出，收到就會自動變成可以進面談
      if (st && st.received) showDone('已經收到你從 LINE 傳來的履歷了，可以開始面談。');
    },
  });
  // 這筆應徵專屬的 LINE 代碼（後端已經接好），按「我用 LINE 傳」就用這組
  RS.setState({ code: d.code, line_url: d.line_url });
}

$('send').addEventListener('click', async () => {
  const msg = $('msg'); msg.hidden = true;
  const v = RS.validate();
  if (!v.ok) { msg.textContent = v.message; msg.hidden = false; RS.focusError(v); ga('apply_blocked', { field: 'fix_' + v.field }); return; }
  const btn = $('send'); btn.disabled = true; btn.textContent = '送出中⋯';
  try {
    const body = await RS.payload();
    const r = await fetch(API + '/apply/resume/' + encodeURIComponent(T), {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!d.ok) throw Object.assign(new Error(d.error || '送出失敗'), { server: true });
    ga('resume_fix_done', { method: RS.method() });
    showDone('履歷收到了，可以開始面談。');
  } catch (e) {
    msg.textContent = e.server ? e.message : '網路連線不穩，請確認網路後再按一次。';
    msg.hidden = false;
    btn.disabled = false; btn.textContent = '送出履歷';
  }
});
boot();
</script>
