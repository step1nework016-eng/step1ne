<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資安對打">
<title>資安紅藍對打（測試版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* 2026-10-08 資安紅藍隊儀表板（要權杖，跟顧問後台同一組）。
   Token：戰場深藍 #0E1430、面板 #1A2246、紅隊 #FF4D5E、藍隊 #3DA5FF、修好金 #FFD166、文字 #EAF0FF。
   Signature：中間的「防禦值」盾牌圓環，紅藍兩邊分數對峙。 */
:root{--bg:#0E1430;--panel:#1A2246;--line:rgba(255,255,255,.1);--red:#FF4D5E;--blue:#3DA5FF;--gold:#FFD166;--ink:#EAF0FF;--dim:#9AA6CF;
  --num:'Nunito',system-ui,sans-serif;--cjk:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(90% 60% at 0% 0%,rgba(255,77,94,.16),transparent 60%),radial-gradient(90% 60% at 100% 0%,rgba(61,165,255,.18),transparent 60%),var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--cjk);min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.5px}
header .wk{font-family:var(--num);font-weight:900;color:var(--dim);font-size:13px}
.refresh{min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:0 14px;font-size:13px;font-weight:700}

/* 對峙列 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.team{border-radius:22px;padding:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.team.r{box-shadow:inset 0 0 0 2px rgba(255,77,94,.35)}
.team.b{box-shadow:inset 0 0 0 2px rgba(61,165,255,.35);text-align:right}
.team .who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.team.b .who{justify-content:flex-end}
.team .who svg{width:24px;height:24px}
.team .pts{font-family:var(--num);font-weight:900;font-size:44px;line-height:1}
.team.r .pts{color:var(--red)}.team.b .pts{color:var(--blue)}
.team .sub{font-size:12.5px;color:var(--dim);line-height:1.5}
.shield{width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.shield svg{width:130px;height:130px}
.shield .lbl{font-size:12px;color:var(--dim);font-weight:700}
.vsb{font-family:var(--num);font-weight:900;font-size:13px;color:var(--gold);letter-spacing:2px}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--num);font-weight:900;font-size:26px}
.stat span{font-size:12.5px;color:var(--dim)}

/* 戰況欄 */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{background:rgba(26,34,70,.6);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:120px}
.col h2{margin:2px 4px 10px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
.col h2 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.col h2 em{font-style:normal;font-family:var(--num);margin-left:auto;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.card .t{font-weight:900;font-size:15px;line-height:1.35}
.card .a{font-size:12px;color:var(--dim)}
.card .p{font-size:13px;line-height:1.55;color:#C9D2F2}
.card .fx{font-size:12.5px;line-height:1.5;color:var(--gold)}
.sev{align-self:flex-start;font-size:11.5px;font-weight:900;border-radius:7px;padding:2px 8px}
.sev.high{background:rgba(255,77,94,.2);color:#FF8A96}.sev.medium{background:rgba(255,209,102,.18);color:var(--gold)}
.sev.low{background:rgba(61,165,255,.18);color:#8FCBFF}.sev.unknown{background:rgba(255,255,255,.1);color:var(--dim)}
.empty{font-size:13px;color:var(--dim);padding:10px 4px}

/* 戰報 */
.log{margin-top:14px;background:rgba(26,34,70,.6);border:1px solid var(--line);border-radius:20px;padding:14px}
.log h2{margin:0 0 10px;font-size:14px;font-weight:900}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.ev:first-of-type{border-top:0}
.ev .dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.ev .dot svg{width:15px;height:15px}
.ev.red .dot{background:rgba(255,77,94,.2)}.ev.blue .dot{background:rgba(61,165,255,.2)}
.ev time{flex:none;font-family:var(--num);font-weight:800;font-size:12px;color:var(--dim);width:82px;padding-top:4px}

/* 登入 */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(80px,calc(env(safe-area-inset-top) + 56px)) 24px 24px;text-align:center}
.login h2{margin:0;font-size:22px;font-weight:900}
.login p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
.login input{width:100%;max-width:320px;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:#fff;font-size:16px;text-align:center}
.login input:focus{outline:none;border-color:var(--gold)}
.login button{width:100%;max-width:320px;min-height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#FF4D5E,#3DA5FF);color:#fff;font-size:17px;font-weight:900}
.login .err{color:#FF8A96;font-weight:700;font-size:13.5px}

@media (max-width:760px){
  .vs{grid-template-columns:1fr 1fr}.shield{grid-column:1/-1;order:-1;width:auto}
  .team .pts{font-size:36px}
  .board{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ring{transition:stroke-dashoffset 1s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1>資安紅藍對打</h1><div class="wk" id="wk">—</div></div><button class="refresh" id="bRef" type="button">重新整理</button></header>
  <section class="vs" aria-label="對戰分數">
    <div class="team r"><div class="who"><svg viewBox="0 0 24 24" fill="none" stroke="#FF4D5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>紅隊・AI 駭客</div><div class="pts" id="rp">0</div><div class="sub">找到漏洞得分<br>高 30・中 15・低 5</div></div>
    <div class="shield"><div class="vsb">VS</div>
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/><circle class="ring" id="ring" cx="60" cy="60" r="50" fill="none" stroke="#FFD166" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)"/><path d="M60 36l18 7v13c0 12-8 20-18 24-10-4-18-12-18-24V43z" fill="rgba(255,209,102,.15)" stroke="#FFD166" stroke-width="2.4" stroke-linejoin="round"/><text id="dv" x="60" y="66" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="18" fill="#FFD166">0</text></svg>
      <div class="lbl">防禦值（滿分 100）</div></div>
    <div class="team b"><div class="who">藍隊・AI 修補員<svg viewBox="0 0 24 24" fill="none" stroke="#3DA5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="pts" id="bp">0</div><div class="sub">修好、且紅隊複測通過才得分</div></div>
  </section>
  <section class="stats"><div class="stat"><b id="sOpen" style="color:#FF8A96">0</b><span>還開著的漏洞</span></div><div class="stat"><b id="sFix" style="color:#8FCBFF">0</b><span>修補中</span></div><div class="stat"><b id="sDone" style="color:#FFD166">0</b><span>已修好（複測通過）</span></div></section>
  <section class="board" id="board" aria-label="戰況"></section>
  <section class="log"><h2>戰報</h2><div id="log"></div></section>
</div>
<script>
const API='https://step1ne-backoffice-worker.aiagentg888.workers.dev';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let TOKEN=ls.get('s1ne_admin_tok')||'';
const SEV={high:'高風險',medium:'中風險',low:'低風險',unknown:'待確認'};
const COLS=[['open','還開著','#FF4D5E'],['fixing','修補中','#3DA5FF'],['verified','已修好','#FFD166']];
const IC={found:'<svg viewBox="0 0 24 24" fill="none" stroke="#FF4D5E" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>',
  fixed:'<svg viewBox="0 0 24 24" fill="none" stroke="#3DA5FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l4 4-9 9H5v-4z"/></svg>',
  verified:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD166" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'};
function week(){const d=new Date(),y=new Date(Date.UTC(d.getFullYear(),0,1));const w=Math.ceil(((d-y)/864e5+y.getUTCDay()+1)/7);return `${d.getFullYear()} 第 ${w} 週`}
async function load(){
  try{
    const r=await fetch(API+'/admin/sec/board',{headers:{Authorization:'Bearer '+TOKEN}});
    if(r.status===401)return login();
    const d=await r.json();if(!d.ok)throw 0;
    $('#wk').textContent=week();
    $('#rp').textContent=d.score.red;$('#bp').textContent=d.score.blue;$('#dv').textContent=d.score.defense;
    $('#ring').style.strokeDashoffset=314*(1-d.score.defense/100);
    const st=s=>d.findings.filter(f=>(s==='open'?!['fixing','verified','wontfix'].includes(f.status):f.status===s));
    $('#sOpen').textContent=st('open').length;$('#sFix').textContent=st('fixing').length;$('#sDone').textContent=st('verified').length;
    $('#board').innerHTML=COLS.map(([k,n,c])=>{const a=st(k);return `<div class="col"><h2><i style="background:${c}"></i>${n}<em>${a.length}</em></h2>${a.length?a.map(f=>`<article class="card"><span class="sev ${esc(f.severity)}">${SEV[f.severity]||'待確認'}</span><div class="t">${esc(f.title)}</div><div class="a">${esc(f.area||'')}・${esc((f.found_at||'').slice(5,16))} 發現</div><div class="p">${esc(f.plain||'')}</div>${f.fix_note?`<div class="fx">${k==='verified'?'修法：':'處理：'}${esc(f.fix_note)}</div>`:''}</article>`).join(''):'<div class="empty">目前沒有</div>'}</div>`}).join('');
    $('#log').innerHTML=d.events.length?d.events.map(e=>`<div class="ev ${e.team==='blue'?'blue':'red'}"><time>${esc((e.created_at||'').slice(5,16))}</time><div class="dot">${IC[e.kind]||IC.found}</div><div>${e.team==='blue'?'<b style="color:#8FCBFF">藍隊</b>':'<b style="color:#FF8A96">紅隊</b>'}　${esc(e.text)}</div></div>`).join(''):'<div class="empty">還沒有戰報</div>';
  }catch(e){$('#board').innerHTML='<div class="empty">連不上，稍後再試</div>'}
}
function login(msg){
  const o=$('#lg');if(o)o.remove();
  document.body.insertAdjacentHTML('beforeend',`<form class="login" id="lg"><h2>輸入登入權杖</h2><p>跟顧問後台同一組權杖，輸入一次就會記住。</p><input id="ti" type="password" autocapitalize="off" spellcheck="false" placeholder="貼上權杖" aria-label="登入權杖">${msg?`<div class="err">${esc(msg)}</div>`:''}<button type="submit">進入戰場</button></form>`);
  $('#lg').onsubmit=async e=>{e.preventDefault();const v=$('#ti').value.trim();if(!v)return;TOKEN=v;
    const r=await fetch(API+'/admin/sec/board',{headers:{Authorization:'Bearer '+v}}).catch(()=>null);
    if(r&&r.ok){ls.set('s1ne_admin_tok',v);$('#lg').remove();load()}else{TOKEN='';login('權杖不對，請再確認一次')}};
}
$('#bRef').onclick=load;
TOKEN?load():login();
</script>
</body>
</html>
