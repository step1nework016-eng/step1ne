<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:#23262d;background:#f4f1ea;-webkit-font-smoothing:antialiased;line-height:1.8;}
a{color:#a67c3d;text-decoration:none;}
.wrap{max-width:640px;margin:0 auto;padding:0 24px;}
@media (max-width:760px){
  .s1ne-hide-m{display:none !important;}
}
</style>

<body>

<header style="background:rgba(244,241,234,0.9);border-bottom:1px solid #e6dfd1;">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px;max-width:1180px;">
    <a href="/" style="display:flex;align-items:center;gap:12px;">
      <img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問" style="height:38px;width:auto;">
    </a>
    <a href="/commission-recruiting/" class="s1ne-hide-m" style="color:#4a4d55;font-size:14.5px;">企業委託招募服務 →</a>
  </div>
</header>

<main>
  <div class="wrap" style="padding:56px 24px;">
    <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;color:#a67c3d;text-transform:uppercase;margin-bottom:16px;text-align:center;">Free Tool</div>
    <h1 style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.4;margin:0 0 16px;color:#1c1f26;text-align:center;">
      這個職位，該用哪一種招募形式？
    </h1>
    <p style="font-size:16px;color:#55585f;text-align:center;max-width:480px;margin:0 auto 36px;">
      正職代招、中高階獵才、還是人力派遣？留下 Email，我們立即寄送「招募形式快速評估工具」連結——
      填職稱與薪資、回答 3 個問題，<strong style="color:#1c1f26;">1 分鐘</strong>拿到建議結果，可直接列印或另存 PDF。
    </p>

    <div style="background:#fff;border:1px solid #e6dfd1;border-radius:20px;padding:36px 32px;box-shadow:0 10px 30px rgba(40,35,25,0.06);">
      <form id="leadForm">
        <label for="email" style="display:block;font-size:13.5px;font-weight:700;color:#4a4d55;margin-bottom:6px;">您的 Email <span style="color:#a67c3d;">*</span></label>
        <input id="email" name="email" type="email" required placeholder="hr@yourcompany.com"
          style="width:100%;font:inherit;font-size:15px;padding:13px 15px;border:1px solid #d9d2c4;border-radius:10px;margin-bottom:16px;">

        <label for="company" style="display:block;font-size:13.5px;font-weight:700;color:#4a4d55;margin-bottom:6px;">公司名稱（選填）</label>
        <input id="company" name="company" type="text" placeholder="方便我們的顧問稱呼您"
          style="width:100%;font:inherit;font-size:15px;padding:13px 15px;border:1px solid #d9d2c4;border-radius:10px;margin-bottom:22px;">

        <button type="submit" id="submitBtn" style="width:100%;font:inherit;font-weight:700;font-size:16px;background:#173b63;color:#fff;border:0;border-radius:999px;padding:15px;cursor:pointer;">
          立即寄送評估工具連結 →
        </button>
        <p id="formMsg" style="margin:14px 0 0;font-size:13.5px;text-align:center;min-height:1.4em;"></p>
      </form>
      <div id="doneState" hidden style="text-align:center;padding:12px 0;">
        <div style="font-size:40px;margin-bottom:12px;">✓</div>
        <p style="font-size:16px;font-weight:700;color:#1c1f26;margin:0 0 6px;">已寄出，請查收信箱</p>
        <p style="font-size:14px;color:#8a8d95;margin:0;">找不到信件的話，麻煩看一下垃圾郵件匣。</p>
      </div>
    </div>

    <p style="font-size:12.5px;color:#9a9da5;text-align:center;margin:20px 0 0;">
      您的 Email 僅用於寄送評估工具連結與後續聯繫，不會轉作其他用途。
    </p>
  </div>
</main>

<footer style="border-top:1px solid #e6dfd1;background:#eee9de;padding:28px 0;">
  <div class="wrap" style="text-align:center;color:#9a9da5;font-size:13px;max-width:800px;">
    <a href="/" style="color:#a67c3d;">← 回 Step1ne 首頁</a>　|　© 2026 德仁管理顧問有限公司 Step1ne
  </div>
</footer>

<script>
document.getElementById('leadForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var company = document.getElementById('company').value.trim();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('formMsg');
  if (!email) return;
  btn.disabled = true; btn.textContent = '寄送中…';
  fetch('https://step1ne-recruit-api.aiagentg888.workers.dev/assessment/lead-email', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ email: email, companyName: company, source: 'hiring_assessment_landing' }),
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) {
      btn.disabled = false; btn.textContent = '立即寄送評估工具連結 →';
      msg.style.color = '#c0392b';
      msg.textContent = d.error || '寄送失敗，請稍後再試';
      return;
    }
    if (typeof gtag === 'function') gtag('event', 'hiring_assessment_lead', { page_path: location.pathname });
    document.getElementById('leadForm').hidden = true;
    document.getElementById('doneState').hidden = false;
  }).catch(function () {
    btn.disabled = false; btn.textContent = '立即寄送評估工具連結 →';
    msg.style.color = '#c0392b';
    msg.textContent = '連不上伺服器，請稍後再試';
  });
});
</script>
