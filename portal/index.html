    renderCandList();
    refreshNotifications();
  }catch{
    document.getElementById('candList').innerHTML = '<div class="state">連線失敗，請稍後再試。</div>';
  }
}

// ===== 2026-10-28 改版（測試版）：人選改成「等你處理／進行中／已結束」三組卡片 =====
// 原本是 9 欄表格＋下拉選單，客戶要自己橫向找欄位、自己判斷輪到誰；彈窗裡又不能操作。
// 現在每位人選算出一個「下一步」，卡片上直接寫；點開右側面板，操作按鈕就在「下一步」那格裡。
// 後端動作完全沿用原本的 tblAdvance／tblSetStage／tblReject／tblPropose，只換前端入口。
const INTERVIEW_STAGE_KEYS = ['stage1', 'stage2', 'stage3', 'stage4'];
function interviewStageOptsFor(c){
  return (c.steps || []).filter(s => INTERVIEW_STAGE_KEYS.includes(s.key)).map(s => [s.key, s.lb]);
}
function stepOf(c, key){ return (c.steps || []).find(s => s.key === key) || null; }
function currentInterviewStage(c){
  const steps = c.steps || [];
  const now = steps.find(s => INTERVIEW_STAGE_KEYS.includes(s.key) && s.now);
  if (now) return now.key;
  const done = [...steps].reverse().find(s => INTERVIEW_STAGE_KEYS.includes(s.key) && s.done);
  return done ? done.key : '';
}
function stageLabelOf(c, key){ return shortStageLabel((interviewStageOptsFor(c).find(([k]) => k === key) || [null, '面試'])[1]); }
function nextStageKey(c){
  const keys = interviewStageOptsFor(c).map(o => o[0]);
  const cur = currentInterviewStage(c);
  if (!cur) return keys[0] || null;
  const i = keys.indexOf(cur);
  return (i >= 0 && i < keys.length - 1) ? keys[i + 1] : null;
}
const WEEKDAY = '日一二三四五六';
// 'YYYY-MM-DD HH:MM' → '10/30（五）15:00'；星期用 Date 算，不心算
function fmtSlot(s){
  s = String(s || '');
  if (s.length < 10) return s;
  const d = new Date(s.slice(0, 10) + 'T00:00:00');
  // 不是今年的日期要寫年份（付款第三期 2027/3/18 原本只寫 3/18，容易看錯）
  const yr = s.slice(0, 4) !== taipeiNow().slice(0, 4) ? s.slice(0, 4) + '/' : '';
  return `${yr}${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}（${WEEKDAY[d.getDay()]}）${s.length >= 16 ? ' ' + s.slice(11, 16) : ''}`;
}
function taipeiNow(minusHours){
  return new Date(Date.now() + 8 * 3600e3 - (minusHours || 0) * 3600e3).toISOString().slice(0, 16).replace('T', ' ');
}
function apptFor(c, stageKey, status){
  const n = Number(String(stageKey || '').replace('stage', ''));
  const list = (c.appts || []).filter(a => Number(a.stage) === n && (!status || a.status === status));
  return list[list.length - 1] || null;
}

// 每位人選目前在哪一組、卡片要寫什麼、面板要給哪些按鈕
function candState(c){
  const confirmS = stepOf(c, 'confirm');
  const offerS = stepOf(c, 'offer') || {};
  const onS = stepOf(c, 'onboard') || {};
  const advanced = !!c.client_advanced_at || !!(stepOf(c, 'matched') || {}).done;
  const cur = currentInterviewStage(c);
  const curIdx = !advanced ? 0 : (onS.done || onS.now) ? 3 : (offerS.done || offerS.now) ? 2 : 1;
  const base = { trackAt: curIdx, ended: false };
  // 結束的人：進度條停在哪一格、那格標紅（stopAt），狀態文字開頭直接寫是哪一種結束
  if (c.advisor_not_recommended_at || (confirmS && confirmS.decision === 'rejected'))
    return { ...base, trackAt: 0, stop: 'bad', group: 'ended', kind: 'nr', pill: ['end', '顧問不推薦'], next: '<b>顧問不推薦</b>・顧問評估後，這位不往下推薦', nextHtml: true };
  if (c.candidate_withdrawn_at)
    return { ...base, stop: 'gray', group: 'ended', kind: 'wd', pill: ['end', '人選放棄'], next: '<b>人選放棄</b>・' + esc(c.candidate_withdraw_reason ? '原因：' + c.candidate_withdraw_reason : '人選決定不繼續'), nextHtml: true };
  if (c.client_rejected_at)
    { const r = c.client_reject_reason || '';
      const lb = r.startsWith('不錄取：') ? '不錄取' : r.startsWith('沒有報到：') ? '沒有報到' : '不推進';
      const at = lb === '不錄取' ? 2 : lb === '沒有報到' ? 3 : 1;
      const why = r.replace(/^(不錄取|沒有報到)：/, '');
      return { ...base, trackAt: at, stop: 'bad', group: 'ended', kind: 'rej', pill: ['end', lb],
        next: `<b>${lb}</b>` + (why ? '・原因：' + esc(why) : ''), nextHtml: true }; }
  if (onS.done || onS.now) {
    // 報到日還沒到就不能說「已報到」（10/28 實例：報到日在下個月，人選頁卻寫已報到）
    if (c.onboard_date && c.onboard_date > taipeiNow().slice(0, 10))
      return { ...base, trackAt: 3, group: 'active', kind: 'onboard_soon', pill: ['act', '等報到'], next: `預計 <b class="num">${esc(fmtSlot(c.onboard_date))}</b> 報到`, nextHtml: true };
    return { ...base, group: 'ended', kind: 'onboarded', pill: ['ok', '已報到'], next: '已報到，恭喜！' + (c.onboard_date ? `（${fmtSlot(c.onboard_date)}）` : '') };
  }
  if (offerS.done || offerS.now)
    return { ...base, group: 'active', kind: 'offered', pill: ['act', '已錄取'], next: '人選報到後，按「已報到」' };
  if (!advanced) {
    // 等越久的人選越可能被別家錄取，讓客戶看得到已經等幾天
    const fwd = String(c.forwarded_at || '').slice(0, 10);
    const days = fwd ? Math.floor((Date.parse(taipeiNow().slice(0, 10)) - Date.parse(fwd)) / 86400000) : 0;
    return { ...base, group: 'todo', kind: 'decide', pill: ['todo', '等你決定'],
      next: '看完資料，決定要不要面試' + (days >= 3 ? `（已推薦 ${days} 天）` : '') };
  }
  // 舊的邀請沒被收掉時（10/27 實例：同一位邀了兩次才確認），同一關已經有確認時間就不算「等人選選時段」
  const confirmedStages = (c.appts || []).filter(a => a.status === 'confirmed').map(a => Number(a.stage));
  const pendingAny = (c.appts || []).filter(a => a.status === 'pending' && Number(a.stage) > 0
    && !confirmedStages.some(s => s >= Number(a.stage))).slice(-1)[0];
  const curN = Number(String(cur).replace('stage', '')) || 0;
  if (pendingAny && Number(pendingAny.stage) >= (curN || 1))
    return { ...base, group: 'active', kind: 'wait_slot', stageKey: 'stage' + pendingAny.stage, pending: pendingAny, pill: ['act', '等人選選時段'],
      next: `${stageLabelOf(c, 'stage' + pendingAny.stage)}：已請人選選時段，選好會顯示在這裡` };
  if (!cur)
    return { ...base, group: 'todo', kind: 'schedule', stageKey: nextStageKey(c), pill: ['todo', '約面試時間'], next: `約${stageLabelOf(c, nextStageKey(c))}的時間` };
  const ap = apptFor(c, cur, 'confirmed');
  if (ap && ap.confirmed_slot && ap.confirmed_slot >= taipeiNow(3))
    return { ...base, group: 'active', kind: 'upcoming', stageKey: cur, slot: ap.confirmed_slot, pill: ['act', '已約面試'],
      next: `${stageLabelOf(c, cur)} <b class="num">${esc(fmtSlot(ap.confirmed_slot))}</b>` + (ap.meeting_url ? (ap.link_sent_at ? '・視訊連結已寄給人選' : '・視訊連結等顧問寄出') : ''), nextHtml: true };
  return { ...base, group: 'todo', kind: 'result', stageKey: cur, slot: ap && ap.confirmed_slot, pill: ['todo', '等你回覆結果'],
    next: ap && ap.confirmed_slot ? `${stageLabelOf(c, cur)}（${fmtSlot(ap.confirmed_slot)}）結束了，結果如何？` : `${stageLabelOf(c, cur)}結束了嗎？結果如何？` };
}

function trackHtml(st){
  const lbs = ['推薦', '面試', '錄取', '報到'];
  const stopCls = st.stop === 'bad' ? 'x' : st.stop === 'gray' ? 'g' : 'n';
  const cells = lbs.map((_, i) => {
    if (i < st.trackAt || (st.kind === 'onboarded')) return '<i class="d"></i>';
    if (i === st.trackAt) return `<i class="${stopCls}"></i>`;
    return '<i></i>';
  }).join('');
  const labels = lbs.map((lb, i) => `<span class="${i === st.trackAt && st.kind !== 'onboarded' ? stopCls : ''}">${lb}${i === st.trackAt && st.stop === 'bad' ? ' ✕' : ''}</span>`).join('');
  return `<div class="trk" aria-hidden="true">${cells}</div><div class="trk-lb">${labels}</div>`;
}

let CAND_JOB_FILTER = '';
function renderCandList(){
  const box = document.getElementById('candList');
  LAST_CAND_SIG = candSig(CAND_LIST);
  const q = (document.getElementById('candSearch').value || '').trim().toLowerCase();
  const jobs = [...new Set(CAND_LIST.map(c => c.job_title || c.job_slug).filter(Boolean))];
  const jobSel = document.getElementById('candJob');
  if (jobs.length > 1) {
    jobSel.hidden = false;
    jobSel.innerHTML = `<option value="">全部職缺（${CAND_LIST.length} 位）</option>` +
      jobs.map(j => `<option value="${esc(j)}" ${CAND_JOB_FILTER === j ? 'selected' : ''}>${esc(j)}（${CAND_LIST.filter(c => (c.job_title || c.job_slug) === j).length}）</option>`).join('');
  } else jobSel.hidden = true;
  const list = CAND_LIST.filter(c => {
    if (CAND_JOB_FILTER && (c.job_title || c.job_slug) !== CAND_JOB_FILTER) return false;
    if (q && !`${c.candidate_name} ${c.job_title || ''}`.toLowerCase().includes(q)) return false;
    return true;
  }).map(c => ({ c, st: candState(c) }));
  if (!CAND_LIST.length) { box.innerHTML = '<div class="cl-empty">顧問還沒有推薦人選給你。有新人選時，這裡會出現，也會通知你。</div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="cl-empty">找不到符合的人選，換個關鍵字試試。</div>'; return; }
  const card = ({ c, st }) => `<button type="button" class="cc" data-app="${esc(c.application_id)}">
      <div><div class="nm">${esc(c.candidate_name)}</div><div class="cjob">${esc(c.job_title || c.job_slug || '')}</div></div>
      <div>${trackHtml(st)}</div>
      <div class="nx"><span class="lb">${st.group === 'ended' ? '狀態' : '下一步'}</span>${st.nextHtml ? st.next : esc(st.next)}</div>
      <span class="go">${st.group === 'todo' ? '去處理' : '打開'}</span>
    </button>`;
  const todo = list.filter(x => x.st.group === 'todo');
  const act = list.filter(x => x.st.group === 'active');
  const end = list.filter(x => x.st.group === 'ended');
  let html = '';
  html += todo.length
    ? `<section class="cl-group todo"><h2>等你處理 <span class="n">${todo.length}</span></h2><p class="hint">這幾位在等你回覆，點開就能直接處理。</p>${todo.map(card).join('')}</section>`
    : `<section class="cl-group todo"><h2>等你處理 <span class="n">0</span></h2><div class="cl-empty">目前沒有要你處理的事。</div></section>`;
  if (act.length) html += `<section class="cl-group"><h2>進行中 <span class="n">${act.length}</span></h2>${act.map(card).join('')}</section>`;
  if (end.length) html += `<details class="cl-group ended"${(!todo.length && !act.length) ? ' open' : ''}><summary>已結束 <span class="n num">${end.length}</span></summary>${end.map(card).join('')}</details>`;
  box.innerHTML = html;
  box.querySelectorAll('.cc').forEach(b => b.addEventListener('click', () => openCandModal(b.dataset.app)));
}
document.getElementById('candSearch').addEventListener('input', renderCandList);
document.getElementById('candJob').addEventListener('change', (e) => { CAND_JOB_FILTER = e.target.value; renderCandList(); });

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
// 原本用 prompt() 問原因，有些手機瀏覽器／內嵌環境會直接跳過——改成頁面內的小視窗
function promptReason(title){
  return new Promise((resolve) => {
    const g = (id) => document.getElementById(id);
    g('reasonTitle').textContent = title;
    g('reasonInput').value = ''; g('reasonErr').textContent = '';
    g('reasonMask').classList.add('show');
    setTimeout(() => g('reasonInput').focus(), 50);
    const done = (v) => { g('reasonMask').classList.remove('show'); g('reasonOk').onclick = null; g('reasonCancel').onclick = null; resolve(v); };
    g('reasonOk').onclick = () => { const v = g('reasonInput').value.trim(); if (!v) { g('reasonErr').textContent = '請寫一句原因'; return; } done(v); };
    g('reasonCancel').onclick = () => done(null);
  });
}

// confirm() 在 LINE 內建瀏覽器會直接回 false（按了沒反應），改頁面內小視窗；沿用原因視窗、藏起輸入框
function confirmBox(msg, okLabel){
  return new Promise((resolve) => {
    const g = (id) => document.getElementById(id);
    g('reasonTitle').textContent = msg;
    g('reasonInput').hidden = true; g('reasonErr').textContent = '';
    g('reasonOk').textContent = okLabel || '確認';
    g('reasonMask').classList.add('show');
    const done = (v) => { g('reasonMask').classList.remove('show'); g('reasonInput').hidden = false; g('reasonOk').textContent = '確認'; g('reasonOk').onclick = null; g('reasonCancel').onclick = null; resolve(v); };
    g('reasonOk').onclick = () => done(true);
    g('reasonCancel').onclick = () => done(false);
    setTimeout(() => g('reasonCancel').focus(), 50);
  });
}

// ── 面板裡的動作 ──
async function actAdvance(appId){
  const c = CAND_LIST.find(x => x.application_id === appId);
  await tblAdvance(appId, null, '');
  const c2 = CAND_LIST.find(x => x.application_id === appId);
  if (c2 && (c2.client_advanced_at || (stepOf(c2, 'matched') || {}).done)) toast('已通知顧問，接下來約面試時間');
  else if (c) openCandModal(appId);
}
async function actReject(appId, title, kind){
  const reason = await promptReason(title);
  if (!reason) return;
  await tblReject(appId, reason, null, '', kind);
  toast('已記錄，顧問會看到你的原因');
}
async function actSetStage(appId, stageKey, title, noteLabel){
  const picked = await promptDateTime(title, noteLabel || '備註（選填，顧問會看到）');
  if (!picked) return;
  const extra = { event_at: picked.event_at, note: picked.note || undefined };
  if (stageKey === 'onboard') extra.onboard_date = picked.event_at.slice(0, 10);
  await tblSetStage(appId, stageKey, extra, null, '');
}
async function actPropose(appId, stageKey, replace){
  const c = CAND_LIST.find(x => x.application_id === appId);
  if (c) await tblPropose(appId, c, stageKey, replace);
  // 送出後面板要跟著換成「等人選選時段」（原本停在舊畫面，看起來像沒送出去）
  if (ACTIVE_APP === appId) openCandModal(appId);
}

// 視訊連結：沿用「跟顧問討論」那支後端（認得 Teams／Meet／Zoom／Webex／Whereby 連結，存進這場面試，
// TG 出「寄視訊連結給人選」卡片）。這裡只是給它一個正式入口，不再讓客戶自己想到要貼在對話框。
const MEET_RE = /https?:\/\/[^\s<>"'）)]*(?:teams\.microsoft\.com|teams\.live\.com|meet\.google\.com|zoom\.us|webex\.com|whereby\.com)[^\s<>"'）)]*/i;
let CHAT_MSGS = [];
// 這場面試後台記到的連結＋顧問有沒有寄出（後端 appts.meeting_url／link_sent_at）
function meetApptOf(c){
  const st = candState(c);
  const n = Number(String(st.stageKey || '').replace('stage', '')) || 0;
  const list = (c.appts || []).filter(a => a.meeting_url && (a.status === 'confirmed' || a.status === 'pending') && (!n || Number(a.stage) === n));
  return list[list.length - 1] || null;
}
function updateMeetState(){
  const el = document.getElementById('cmMeetState');
  if (!el) return;
  const c = CAND_LIST.find(x => x.application_id === ACTIVE_APP);
  const ap = c && meetApptOf(c);
  if (ap) {
    el.className = 'meet-state ok';
    el.innerHTML = (ap.link_sent_at
      ? `✓ 已寄給人選（${esc(fmtSlot(ap.link_sent_at.slice(0, 16)))}，Email＋LINE），前一天的提醒也會帶這個連結。`
      : `已交給顧問，顧問確認後會寄給人選。`)
      + `<br><span style="font-weight:400;color:var(--ink3);overflow-wrap:anywhere">${esc(ap.meeting_url)}</span>`;
    return;
  }
  const mine = CHAT_MSGS.filter(m => m.from_role === 'client' && MEET_RE.test(m.content || ''));
  if (mine.length) {
    const last = mine[mine.length - 1];
    const url = (last.content.match(MEET_RE) || [''])[0];
    el.className = 'meet-state ok';
    el.innerHTML = `已交給顧問（${esc((last.created_at || '').slice(5, 16))}）：顧問確認後會用 Email＋LINE 寄給人選。<br><span style="font-weight:400;color:var(--ink3);overflow-wrap:anywhere">${esc(url)}</span>`;
  } else {
    el.className = 'meet-state';
    el.textContent = '還沒貼。貼上 Teams／Google Meet／Zoom 連結，顧問確認後會寄給人選，前一天的提醒也會帶這個連結。';
  }
}
async function saveMeetLink(){
  const input = document.getElementById('cmMeetInput');
  const btn = document.getElementById('cmMeetSave');
  const el = document.getElementById('cmMeetState');
  const v = input.value.trim();
  const url = (v.match(MEET_RE) || [''])[0];
  if (!url) { el.className = 'meet-state err'; el.textContent = '這不像視訊會議連結。系統認得 Teams、Google Meet、Zoom、Webex、Whereby；其他連結請直接在下面「跟顧問討論」貼給顧問。'; return; }
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(ACTIVE_APP)}/messages`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ content: '視訊面試連結：' + url }),
    });
    const data = await res.json();
    if (!data.ok) { el.className = 'meet-state err'; el.textContent = data.error || '沒有存成功，請再按一次'; btn.disabled = false; return; }
    input.value = '';
    toast('連結已交給顧問');
    await loadCandidates();
    openCandModal(ACTIVE_APP);
  } catch { el.className = 'meet-state err'; el.textContent = '連線失敗，請稍後再按一次'; }
  btn.disabled = false;
}

// 2026-10-28 Jacky：「第二次面談以上要在哪設定？」——原本只能到「職缺需求」那個職缺裡勾，
// 客戶面完第一關不會想到要去別頁。改成面板上直接一顆「還要再面一關」，按了就幫這個職缺多開一關。
const ROUND_CN = { 2: '第二階段', 3: '第三階段', 4: '第四階段' };
function addRoundBtn(c, id){
  const n = interviewStageOptsFor(c).length;
  return n >= 1 && n < 4 ? `<button type="button" class="sec" data-act="addround" data-app="${id}">還要再面一關（${ROUND_CN[n + 1]}）</button>` : '';
}
async function actAddRound(appId){
  const c = CAND_LIST.find(x => x.application_id === appId);
  if (!c) return;
  const n = interviewStageOptsFor(c).length;
  const cfg = ['stage2', 'stage3', 'stage4'].slice(0, n);
  try {
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(c.job_slug)}`, {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ interview_stage_config: JSON.stringify(JSON.stringify(cfg)) }), // 多包一層：後端存檔會把陣列整理成純文字
    });
    const data = await res.json();
    if (!data.ok) { toast('這個職缺沒辦法從這裡加關，請在下面傳訊息請顧問幫忙加'); return; }
    const jr = PORTAL_DATA.jobs.find(j => j.slug === c.job_slug);
    if (jr) jr.interview_stage_config = JSON.stringify(cfg);
    await loadCandidates();
    openCandModal(appId);
    toast(`已加上${ROUND_CN[n + 1]}，可以約時間了（這個職缺之後的人選也都會有這一關）`);
  } catch { toast('連線失敗，請稍後再試'); }
}

  const nk = nextStageKey(c);
  const nkLb = nk ? stageLabelOf(c, nk) : '';
  switch (st.kind) {
    case 'decide': return `<h4>下一步</h4><div class="big">要不要約他面試？</div>
      <div class="meet-state">先看下面顧問的說明和初篩報告。按「要面試」會通知顧問，接著選幾個時段給人選挑。</div>
      <div class="btns"><button type="button" data-act="advance" data-app="${id}">要面試這位</button><button type="button" class="danger" data-act="reject" data-app="${id}">不考慮</button></div>`;
    case 'schedule': return `<h4>下一步</h4><div class="big">約${esc(stageLabelOf(c, st.stageKey))}的時間</div>
      <div class="btns"><button type="button" data-act="propose" data-stage="${esc(st.stageKey)}" data-app="${id}">給人選幾個時段挑</button>
      <button type="button" class="sec" data-act="setstage" data-stage="${esc(st.stageKey)}" data-app="${id}">已經約好了，直接填時間</button></div>
      <div class="sub-act"><button type="button" class="danger" data-act="reject" data-app="${id}">不考慮這位</button></div>`;
    case 'wait_slot': {
      const ps = (st.pending && st.pending.proposed_slots) || [];
      return `<h4>下一步</h4><div class="big">等人選選${esc(stageLabelOf(c, st.stageKey))}的時間</div>
      ${ps.length ? `<div>你給人選挑的時段：</div><ul style="margin:0;padding-left:20px">${ps.map(s => `<li class="num">${esc(fmtSlot(s.slot_at))}${s.format ? '・' + esc(s.format) : ''}</li>`).join('')}</ul>` : ''}
      <div class="meet-state">${st.pending && st.pending.invited_at ? `${esc(fmtSlot(st.pending.invited_at.slice(0, 16)))} 已用 LINE／Email 通知人選。` : ''}人選選好後，時間會自動出現在這裡，不用回來填。</div>
      <div class="btns"><button type="button" class="sec" data-act="propose" data-stage="${esc(st.stageKey)}" data-app="${id}">改時段（重新給人選挑）</button>
        <button type="button" class="sec" data-act="setstage" data-stage="${esc(st.stageKey)}" data-app="${id}">已經跟人選約好了，直接填時間</button></div>
      <div class="sub-act"><button type="button" class="danger" data-act="reject" data-app="${id}">不考慮這位</button></div>`;
    }
    case 'upcoming': return `<h4>下一步</h4><div class="big when">${esc(fmtSlot(st.slot))}</div><div>${esc(stageLabelOf(c, st.stageKey))}・人選已確認這個時間</div>
      <div class="btns"><button type="button" class="sec" data-act="repropose" data-stage="${esc(st.stageKey)}" data-app="${id}">要改面試時間</button></div>
      <div class="sub-act"><div class="meet-state">面試完之後：</div><div class="btns">
        ${nk ? `<button type="button" class="sec" data-act="propose" data-stage="${esc(nk)}" data-app="${id}">約${esc(nkLb)}</button>` : addRoundBtn(c, id)}
        <button type="button" class="sec" data-act="offer" data-app="${id}">錄取</button>
        <button type="button" class="danger" data-act="reject-offer" data-app="${id}">不錄取</button></div></div>`;
    case 'result': return `<h4>下一步</h4><div class="big">${esc(st.next)}</div>
      <div class="btns">
        ${nk ? `<button type="button" data-act="propose" data-stage="${esc(nk)}" data-app="${id}">約${esc(nkLb)}</button>` : addRoundBtn(c, id)}

      ${nk ? `<div class="sub-act"><button type="button" class="sec" data-act="setstage" data-stage="${esc(nk)}" data-app="${id}">${esc(nkLb)}已經約好了，直接填時間</button></div>` : ''}`;
    case 'offered': return `<h4>下一步</h4><div class="big">人選報到了嗎？</div>
      <div class="btns"><button type="button" data-act="onboard" data-app="${id}">已報到</button><button type="button" class="danger" data-act="reject-onboard" data-app="${id}">沒有來報到</button></div>
      <div class="meet-state">錄取通知（Offer 信）可以在下面「資料」上傳，系統會同步寄給人選。</div>`;
    default: return `<h4>狀態</h4><div class="big">${esc(st.pill[1])}</div><div>${st.nextHtml ? st.next.replace(/^<b>[^<]*<\/b>・?/, '') : esc(st.next)}</div>`;
  }
}

function openCandModal(appId){
  const c = CAND_LIST.find(x => x.application_id === appId);
  if (!c) return;
  const st = candState(c);
  const sameApp = ACTIVE_APP === appId;
  ACTIVE_APP = appId;
  document.getElementById('cmName').textContent = c.candidate_name;
  document.getElementById('cmSub').textContent = `${c.job_title || c.job_slug || ''}　・　推薦日 ${(c.forwarded_at || '').slice(0, 10)}`;
  const nb = document.getElementById('cmNext');
  nb.className = 'bx next' + (st.group === 'todo' ? ' todo' : '');
  nb.innerHTML = nextBoxHtml(c, st);
  nb.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
    const a = b.dataset.act, id = b.dataset.app;
    b.disabled = true;
    try {
      if (a === 'advance') await actAdvance(id);
      else if (a === 'reject') await actReject(id, '不考慮的原因（顧問會看到，幫我們調整之後推薦的方向）');
      else if (a === 'reject-offer') await actReject(id, '不錄取的原因（顧問會看到）', 'not_hired');
      else if (a === 'reject-onboard') await actReject(id, '沒有來報到的原因（顧問會看到）', 'no_show');
      else if (a === 'propose') await actPropose(id, b.dataset.stage);
      else if (a === 'repropose') await actPropose(id, b.dataset.stage, true);
      else if (a === 'setstage') await actSetStage(id, b.dataset.stage, stageLabelOf(c, b.dataset.stage) + '的時間');
      else if (a === 'offer') await actSetStage(id, 'offer', '錄取時間', '錄取原因（選填，顧問會看到）');
      else if (a === 'onboard') await actSetStage(id, 'onboard', '報到日期');
      else if (a === 'addround') await actAddRound(id);
    } finally { b.disabled = false; }
  }));

  // 視訊連結：已約好（或在等人選選時段）的面試才出現
  const meet = document.getElementById('cmMeet');
  if (st.kind === 'upcoming' || st.kind === 'wait_slot') {
    meet.hidden = false;
    meet.innerHTML = `<h4>視訊會議連結</h4>
      <label for="cmMeetInput" class="meet-state" style="color:var(--ink)">如果是視訊面試，把連結貼在這：</label>
      <div class="meet-row"><input type="url" id="cmMeetInput" inputmode="url" placeholder="https://teams.microsoft.com/…"><button type="button" id="cmMeetSave">交給顧問</button></div>
      <div class="meet-state" id="cmMeetState" aria-live="polite">讀取中…</div>`;
    document.getElementById('cmMeetSave').addEventListener('click', saveMeetLink);
    updateMeetState();
  } else { meet.hidden = true; meet.innerHTML = ''; }

  let nrHtml = '';
  if (c.advisor_not_recommended_at) {
    const why = c.advisor_not_recommended_reason ? esc(c.advisor_not_recommended_reason).replace(/\n/g, '<br>') : '顧問評估後決定不推薦，未提供進一步說明。';
    nrHtml = `<div class="nrec"><h4>這位人選我們不推薦</h4><div>${why}</div><div class="meet-state">顧問於 ${esc(String(c.advisor_not_recommended_at).slice(0, 10))} 標記</div></div>`;
  }
  document.getElementById('cmNoteBlock').innerHTML = nrHtml + `<h4>顧問給你的說明</h4>` + (c.client_note
    ? `<div>${esc(c.client_note).replace(/\n/g, '<br>')}</div>` : `<div class="meet-state">顧問還沒寫說明</div>`);

  const fileItem = (label, inner) => `<div class="cm-file-item"><div class="lb">${esc(label)}</div>${inner}</div>`;
  document.getElementById('cmFiles').innerHTML = [
    fileItem('初篩報告', c.has_client_report
      ? `<a class="cm-fbtn" href="${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(c.application_id)}/report" target="_blank" rel="noopener">打開報告</a>`
      : `<span class="wait">顧問還在整理</span>`),
    ...(c.forms || []).map(f => fileItem(f.form_name, f.status === 'submitted'
      ? `<a class="cm-fbtn" href="${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(c.application_id)}/form/${encodeURIComponent(f.id)}" target="_blank" rel="noopener">下載</a>`
      : `<span class="wait">等人選填寫</span>`)),
    c.offer_stage_reached ? fileItem('錄取通知（Offer 信）',
      `<input type="file" id="cmOfferFile" style="display:none" accept=".pdf,.jpg,.jpeg,.png">` +
      `<button type="button" class="cm-fbtn" id="cmOfferBtn">${c.offer_file_name ? '重新上傳' : '上傳'}</button>` +
      `<span class="meet-state" style="font-size:12px">PDF／JPG／PNG，8MB 以內${c.offer_file_name ? '・已寄給人選：' + esc(c.offer_file_name) : ''}</span>`) : '',
  ].join('');
  wireOfferUpload(appId);

  document.getElementById('cmSteps').innerHTML = (c.steps || []).map(s => `
    <div class="step ${s.done ? 'done' : ''} ${s.now ? 'now' : ''}"><div class="ln"></div><div class="dot">${s.done ? '✓' : ''}</div><div class="lb">${esc(s.key === 'confirm' ? '顧問推薦' : s.key === 'matched' ? '你決定面試' : shortStageLabel(s.lb))}</div></div>`).join('');
  document.getElementById('cmInfo').textContent = c.line_id_given ? `人選 LINE ID：${c.line_id_given}` : '';

  const mask = document.getElementById('candModalMask');
  const wasOpen = mask.classList.contains('show');
  mask.classList.add('show');
  if (!wasOpen) { document.body.style.overflow = 'hidden'; setTimeout(() => document.getElementById('cmClose').focus(), 30); }
  if (!sameApp || !wasOpen) { CHAT_MSGS = []; document.getElementById('cmChatWindow').innerHTML = '<div class="meet-state">讀取中…</div>'; }
  cmLoadChat();
  if (CHAT_POLL_TIMER) clearInterval(CHAT_POLL_TIMER);
  CHAT_POLL_TIMER = setInterval(function () { if (!document.hidden) cmLoadChat(); }, 10000);
}

// 2026-10-28 Jacky：人選在 LINE／Email 選好時段、顧問在 TG 寄出連結，客戶頁要自己更新，
// 不能停在舊畫面等客戶手動重新整理。畫面開著才抓（看不到的分頁不打，D1 額度事件的教訓），
// 回到這個分頁時立刻抓一次；資料沒變就什麼都不做。客戶正在打字的連結欄、對話框不會被清掉。
let LAST_CAND_SIG = '';
function candSig(list){
  return JSON.stringify((list || []).map(c => [c.application_id, c.client_advanced_at, c.client_rejected_at, c.candidate_withdrawn_at,
    (c.steps || []).map(s => (s.done ? 'd' : '') + (s.now ? 'n' : '')).join(''),
    (c.appts || []).map(a => [a.stage, a.status, a.confirmed_slot, a.meeting_url, a.link_sent_at].join('|')).join(',')]));
}
async function silentRefreshCandidates(){
  if (document.hidden || !CANDIDATES_LOADED) return;
  if (['reasonMask', 'dtModalMask', 'slotsModalMask'].some(id => document.getElementById(id).classList.contains('show'))) return;
  try {
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates`);
    const data = await res.json();
    if (!data.ok) return;
    const list = data.candidates || [];
    const sig = candSig(list);
    if (sig === LAST_CAND_SIG) return;
    LAST_CAND_SIG = sig;
    CAND_LIST = list;
    renderCandList();
    if (ACTIVE_APP && document.getElementById('candModalMask').classList.contains('show')) {
      const mi = document.getElementById('cmMeetInput');
      const typed = mi ? mi.value : '';
      openCandModal(ACTIVE_APP);
      const mi2 = document.getElementById('cmMeetInput');
      if (mi2 && typed) mi2.value = typed;
      toast('畫面已更新');
    }
  } catch { /* 下一輪再試 */ }
}
setInterval(silentRefreshCandidates, 40000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) silentRefreshCandidates(); });
window.addEventListener('focus', silentRefreshCandidates);

// 2026-09-03 加：跟 prompt() 一樣是「跳出來要一個值，取消就回 null」，
// 只是多了 datetime-local 輸入框跟一個選填備註。
function promptDateTime(title, noteLabel, defaultDate){
  return new Promise((resolve) => {
    const g = (id) => document.getElementById(id);
    const mask = g('dtModalMask'), input = g('dtModalInput'), note = g('dtModalNote');
    const okBtn = g('dtModalOk'), cancelBtn = g('dtModalCancel');
    g('dtModalTitle').textContent = title;
    g('dtModalNoteLabel').textContent = noteLabel;
    input.value = defaultDate || '';
    note.value = '';
    mask.classList.add('show');
    function cleanup(result){
      mask.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){
      if (!input.value) { alert('請選擇時間'); return; }
      cleanup({ event_at: input.value, note: note.value.trim() });
    }
    function onCancel(){ cleanup(null); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

// ── 2026-09-09 加：邀請人選選時段（用人單位還沒喬好確定時間時用）──
function slotRowHtml(){
  return '<div class="slot-row" style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center;">' +
    '<input type="date" class="slot-date" style="border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px">' +
    '<input type="time" class="slot-time" style="border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px">' +
    '<select class="slot-fmt" style="border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px">' +
      '<option value="現場面談">現場面談</option><option value="視訊面談">視訊面談</option><option value="電話面談">電話面談</option>' +
    '</select>' +
    '<input type="url" class="slot-url" placeholder="視訊連結（選視訊面談才需要）" hidden ' +
      'style="border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px;flex:1 1 160px;min-width:140px">' +
    '<button type="button" class="slot-rm cm-fbtn" style="padding:4px 8px;font-size:12px">移除</button>' +
  '</div>';
}
function slotsAddRow(){
  const wrap = document.createElement('div');
  wrap.innerHTML = slotRowHtml();
  const row = wrap.firstChild;
  row.querySelector('.slot-rm').addEventListener('click', () => row.remove());
  const fmtSel = row.querySelector('.slot-fmt'), urlInp = row.querySelector('.slot-url');
  const syncUrl = () => { urlInp.hidden = fmtSel.value !== '視訊面談'; };
  fmtSel.addEventListener('change', syncUrl); syncUrl();
  document.getElementById('slotsModalRows').appendChild(row);
}
function promptThreeSlots(title){
  return new Promise((resolve) => {
    const g = (id) => document.getElementById(id);
    const mask = g('slotsModalMask');
    g('slotsModalTitle').textContent = title;
    g('slotsModalRows').innerHTML = '';
    g('slotsModalInterviewer').value = ''; g('slotsModalLocation').value = ''; g('slotsModalNote').value = '';
    g('slotsModalMsg').textContent = '';
    slotsAddRow(); slotsAddRow();
    mask.classList.add('show');
    const addBtn = g('slotsModalAddRow'), okBtn = g('slotsModalOk'), cancelBtn = g('slotsModalCancel');
    function cleanup(result){
      mask.classList.remove('show');
      addBtn.removeEventListener('click', slotsAddRow);
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){
      const slots = [];
      document.querySelectorAll('#slotsModalRows .slot-row').forEach(row => {
        const d = row.querySelector('.slot-date').value, t = row.querySelector('.slot-time').value;
        const f = row.querySelector('.slot-fmt').value, u = row.querySelector('.slot-url').value.trim();
        if (d && t) slots.push(u ? { slot_at: d + ' ' + t, format: f, meeting_url: u } : { slot_at: d + ' ' + t, format: f });
      });
      // 2026-09-21 改：原本硬性要求 2 個。實際上用人單位常常就是「我只有這個
      // 時間」——逼他補第二個，他要嘛亂填一個不打算用的，要嘛乾脆不用這個功能
      // 改回頭用電話約，兩種都比讓他送出一個時段糟。改成至少 1 個。
      if (!slots.length) { g('slotsModalMsg').textContent = '至少要填 1 個完整的候選時段（日期＋時間都要選）'; return; }
      cleanup({
        slots,
        interviewer: g('slotsModalInterviewer').value.trim(),
        location: g('slotsModalLocation').value.trim(),
        note: g('slotsModalNote').value.trim(),
      });
    }
    function onCancel(){ cleanup(null); }
    addBtn.addEventListener('click', slotsAddRow);
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}
async function tblPropose(appId, c, stageOverride, replace){
  const opts = interviewStageOptsFor(c);
  const stage = stageOverride || currentInterviewStage(c) || (opts[0] || [])[0];
  if (!stage) { alert('這個職缺還沒設定面試輪次，請聯繫顧問先設定'); return; }
  const stageLb = (opts.find(([k]) => k === stage) || [null, '這一階段面試'])[1];
  const picked = await promptThreeSlots(stageLb + '的候選時段');
  if (!picked) return;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/propose-slots`, {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ stage, replace: replace === true || undefined, slots: picked.slots, interviewer: picked.interviewer || undefined,
        location: picked.location || undefined, note: picked.note || undefined }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '送出失敗'); return; }
    const via = [data.notified_line ? 'LINE' : null, data.notified_email ? 'Email' : null].filter(Boolean).join('＋');
    toast(via ? `已經用 ${via} 通知人選選時段了` : '時段已存好，但這位人選沒綁 LINE 也沒有 Email，請聯繫顧問');
    await loadCandidates();
  }catch{
    alert('連線失敗，請稍後再試');
  }
}

async function tblHandleChange(appId, role, value, sel){
  const prevValue = [...sel.options].find(o => o.defaultSelected)?.value ?? '';
  if (role === 'advance') {
    if (value === 'advance') { await tblAdvance(appId, sel, prevValue); return; }
    const reason = prompt('請說明不推進的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
    if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
    await tblReject(appId, reason.trim(), sel, prevValue);
    return;
  }
  if (role === 'interview') {
    // 2026-09-01 拿掉 confirm() 彈窗——選面試階段是往前推進的低風險動作
    // （後端本來就擋倒退），不需要多一層確認對話框；而且部分瀏覽器/嵌入
    // 環境對 confirm() 支援不穩，選了卻沒反應最常見的原因就是這個。
    // 2026-09-03 加：改成一定要留面試實際/預計的年月日時分，後端也會擋
    // 沒帶這個值的請求。
    if (!value) return;
    const stageLabel = sel.options[sel.selectedIndex]?.textContent || '這一階段面試';
    const picked = await promptDateTime(stageLabel + '的時間', '備註（選填，顧問會看到）');
    if (!picked) { sel.value = prevValue; return; }
    await tblSetStage(appId, value, { event_at: picked.event_at, note: picked.note || undefined }, sel, prevValue);
    return;
  }
  if (role === 'offer') {
    if (value === 'decline') {
      const reason = prompt('請說明不錄取的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
      if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
      // 2026-10-28：帶 kind，後端才知道這是面試後不錄取，不是面試前不推進（之前一律被擋）
      await tblReject(appId, reason.trim(), sel, prevValue, 'not_hired');
    } else if (value === 'offer') {
      const picked = await promptDateTime('錄取時間', '錄取原因（選填，顧問會看到）');
      if (!picked) { sel.value = prevValue; return; }
      await tblSetStage(appId, 'offer', { event_at: picked.event_at, note: picked.note || undefined }, sel, prevValue);
    }
    return;
  }
  if (role === 'onboard') {
    if (value === 'decline') {
      const reason = prompt('請說明不報到的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
      if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
      await tblReject(appId, reason.trim(), sel, prevValue, 'no_show');
    } else if (value === 'onboard') {
      const picked = await promptDateTime('預計報到時間', '備註（選填，顧問會看到）');
      if (!picked) { sel.value = prevValue; return; }
      await tblSetStage(appId, 'onboard', {
        event_at: picked.event_at, note: picked.note || undefined,
        onboard_date: picked.event_at.slice(0, 10),
      }, sel, prevValue);
    }
    return;
  }
}

// 2026-09-10 加：offer信上傳——選檔案後直接base64送出（跟後端saveUpload()
// 同一套，不是multipart），成功後重整這個人選的資料讓按鈕變「重新上傳」＋
// 顯示檔名。8MB上限跟後端一致，前端先擋一次省得選了大檔案傳到一半才報錯。
function wireOfferUpload(appId){
  const btn = document.getElementById('cmOfferBtn');
  const input = document.getElementById('cmOfferFile');
  if (!btn || !input) return;
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { alert('檔案超過 8MB，麻煩壓縮後再傳'); input.value = ''; return; }
    btn.disabled = true; btn.textContent = '上傳中…';
    try {
      const b64 = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1] || '');
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/offer-upload`, {
        method: 'POST', headers: {'content-type':'application/json'},
        body: JSON.stringify({ b64, name: file.name, mime: file.type || 'application/octet-stream' }),
      });
      const data = await res.json();
      if (!data.ok) { alert(data.error || '上傳失敗'); btn.disabled = false; btn.textContent = '⬆ 上傳'; return; }
      alert('已上傳，系統同步寄給人選了');
      await loadCandidates();
      if (ACTIVE_APP === appId) openCandModal(appId);
    } catch {
      alert('連線失敗，請稍後再試');
      btn.disabled = false; btn.textContent = '⬆ 上傳';
    }
  });
}

// ── 通知鈴鐺：跨人選的未讀訊息角標 ──
// 2026-10-28 Jacky：「小鈴鐺感覺沒有用到」——原本只列顧問回的未讀訊息，幾乎永遠是空的。
// 改成「上次看之後發生了什麼」：新推薦人選、人選選好面試時間、視訊連結已寄、人選放棄、顧問回覆、款項已確認。
// 「上次看」記在這台瀏覽器（localStorage）；顧問未讀訊息照舊以後台數字為準。
const BELL_SEEN_KEY = 'portal_bell_seen_' + token;
function bellSeen(){ try { return localStorage.getItem(BELL_SEEN_KEY) || ''; } catch { return ''; } }
function bellMarkSeen(){ try { localStorage.setItem(BELL_SEEN_KEY, taipeiNow()); } catch {} }
let BELL_BILL = null;
async function refreshNotifications(){
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/notifications`);
    const data = await res.json();
    if (!data.ok) return;
    if (BELL_BILL === null) {
      try { const b = await (await fetch(`${API}/portal/${encodeURIComponent(token)}/billing`)).json(); BELL_BILL = (b.ok && b.installments) || []; } catch { BELL_BILL = []; }
    }
    const seen = bellSeen();
    const since = new Date(Date.now() + 8 * 3600e3 - 30 * 86400e3).toISOString().slice(0, 10);  // 只列 30 天內
    const ev = [];
    (data.items || []).forEach(it => ev.push({ at: '9999', app: it.application_id, unread: true,
      text: `<b>${esc(it.name)}</b>：顧問回覆了（${it.unread_count} 則）`, sub: (it.last_message || '').slice(0, 40) }));
    (CAND_LIST || []).forEach(c => {
      const nm = `<b>${esc(c.candidate_name)}</b>`;
      if (c.forwarded_at) ev.push({ at: c.forwarded_at, app: c.application_id, text: `${nm}：顧問推薦了新人選`, sub: c.job_title || '' });
      (c.appts || []).forEach(a => {
        if (a.confirmed_at) ev.push({ at: a.confirmed_at, app: c.application_id, text: `${nm}：選好面試時間了`, sub: fmtSlot(a.confirmed_slot) });
        if (a.link_sent_at) ev.push({ at: a.link_sent_at, app: c.application_id, text: `${nm}：視訊連結已寄給人選`, sub: '' });
      });
      if (c.candidate_withdrawn_at) ev.push({ at: c.candidate_withdrawn_at, app: c.application_id, text: `${nm}：人選決定不繼續`, sub: c.candidate_withdraw_reason || '' });
    });
    (BELL_BILL || []).forEach(r => {
      const d = (r.confirmed_received === 'yes' || r.paid) && (r.paid_date || r.confirmed_date);
      if (d) ev.push({ at: d, bill: true, text: `<b>${esc(r.candidate_name)}</b>・${esc(r.label)}：款項已確認收到`, sub: '' });
    });
    const list = ev.filter(x => x.unread || String(x.at) >= since).sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 20);
    list.forEach(x => { x.fresh = x.unread || (seen ? String(x.at) > seen : String(x.at).slice(0, 10) >= since && false); });
    // 第一次打開（沒有「上次看」）：不把 30 天內全部標成新的，只標 3 天內的
    if (!seen) { const d3 = new Date(Date.now() + 8 * 3600e3 - 3 * 86400e3).toISOString().slice(0, 10); list.forEach(x => { if (!x.unread) x.fresh = String(x.at) >= d3; }); }
    const n = list.filter(x => x.fresh).length;
    const badge = document.getElementById('notifyBadge');
    badge.textContent = n > 99 ? '99+' : n;
    badge.classList.toggle('show', n > 0);
    const listEl = document.getElementById('notifyList');
    listEl.innerHTML = '<div class="bell-head">最新動態</div>' + (list.length
      ? list.map((x, i) => `<button type="button" class="notify-item${x.fresh ? ' fresh' : ''}" data-i="${i}">
          <span class="bell-t">${x.text}</span>${x.sub ? `<span>${esc(x.sub)}</span>` : ''}
          ${x.unread ? '' : `<span class="bell-at num">${esc(fmtSlot(String(x.at).slice(0, 16)))}</span>`}</button>`).join('')
      : '<div class="notify-empty">最近 30 天沒有新動態</div>');
    listEl.querySelectorAll('.notify-item').forEach(el => el.addEventListener('click', () => {
      const x = list[Number(el.dataset.i)];
      document.getElementById('notifyMenu').classList.remove('show');
      if (x.bill) showTopView('billing'); else if (x.app) openFromNotification(x.app);
    }));
  }catch{
    // 通知輪詢失敗不打斷使用
  }
}
document.getElementById('notifyBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const m = document.getElementById('notifyMenu');
  m.classList.toggle('show');
  // 打開看過＝這些都不算新的了（顧問未讀訊息除外，要點進去讀才會消）
  if (m.classList.contains('show')) { bellMarkSeen(); setTimeout(refreshNotifications, 1500); }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.notify-wrap')) document.getElementById('notifyMenu').classList.remove('show');
});
function openFromNotification(appId){
  document.getElementById('notifyMenu').classList.remove('show');
  showTopView('candidates');
  const tryOpen = () => {
    if (CAND_LIST.find(c => c.application_id === appId)) openCandModal(appId);
    else setTimeout(tryOpen, 300);
  };
  tryOpen();
}
// 2026-09-01 加：分頁不在前景時不打這支——20 秒一次、客戶開著這頁掛一整天
// 是背景常態流量，跟顧問後台 tracker 頁同一批問題（見 D1 額度打滿那次的
// 修復註解），沒必要在看不到的分頁還一直刷。
setInterval(function () { if (!document.hidden) refreshNotifications(); }, 40000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshNotifications(); });
refreshNotifications();

load();
