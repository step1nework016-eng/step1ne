<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>用人需求表｜STEP1NE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#c98a1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
/* 人選進度儀表板內容比較寬（漏斗+表格），不該被用人需求表那個 900px 窄版型鎖住——
   跳出 .wrap 的寬度限制，改用自己的寬版容器。 */
#candidatesView{max-width:1400px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding:0 24px}
@media(max-width:640px){#candidatesView{padding:0 12px}}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
header .wrap{display:flex;align-items:center;gap:10px}
header b{font-size:16px}
header span{color:var(--ink3);font-size:13px}
main{padding:24px 0 80px}
.state{max-width:420px;margin:16vh auto;text-align:center;color:var(--ink2)}
.job{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:hidden}
.job > h2{margin:0;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line);background:var(--soft);
 display:flex;align-items:center;gap:10px}
.job > h2 .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:400}
table{width:100%;border-collapse:collapse}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
td.lb{width:170px;color:var(--ink2);font-weight:600;white-space:nowrap;padding-top:13px}
td.vv{width:100%}
td.st{width:70px;text-align:right;padding-top:13px}
textarea,input[type=text]{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
 border-radius:8px;background:#fff;resize:vertical;min-height:38px}
textarea{min-height:56px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:#e3f3e9;color:var(--ok)}
.pill.warn{background:#fdf1de;color:var(--warn)}
.savebar{padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-top:1px solid var(--line)}
button{font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.savebar .saved{font-size:13px;color:var(--ok);opacity:0;transition:opacity .2s}
.savebar .saved.on{opacity:1}
/* 一鍵匯入 */
.import-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px}
.import-box h3{margin:0 0 4px;font-size:15px}
.import-box p.hint{margin:0 0 12px;font-size:13px;color:var(--ink3)}
.import-tabs{display:flex;gap:6px;margin-bottom:12px}
.import-tab{font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.import-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.import-pane{display:none}
.import-pane.on{display:block}
.import-pane input[type=file]{width:100%;font-size:13.5px}
.import-pane input[type=text],.import-pane textarea{width:100%;font:inherit;font-size:13.5px;
 padding:9px 11px;border:1px solid var(--line);border-radius:8px}
.import-pane textarea{min-height:100px}
.import-status{margin-top:10px;font-size:13px;color:var(--ink2)}
.import-status.err{color:var(--bad)}
[data-k].imported{border-color:var(--gold)!important;background:#fdf6e9}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;
 padding:13px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:20px}
.hire-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;color:var(--ink2)}
.hire-box button{padding:7px 16px;font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar input[type=search]{flex:1 1 220px;font:inherit;font-size:14px;padding:9px 13px;border:1px solid var(--line);
 border-radius:10px;background:#fff}
.bar select{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;
 justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.pick:hover{border-color:var(--gold)}
.pick b{font-size:14.5px}
.pick .cnt{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.back{background:transparent;color:var(--ink2);font-weight:600;padding:6px 0;margin-bottom:14px;
 border:0;cursor:pointer;font-size:13.5px}
.back:hover{color:var(--gold)}
.toptabs{display:flex;gap:8px;margin-bottom:18px}
.toptab{font:inherit;font-size:14px;font-weight:700;background:#fff;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.toptab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cand{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.cand .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cand b{font-size:15px}
.cand .meta{font-size:12.5px;color:var(--ink3)}
.cand .row2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.cand select{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.cand button{padding:7px 16px;font-size:13px}
.cand .upd-msg{font-size:12.5px;color:var(--ok);margin-left:4px}
.cand .add-round{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.cand .add-round input[type=text]{width:160px;font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.cand .add-round .hint{font-size:12px;color:var(--ink3);width:100%}
.cand .info-row{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-top:8px}
.cand .info-row .k{color:var(--ink3);font-weight:600;flex:none}
.cand .info-row .v.mut{color:var(--ink3)}
.cand .client-note{background:var(--soft,#faf8f3);border-radius:9px;padding:10px 13px;margin-top:8px;font-size:13.5px}
.cand .client-note .k{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--gold,#a67c3d);text-transform:uppercase;margin-bottom:4px}
.cand .filebtn{font:inherit;font-size:13px;font-weight:600;color:var(--gold,#a67c3d);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
.cand .report-box{margin-top:10px}
.cand .report-md{background:var(--soft,#faf8f3);border-radius:9px;padding:14px 16px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;max-height:360px;overflow-y:auto}
/* 進度條（跟顧問後台階段條同一套畫法） */
.steps{display:flex;overflow-x:auto;gap:0;padding:10px 4px 4px}
.step{position:relative;flex:1 1 0;min-width:84px;text-align:center}
.step .ln{position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0;border-radius:999px}
.step:first-child .ln{display:none}
.step.done .ln{background:var(--gold)}
.step .dot{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:30px;height:30px;
 margin:0 auto 9px;border-radius:50%;background:#fff;border:2.5px solid var(--line);font-size:13px;font-weight:900;color:#fff}
.step.done .dot{background:var(--gold);border-color:var(--gold)}
.step.now .dot{border-color:var(--gold);background:#fff;box-shadow:0 0 0 5px #fdf1de}
.step .lb{font-size:11.5px;color:var(--ink3);margin-top:0;line-height:1.4;font-weight:600}
.step.now .lb{color:var(--gold);font-weight:800}
.step.done .lb{color:var(--ink2);font-weight:700}
.step.done .lb{color:var(--ink2)}
#mask{position:fixed;inset:0;background:rgba(35,38,45,.45);z-index:40}
#savedModal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(360px,90vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);
 padding:28px 24px;text-align:center}
#savedModal .ico{font-size:34px;color:var(--ok);margin-bottom:10px}
#savedModal h3{margin:0 0 8px;font-size:17px}
#savedModal p{margin:0 0 20px;font-size:13.5px;color:var(--ink2)}
#savedModal .row{display:flex;gap:8px;justify-content:center}
#savedModal button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
/* 通知鈴鐺 */
.notify-wrap{position:relative;margin-left:auto}
.notify-btn{position:relative;width:34px;height:34px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.notify-btn svg{width:17px;height:17px;flex-shrink:0}
.notify-badge{position:absolute;right:-5px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.notify-badge.show{display:flex}
.notify-menu{position:absolute;right:0;top:42px;width:300px;max-width:80vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(35,30,15,.16);padding:8px;z-index:60;display:none}
.notify-menu.show{display:block}
.notify-item{padding:9px 10px;border-radius:9px;cursor:pointer;border-top:1px solid var(--line);font-size:13px}
.notify-item:first-of-type{border-top:0}
.notify-item:hover{background:var(--soft)}
.notify-item b{display:block;font-size:13px}
.notify-item span{font-size:12px;color:var(--ink3);display:block;margin-top:2px}
.notify-empty{padding:16px 10px;text-align:center;color:var(--ink3);font-size:13px}
/* 人選訊息串 */
.chat-box{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:10px}
.chat-window{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.chat-msg{max-width:82%;padding:8px 10px;border-radius:11px;font-size:13px;line-height:1.55}
.chat-msg.client{align-self:flex-end;background:#fdf1de}
.chat-msg.consultant{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.chat-msg .t{font-size:10.5px;color:var(--ink3);margin-top:3px;text-align:right}
.chat-compose{display:flex;gap:6px}
.chat-compose textarea{flex:1;min-height:38px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.chat-compose button{padding:7px 14px;font-size:12.5px}
.unread-dot{display:inline-flex;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle}

/* 人選進度儀表板 */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.dash-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.dash-stat .lb{font-size:12px;color:var(--ink3);margin-bottom:5px}
.dash-stat .vv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.dash-layout{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
.dash-layout>*{min-width:0}
@media(max-width:900px){.dash-layout{grid-template-columns:1fr}}
.dash-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.dash-helper{font-size:12px;color:var(--ink3);line-height:1.6;margin-bottom:12px}
.dash-job-block{margin-bottom:14px}
.dash-job-block:last-child{margin-bottom:0}
.dash-job-block h4{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.dash-funnel-row{margin:8px 0}
.dash-funnel-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.dash-bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.dash-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e0c592);border-radius:999px}
.dash-main-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dash-chips{display:flex;flex-wrap:wrap;gap:7px}
.dash-chip{border:1px solid var(--line);background:var(--soft);color:var(--ink2);padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12.5px}
.dash-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dash-search-area{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dash-search{min-width:200px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
.dash-view-switch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dash-view-btn{border:0;background:#fff;padding:8px 13px;cursor:pointer;font-weight:700;color:var(--ink2);font-size:12.5px}
.dash-view-btn.on{background:var(--ink);color:#fff}
.dash-table-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.dash-table{width:100%;border-collapse:collapse;min-width:960px}
.dash-table td:first-child,.dash-table td:first-child b{white-space:nowrap}
.dash-table th{background:var(--soft);color:var(--ink2);font-size:12.5px;font-weight:800;padding:11px;text-align:left;white-space:nowrap}
.dash-table td{padding:11px;border-top:1px solid var(--line);vertical-align:middle}
.dash-table td:not(:first-child){white-space:nowrap}
.dash-table tr{cursor:pointer}
.dash-table tr:hover td{background:var(--soft)}
.dash-pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--soft);color:var(--gold)}
.dash-pill.now{background:#fdf1de;color:var(--warn)}
.dash-pill.done{background:#e3f3e9;color:var(--ok)}
.dash-pill.rejected{background:#fbeaea;color:var(--bad)}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dash-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-width:0}
.dash-card:hover{border-color:var(--gold)}
.dash-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-card-top>div:first-child{min-width:0}
.dash-card-meta{font-size:11.5px;color:var(--ink3);margin-top:8px}
.dash-card-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.dash-card-info .lb{font-size:11px;color:var(--ink3);margin-bottom:2px}
.dash-card-info .vv{font-size:13px}
.dash-card-progress{display:flex;align-items:center;gap:5px;margin-top:14px}
.dash-card-progress .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0}
.dash-card-progress .dot.done{background:var(--gold)}
.dash-card-progress .ln{flex:1;height:2px;background:var(--line)}
.dash-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.dash-card-foot .hint{font-weight:800;color:var(--gold)}
.dash-empty{padding:36px 16px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:12px}
/* 人選詳情彈窗 */
#candModalMask{position:fixed;inset:0;background:rgba(35,32,20,.4);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#candModalMask.show{display:flex}
.cand-modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line)}
.cand-modal-top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;gap:10px;z-index:2}
.cand-modal-body{padding:16px 18px 20px}
.cand-modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:17px}
.cm-section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cm-section h4{margin:0 0 10px;font-size:14px}
.cm-info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.cm-info-grid .lb{font-size:11px;color:var(--ink3);margin-bottom:2px}
.cm-info-grid .vv{font-size:13px;font-weight:600}
.cm-fbtn{font:inherit;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;text-decoration:none}
.cm-update-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cm-update-grid select,.cm-update-grid input[type=text]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.cm-update-grid button{padding:7px 14px;font-size:12.5px}
.cm-hint{font-size:11.5px;color:var(--ink3);width:100%;margin-top:2px}
</style>

<header><div class="wrap" style="position:relative">
  <b>STEP1NE 用人需求表</b><span id="coname"></span>
  <div class="notify-wrap">
    <button class="notify-btn" id="notifyBtn" title="人選訊息通知">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notify-badge" id="notifyBadge">0</span>
    </button>
    <div class="notify-menu" id="notifyMenu"><div id="notifyList"></div></div>
  </div>
</div></header>

<main class="wrap">
  <div id="loading" class="state">讀取中…</div>
  <div id="content" hidden>
    <div class="toptabs">
      <button type="button" class="toptab on" id="tabCandidates">人選進度</button>
      <button type="button" class="toptab" id="tabJobs">用人需求表</button>
    </div>
    <div id="candidatesView">
      <section class="dash-stats" id="dashStats"></section>
      <div class="dash-layout">
        <aside class="dash-panel">
          <h2 style="margin:0 0 6px;font-size:16px">招募漏斗</h2>
          <div class="dash-helper">依職缺分別統計，顧問接觸中到已到職各階段的人數。</div>
          <div id="dashFunnel"></div>
        </aside>
        <main class="dash-panel">
          <div class="dash-main-top">
            <div class="dash-chips" id="dashChips"></div>
            <div class="dash-search-area">
              <div class="dash-view-switch">
                <button class="dash-view-btn on" id="dashTableBtn" type="button">表格式</button>
                <button class="dash-view-btn" id="dashCardBtn" type="button">卡片式</button>
              </div>
              <input class="dash-search" id="dashSearch" placeholder="搜尋人選 / LINE ID">
            </div>
          </div>
          <div id="dashTableView"></div>
          <div id="dashCardView" hidden></div>
        </main>
      </div>
    </div>
    <div id="pickView" hidden>
      <div class="note">請先從下面選一個職缺開始填寫。黃色標籤代表這格還有資料還沒補上。</div>
      <div class="bar">
        <input type="search" id="q" placeholder="搜尋職缺名稱…">
        <select id="fl">
          <option value="">全部職缺</option>
          <option value="incomplete">尚有欄位待補</option>
          <option value="complete">已全部填寫</option>
        </select>
        <button class="sec" id="newJobBtn" type="button">＋ 新增職缺</button>
      </div>
      <div id="newJobBox" hidden style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">新職缺名稱</label>

</main>

<script>
const API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
const token = new URLSearchParams(location.search).get('t') || '';

// 跟 consultant/job-preview/index.html 的 EMP_LABEL 保持同一份對照——
// 值存英文代碼（跟資料庫、阿財共用的既有慣例一致），畫面一律顯示中文。
const EMPLOYMENT_OPTIONS = { FULL_TIME: '正職', PART_TIME: '兼職', TEMPORARY: '臨時／派遣',
  CONTRACTOR: '承攬／約聘', INTERN: '實習' };

const LABELS = {
  client_name:'公司名稱', client_screen_conditions:'用人條件補充說明', faq_notes:'常見問題／FAQ說明',
  salary_note:'薪資補充說明',
  title:'職缺名稱', client_intro:'公司簡介', hiring_manager:'用人主管',
  years_min:'最低年資要求', must_skills:'必要技能',
  salary_min:'薪資下限', salary_max:'薪資上限', salary_unit:'薪資單位',
  locations:'工作地點', employment:'聘僱型態', onboard_by:'希望到職日',
  team_size:'團隊人數與組成', interview_rounds:'面試次數', interview_who:'面試官', has_test:'是否有測驗',
  client_contact_name:'聯絡窗口', client_contact_phone:'聯絡電話',
  headcount:'需求人數', work_mode:'辦公型態',
  work_hours:'上班時間', leave_policy:'休假方式', employment_period:'工作期間', overtime_policy:'加班情形',
  hiring_reason:'招募原因', urgency:'急迫程度',
  main_duties:'主要工作職責', reports_to:'直接匯報對象', leads_team:'是否帶團隊',
  education_level:'學歷要求', required_conditions:'必備條件', language_requirement:'語言能力',
  nice_to_have_skills:'加分技能／經驗', preferred_background:'偏好背景', personality_traits:'期望人格特質',
  salary_tier_table:'薪資分級表（進階，如不熟悉建議留給顧問填）', salary_structure_note:'薪資結構說明',
  benefits_detail:'福利與津貼', dispatch_to_permanent_policy:'派遣／轉正條件', off_limits_note:'同業限制',
  dispatch_client:'實際要派單位／進駐專案', department:'所屬部門／團隊',
  work_environment_ratio:'工作環境現場比重', attendance_method:'出勤紀錄方式',
  interview_process:'面試流程與關卡', dispatch_range:'專案調派範圍',
  contract_terms_note:'保密／競業／最低服務年限', overtime_detail:'加班細項（進階，如不熟悉建議留給顧問填）',
  onboarding_prep_note:'錄取後前置作業',
};

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let PORTAL_DATA = null;

async function load(){
  if (!token){ document.getElementById('loading').textContent = '這個連結不完整，請跟顧問確認。'; return; }
  let data;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}`);
    data = await res.json();
  }catch{
    document.getElementById('loading').textContent = '連線失敗，請稍後再試。';
    return;
  }
  if (!data.ok){
    document.getElementById('loading').textContent = data.error || '連結無效，請聯繫顧問重新發送。';
    return;
  }
  PORTAL_DATA = data;
  document.getElementById('coname').textContent = data.company.displayName;
  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = false;

  if (!data.jobs.length){
    document.getElementById('picklist').innerHTML = '<div class="state">目前還沒有職缺掛在這個入口，請聯繫顧問。</div>';
    document.querySelector('.bar').hidden = true;
  } else {
    renderPicklist();
  }
  // 用人單位進來第一眼要看到的是「人選進度」，不是內部填表用的「用人需求表」——
  // 兩個分頁對調後，這裡改成預設就把人選資料載進來，不用等使用者自己點分頁。
  loadCandidates();
}

function jobFilled(job, fields){
  return fields.filter(k => job[k] !== null && job[k] !== '').length;
}

function renderPicklist(){
  const fields = PORTAL_DATA.fields;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fl = document.getElementById('fl').value;
  const listEl = document.getElementById('picklist');

  const rows = PORTAL_DATA.jobs.filter(job => {
    if (q && !(job.title || job.slug || '').toLowerCase().includes(q)) return false;
    const filled = jobFilled(job, fields);
    if (fl === 'incomplete' && filled >= fields.length) return false;
    if (fl === 'complete' && filled < fields.length) return false;
    return true;
  });

  if (!rows.length){ listEl.innerHTML = '<div class="state">找不到符合條件的職缺。</div>'; return; }

  listEl.innerHTML = rows.map(job => {
    const pending = job.status === 'pending_review';
    if (pending){
      return `<div class="pick" data-slug="${esc(job.slug)}" data-pending="1" style="opacity:.7">
        <b>${esc(job.title || job.slug)}</b>
        <span class="cnt" style="color:#c98a1e;font-weight:700">審核中</span>
      </div>`;
    }
    // 2026-08-25 加：職缺清單這裡原本完全看不出目前是招募中還是已結束——
    // 點進去才看得到結束招募／重新招募按鈕，客戶不點進去根本不知道有這個功能。
    // 清單就要看得到狀態，不用先猜哪個職缺可能被關掉了才點進去確認。
    let statusBadge = '<span class="cnt" style="color:var(--ok)">● 招募中</span>';
    let hireBtn = job.status === 'open'
      ? `<button type="button" class="sec hire-toggle-btn" data-slug="${esc(job.slug)}" data-action="close" style="padding:4px 10px;font-size:11.5px;margin-top:4px">結束招募</button>`
      : '';
    // 2026-08-25 改：不管是客戶自己關的還是顧問關的，都給「重新招募」按鈕——
    // 兩種情況都要讓客戶能自己重啟。
    if (job.status === 'closed'){
      statusBadge = job.closed_by === 'client'
        ? '<span class="cnt" style="color:#c98a1e;font-weight:700">已結束招募（可重新開啟）</span>'
        : '<span class="cnt" style="color:#c98a1e;font-weight:700">顧問已關閉（可重新開啟）</span>';
      hireBtn = `<button type="button" class="sec hire-toggle-btn" data-slug="${esc(job.slug)}" data-action="reopen" style="padding:4px 10px;font-size:11.5px;margin-top:4px">重新招募</button>`;
    }
    const filled = jobFilled(job, fields);
    return `<div class="pick" data-slug="${esc(job.slug)}">
      <b>${esc(job.title || job.slug)}</b>
      <span class="cnt" style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        ${statusBadge}
        <span style="font-size:11.5px;color:var(--ink3)">已填 ${filled} / ${fields.length}</span>
        ${hireBtn}
      </span>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.pick').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.hire-toggle-btn')) return; // 結束招募／重新招募按鈕自己處理，不要連帶打開職缺
      if (el.dataset.pending) { alert('這個職缺還在等顧問確認，核准後才能編輯內容。'); return; }
      openJob(el.dataset.slug);
    });
  });
  // 2026-08-25 加：結束招募／重新招募直接在清單上就能按，不用先點進職缺才看得到——
  // 客戶之前就是因為這個按鈕藏在職缺內頁，才會覺得「怎麼都沒有」。
  listEl.querySelectorAll('.hire-toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const slug = btn.dataset.slug;
      if (btn.dataset.action === 'close') closeHire(slug, renderPicklist);
      else reopenHire(slug, renderPicklist);
    });
  });
}

document.getElementById('newJobBtn').addEventListener('click', () => {
  document.getElementById('newJobBox').hidden = false;
  document.getElementById('newJobTitle').focus();
});
document.getElementById('newJobCancel').addEventListener('click', () => {
  document.getElementById('newJobBox').hidden = true;
  document.getElementById('newJobTitle').value = '';
});
document.getElementById('newJobSubmit').addEventListener('click', async () => {
  const title = document.getElementById('newJobTitle').value.trim();
  const errEl = document.getElementById('newJobErr');
  errEl.hidden = true;
  if (!title){ errEl.textContent = '請填職缺名稱'; errEl.hidden = false; return; }
  const btn = document.getElementById('newJobSubmit');
  btn.disabled = true;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ title }),
    });
    const data = await res.json();
    if (!data.ok){ errEl.textContent = data.error || '送出失敗'; errEl.hidden = false; btn.disabled = false; return; }
    document.getElementById('newJobBox').hidden = true;
    document.getElementById('newJobTitle').value = '';
    PORTAL_DATA.jobs.push({ slug: data.slug, title, status: 'client_draft' });
    openJob(data.slug);
  }catch{
    errEl.textContent = '連線失敗，請稍後再試'; errEl.hidden = false;
  }
  btn.disabled = false;
});

document.getElementById('q').addEventListener('input', renderPicklist);
document.getElementById('fl').addEventListener('change', renderPicklist);
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('jobView').hidden = true;
  document.getElementById('pickView').hidden = false;
});

function openJob(slug){
  const job = PORTAL_DATA.jobs.find(j => j.slug === slug);
  if (!job) return;
  const jobsEl = document.getElementById('jobs');
  jobsEl.innerHTML = '';
  jobsEl.appendChild(renderJob(job, PORTAL_DATA.fields));
  document.getElementById('pickView').hidden = true;
  document.getElementById('jobView').hidden = false;
}

function renderJob(job, fields){
  const filled = fields.filter(k => job[k] !== null && job[k] !== '').length;
  const div = document.createElement('div');
  div.className = 'job';
  const rows = fields.map(key => {
    const val = job[key] ?? '';
    const has = val !== '';
    const isLong = ['main_duties','required_conditions','benefits_detail','salary_tier_table',
      'overtime_detail','salary_structure_note','dispatch_to_permanent_policy','contract_terms_note',
      'client_intro','client_screen_conditions','faq_notes','salary_note'].includes(key);
    // 2026-08-25 加：聘僱型態原本是自由文字輸入，客戶會直接打進英文代碼
    // （或看到資料庫裡存的 FULL_TIME 這種代碼字串），跟顧問後台/職缺預覽頁
    // 用的翻譯表（EMP_LABEL）兜不起來。改成下拉選單，選項固定、中文顯示，
    // 值還是存英文代碼——跟其他地方讀這個欄位的邏輯保持一致，不用另外改。
    let fieldHtml;
    if (key === 'employment'){
      fieldHtml = `<select data-k="${key}">
        <option value="">— 請選擇 —</option>
        ${Object.entries(EMPLOYMENT_OPTIONS).map(([k, lb]) =>
          `<option value="${k}"${val === k ? ' selected' : ''}>${esc(lb)}</option>`).join('')}
      </select>`;
    } else if (isLong){
      fieldHtml = `<textarea data-k="${key}">${esc(val)}</textarea>`;
    } else {
      fieldHtml = `<input type="text" data-k="${key}" value="${esc(val)}">`;
    }
    return `<tr>
      <td class="lb">${esc(LABELS[key] || key)}</td>
      <td class="vv">${fieldHtml}</td>
      <td class="st">${has ? '<span class="pill ok">已填</span>' : '<span class="pill warn">待補</span>'}</td>
    </tr>`;
  }).join('');
  div.innerHTML = `
    <h2>${esc(job.title || job.slug)}<span class="cnt">已填 ${filled} / ${fields.length}</span></h2>
    ${renderImportBox(job.slug)}
    ${renderHireStateBox(job)}
    <table>${rows}</table>
    <div class="savebar">
      <button data-slug="${esc(job.slug)}" class="save-btn">儲存這個職缺</button>
      <button data-slug="${esc(job.slug)}" class="sec submit-btn" type="button">填完了，送出審核 →</button>
    </div>`;
  div.querySelector('.save-btn').addEventListener('click', (e) => saveJob(job.slug, div, e.target));
  div.querySelector('.submit-btn').addEventListener('click', (e) => submitJob(job.slug, div, e.target));
  wireImportBox(div, job.slug);
  wireHireStateBox(div, job.slug);
  return div;
}

// ── 結束招募／重新招募 ──
function renderHireStateBox(job){
  if (job.status === 'open'){
    return `<div class="hire-box">
      <span>這個職缺目前招募中。</span>
      <button type="button" class="sec close-hire-btn">✓ 已找到人・結束招募</button>
    </div>`;
  }
  // 2026-08-25 改：不管是客戶自己按「結束招募」關的，還是顧問後台關的，
  // 都給客戶「重新招募」按鈕——兩種情況都要讓客戶能自己重啟。
  if (job.status === 'closed'){
    const byLabel = job.closed_by === 'client' ? '你' : '顧問';
    return `<div class="hire-box">
      <span>${byLabel}已標記這個職缺「結束招募」${job.closed_reason ? '（原因：' + esc(job.closed_reason) + '）' : ''}，公開頁面已隱藏、暫不安排新面試。</span>
      <button type="button" class="reopen-btn">重新招募</button>
    </div>`;
  }
  return '';
}
function wireHireStateBox(jobEl, slug){
  const closeBtn = jobEl.querySelector('.close-hire-btn');
  if (closeBtn) closeBtn.addEventListener('click', () => closeHire(slug, () => openJob(slug)));
  const reopenBtn = jobEl.querySelector('.reopen-btn');
  if (reopenBtn) reopenBtn.addEventListener('click', () => reopenHire(slug, () => openJob(slug)));
}
async function closeHire(slug, refreshFn){
  const reason = prompt('請簡單說明結束招募的原因（例如：已透過其他管道找到人選）');
  if (reason === null) return;
  if (!reason.trim()){ alert('請填寫原因'); return; }
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/close-hire`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ reason: reason.trim() }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '送出失敗'); return; }
    const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
    if (jobRecord){ jobRecord.status = 'closed'; jobRecord.closed_by = 'client'; jobRecord.closed_reason = reason.trim(); }
    (refreshFn || (() => openJob(slug)))();
  }catch{
    alert('連線失敗，請稍後再試');
  }
}
async function reopenHire(slug, refreshFn){
  const reason = prompt('請簡單說明重新招募的原因');
  if (reason === null) return;
  if (!reason.trim()){ alert('請填寫原因'); return; }
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/reopen`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ reason: reason.trim() }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '送出失敗'); return; }
    const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
    if (jobRecord){ jobRecord.status = 'open'; jobRecord.closed_by = null; jobRecord.closed_reason = null; }
    (refreshFn || (() => openJob(slug)))();
  }catch{
    alert('連線失敗，請稍後再試');
  }
}

// ── 一鍵匯入 ──
// 三種來源共用同一套流程：POST 建立匯入紀錄 → 輪詢直到本機排程解析完成
// → 把解析出來的值填進表單對應欄位並反白，讓客戶自己確認/修改，
// 不會解析完就自動蓋掉客戶可能已經手動填過的內容而不讓人發現。
function renderImportBox(slug){
  return `
    <div class="import-box" data-slug="${esc(slug)}">
      <h3>一鍵匯入（選填）</h3>
      <p class="hint">有現成的 JD 檔案或連結嗎？上傳或貼上，AI 會自動幫你把內容對應填進下面的表單——填完記得檢查一下對不對。</p>
      <div class="import-tabs">
        <button type="button" class="import-tab on" data-pane="file">上傳檔案</button>
        <button type="button" class="import-tab" data-pane="url">貼連結</button>
        <button type="button" class="import-tab" data-pane="text">貼文字</button>
      </div>
      <div class="import-pane on" data-pane="file">
        <input type="file" class="import-file" multiple accept=".pdf,.docx,.doc,.xlsx,.xls,.txt,.rtf">
        <p class="hint" style="margin:8px 0 0">支援 PDF／Word／Excel，單檔 8MB 以內。</p>
      </div>
      <div class="import-pane" data-pane="url">
        <input type="text" class="import-url" placeholder="貼職缺頁網址，或 Google Docs／Sheets 連結（需設為「知道連結的人可檢視」）">
      </div>
      <div class="import-pane" data-pane="text">
        <textarea class="import-text" placeholder="把 JD 內容直接貼在這裡"></textarea>
      </div>
      <div style="margin-top:12px">
        <button type="button" class="import-submit sec">開始匯入</button>
      </div>
      <div class="import-status" hidden></div>
    </div>`;
}

function wireImportBox(rootEl, slug){
  const box = rootEl.querySelector('.import-box');
  box.querySelectorAll('.import-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      box.querySelectorAll('.import-tab').forEach(t => t.classList.remove('on'));
      box.querySelectorAll('.import-pane').forEach(p => p.classList.remove('on'));
      tab.classList.add('on');
      box.querySelector(`.import-pane[data-pane="${tab.dataset.pane}"]`).classList.add('on');
    });
  });
  box.querySelector('.import-submit').addEventListener('click', () => startImport(rootEl, box, slug));
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startImport(rootEl, box, slug){
  const statusEl = box.querySelector('.import-status');
  const btn = box.querySelector('.import-submit');
  const activePane = box.querySelector('.import-tab.on').dataset.pane;
  statusEl.hidden = false; statusEl.className = 'import-status'; statusEl.textContent = '';
  let payload = null;

  if (activePane === 'file'){
    const input = box.querySelector('.import-file');
    const files = Array.from(input.files || []);
    if (!files.length){ statusEl.className = 'import-status err'; statusEl.textContent = '請先選擇檔案'; return; }
    const tooBig = files.find(f => f.size > 8 * 1024 * 1024);
    if (tooBig){ statusEl.className = 'import-status err';
      statusEl.textContent = `「${tooBig.name}」超過 8MB，請改貼雲端連結或分成多個檔案`; return; }
    btn.disabled = true; statusEl.textContent = '讀取檔案中…';
    const encoded = await Promise.all(files.map(async f => ({ b64: await fileToBase64(f), name: f.name, mime: f.type })));
    payload = { sourceType: 'file', files: encoded };
  } else if (activePane === 'url'){
    const url = box.querySelector('.import-url').value.trim();
    if (!url){ statusEl.className = 'import-status err'; statusEl.textContent = '請貼上連結'; return; }
    payload = { sourceType: 'url', url };
  } else {
    const text = box.querySelector('.import-text').value.trim();
    if (!text){ statusEl.className = 'import-status err'; statusEl.textContent = '請貼上文字內容'; return; }
    payload = { sourceType: 'text', text };
  }

  btn.disabled = true;
  statusEl.textContent = '匯入中，AI 正在讀取內容（通常 1-2 分鐘，可以先做別的事，等一下回來看）…';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/import`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok){ statusEl.className = 'import-status err'; statusEl.textContent = data.error || '匯入失敗'; btn.disabled = false; return; }
    pollImport(rootEl, box, slug, data.importId, statusEl, btn);
  }catch{
    statusEl.className = 'import-status err'; statusEl.textContent = '連線失敗，請稍後再試'; btn.disabled = false;
  }
}

async function pollImport(rootEl, box, slug, importId, statusEl, btn, attempt){
  attempt = attempt || 0;
  if (attempt > 40){ // 本機排程每 2 分鐘跑一次，等超過 6 分鐘就請客戶自己重整
    statusEl.className = 'import-status err';
    statusEl.textContent = '處理時間比預期久，稍後重新整理頁面看看，或改用「貼文字」試試。';
    btn.disabled = false;
    return;
  }
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/imports/${encodeURIComponent(importId)}`);
    const data = await res.json();
    if (!data.ok){ statusEl.className = 'import-status err'; statusEl.textContent = data.error || '查詢失敗'; btn.disabled = false; return; }
    if (data.status === 'parsed'){
      applyImportToForm(rootEl, data.parsed || {});
      const n = Object.keys(data.parsed || {}).length;
      statusEl.className = 'import-status';
      statusEl.textContent = n
        ? `已匯入 ${n} 個欄位（下面金色框起來的），檢查沒問題後記得按「儲存這個職缺」。`
        : '沒有解析出可用的欄位，麻煩手動填寫。';
      btn.disabled = false;
      return;
    }
    if (data.status === 'failed'){
      statusEl.className = 'import-status err';
      statusEl.textContent = data.errorNote || '匯入解析失敗，請改手動填寫';
      btn.disabled = false;
      return;
    }
    setTimeout(() => pollImport(rootEl, box, slug, importId, statusEl, btn, attempt + 1), 9000);
  }catch{
    setTimeout(() => pollImport(rootEl, box, slug, importId, statusEl, btn, attempt + 1), 9000);
  }
}

function applyImportToForm(rootEl, parsed){
  Object.keys(parsed).forEach(key => {
    const el = rootEl.querySelector(`[data-k="${key}"]`);
    if (!el) return;
    el.value = parsed[key];
    el.classList.add('imported');
    const td = el.closest('tr');
    if (td) td.querySelector('.st').innerHTML = '<span class="pill ok">已填</span>';
  });
}

async function submitJob(slug, jobEl, btn){
  if (!confirm('確定要送出審核嗎？送出後這個職缺會鎖住，要等顧問核准或退回才能再修改。')) return;
  btn.disabled = true;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/submit`, {
      method: 'POST', headers: {'content-type':'application/json'},
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '送出失敗'); btn.disabled = false; return; }
    const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
    if (jobRecord) jobRecord.status = 'pending_review';
    alert('已送出審核，顧問確認後會通知你。');
    document.getElementById('jobView').hidden = true;
    document.getElementById('pickView').hidden = false;
    renderPicklist();
  }catch{
    alert('連線失敗，請稍後再試'); btn.disabled = false;
  }
}

async function saveJob(slug, jobEl, btn){
  btn.disabled = true;
  const payload = {};
  jobEl.querySelectorAll('[data-k]').forEach(el => { payload[el.dataset.k] = el.value; });
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}`, {
      method: 'PUT',
      headers: {'content-type':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '儲存失敗'); btn.disabled = false; return; }
    // 補上「待補」狀態即時更新，同時同步回 PORTAL_DATA，回清單時已填數才會是新的
    const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
    jobEl.querySelectorAll('[data-k]').forEach(el => {
      const td = el.closest('tr').querySelector('.st');
      td.innerHTML = el.value ? '<span class="pill ok">已填</span>' : '<span class="pill warn">待補</span>';
      if (jobRecord) jobRecord[el.dataset.k] = el.value;
    });
    showSavedModal();
  }catch{
    alert('連線失敗，請稍後再試');
  }
  btn.disabled = false;
}

let CAND_VIEW = 'table';
let CAND_FILTER = '全部';
let ACTIVE_APP = null;
let CHAT_POLL_TIMER = null;

const FUNNEL_STAGES = [
  ['shortlisted', '顧問接觸中'],
  ['interviewed', '進入 AI 面談'],
  ['passed_screening', '顧問審核通過'],
  ['client_stage', '客戶面談中'],

  document.getElementById('tabJobs').classList.toggle('on', view === 'jobs');

function currentStageOf(c){
  if (c.client_rejected_at) return { key:'rejected', lb:'已婉拒' };
  const steps = c.steps || [];
  return steps.find(s => s.now) || [...steps].reverse().find(s => s.done) || { lb: '尚未開始' };
}
// 卡片/表格的狀態標籤空間有限，顧問回填面試輪次時組出來的完整標籤
// 「人資面談（高階主管）（第二階段）」太長會把版面撐壞——這種窄空間只需要
// 「第幾階段面談」，完整內容還是留在彈窗的「目前狀態」文字裡看得到。
function shortStageLabel(lb){
  const m = String(lb || '').match(/第[一二三四]階段/);
  return m ? `${m[0]}面談` : lb;
}

async function loadCandidates(){
  document.getElementById('dashTableView').innerHTML = '<div class="state">讀取中…</div>';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates`);

    CANDIDATES_LOADED = true;
    CAND_LIST = data.candidates || [];
    renderChips();
    renderTable();
    renderCards();
    loadFunnels();
    refreshNotifications();
  }catch{
    document.getElementById('dashTableView').innerHTML = '<div class="state">連線失敗，請稍後再試。</div>';

async function loadFunnels(){
  const slugs = [...new Set(CAND_LIST.map(c => c.job_slug).filter(Boolean))];
  const statsEl = document.getElementById('dashStats');
  const funnelEl = document.getElementById('dashFunnel');
  if (!slugs.length){ statsEl.innerHTML = ''; funnelEl.innerHTML = '<div class="dash-helper">目前還沒有人選，漏斗數字會在有推薦後出現。</div>'; return; }
  const results = await Promise.all(slugs.map(async slug => {
    try{
      const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/funnel`);
      const data = await res.json();
      const title = (CAND_LIST.find(c => c.job_slug === slug) || {}).job_title || slug;
      return data.ok ? { slug, title, funnel: data.funnel } : null;
    }catch{ return null; }
  }));
  const rows = results.filter(Boolean);
  if (!rows.length){ statsEl.innerHTML = ''; funnelEl.innerHTML = ''; return; }

  // 總覽數字卡：多個職缺就加總，單一職缺就直接顯示
  const totals = {};
  FUNNEL_STAGES.forEach(([k]) => { totals[k] = rows.reduce((sum, r) => sum + (r.funnel[k] || 0), 0); });
  statsEl.innerHTML = FUNNEL_STAGES.map(([k, lb]) =>
    `<div class="dash-stat"><div class="lb">${esc(lb)}</div><div class="vv">${totals[k]}</div></div>`).join('');

  funnelEl.innerHTML = rows.map(r => {
    const max = Math.max(1, ...FUNNEL_STAGES.map(([k]) => r.funnel[k] || 0));
    const barsHtml = FUNNEL_STAGES.map(([k, lb]) => `
      <div class="dash-funnel-row">
        <div class="dash-funnel-head"><span>${esc(lb)}</span><strong>${r.funnel[k] || 0}</strong></div>
        <div class="dash-bar"><span style="width:${Math.max(4, (r.funnel[k] || 0) / max * 100)}%"></span></div>
      </div>`).join('');
    return `<div class="dash-job-block">${rows.length > 1 ? `<h4>${esc(r.title)}</h4>` : ''}${barsHtml}</div>`;
  }).join('');
}

function renderChips(){
  const labels = [...new Set(CAND_LIST.map(c => currentStageOf(c).lb))];
  const chips = ['全部', ...labels];
  document.getElementById('dashChips').innerHTML = chips.map(c => {
    const count = c === '全部' ? CAND_LIST.length : CAND_LIST.filter(x => currentStageOf(x).lb === c).length;
    return `<button type="button" class="dash-chip ${CAND_FILTER === c ? 'on' : ''}" data-chip="${esc(c)}">${esc(shortStageLabel(c))} ${count}</button>`;
  }).join('');
  document.getElementById('dashChips').querySelectorAll('.dash-chip').forEach(btn => {
    btn.addEventListener('click', () => { CAND_FILTER = btn.dataset.chip; renderChips(); renderTable(); renderCards(); });
  });
}

function filteredCandidates(){
  const q = document.getElementById('dashSearch').value.trim().toLowerCase();
  return CAND_LIST.filter(c => {
    if (CAND_FILTER !== '全部' && currentStageOf(c).lb !== CAND_FILTER) return false;
    if (q && !`${c.candidate_name} ${c.line_id_given || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function stagePillClass(s){ return s.key==='rejected' ? 'rejected' : s.now ? 'now' : (s.done ? 'done' : ''); }

// 2026-09-01 改：原本表格欄位是「所有人選 steps.key 的聯集」動態長出來的，
// 面試進度到哪就多長哪一格——Jacky 要的是固定 8 欄，而且「用人單位」以後
// （面試階段／錄取／報到）三格直接在表格上用下拉選單操作，企業自己就能填，
// 不用另外點開人選卡片。「顧問階段」維持唯讀（那是我們自己內部審核的紀錄，
// 不是企業要填的東西）。
const TABLE_COLS = [
  ['confirm', '顧問階段'],
  ['matched', '用人單位'],
  ['interview', '面試階段'],
  ['offer', '錄取'],
  ['onboard', '報到'],
];
const INTERVIEW_STAGE_OPTS = [['stage1', '第一階段'], ['stage2', '第二階段'], ['stage3', '第三階段']];

function stepOf(c, key){ return (c.steps || []).find(s => s.key === key) || null; }
function currentInterviewStage(c){
  // 面試階段欄位收斂 stage1~stage3 成一格——取目前「進行中」的那一關，
  // 沒有進行中的就取已完成裡最後一關（表示上一輪已經過了、等下一輪安排）。
  const steps = c.steps || [];
  const now = steps.find(s => ['stage1', 'stage2', 'stage3'].includes(s.key) && s.now);
  if (now) return now.key;
  const done = [...steps].reverse().find(s => ['stage1', 'stage2', 'stage3'].includes(s.key) && s.done);
  return done ? done.key : '';
}

function renderTable(){
  const list = filteredCandidates();
  const el = document.getElementById('dashTableView');
  if (!list.length){ el.innerHTML = '<div class="dash-empty">目前沒有符合條件的人選</div>'; return; }
  el.innerHTML = `<div class="dash-table-wrap"><table class="dash-table">
    <thead><tr><th>人選</th><th>LINE ID</th><th>推送日</th>${TABLE_COLS.map(([, lb]) => `<th>${esc(lb)}</th>`).join('')}</tr></thead>
    <tbody>${list.map(c => {
      const rejected = !!c.client_rejected_at;
      const confirmS = stepOf(c, 'confirm');
      const confirmCell = !confirmS ? '—' : confirmS.now ? '<span class="dash-pill now">進行中</span>' : confirmS.done ? '<span class="dash-pill done">已完成</span>' : '—';

      const matchedS = stepOf(c, 'matched');
      let matchedCell;
      if (rejected) {
        matchedCell = `<span class="dash-pill rejected" title="${esc(c.client_reject_reason || '')}">已婉拒</span>`;
      } else {
        matchedCell = `<select class="dash-tbl-sel" data-app="${esc(c.application_id)}" data-role="advance">
          <option value="advance">推進</option>
          <option value="decline">不推進</option>
        </select>`;
      }

      const curInterview = currentInterviewStage(c);
      const interviewCell = rejected ? '—' : `<select class="dash-tbl-sel" data-app="${esc(c.application_id)}" data-role="interview">
        <option value="" ${!curInterview ? 'selected' : ''} disabled>尚未開始</option>
        ${INTERVIEW_STAGE_OPTS.map(([k, lb]) => `<option value="${k}" ${curInterview === k ? 'selected' : ''}>${esc(lb)}</option>`).join('')}
      </select>`;

      const offerDone = !!(stepOf(c, 'offer') || {}).done;
      const offerCell = rejected ? '—' : `<select class="dash-tbl-sel" data-app="${esc(c.application_id)}" data-role="offer">
        <option value="" ${!offerDone ? 'selected' : ''} disabled>尚未決定</option>
        <option value="offer" ${offerDone ? 'selected' : ''}>錄取</option>
        <option value="decline">不錄取</option>
      </select>`;

      const onboardDone = !!(stepOf(c, 'onboard') || {}).done;
      const onboardCell = rejected ? '—' : `<select class="dash-tbl-sel" data-app="${esc(c.application_id)}" data-role="onboard">
        <option value="" ${!onboardDone ? 'selected' : ''} disabled>尚未決定</option>
        <option value="onboard" ${onboardDone ? 'selected' : ''}>報到</option>
        <option value="decline">不報到</option>
      </select>`;

      return `<tr data-app="${esc(c.application_id)}">
        <td><b>${esc(c.candidate_name)}</b><div style="font-size:12px;color:var(--ink3)">${esc(c.job_title || c.job_slug)}</div></td>
        <td>${esc(c.line_id_given || '尚未提供')}</td>
        <td>${esc((c.forwarded_at || '').slice(0, 10))}</td>
        <td>${confirmCell}</td>
        <td>${matchedCell}</td>
        <td>${interviewCell}</td>
        <td>${offerCell}</td>
        <td>${onboardCell}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  wireOpenButtons(el);
  wireTableSelects(el);
}

// 表格上的下拉選單是企業自己操作進度用的，不能點了反而順便打開人選彈窗
// （彈窗裡也有一樣的操作，兩邊會互相蓋掉彼此還沒送出的選擇）。
function wireTableSelects(root){
  root.querySelectorAll('select.dash-tbl-sel').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', (e) => {
      e.stopPropagation();
      tblHandleChange(sel.dataset.app, sel.dataset.role, sel.value, sel);
    });
  });
}

async function tblHandleChange(appId, role, value, sel){
  const prevValue = [...sel.options].find(o => o.defaultSelected)?.value ?? '';
  if (role === 'advance') {
    if (value === 'advance') return; // 已經是預設狀態，不用送出
    const reason = prompt('請說明不推進的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
    if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
    await tblReject(appId, reason.trim(), sel, prevValue);
    return;
  }
  if (role === 'interview') {
    if (!value) return;
    const lb = (INTERVIEW_STAGE_OPTS.find(([k]) => k === value) || [])[1] || value;
    if (!confirm(`確定要把這位人選的面試階段更新為「${lb}」嗎？`)) { sel.value = prevValue; return; }
    await tblSetStage(appId, value, {}, sel, prevValue);
    return;
  }
  if (role === 'offer') {
    if (value === 'decline') {
      const reason = prompt('請說明不錄取的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
      if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
      await tblReject(appId, reason.trim(), sel, prevValue);
    } else if (value === 'offer') {
      const note = prompt('錄取原因（選填，顧問會看到）') || '';
      await tblSetStage(appId, 'offer', { note: note.trim() || undefined }, sel, prevValue);
    }
    return;
  }
  if (role === 'onboard') {
    if (value === 'decline') {
      const reason = prompt('請說明不報到的原因（顧問會看到，這會幫助我們調整後續推薦方向）');
      if (reason === null || !reason.trim()) { sel.value = prevValue; return; }
      await tblReject(appId, reason.trim(), sel, prevValue);
    } else if (value === 'onboard') {
      const today = new Date().toISOString().slice(0, 10);
      const date = prompt('預計報到日期（格式 YYYY-MM-DD）', today);
      if (date === null) { sel.value = prevValue; return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())) { alert('日期格式不對，請用 YYYY-MM-DD'); sel.value = prevValue; return; }
      await tblSetStage(appId, 'onboard', { onboard_date: date.trim() }, sel, prevValue);
    }
    return;
  }
}

async function tblSetStage(appId, stage, extra, sel, prevValue){
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/stage`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ stage, ...extra }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '更新失敗'); if (sel) sel.value = prevValue; return; }
    await loadCandidates();
    if (ACTIVE_APP === appId) openCandModal(appId);
  }catch{
    alert('連線失敗，請稍後再試');
    if (sel) sel.value = prevValue;
  }
}

async function tblReject(appId, reason, sel, prevValue){
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/reject`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ reason }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '送出失敗'); if (sel) sel.value = prevValue; return; }
    await loadCandidates();
    if (ACTIVE_APP === appId) openCandModal(appId);
  }catch{
    alert('連線失敗，請稍後再試');
    if (sel) sel.value = prevValue;
  }
}

function renderCards(){
  const list = filteredCandidates();
  const el = document.getElementById('dashCardView');
  if (!list.length){ el.innerHTML = '<div class="dash-empty">目前沒有符合條件的人選</div>'; return; }
  el.innerHTML = `<div class="dash-cards">${list.map(c => {
    const cur = currentStageOf(c);
    const steps = c.steps || [];
    const dotsHtml = steps.map((s, i) => `<span class="dot ${s.done ? 'done' : ''}"></span>${i < steps.length - 1 ? '<span class="ln"></span>' : ''}`).join('');
    return `<div class="dash-card cm-openbtn" data-app="${esc(c.application_id)}">
      <div class="dash-card-top">
        <div><b>${esc(c.candidate_name)}</b><div style="font-size:12px;color:var(--ink3)">${esc(c.job_title || c.job_slug)}</div></div>
        <span class="dash-pill ${stagePillClass(cur)}">${esc(shortStageLabel(cur.lb))}</span>
      </div>
      <div class="dash-card-info">
        <div><div class="lb">首次聯繫</div><div class="vv">${esc((c.forwarded_at || '').slice(0, 10)) || '—'}</div></div>
        <div><div class="lb">LINE ID</div><div class="vv">${esc(c.line_id_given || '尚未提供')}</div></div>
      </div>
      <div class="dash-card-progress">${dotsHtml}</div>
      <div class="dash-card-foot">
        <span>目前狀態：${esc(shortStageLabel(cur.lb))}</span>
        <span class="hint">點擊查看完整人選資料 →</span>
      </div>
    </div>`;
  }).join('')}</div>`;
  wireOpenButtons(el);
}

function wireOpenButtons(root){
  root.querySelectorAll('.cm-openbtn').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); openCandModal(el.dataset.app); });
  });
  // 表格的整列、卡片本身也要能點（不是只有「查看」按鈕才能開），跟 demo 的
  // <tr onclick="openModal(...)"> 行為一致。
  root.querySelectorAll('tr[data-app]').forEach(el => {
    el.addEventListener('click', () => openCandModal(el.dataset.app));
  });
}

// ── 人選詳情彈窗 ──
function openCandModal(appId){
  const c = CAND_LIST.find(x => x.application_id === appId);
  if (!c) return;
  ACTIVE_APP = appId;
  document.getElementById('cmName').textContent = c.candidate_name;
  document.getElementById('cmSub').textContent = `${c.job_title || c.job_slug}　/　目前狀態：${currentStageOf(c).lb}`;
  document.getElementById('cmSteps').innerHTML = (c.steps || []).map(s => `
    <div class="step ${s.done ? 'done' : ''} ${s.now ? 'now' : ''}"><div class="ln"></div><div class="dot">${s.done ? '✓' : ''}</div><div class="lb">${esc(s.lb)}</div></div>
  `).join('');
  document.getElementById('cmInfo').innerHTML = [
    ['LINE ID', c.line_id_given || '尚未提供'],
    ['推送日', (c.forwarded_at || '').slice(0, 10) || '—'],
    ['職缺', c.job_title || c.job_slug || '—'],
    ['目前狀態', currentStageOf(c).lb],
  ].map(([k, v]) => `<div><div class="lb">${esc(k)}</div><div class="vv">${esc(v)}</div></div>`).join('');
  document.getElementById('cmNoteBlock').innerHTML = c.client_note
    ? `<h4>顧問給你的說明</h4><div class="note" style="margin:0">${esc(c.client_note).replace(/\n/g, '<br>')}</div>`
    : `<h4>顧問給你的說明</h4><div style="color:var(--ink3);font-size:13px">尚未提供</div>`;
  document.getElementById('cmFiles').innerHTML = `
    ${c.has_resume ? `<a class="cm-fbtn" href="${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(c.application_id)}/resume" target="_blank" rel="noopener">↓ 下載履歷</a>` : `<span style="font-size:13px;color:var(--ink3)">履歷尚未提供</span>`}
    ${c.has_client_report ? `<button type="button" class="cm-fbtn" id="cmReportBtn">👁 查看初篩報告摘要</button>` : `<span style="font-size:13px;color:var(--ink3)">報告摘要顧問還在準備</span>`}
  `;
  const reportBtn = document.getElementById('cmReportBtn');
  if (reportBtn) reportBtn.addEventListener('click', cmToggleReport);
  document.getElementById('cmReportBox').hidden = true;

  const roundsFull = c.interview_rounds_used >= 4;
  if (c.client_rejected_at){
    document.getElementById('cmUpdateBox').innerHTML = `
      <div class="cm-update-grid" style="flex-direction:column;align-items:stretch;background:#fbeaea;border-radius:8px;padding:10px">
        <b style="color:var(--bad);font-size:13px">已婉拒此人選</b>
        <div style="font-size:13px;margin-top:4px">${esc(c.client_reject_reason || '')}</div>
        <div class="mut" style="font-size:11.5px;margin-top:4px">${esc((c.client_rejected_at||'').slice(0,16))}</div>
      </div>`;
  } else {
    document.getElementById('cmUpdateBox').innerHTML = `
      ${roundsFull ? '' : `<div class="cm-update-grid" style="margin-bottom:10px">
        <select id="cmRoundType">${Object.entries(c.interview_round_types).map(([k, lb]) => `<option value="${esc(k)}">${esc(lb)}</option>`).join('')}</select>
        <input type="text" id="cmRoundNote" placeholder="備註是哪個層級（選填）">
        <button type="button" id="cmRoundAdd">新增下一輪面試</button>
        <span class="upd-msg" id="cmRoundMsg"></span>
        <span class="cm-hint">選這一輪是人資面談還是用人單位主管面談，送出後會依序記成「第一階段」「第二階段」……</span>
      </div>`}
      <div class="cm-update-grid" style="flex-direction:column;align-items:stretch">
        <textarea id="cmStageNote" placeholder="面談結束後的狀況、主管評語等回饋（選填，顧問會看到）" style="width:100%;min-height:60px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;resize:vertical;box-sizing:border-box"></textarea>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
          <select id="cmStagePick">${c.editable_stages.map(s => `<option value="${esc(s.key)}">${esc(s.lb)}</option>`).join('')}</select>
          <button type="button" id="cmStageUpd">更新為此狀態</button>
          <span class="upd-msg" id="cmStageMsg"></span>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <button type="button" id="cmRejectBtn" class="sec" style="color:var(--bad);border-color:#e0b0b0">婉拒此人選</button>
        <span class="upd-msg" id="cmRejectMsg"></span>
      </div>`;
    const roundAddBtn = document.getElementById('cmRoundAdd');
    if (roundAddBtn) roundAddBtn.addEventListener('click', cmAddInterviewRound);
    document.getElementById('cmStageUpd').addEventListener('click', cmUpdateStage);
    document.getElementById('cmRejectBtn').addEventListener('click', cmRejectCandidate);
  }

  document.getElementById('candModalMask').classList.add('show');
  cmLoadChat();
  if (CHAT_POLL_TIMER) clearInterval(CHAT_POLL_TIMER);
  CHAT_POLL_TIMER = setInterval(cmLoadChat, 6000);
}
function closeCandModal(){
  document.getElementById('candModalMask').classList.remove('show');
  if (CHAT_POLL_TIMER){ clearInterval(CHAT_POLL_TIMER); CHAT_POLL_TIMER = null; }
  ACTIVE_APP = null;
}
document.getElementById('cmClose').addEventListener('click', closeCandModal);
document.getElementById('candModalMask').addEventListener('click', (e) => { if (e.target.id === 'candModalMask') closeCandModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCandModal(); });

async function cmToggleReport(){
  const box = document.getElementById('cmReportBox');
  const btn = document.getElementById('cmReportBtn');
  if (!box.hidden){ box.hidden = true; btn.textContent = '👁 查看初篩報告摘要'; return; }
  box.hidden = false;
  box.innerHTML = '<div class="state">讀取中…</div>';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(ACTIVE_APP)}/report`);
    const data = await res.json();
    if (!data.ok || !data.content_client_md){ box.innerHTML = '<div class="state">報告摘要顧問還在準備。</div>'; return; }
    box.innerHTML = `<div class="report-md">${esc(data.content_client_md)}</div>`;
    btn.textContent = '收合報告摘要';
  }catch{
    box.innerHTML = '<div class="state">連線失敗，請稍後再試。</div>';
  }
}

async function cmLoadChat(){
  if (!ACTIVE_APP) return;
  const win = document.getElementById('cmChatWindow');
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(ACTIVE_APP)}/messages`);
    const data = await res.json();
    if (!data.ok) return;
    const msgs = data.messages || [];
    win.innerHTML = msgs.length
      ? msgs.map(m => `<div class="chat-msg ${m.from_role === 'client' ? 'client' : 'consultant'}">
          ${esc(m.content)}<div class="t">${m.from_role === 'client' ? '你' : esc(m.from_name || 'STEP1NE 顧問')}・${esc((m.created_at || '').slice(5, 16))}</div>
        </div>`).join('')
      : '<div class="state" style="margin:8px 0">還沒有訊息，直接在下面輸入傳給顧問。</div>';
    win.scrollTop = win.scrollHeight;
    refreshNotifications();
  }catch{
    // 輪詢失敗不用打斷使用者，下一輪再試
  }
}
document.getElementById('cmChatSend').addEventListener('click', async () => {
  const textarea = document.getElementById('cmChatInput');
  const btn = document.getElementById('cmChatSend');
  const content = textarea.value.trim();
  if (!content || !ACTIVE_APP) return;
  btn.disabled = true;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(ACTIVE_APP)}/messages`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ content }),
    });
    const data = await res.json();
    if (!data.ok){ alert(data.error || '傳送失敗'); btn.disabled = false; return; }
    textarea.value = '';
    await cmLoadChat();
  }catch{
    alert('連線失敗，請稍後再試');
  }
  btn.disabled = false;
});

// ── 通知鈴鐺：跨人選的未讀訊息角標 ──
async function refreshNotifications(){
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/notifications`);
    const data = await res.json();
    if (!data.ok) return;
    const badge = document.getElementById('notifyBadge');
    badge.textContent = data.total_unread;
    badge.classList.toggle('show', data.total_unread > 0);
    const listEl = document.getElementById('notifyList');
    const items = data.items || [];
    listEl.innerHTML = items.length
      ? items.map(it => `<div class="notify-item" data-app="${esc(it.application_id)}">
          <b>${esc(it.name)} <span class="unread-dot">${it.unread_count}</span></b>
          <span>${esc((it.last_message || '').slice(0, 40))}</span>
        </div>`).join('')
      : '<div class="notify-empty">目前沒有未讀訊息</div>';
    listEl.querySelectorAll('.notify-item').forEach(el => {
      el.addEventListener('click', () => openFromNotification(el.dataset.app));
    });
  }catch{
    // 通知輪詢失敗不打斷使用
  }
}
document.getElementById('notifyBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('notifyMenu').classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.notify-wrap')) document.getElementById('notifyMenu').classList.remove('show');
});
function openFromNotification(appId){
  document.getElementById('notifyMenu').classList.remove('show');
  showTopView('candidates');
  const tryOpen = () => {
    if (CAND_LIST.find(c => c.application_id === appId)) openCandModal(appId);
    else setTimeout(tryOpen, 300);
  };
  tryOpen();
}
setInterval(refreshNotifications, 20000);
refreshNotifications();

async function cmAddInterviewRound(){
  const appId = ACTIVE_APP;
  const interviewType = document.getElementById('cmRoundType').value;
  const detailNote = document.getElementById('cmRoundNote').value.trim();
  const btn = document.getElementById('cmRoundAdd');
  const msgEl = document.getElementById('cmRoundMsg');
  btn.disabled = true;
  msgEl.textContent = '';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/add-interview-round`, {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ interview_type: interviewType, detail_note: detailNote || undefined }),
    });
    const data = await res.json();
    if (!data.ok){ msgEl.style.color = 'var(--bad)'; msgEl.textContent = data.error || '新增失敗'; btn.disabled = false; return; }
    msgEl.style.color = 'var(--ok)'; msgEl.textContent = '已新增';
    await loadCandidates();
    if (ACTIVE_APP === appId) openCandModal(appId);
  }catch{
    msgEl.style.color = 'var(--bad)'; msgEl.textContent = '連線失敗，請稍後再試'; btn.disabled = false;
  }
}

async function cmUpdateStage(){
  const appId = ACTIVE_APP;
  const stage = document.getElementById('cmStagePick').value;
  const note = document.getElementById('cmStageNote').value.trim();
  const btn = document.getElementById('cmStageUpd');
  const msgEl = document.getElementById('cmStageMsg');
  btn.disabled = true;
  msgEl.textContent = '';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/stage`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ stage, note: note || undefined }),
    });
    const data = await res.json();
    if (!data.ok){ msgEl.style.color = 'var(--bad)'; msgEl.textContent = data.error || '更新失敗'; btn.disabled = false; return; }
    msgEl.style.color = 'var(--ok)';
    msgEl.textContent = '已更新';
    await loadCandidates();
    if (ACTIVE_APP === appId) openCandModal(appId);
  }catch{
    msgEl.style.color = 'var(--bad)'; msgEl.textContent = '連線失敗，請稍後再試';
  }
  btn.disabled = false;
}

async function cmRejectCandidate(){
  const appId = ACTIVE_APP;
  const msgEl = document.getElementById('cmRejectMsg');
  const reason = prompt('請說明婉拒原因（顧問會看到，這會幫助我們調整後續推薦方向）');
  if (reason === null) return;
  if (!reason.trim()){ msgEl.style.color = 'var(--bad)'; msgEl.textContent = '請填寫原因'; return; }
  if (!confirm('確定要婉拒這位人選嗎？')) return;
  const btn = document.getElementById('cmRejectBtn');
  btn.disabled = true; msgEl.textContent = '處理中…';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/candidates/${encodeURIComponent(appId)}/reject`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ reason: reason.trim() }),
    });
    const data = await res.json();
    if (!data.ok){ msgEl.style.color = 'var(--bad)'; msgEl.textContent = data.error || '送出失敗'; btn.disabled = false; return; }
    await loadCandidates();
    if (ACTIVE_APP === appId) openCandModal(appId);
  }catch{
    msgEl.style.color = 'var(--bad)'; msgEl.textContent = '連線失敗，請稍後再試'; btn.disabled = false;
  }
}

load();
</script>
</html>
