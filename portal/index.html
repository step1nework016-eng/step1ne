<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>客戶專區｜STEP1NE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Sans:wght@500;600&display=swap">
<meta name="description" content="Step1ne 德仁管理顧問｜貴司專屬的用人需求表，填好職缺條件後由顧問為您媒合人選。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Step1ne 德仁管理顧問">
<meta property="og:title" content="用人需求表｜Step1ne 德仁管理顧問">
<meta property="og:description" content="貴司專屬的用人需求表，填好職缺條件後由顧問為您媒合人選。">
<meta property="og:locale" content="zh_TW">
<meta property="og:image" content="https://step1ne.com/assets/og-talent-brand.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://step1ne.com/assets/og-talent-brand.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--gold:#a67c3d;--ink:#23262d;--ink2:#4d5563;--ink3:#8a8d95;--line:#eee7db;--soft:#faf8f3;--bg:#f4f1ea;--ok:#2f8f5b;--bad:#c0392b;--warn:#c98a1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
/* 人選進度儀表板內容比較寬（漏斗+表格），不該被用人需求表那個 900px 窄版型鎖住——
   跳出 .wrap 的寬度限制，改用自己的寬版容器。 */
#candidatesView{max-width:1400px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding:0 24px}
@media(max-width:640px){#candidatesView{padding:0 12px}}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
header .wrap{display:flex;align-items:center;gap:10px}
header b{font-size:16px}
header span{color:var(--ink3);font-size:13px}
main{padding:24px 0 80px}
.state{max-width:420px;margin:16vh auto;text-align:center;color:var(--ink2)}
.job{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:hidden}
.job > h2{margin:0;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line);background:var(--soft);
 display:flex;align-items:center;gap:10px}
.job > h2 .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:400}
table{width:100%;border-collapse:collapse}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
td.lb{width:170px;color:var(--ink2);font-weight:600;white-space:nowrap;padding-top:13px}
td.vv{width:100%}
td.st{width:70px;text-align:right;padding-top:13px}
textarea,input[type=text]{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
 border-radius:8px;background:#fff;resize:vertical;min-height:38px}
textarea{min-height:56px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:#e3f3e9;color:var(--ok)}
.pill.warn{background:#fdf1de;color:var(--warn)}
.savebar{padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-top:1px solid var(--line)}
button{font:inherit;font-weight:700;background:var(--gold);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.savebar .saved{font-size:13px;color:var(--ok);opacity:0;transition:opacity .2s}
.savebar .saved.on{opacity:1}
/* 一鍵匯入 */
.import-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px}
.import-box h3{margin:0 0 4px;font-size:15px}
.import-box p.hint{margin:0 0 12px;font-size:13px;color:var(--ink3)}
.import-tabs{display:flex;gap:6px;margin-bottom:12px}
.import-tab{font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.import-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.import-pane{display:none}
.import-pane.on{display:block}
.import-pane input[type=file]{width:100%;font-size:13.5px}
.import-pane input[type=text],.import-pane textarea{width:100%;font:inherit;font-size:13.5px;
 padding:9px 11px;border:1px solid var(--line);border-radius:8px}
.import-pane textarea{min-height:100px}
.import-status{margin-top:10px;font-size:13px;color:var(--ink2)}
.import-status.err{color:var(--bad)}
[data-k].imported{border-color:var(--gold)!important;background:#fdf6e9}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;
 padding:13px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:20px}
.hire-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;color:var(--ink2)}
.hire-box button{padding:7px 16px;font-size:13px}
/* 面試輪數設定——2026-09-01 從 53 個欄位的表格裡搬出來，獨立成職缺頁最上面
   一個醒目卡片，跟其他純文字欄位在視覺上區分開，不用滑很久才找到。 */
.stage-config-box{background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.stage-config-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stage-config-head b{font-size:14.5px}
.stage-config-summary{font-size:12.5px;font-weight:700;color:var(--gold);background:#fbf2e2;border-radius:999px;padding:3px 11px}
.stage-config-sub{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.stage-config-opts{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.stage-config-opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.stage-config-opts input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.stage-config-opts input[type=checkbox]:disabled{cursor:default;opacity:.5}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar input[type=search]{flex:1 1 220px;font:inherit;font-size:14px;padding:9px 13px;border:1px solid var(--line);
 border-radius:10px;background:#fff}
.bar select{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;
 justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.pick:hover{border-color:var(--gold)}
.pick b{font-size:14.5px}
.pick .cnt{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.back{background:transparent;color:var(--ink2);font-weight:600;padding:6px 0;margin-bottom:14px;
 border:0;cursor:pointer;font-size:13.5px}
.back:hover{color:var(--gold)}
.toptabs{display:flex;gap:8px;margin-bottom:18px}
.toptab{font:inherit;font-size:14px;font-weight:700;background:#fff;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.toptab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cand{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.cand .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cand b{font-size:15px}
.cand .meta{font-size:12.5px;color:var(--ink3)}
.cand .row2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.cand select{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.cand button{padding:7px 16px;font-size:13px}
.cand .upd-msg{font-size:12.5px;color:var(--ok);margin-left:4px}
.cand .add-round{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.cand .add-round input[type=text]{width:160px;font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.cand .add-round .hint{font-size:12px;color:var(--ink3);width:100%}
.cand .info-row{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-top:8px}
.cand .info-row .k{color:var(--ink3);font-weight:600;flex:none}
.cand .info-row .v.mut{color:var(--ink3)}
.cand .client-note{background:var(--soft,#faf8f3);border-radius:9px;padding:10px 13px;margin-top:8px;font-size:13.5px}
.cand .client-note .k{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--gold,#a67c3d);text-transform:uppercase;margin-bottom:4px}
.cand .filebtn{font:inherit;font-size:13px;font-weight:600;color:var(--gold,#a67c3d);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
.cand .report-box{margin-top:10px}
.cand .report-md{background:var(--soft,#faf8f3);border-radius:9px;padding:14px 16px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;max-height:360px;overflow-y:auto}
/* 進度條（跟顧問後台階段條同一套畫法） */
.steps{display:flex;overflow-x:auto;gap:0;padding:10px 4px 4px}
.step{position:relative;flex:1 1 0;min-width:84px;text-align:center}
.step .ln{position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0;border-radius:999px}
.step:first-child .ln{display:none}
.step.done .ln{background:var(--gold)}
.step .dot{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:30px;height:30px;
 margin:0 auto 9px;border-radius:50%;background:#fff;border:2.5px solid var(--line);font-size:13px;font-weight:900;color:#fff}
.step.done .dot{background:var(--gold);border-color:var(--gold)}
.step.now .dot{border-color:var(--gold);background:#fff;box-shadow:0 0 0 5px #fdf1de}
.step .lb{font-size:11.5px;color:var(--ink3);margin-top:0;line-height:1.4;font-weight:600}
.step.now .lb{color:var(--gold);font-weight:800}
.step.done .lb{color:var(--ink2);font-weight:700}
.step.done .lb{color:var(--ink2)}
#mask{position:fixed;inset:0;background:rgba(35,38,45,.45);z-index:40}
#savedModal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(360px,90vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);
 padding:28px 24px;text-align:center}
#savedModal .ico{font-size:34px;color:var(--ok);margin-bottom:10px}
#savedModal h3{margin:0 0 8px;font-size:17px}
#savedModal p{margin:0 0 20px;font-size:13.5px;color:var(--ink2)}
#savedModal .row{display:flex;gap:8px;justify-content:center}
#savedModal button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
/* 通知鈴鐺 */
.notify-wrap{position:relative;margin-left:auto}
.notify-btn{position:relative;width:34px;height:34px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.notify-btn svg{width:17px;height:17px;flex-shrink:0}
.notify-badge{position:absolute;right:-5px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.notify-badge.show{display:flex}
.notify-menu{position:absolute;right:0;top:42px;width:300px;max-width:80vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(35,30,15,.16);padding:8px;z-index:60;display:none}
.notify-menu.show{display:block}
.notify-item{padding:9px 10px;border-radius:9px;cursor:pointer;border-top:1px solid var(--line);font-size:13px}
.notify-item:first-of-type{border-top:0}
.notify-item:hover{background:var(--soft)}
.notify-item b{display:block;font-size:13px}
.notify-item span{font-size:12px;color:var(--ink3);display:block;margin-top:2px}
.notify-empty{padding:16px 10px;text-align:center;color:var(--ink3);font-size:13px}
/* 人選訊息串 */
.chat-box{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:10px}
.chat-window{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.chat-msg{max-width:82%;padding:8px 10px;border-radius:11px;font-size:13px;line-height:1.55}
.chat-msg.client{align-self:flex-end;background:#fdf1de}
.chat-msg.consultant{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.chat-msg .t{font-size:10.5px;color:var(--ink3);margin-top:3px;text-align:right}
.chat-compose{display:flex;gap:6px}
.chat-compose textarea{flex:1;min-height:38px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.chat-compose button{padding:7px 14px;font-size:12.5px}
.unread-dot{display:inline-flex;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle}

/* 人選進度儀表板 */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.dash-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.dash-stat .lb{font-size:12px;color:var(--ink3);margin-bottom:5px}
.dash-stat .vv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.dash-layout{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
.dash-layout>*{min-width:0}
@media(max-width:900px){.dash-layout{grid-template-columns:1fr}}
.dash-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.dash-helper{font-size:12px;color:var(--ink3);line-height:1.6;margin-bottom:12px}
.dash-job-block{margin-bottom:14px}
.dash-job-block:last-child{margin-bottom:0}
.dash-job-block h4{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.dash-funnel-row{margin:8px 0}
.dash-funnel-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.dash-bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.dash-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e0c592);border-radius:999px}
.dash-main-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dash-chips{display:flex;flex-wrap:wrap;gap:7px}
.dash-chip{border:1px solid var(--line);background:var(--soft);color:var(--ink2);padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12.5px}
.dash-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dash-search-area{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dash-search{min-width:200px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
.dash-view-switch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dash-view-btn{border:0;background:#fff;padding:8px 13px;cursor:pointer;font-weight:700;color:var(--ink2);font-size:12.5px}
.dash-view-btn.on{background:var(--ink);color:#fff}
.dash-table-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.dash-table{width:100%;border-collapse:collapse;min-width:960px}
.dash-table td:first-child,.dash-table td:first-child b{white-space:nowrap}
.dash-table th{background:var(--soft);color:var(--ink2);font-size:12.5px;font-weight:800;padding:11px;text-align:left;white-space:nowrap}
.dash-table td{padding:11px;border-top:1px solid var(--line);vertical-align:middle}
.dash-table td:not(:first-child){white-space:nowrap}
.dash-table tr{cursor:pointer}
.dash-table tr:hover td{background:var(--soft)}
.dash-pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--soft);color:var(--gold)}
.dash-pill.now{background:#fdf1de;color:var(--warn)}
.dash-pill.done{background:#e3f3e9;color:var(--ok)}
.dash-pill.rejected{background:#fbeaea;color:var(--bad)}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dash-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-width:0}
.dash-card:hover{border-color:var(--gold)}
.dash-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-card-top>div:first-child{min-width:0}
.dash-card-meta{font-size:11.5px;color:var(--ink3);margin-top:8px}
.dash-card-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.dash-card-info .lb{font-size:11px;color:var(--ink3);margin-bottom:2px}
.dash-card-info .vv{font-size:13px}
.dash-card-progress{display:flex;align-items:center;gap:5px;margin-top:14px}
.dash-card-progress .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0}
.dash-card-progress .dot.done{background:var(--gold)}
.dash-card-progress .ln{flex:1;height:2px;background:var(--line)}
.dash-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.dash-card-foot .hint{font-weight:800;color:var(--gold)}
.dash-empty{padding:36px 16px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:12px}
/* 人選詳情彈窗 */
#candModalMask{position:fixed;inset:0;background:rgba(35,32,20,.4);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#candModalMask.show{display:flex}
#dtModalMask{position:fixed;inset:0;background:rgba(35,32,20,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#dtModalMask.show{display:flex}
#slotsModalMask{position:fixed;inset:0;background:rgba(35,32,20,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#slotsModalMask.show{display:flex}
.dt-modal{width:min(360px,92vw);background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px 20px}
#billModalMask{position:fixed;inset:0;background:rgba(35,32,20,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#billModalMask.show{display:flex}
.bill-modal{width:min(480px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px 22px}
.bill-modal .close{float:right;width:28px;height:28px;min-width:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:inherit}
tr.billRow{cursor:pointer}
tr.billRow:hover td{background:var(--soft)}
/* 收費進程表只有 5 欄，不像人選進度表需要 8 欄橫向捲動的寬度——沿用
   .dash-table 的 min-width:960px 會讓手機版把「到職多久」「收款進度」
   擠到螢幕外，還看不出來可以滑。這裡蓋掉，讓它照內容自然寬度排版。 */
.dash-table.bill-table{min-width:0}
@media(max-width:640px){
  .dash-table.bill-table td:not(:first-child),.dash-table.bill-table th{white-space:normal}
  .bill-table th,.bill-table td{font-size:12.5px;padding:9px 6px}
}
.progress{display:inline-block;width:70px;height:6px;border-radius:999px;background:#eee7db;overflow:hidden;vertical-align:middle;margin-right:6px}
.progress i{display:block;height:100%;background:#2f8f5b}
.cand-modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line)}
.cand-modal-top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;gap:10px;z-index:2}
.cand-modal-body{padding:16px 18px 20px}
.cand-modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;font-size:17px;line-height:1}
.cm-section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cm-section h4{margin:0 0 10px;font-size:14px}
.cm-info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.cm-info-grid .lb{font-size:11px;color:var(--ink3);margin-bottom:2px}
.cm-info-grid .vv{font-size:13px;font-weight:600}
.cm-fbtn{font:inherit;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;text-decoration:none}
.cm-file-grid{display:flex;flex-wrap:wrap;gap:10px}
.cm-file-item{display:flex;flex-direction:column;gap:5px;min-width:120px}
.cm-file-item .lb{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:4px}
.cm-file-item .lb .ic{font-size:12.5px}
.cm-file-item .wait{font-size:12px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.cm-update-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cm-update-grid select,.cm-update-grid input[type=text]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.cm-update-grid button{padding:7px 14px;font-size:12.5px}
.cm-hint{font-size:11.5px;color:var(--ink3);width:100%;margin-top:2px}
/* ── 用人事實卡片式編輯器（2026-09-03 加，取代原本逐欄表格） ── */
#fcWrap{display:flex;flex-direction:column;gap:10px}
.fcProgBar{font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:10px}
.fcCard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fcCardHead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.fcMid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fcMid b{font-size:14.5px}
.fcMid span{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcDot{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.fcDot.done{background:#e5f4ea;color:var(--ok)}
.fcDot.warn{background:#fbf1e1;color:var(--warn)}
.fcDot.empty{background:var(--soft);color:var(--ink3)}
.fcChev{color:var(--ink3);transition:transform .15s;flex:none}
.fcCard.open .fcChev{transform:rotate(180deg)}
.fcCardBody{max-height:0;overflow:hidden;transition:max-height .2s ease}
.fcCard.open .fcCardBody{max-height:4000px}
.fcCardInner{padding:2px 16px 16px}
.fcBlock{margin-top:12px}
.fcBlock:first-child{margin-top:0}
.fcBlock label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.fcReq{color:var(--bad);font-weight:700}
.fcBlock input[type=text],.fcBlock input:not([type]),.fcBlock textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink)}
.fcBlock textarea{min-height:72px;resize:vertical;line-height:1.6}
.fcBlock.miss input,.fcBlock.miss textarea{border-color:var(--bad)}
.fcHint{font-size:12px;color:var(--ink3);margin-bottom:6px;line-height:1.6}
.fcBlock input.aiFilled,.fcBlock textarea.aiFilled{border-color:var(--gold);background:#fdf6e9}
.fcAiBadge{margin-top:5px;font-size:11.5px;color:var(--gold);font-weight:700}
.fcTimeRow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fcTimeRow input[type=time]{width:auto;flex:1}
.fcTimeDash{color:var(--ink3)}
.fcTimeFallback{font-size:12.5px!important;padding:7px 10px!important}
.fcFlag{margin-top:6px;background:#fbf1e1;border:1px solid #e8d5ab;border-radius:9px;padding:8px 11px;font-size:12px;color:#7a5a22;line-height:1.6}
.fcChipRow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.fcChip{font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;user-select:none}
.fcChip.picked{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.fcMoreToggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gold);font-weight:700;cursor:pointer;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fcN{background:var(--soft);color:var(--ink3);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
.fcMoreWrap{display:none}
.fcMoreWrap.open{display:block}
@keyframes fcJumpFlash{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 rgba(166,124,61,0)}}
.fcJump{animation:fcJumpFlash 1.1s ease}
.fcJump input,.fcJump textarea{border-color:var(--gold)}
#fcMissBanner{display:none;background:#fbeaea;border:1px solid #f3cdc7;color:var(--bad);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:12px}
.fcPvMask{position:fixed;inset:0;background:rgba(35,38,45,.5);display:flex;align-items:center;justify-content:center;z-index:9000;opacity:0;pointer-events:none;transition:opacity .15s}
.fcPvMask.show{opacity:1;pointer-events:auto}
.fcPvBox{background:#fff;border-radius:16px;width:min(520px,92vw);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.fcPvHead{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.fcPvScroll{padding:16px 20px;overflow-y:auto;flex:1}
.fcPvIssues{background:#fbf1e1;border:1px solid #e8d5ab;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#7a5a22;margin-bottom:14px}
.fcPvIssues ul{margin:6px 0 0;padding-left:18px}
.fcPvNote{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.fcPvNote-amber{background:#fbf1e1;border:1px solid #e8d5ab;color:#7a5a22;border-radius:10px;padding:10px 13px}
.fcPvJob .fcHero{margin-bottom:14px}
.fcTag{font-size:11.5px;font-weight:700;color:var(--gold);background:#fbf2e2;border-radius:999px;padding:3px 11px}
.fcPvJob h2{margin:8px 0 4px;font-size:19px}
.fcPvJob .fcHero p{margin:0;color:var(--ink3);font-size:13px}
.fcSpecRow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fcSpecRow dt{color:var(--ink3);margin:0}
.fcSpecRow dd{margin:0;font-weight:700}
.fcPvSection{margin-top:14px}
.fcPvSection h4{margin:0 0 4px;font-size:12.5px;color:var(--ink3)}
.fcPvSection p{margin:0;font-size:13.5px;white-space:pre-wrap}
.fcPvRow{display:flex;gap:8px;padding:3px 0;font-size:13px;align-items:baseline}
.fcPvRow b{color:var(--ink3);font-weight:600;flex:0 0 auto;white-space:nowrap}
.fcPvRow span{white-space:pre-wrap;overflow-wrap:anywhere}
.fcPvFoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fcPvFoot button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.nrec{background:#fdf3e7;border-left:3px solid #8a4b12;border-radius:0 10px 10px 0;
  padding:12px 15px;margin:0 0 14px}
.nrec h4{margin:0 0 6px;font-size:14px;color:#8a4b12}
.nrec-why{font-size:13.5px;line-height:1.7;color:#5c3a12}
.nrec-when{margin-top:7px;font-size:11.5px;color:#9a7a52}
/* ===== 2026-10-28 客戶頁改版（測試版）=====
   版面：頂部品牌列＋三個分頁 → 人選依「等你處理／進行中／已結束」分組成卡片 → 點卡片從右側滑出人選面板（手機全螢幕）
   顏色：冷灰底、深青色主按鈕、橘色只用在「等你處理」；不用米色＋金色 */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#132235; --ink2:#334458; --ink3:#5B6B7E; --line:#DAE2EA; --soft:#EEF3F7;
  --gold:#0D6670; --primary:#0D6670; --primary-ink:#FFFFFF; --primary-soft:#E2F1F2;
  --attn:#9A5A06; --attn-soft:#FFF2DB; --ok:#1D7448; --ok-soft:#E3F3EA; --bad:#B4322A; --bad-soft:#FBE7E5; --warn:#9A5A06;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif; --f-num:"IBM Plex Sans","Noto Sans TC",sans-serif;
}
body{background:var(--bg);color:var(--ink);font:15.5px/1.7 var(--f-body)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{border-radius:10px;min-height:44px;padding:0 18px;background:var(--primary);color:var(--primary-ink)}
button.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
input[type=text],input[type=search],input[type=url],input[type=date],input[type=time],input[type=datetime-local],select,textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 0}
header .wrap{max-width:1180px}
header b{font-size:17px;letter-spacing:.02em}
header .beta-tag{font-size:12px;font-weight:700;color:var(--attn);background:var(--attn-soft);border-radius:999px;padding:2px 10px}
.notify-btn{width:44px;height:44px;border-radius:10px;min-height:44px;padding:0}
.wrap{max-width:1180px}
main{padding:0 0 80px}
.toptabs{display:flex;gap:4px;margin:0 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.toptab{min-height:48px;border-radius:0;background:transparent;color:var(--ink3);border:0;border-bottom:3px solid transparent;padding:0 16px;font-size:15.5px;white-space:nowrap}
.toptab.on{background:transparent;color:var(--primary);border-color:var(--primary)}
.toptab:hover{color:var(--ink)}
#candidatesView{max-width:none;width:auto;margin:0;padding:0}

/* 人選清單 */
.cl-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cl-bar input{flex:1 1 220px;padding:0 12px}
.cl-bar select{flex:0 1 260px;padding:0 10px;max-width:100%}
.cl-group{display:grid;gap:10px;margin-bottom:26px}
.cl-group > h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.cl-group > h2 .n{font-family:var(--f-num);font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--soft);color:var(--ink3)}
.cl-group.todo > h2{color:var(--attn)}
.cl-group.todo > h2 .n{background:var(--attn-soft);color:var(--attn)}
.cl-group .hint{font-size:13.5px;color:var(--ink3);margin:-4px 0 2px}
details.cl-group > summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--ink3)}
details.cl-group > summary::-webkit-details-marker{display:none}
details.cl-group > summary::before{content:"▸";display:inline-block;transition:transform .15s}
details.cl-group[open] > summary::before{transform:rotate(90deg)}
.cc{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(190px,1.2fr) minmax(220px,1.8fr) auto;gap:16px;align-items:center;width:100%;color:var(--ink)}
.cc:hover{border-color:var(--primary)}
.cc:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.cl-group.todo .cc{border-color:#F0D3A3}
.cc .nm{font-weight:700;font-size:16px}
.cc .cjob{font-size:13px;color:var(--ink3);overflow-wrap:anywhere}
.cc .nx{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.cc .nx .lb{display:block;font-size:12px;color:var(--ink3);letter-spacing:.04em}
.cc .go{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.cl-group.todo .cc .go{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.cl-group.ended .cc{opacity:.78}
@media (max-width:820px){.cc{grid-template-columns:1fr;gap:10px}.cc .go{justify-self:start}}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.trk i{height:8px;border-radius:4px;background:var(--line)}
.trk i.d{background:var(--ok)}
.trk i.n{background:var(--primary)}
.trk i.x{background:var(--bad)}
.trk i.g{background:#C9D2DB}
.trk-lb .x{color:var(--bad);font-weight:700}
.trk-lb .g{font-weight:700}
.trk-lb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;color:var(--ink3);margin-top:4px}
.trk-lb .n{color:var(--primary);font-weight:700}
.pl{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pl.todo{background:var(--attn-soft);color:var(--attn)}
.pl.act{background:var(--primary-soft);color:var(--primary)}
.pl.ok{background:var(--ok-soft);color:var(--ok)}
.pl.end{background:var(--soft);color:var(--ink3)}
.cl-empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--ink3)}

/* 人選面板（右側滑出；手機全螢幕） */
#candModalMask{align-items:stretch;justify-content:flex-end;padding:0;background:rgba(15,25,35,.45)}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(15,25,35,.18);animation:dwIn .2s ease-out}
@keyframes dwIn{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dw-top{padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
.dw-top h3{margin:0;font-size:20px}
.dw-top #cmSub{font-size:13.5px;color:var(--ink3)}
.dw-x{width:44px;height:44px;min-height:44px;padding:0;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:22px;line-height:1;flex-shrink:0}
.dw-body{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.bx{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.bx > h4,.bx h4{margin:0;font-size:13.5px;color:var(--ink3);font-weight:700;letter-spacing:.04em}
.bx.next{background:var(--primary-soft);border-color:transparent}
.bx.next.todo{background:var(--attn-soft)}
.bx.next .big{font-size:19px;font-weight:700;line-height:1.45}
.bx.next .when{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:0 1 auto}
.sub-act{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.meet-row{display:flex;gap:8px;flex-wrap:wrap}
.meet-row input{flex:1 1 220px;padding:0 12px;min-width:0}
.meet-state{font-size:13.5px;color:var(--ink3)}
.meet-state.ok{color:var(--ok);font-weight:700}
.meet-state.err{color:var(--bad);font-weight:700}
.nrec{background:var(--bad-soft);border-radius:10px;padding:12px}
.nrec h4{color:var(--bad)!important}
.cm-file-grid{display:flex;flex-wrap:wrap;gap:10px}
.cm-file-item{display:grid;gap:6px;min-width:140px}
.cm-file-item .lb{font-size:12.5px;color:var(--ink3)}
.cm-fbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:10px;font-size:14px;color:var(--primary);background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:700}
.cm-file-item .wait{font-size:13px;color:var(--ink3);background:var(--soft);border-radius:8px;padding:8px 10px}
.chat-window{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:86%;padding:8px 12px;border-radius:12px;font-size:14px;overflow-wrap:anywhere}
.chat-msg.client{align-self:flex-end;background:var(--primary-soft)}
.chat-msg.consultant{align-self:flex-start;background:var(--soft);border:0}
.chat-msg .t{font-size:11px;color:var(--ink3)}
.chat-compose{display:flex;gap:8px;align-items:flex-end}
.chat-compose textarea{flex:1;min-height:44px;font-size:15px;padding:10px 12px}
.chat-compose button{min-height:44px;padding:0 18px;font-size:15px}
.steps{display:flex;gap:0;margin:0}
.step .dot{width:26px;height:26px}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.now .dot{border-color:var(--primary)}
#cmSteps .ln{top:13px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-size:14.5px;z-index:9999;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
#reasonMask{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:85;display:none;align-items:center;justify-content:center;padding:16px}
#reasonMask.show{display:flex}
#reasonMask textarea{width:100%;padding:10px 12px;min-height:96px}
.dt-modal{width:min(440px,94vw);border-radius:14px;padding:20px;background:var(--surface)}
.dt-modal input,.dt-modal textarea{min-height:44px}
.dt-modal .cm-fbtn{min-height:44px}
#slotsModalAddRow{color:var(--primary)!important;min-height:44px;font-weight:700}
.slot-row input,.slot-row select{min-height:44px}
.slot-row .slot-rm{min-height:44px}

/* 職缺需求 */
.note{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:12px}
.bar input,.bar select{min-height:44px}
.picklist{display:grid;gap:10px}
.jc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;cursor:pointer}
.jc:hover{border-color:var(--primary)}
.jc-top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.jc-top b{font-size:16px}
.jc-prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.jc-prog i{display:block;height:100%;background:var(--primary)}
.jc-miss{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;align-items:center}
.jc-miss span{background:var(--attn-soft);color:var(--attn);border-radius:999px;padding:2px 10px}
.jc .btns button{min-height:44px;font-size:14px;padding:0 14px}
.jc .del{background:transparent;border:0;color:var(--ink3);text-decoration:underline;font-weight:500;padding:0 8px}
.job{border-radius:14px;border-color:var(--line)}
.job > h2{background:var(--soft)}
.savebar{background:var(--soft)}
.back{min-height:44px}

/* 收費 */
.pay{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin-bottom:10px}
.pay-top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.pay-top b{font-size:16px}
.inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.inst > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:14px}
.inst .paid{background:var(--ok-soft);border-color:transparent}
.inst .sent{background:var(--primary-soft);border-color:transparent}
.inst .due{background:var(--attn-soft);border-color:transparent}
.bill-modal{border-radius:14px}
.bill-modal .close{width:44px;height:44px;min-width:44px;min-height:44px}

/* 2026-10-28 付款：每一期一張可點的卡＋「付款怎麼走」 */
.inst-card{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:14px;color:var(--ink);background:var(--surface);min-height:44px}
.inst-card:hover{border-color:var(--primary)}
.inst-card:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.inst-card.paid{background:var(--ok-soft);border-color:transparent}
.inst-card.sent{background:var(--primary-soft);border-color:transparent}
.inst-card.due{background:var(--attn-soft);border-color:transparent}
.inst-go{font-size:13px;color:var(--primary);font-weight:700;margin-top:4px}
.payflow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.payflow summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.payflow ol{margin:8px 0 0;padding-left:22px;display:grid;gap:6px;font-size:14.5px}

/* 2026-10-28 付款流程圖：桌機橫排＋箭頭，手機直排 */
.pf{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.pf-step{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;padding:14px 10px;border-radius:12px;background:var(--soft)}
.pf-step:not(:last-child)::after{content:"";position:absolute;right:-17px;top:38px;width:12px;height:12px;border-top:2.5px solid var(--primary);border-right:2.5px solid var(--primary);transform:rotate(45deg)}
.pf-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--primary);border:2px solid var(--primary)}
.pf-ic svg{width:24px;height:24px}
.pf-n{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--ink3)}
.pf-step b{font-size:15px}
.pf-d{font-size:13px;color:var(--ink2);line-height:1.5}
.pf-src{font-size:12px;color:var(--ink3);overflow-wrap:anywhere}
.pf-step.opt{background:var(--surface);border:2px dashed var(--line)}
.pf-step.opt .pf-ic{border-style:dashed}
.pf-opt{font-size:11.5px;font-weight:700;color:var(--attn);background:var(--attn-soft);border-radius:999px;padding:0 8px}
.pf-step.done{background:var(--ok-soft)}
.pf-step.done .pf-ic{color:var(--ok);border-color:var(--ok)}
.pf-note{margin:12px 0 0;font-size:13.5px;color:var(--ink3)}
@media (max-width:820px){
  .pf{grid-template-columns:1fr;gap:18px}
  .pf-step{grid-template-columns:48px 1fr;justify-items:start;text-align:left;column-gap:12px;align-items:center}
  .pf-step .pf-ic{grid-row:span 4}
  .pf-step:not(:last-child)::after{right:auto;left:30px;top:auto;bottom:-14px;transform:rotate(135deg)}
}

/* 職缺地點、小鈴鐺動態 */
.jc-loc{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ink2)}
.jc-loc svg{width:16px;height:16px;color:var(--primary);flex-shrink:0}

.notify-menu{width:340px;max-height:70vh;overflow:auto}
.bell-head{font-weight:700;font-size:13px;color:var(--ink3);padding:6px 10px}
.notify-item{all:unset;box-sizing:border-box;display:grid;gap:2px;width:100%;padding:10px;border-radius:9px;cursor:pointer;border-top:1px solid var(--line);font-size:13.5px;min-height:44px}
.notify-item:hover{background:var(--soft)}
.notify-item.fresh{background:var(--primary-soft)}
.notify-item.fresh .bell-t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.notify-item span{font-size:12.5px;color:var(--ink3)}
.notify-item .bell-t{font-size:13.5px;color:var(--ink)}
.bell-at{font-size:11.5px!important}

const API = 'https://step1ne-backoffice-worker.aiagentg888.workers.dev';

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let PORTAL_DATA = null;

async function load(){
  if (!token){ document.getElementById('loading').textContent = '這個連結不完整，請跟顧問確認。'; return; }
  let data;
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}`);
    data = await res.json();
  }catch{
    document.getElementById('loading').textContent = '連線失敗，請稍後再試。';
    return;
  }
  if (!data.ok){
    document.getElementById('loading').textContent = data.error || '連結無效，請聯繫顧問重新發送。';
    return;
  }
  PORTAL_DATA = data;
  document.getElementById('coname').textContent = data.company.displayName;
  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = false;

  if (!data.jobs.length){
    // 2026-10-28：原本把整條工具列藏起來，「＋新增職缺」也一起不見，新客戶沒辦法自己開第一個職缺
    document.getElementById('picklist').innerHTML = '<div class="cl-empty">還沒有職缺。按右上「＋ 新增職缺」開始填第一個，或請顧問幫你建立。</div>';
    document.getElementById('q').hidden = true; document.getElementById('fl').hidden = true;
  } else {
    renderPicklist();
  }
  // 用人單位進來第一眼要看到的是「人選進度」，不是內部填表用的「用人需求表」——
  // 兩個分頁對調後，這裡改成預設就把人選資料載進來，不用等使用者自己點分頁。
  loadCandidates();
}

  return fields.filter(k => job[k] !== null && job[k] !== '').length;
}

// ===== 2026-10-28 改版（測試版）：職缺清單改卡片，直接寫「還缺哪幾項必填」=====
function jobMissingRequired(job){
  const out = [];
  FC_CARDS.forEach(d => d.core.concat(d.more).forEach(q => {
    if (q.required && (job[q.k] === null || job[q.k] === undefined || job[q.k] === '')) out.push(q.lClient || q.l);
  }));
  return out;
}
// 2026-10-28 Jacky：「每一個職缺名稱下方要顯示工作地點」——同名職缺（兩個 BIM 工程師）也靠地點分得出來。
// locations 有的是純文字、有的是 ['新竹'] 這種清單格式，統一成「新竹、台中」。
function jobLocText(v){
  let s = String(v || '').trim();
  if (!s) return '';
  try { const p = JSON.parse(s.replace(/'/g, '"')); if (Array.isArray(p)) s = p.map(String).join('、'); } catch {}
  return s.replace(/^\[|\]$/g, '').replace(/['"]/g, '').trim();
}
function jobLocHtml(job){
  const loc = jobLocText(job.locations);
  return `<span class="jc-loc"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${loc ? esc(loc) : '<span class="muted-loc">工作地點還沒填</span>'}</span>`;
}
function renderPicklist(){
  const fields = PORTAL_DATA.fields;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fl = document.getElementById('fl').value;
  const listEl = document.getElementById('picklist');
  const rows = PORTAL_DATA.jobs.filter(job => {
    if (q && !(job.title || job.slug || '').toLowerCase().includes(q)) return false;
    const filled = jobFilled(job, fields);
    if (fl === 'incomplete' && filled >= fields.length) return false;
    if (fl === 'complete' && filled < fields.length) return false;
    return true;
  });
  if (!rows.length){ listEl.innerHTML = '<div class="cl-empty">找不到符合條件的職缺。</div>'; return; }
  listEl.innerHTML = rows.map(job => {
    const title = esc(job.title || job.slug);
    if (job.status === 'pending_review'){
      return `<div class="jc" data-slug="${esc(job.slug)}" data-pending="1" style="cursor:default">
        <div class="jc-top"><b>${title}</b><span class="pl todo">顧問確認中</span></div>
        <div class="meet-state">顧問確認後就能修改，通常一個工作天內。</div></div>`;
    }
    const filled = jobFilled(job, fields);
    const pct = Math.round(filled / Math.max(1, fields.length) * 100);
    const miss = jobMissingRequired(job);
    const closed = job.status === 'closed';
    const draft = job.status === 'client_draft';
    // 2026-10-28：顧問核准了但還沒刊登（status='draft'）原本被當成「招募中」，還給了按了會出錯的「結束招募」
    const staging = job.status === 'draft';
    const statusPill = closed
      ? `<span class="pl end">${job.closed_by === 'client' ? '已結束招募' : '顧問已關閉'}</span>`
      : draft ? '<span class="pl todo">還沒送出給顧問</span>'
      : staging ? '<span class="pl act">顧問準備刊登中</span>'
      : '<span class="pl ok">招募中</span>';
    return `<div class="jc" data-slug="${esc(job.slug)}" role="button" tabindex="0" aria-label="打開職缺 ${title}">
      <div class="jc-top"><div style="display:grid;gap:4px"><b>${title}</b>${jobLocHtml(job)}${statusPill}</div>
        <div class="btns">
          <button type="button" class="${miss.length ? '' : 'sec'} open-job-btn">${miss.length ? '繼續填' : '查看／修改'}</button>
          ${(draft || staging) ? '' : `<button type="button" class="sec hire-toggle-btn" data-slug="${esc(job.slug)}" data-action="${closed ? 'reopen' : 'close'}">${closed ? '重新招募' : '結束招募'}</button>`}
        </div></div>
      <div><div class="jc-prog"><i style="width:${pct}%"></i></div><div class="meet-state num" style="margin-top:4px">已填 ${filled} / ${fields.length} 項${filled >= fields.length ? '・全部填好了' : ''}</div></div>
      ${miss.length ? `<div class="jc-miss"><span style="background:none;color:var(--ink3);padding:0">還缺必填：</span>${miss.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      <div><button type="button" class="del delete-job-btn" data-slug="${esc(job.slug)}">刪除這個職缺</button></div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.jc').forEach(el => {
    const open = (e) => {
      if (e.target.closest('.hire-toggle-btn') || e.target.closest('.delete-job-btn')) return;
      if (el.dataset.pending) return;
      openJob(el.dataset.slug);
    };
    el.addEventListener('click', open);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === el) open(e); });
  });
  listEl.querySelectorAll('.hire-toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.dataset.action === 'close') closeHire(btn.dataset.slug, renderPicklist);
      else reopenHire(btn.dataset.slug, renderPicklist);
    });
  });
  listEl.querySelectorAll('.delete-job-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const slug = btn.dataset.slug;
      const job = PORTAL_DATA.jobs.find(j => j.slug === slug);
      if (!(await confirmBox(`確定要刪除「${(job && (job.title || job.slug)) || slug}」這個職缺嗎？如果已經有人應徵過會刪不掉，系統會告訴你原因。`, '刪除'))) return;
      btn.disabled = true;
      try{
        const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}`, { method: 'DELETE' });
        const data = await res.json();
        if (!data.ok){ alert(data.error || '刪除失敗'); btn.disabled = false; return; }
        PORTAL_DATA.jobs = PORTAL_DATA.jobs.filter(j => j.slug !== slug);
        renderPicklist();
      }catch{
        alert('連線失敗，請稍後再試'); btn.disabled = false;
      }
    });
  });
}

// 2026-09-03 加：面試前要先給人選填的資料／測驗，讓用人單位自己上傳，

  box.innerHTML = '<p class="mut">載入中…</p>';
  let forms = [];
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/forms`);
    const data = await res.json();
    forms = (data.ok && data.forms) || [];
  }catch{}
  box.innerHTML = `
    <div class="import-box">
      <h3>面試前要給人選填的資料／測驗（選填）</h3>
      <p class="hint">如果面試前需要人選先填寫某份資料或測驗，直接上傳在這裡——推薦人選給你們的時候，顧問會自動一起寄出，不用你們再傳一次給顧問。</p>
      ${forms.length
        ? '<div style="margin-bottom:12px">' + forms.map(f => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:13.5px">
              <b>${esc(f.name)}</b>
              <button type="button" class="jfDel" data-id="${esc(f.id)}" style="border:0;background:none;color:var(--bad);font-size:13px;cursor:pointer">刪除</button>
            </div>`).join('') + '</div>'
        : '<p class="mut" style="margin:0 0 12px">目前還沒有上傳任何表單。</p>'}
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">新增一份</label>
      <input type="text" id="jfName" placeholder="表單名稱，例如：職前測驗、保密協議">
      <input type="file" id="jfFile" style="margin-top:8px">
      <div style="margin-top:10px"><button type="button" class="sec" id="jfGo">＋ 新增</button> <span id="jfMsg" style="font-size:12.5px;margin-left:8px"></span></div>
    </div>`;
  box.querySelectorAll('.jfDel').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!(await confirmBox('確定要刪除這份表單嗎？已經寄出的不受影響，只是之後不會再自動附上。', '刪除'))) return;
      await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/forms/${encodeURIComponent(btn.dataset.id)}/delete`, { method: 'POST' });
      loadJobForms(slug);
    });
  });
  document.getElementById('jfGo').addEventListener('click', async () => {
    const name = document.getElementById('jfName').value.trim();
    const fileInput = document.getElementById('jfFile');
    const msg = document.getElementById('jfMsg');
    if (!name){ msg.textContent = '請填表單名稱'; msg.style.color = 'var(--bad)'; return; }
    const go = document.getElementById('jfGo');
    go.disabled = true; msg.style.color = 'var(--ink3)'; msg.textContent = '處理中…';
    const submit = async (fileB64, fileName, fileMime) => {
      try{
        const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/forms`, {
          method: 'POST', headers: {'content-type':'application/json'},
          body: JSON.stringify({ name, file_b64: fileB64, file_name: fileName, file_mime: fileMime }),
        });

      const reader = new FileReader();
      reader.onload = () => submit(String(reader.result).split(',')[1], fileInput.files[0].name, fileInput.files[0].type);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      submit(null, null, null);
    }
  });

// 2026-09-01 改：面試輪數設定原本混在下面 53 個欄位的表格裡，長得跟其他
// 純文字欄位一模一樣，Jacky 反映「不直覺，都是填寫文字的設定」——這是
// 結構性設定（決定進度表格長什麼樣），不是職缺描述文字，理應一進來就
// 看得到、跟其他欄位分開，不用往下滑好幾輪才找到。獨立成職缺頁最上面
// 一個醒目區塊，不算進下面「已填 X/Y」那個純文字欄位的完成度統計。
function renderStageConfigBox(job){
  let stages = [];
  try { stages = JSON.parse(job.interview_stage_config || '[]'); } catch { stages = []; }
  const order = ['stage2', 'stage3', 'stage4'];
  const labelOf = { stage2: '第二階段', stage3: '第三階段', stage4: '第四階段' };
  const summary = stages.length
    ? `目前設定：面試到「${labelOf[stages[stages.length - 1]]}」`
    : '目前設定：只有第一階段面談';
  return `<div class="stage-config-box">
    <div class="stage-config-head">
      <b>這個職缺有幾階段面試？</b>
      <span class="stage-config-summary">${esc(summary)}</span>
    </div>
    <div class="stage-config-sub">第一階段面談是每個職缺都有的基本關卡，不用勾選。還有更多輪面試的話在這裡勾起來；也可以在人選面板面完一關時，直接按「還要再面一關」。</div>
    <div class="stage-config-opts">
      ${order.map(k => `<label><input type="checkbox" class="stage-chk" value="${k}"${stages.includes(k) ? ' checked' : ''}> ${labelOf[k]}</label>`).join('')}
    </div>
    <input type="hidden" data-k="interview_stage_config" value='${esc(JSON.stringify(stages))}'>
  </div>`;
}

// 勾選就立刻存檔，不等使用者滑到表單最下面按「儲存這個職缺」——2026-09-01
// 修：Jacky 勾完切走頁面又跳回去，是因為這格原本跟其他 52 個文字欄位一樣
// 只更新畫面上的隱藏欄位，要按最下面的儲存鍵才真的送出。現在這格已經獨立
// 成一個醒目卡片、長得像表格上「選了就生效」的下拉選單，使用者會預期勾了
// 就算數——改成勾選當下直接呼叫 PUT，跟其他欄位的「先填、最後一次存」
// 分開處理。
// 勾第三/四階段時自動連帶勾前面幾關——面試關卡是線性往前推進的，不可能只有
// 第四階段卻沒有第二三階段，中間斷層會讓 resolveStage() 判斷錯亂。
function wireStageConfigBox(root, slug){
  root.querySelectorAll('.stage-config-box').forEach(box => {
    const hidden = box.querySelector('input[type=hidden]');
    const summaryEl = box.querySelector('.stage-config-summary');
    const order = ['stage2', 'stage3', 'stage4'];
    const labelOf = { stage2: '第二階段', stage3: '第三階段', stage4: '第四階段' };
    const sync = async () => {
      const checked = Array.from(box.querySelectorAll('.stage-chk:checked')).map(c => c.value);
      const maxIdx = Math.max(-1, ...checked.map(k => order.indexOf(k)));
      const normalized = order.slice(0, maxIdx + 1);
      box.querySelectorAll('.stage-chk').forEach(c => { c.checked = normalized.includes(c.value); c.disabled = true; });
      hidden.value = JSON.stringify(normalized);
      if (summaryEl) summaryEl.textContent = '儲存中…';
      try{
        const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}`, {
          method: 'PUT', headers: {'content-type':'application/json'},
          // 2026-10-28 修：後端存檔會把 '["stage2"]' 這種陣列「整理」成 'stage2'（sanitizeFactValue），
          // 讀的那邊認不得，勾了第二階段卻一直只有一關（10/20 兩個職缺就這樣）。多包一層字串，整理完剛好還原成陣列。
          body: JSON.stringify({ interview_stage_config: JSON.stringify(hidden.value) }),
        });
        const data = await res.json();
        if (!data.ok){ alert(data.error || '儲存失敗，請重新勾選一次'); if (summaryEl) summaryEl.textContent = '沒有存成功，請重新勾選一次'; box.querySelectorAll('.stage-chk').forEach(c => { c.disabled = false; }); return; }
        const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
        if (jobRecord) jobRecord.interview_stage_config = hidden.value;
      }catch{
        alert('連線失敗，請確認網路連線後重新勾選一次');
      }
      if (summaryEl) summaryEl.textContent = normalized.length
        ? `目前設定：面試到「${labelOf[normalized[normalized.length - 1]]}」`
        : '目前設定：只有第一階段面談';
      box.querySelectorAll('.stage-chk').forEach(c => { c.disabled = false; });
    };
    box.querySelectorAll('.stage-chk').forEach(c => c.addEventListener('change', sync));
  });
}

function renderJob(job, fields){
  const div = document.createElement('div');
  div.className = 'job';
  div.innerHTML = `
    <h2>${esc(job.title || job.slug)}<span class="cnt fcProgBar" id="fcProg" style="margin:0"></span></h2>
    ${renderStageConfigBox(job)}
    ${job.status === 'client_draft' ? renderImportBox(job.slug) : ''}
    ${renderHireStateBox(job)}
    <div id="fcMissBanner"></div>
    <div id="fcWrap"></div>
    <div id="jobFormsBox"></div>
    <div class="savebar">
      ${job.status === 'client_draft'
        ? `<button type="button" class="sec save-btn">存檔（不送審，隨時可以回來改）</button>
      <button type="button" class="submit-btn">看預覽，再送出審核 →</button>`
        : `<button type="button" class="save-btn">儲存修改</button><span class="meet-state">這個職缺已經在顧問那邊，存了就會更新，顧問會收到通知。</span>`}
    </div>`;

  div.querySelector('.save-btn').addEventListener('click', (e) => quickSaveJob(job.slug, e.target));

  wireHireStateBox(div, job.slug);
  wireStageConfigBox(div, job.slug);
  return div;
}

// 「存檔」——不經過預覽，隨時存、隨時可以離開再回來改，client_draft 階段本來就是這樣。
async function quickSaveJob(slug, btn){
  btn.disabled = true;
  const all = fcCollectValues();
  const jobRec = PORTAL_DATA.jobs.find(j => j.slug === slug) || {};
  const norm = (v) => (v === null || v === undefined) ? '' : String(v);
  const payload = {};
  Object.keys(all).forEach(k => { if (norm(all[k]) !== norm(jobRec[k])) payload[k] = all[k]; });
  if (!Object.keys(payload).length) { btn.disabled = false; showSavedModal(); return; }
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}`, {
      method: 'PUT', headers: {'content-type':'application/json'}, body: JSON.stringify(payload),
    });
    const data = await res.json();
    btn.disabled = false;
    if (!data.ok){ alert(data.error || '儲存失敗'); return; }
    const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
    if (jobRecord) Object.assign(jobRecord, payload);
    showSavedModal();
  }catch{
    btn.disabled = false;
    alert('連線失敗，請稍後再試');
  }
}

// 「看預覽，再送出審核」——預覽彈窗確認後才真的存檔＋送審，兩件事綁在一起，
// 呼應「送出前一定要看過一次」這個設計，不是盲送。
async function submitJobWithFacts(slug, values){
  const putRes = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}`, {
    method: 'PUT', headers: {'content-type':'application/json'}, body: JSON.stringify(values),
  });
  const putData = await putRes.json();
  if (!putData.ok){ alert(putData.error || '儲存失敗'); return; }
  const subRes = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/submit`, {
    method: 'POST', headers: {'content-type':'application/json'},
  });
  const subData = await subRes.json();
  if (!subData.ok){ alert(subData.error || '送出失敗'); return; }
  const jobRecord = PORTAL_DATA.jobs.find(j => j.slug === slug);
  if (jobRecord){ Object.assign(jobRecord, values); jobRecord.status = 'pending_review'; }

function wireImportBox(rootEl, slug){

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startImport(rootEl, box, slug){
  const statusEl = box.querySelector('.import-status');
  const btn = box.querySelector('.import-submit');
  const activePane = box.querySelector('.import-tab.on').dataset.pane;
  statusEl.hidden = false; statusEl.className = 'import-status'; statusEl.textContent = '';
  let payload = null;

  if (activePane === 'file'){
    const input = box.querySelector('.import-file');
    const files = Array.from(input.files || []);
    if (!files.length){ statusEl.className = 'import-status err'; statusEl.textContent = '請先選擇檔案'; return; }
    const tooBig = files.find(f => f.size > 8 * 1024 * 1024);
    if (tooBig){ statusEl.className = 'import-status err';
      statusEl.textContent = `「${tooBig.name}」超過 8MB，請改貼雲端連結或分成多個檔案`; return; }
    btn.disabled = true; statusEl.textContent = '讀取檔案中…';
    const encoded = await Promise.all(files.map(async f => ({ b64: await fileToBase64(f), name: f.name, mime: f.type })));
    payload = { sourceType: 'file', files: encoded };
  } else if (activePane === 'url'){
    const url = box.querySelector('.import-url').value.trim();
    if (!url){ statusEl.className = 'import-status err'; statusEl.textContent = '請貼上連結'; return; }
    payload = { sourceType: 'url', url };
  } else {
    const text = box.querySelector('.import-text').value.trim();
    if (!text){ statusEl.className = 'import-status err'; statusEl.textContent = '請貼上文字內容'; return; }
    payload = { sourceType: 'text', text };
  }

  btn.disabled = true;
  statusEl.textContent = '匯入中，AI 正在讀取內容（通常 1-2 分鐘，可以先做別的事，等一下回來看）…';
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/jobs/${encodeURIComponent(slug)}/import`, {
      method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok){ statusEl.className = 'import-status err'; statusEl.textContent = data.error || '匯入失敗'; btn.disabled = false; return; }
    pollImport(rootEl, box, slug, data.importId, statusEl, btn);
  }catch{
    statusEl.className = 'import-status err'; statusEl.textContent = '連線失敗，請稍後再試'; btn.disabled = false;
  }
}

async function pollImport(rootEl, box, slug, importId, statusEl, btn, attempt){
  attempt = attempt || 0;
  if (attempt > 40){ // 本機排程每 2 分鐘跑一次，等超過 6 分鐘就請客戶自己重整
    statusEl.className = 'import-status err';
    statusEl.textContent = '處理時間比預期久，稍後重新整理頁面看看，或改用「貼文字」試試。';
    btn.disabled = false;
    return;
  }
  try{
    const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/imports/${encodeURIComponent(importId)}`);
    const data = await res.json();
    if (!data.ok){ statusEl.className = 'import-status err'; statusEl.textContent = data.error || '查詢失敗'; btn.disabled = false; return; }
    if (data.status === 'parsed'){
      const n = fcApplyImported(data.parsed || {});
      statusEl.className = 'import-status';
      statusEl.textContent = n
        ? `已匯入 ${n} 個欄位（下面金色標「AI 幫你抓的」那些），檢查沒問題後記得存檔。`
        : '沒有解析出可用的欄位，麻煩手動填寫。';
      btn.disabled = false;
      return;
    }
    if (data.status === 'failed'){
      statusEl.className = 'import-status err';
      statusEl.textContent = data.errorNote || '匯入解析失敗，請改手動填寫';
      btn.disabled = false;
      return;
    }
    setTimeout(() => pollImport(rootEl, box, slug, importId, statusEl, btn, attempt + 1), 9000);
  }catch{
    setTimeout(() => pollImport(rootEl, box, slug, importId, statusEl, btn, attempt + 1), 9000);
  }
}

function billTenureText(onboardDate){

// ===== 2026-10-28 改版（測試版）：收費改成一人一張卡，每一期直接攤開；快到期的放最上面提醒 =====
// 2026-10-28 Jacky：付款頁要顯示金額，「但金額要正確」——同一位人選的每一期都要有金額，而且驗算得過
// （未稅＋稅＝含稅、稅是 5%、各期金額比例跟百分比對得上、百分比加起來 100）才顯示；任何一項對不上就不顯示數字，
// 寫「金額確認中」，寧可不給也不能給錯。
const NT = (n) => 'NT$ ' + Number(n).toLocaleString('en-US');
function billAmountsOk(rows){
  if (!rows.length || rows.some(r => [r.amount_untaxed, r.amount_tax, r.amount_taxed].some(v => v === null || v === undefined || isNaN(Number(v))))) return false;
  const total = rows.reduce((s, r) => s + Number(r.amount_untaxed), 0);
  const pctSum = rows.reduce((s, r) => s + Number(r.percent), 0);
  if (!total || Math.abs(pctSum - 100) > 0.01) return false;
  return rows.every(r => {
    const u = Number(r.amount_untaxed), x = Number(r.amount_tax), t = Number(r.amount_taxed);
    return u + x === t && Math.abs(x - u * 0.05) <= 1 && Math.abs(u / total * 100 - Number(r.percent)) <= 0.5;
  });
}
function billAmountHtml(r, ok){
  if (!ok) return '<span class="meet-state">金額確認中</span>';
  return `<span class="num" style="font-size:16px;font-weight:700">${NT(r.amount_taxed)}</span><span class="meet-state num" style="font-size:12.5px">未稅 ${Number(r.amount_untaxed).toLocaleString('en-US')}＋稅 ${Number(r.amount_tax).toLocaleString('en-US')}${r.invoice_no ? '・發票 ' + esc(r.invoice_no) : ''}</span>`;

    html += `<section class="cl-group todo"><h2>該付款了 <span class="n">${dueRows.length}</span></h2>${dueRows.map(({ r, gi }) => `
      <div class="pay" style="border-color:#F0D3A3"><div class="pay-top"><div><b>${esc(r.candidate_name)}</b>　${esc(r.label)}・${esc(r.percent)}%</div>
      <span class="pl todo num">${r.due_date < today ? `已過期 ${overdueDays(r.due_date)} 天（${esc(fmtSlot(r.due_date))} 到期）` : `${esc(fmtSlot(r.due_date))} 到期`}</span></div>
      <div style="display:grid;gap:2px">${billAmountHtml(r, AMT_OK[gi])}</div>
      <div class="btns"><button type="button" class="inst-open" data-gi="${gi}" data-id="${esc(r.id)}">我已匯款，上傳證明</button></div></div>`).join('')}</section>`;
  }
  html += `<section class="cl-group"><h2>已報到人選的付款 <span class="n">${BILL_GROUPS.length}</span></h2>` + BILL_GROUPS.map((rows, gi) => {
    const r0 = rows[0];
    const paidN = rows.filter(x => x.confirmed_received === 'yes' || x.paid).length;
    const allPaid = paidN === rows.length;
    const hasOpen = rows.some(r => instState(r)[0] === '' || instState(r)[0] === 'due');
    return `<div class="pay">
      <div class="pay-top"><div><b>${esc(r0.candidate_name)}</b><div class="meet-state">${esc(r0.job_title)}・<span class="num">${esc(fmtSlot(r0.onboard_date))}</span> 報到・${esc(billTenureText(r0.onboard_date))}</div></div>
        <div style="display:grid;gap:4px;justify-items:end"><span class="pl ${allPaid ? 'ok' : 'act'} num">${allPaid ? '全部付清' : `已付 ${paidN} / ${rows.length} 期`}</span>
        ${AMT_OK[gi] ? `<span class="meet-state num">總額 ${NT(rows.reduce((s, r) => s + Number(r.amount_taxed), 0))}（含稅）</span>` : ''}</div></div>
      <div class="inst">${rows.map(r => { const s = instState(r); return `<button type="button" class="inst-card inst-open ${s[0]}" data-gi="${gi}" data-id="${esc(r.id)}"><b>${esc(r.label)}・${esc(r.percent)}%</b>${billAmountHtml(r, AMT_OK[gi])}<span class="num">到期 ${esc(fmtSlot(r.due_date))}</span><span style="font-weight:700">${esc(s[1])}</span><span class="inst-go">${s[0] === 'paid' ? '看明細 ›' : s[0] === 'sent' ? '看明細 ›' : '上傳證明／看明細 ›'}</span></button>`; }).join('')}</div>
    </div>`;
  }).join('') + `</section>`;
  el.innerHTML = html;
  el.querySelectorAll('.inst-open').forEach(b => b.addEventListener('click', () => openInstModal(Number(b.dataset.gi), b.dataset.id)));
}

// 2026-09-15 加：每一期改成可以直接上傳匯款證明＋選匯款日期，按「確認送出」＝
// 「我已經匯款了」，會通知顧問到 Telegram 按已收到／還沒收到。已經回報過的（不管
// 待確認還是已確認）不能重複送出，避免同一期送兩次搞混顧問要看哪一份證明。
function billStatusBlock(r){
  // 2026-10-28：手動標已收（paid）也算；顧問按「還沒收到」（confirmed_received='no'）要讓客戶能重新上傳
  if (r.confirmed_received === 'yes' || r.paid) {
    return { status: `<span style="color:var(--ok);font-weight:700">✓ 顧問已確認收到</span>`, action: '' };
  }
  if (r.client_submitted_at && r.confirmed_received !== 'no') {
    return { status: `<span style="color:var(--attn);font-weight:700">已回報匯款，等顧問確認</span><br>` +
      `<span style="color:var(--ink3);font-size:13px">匯款日期 ${esc(r.client_transfer_date || '')}</span>`, action: '' };
  }
  const again = r.confirmed_received === 'no';
  return { status: again ? `<span style="color:var(--bad);font-weight:700">顧問還沒收到這筆款項，請確認後重新上傳證明</span>` : `<span style="color:var(--ink3)">還沒付款</span>`, action:
    `<div class="bill-upload" data-id="${esc(r.id)}" style="margin-top:8px;padding:12px;background:var(--soft);border-radius:10px;display:grid;gap:8px">` +
    `<label style="display:grid;gap:4px;font-size:14px">匯款日期<input type="date" class="bu-date" max="${taipeiNow().slice(0, 10)}"></label>` +
    `<label style="display:grid;gap:4px;font-size:14px">匯款單照片或 PDF（選填）<input type="file" class="bu-file" accept="image/*,.pdf" style="min-height:44px"></label>` +
    `<button type="button" class="bu-go">我已匯款，送出</button>` +
    `<div class="bu-msg" style="font-size:13px;color:var(--ink3)"></div></div>` };
}

async function submitBillProof(box){
  const id = box.dataset.id;
  const dateInput = box.querySelector('.bu-date');
  const fileInput = box.querySelector('.bu-file');
  const msg = box.querySelector('.bu-msg');
  const btn = box.querySelector('.bu-go');
  const transferDate = dateInput.value;
  if (!transferDate) { msg.style.color = 'var(--bad)'; msg.textContent = '請選匯款日期'; return; }
  btn.disabled = true; msg.style.color = 'var(--ink3)'; msg.textContent = '送出中…';
  const send = async (fileB64, filename, mime) => {
    try {
      const res = await fetch(`${API}/portal/${encodeURIComponent(token)}/billing/${encodeURIComponent(id)}`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ transfer_date: transferDate, file_b64: fileB64, filename, mime }),
      });
      const data = await res.json();
      if (!data.ok) { btn.disabled = false; msg.style.color = 'var(--bad)'; msg.textContent = data.error || '送出失敗'; return; }
      msg.style.color = '#2f8f5b'; msg.textContent = '已送出，等顧問確認';
      BILLING_LOADED = false;
      loadBilling();
    } catch {
      btn.disabled = false; msg.style.color = 'var(--bad)'; msg.textContent = '連不上伺服器，請稍後再試';
    }
  };
  if (fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = () => send(String(reader.result).split(',')[1], fileInput.files[0].name, fileInput.files[0].type);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    send(null, null, null);
  }
}

function currentStageOf(c){
  // 2026-09-01 改：客戶端字眼統一用「不推進」，跟表格「用人單位」欄的下拉選項
  // （推進／不推進）對齊——「婉拒」聽起來像另一套獨立動作，容易讓人以為
  // 這是分頁跟下拉選單是兩件不同的事。
  if (c.client_rejected_at) return { key:'rejected', lb:'不推進' };
  const steps = c.steps || [];
  return steps.find(s => s.now) || [...steps].reverse().find(s => s.done) || { lb: '尚未開始' };
}
// 卡片/表格的狀態標籤空間有限，顧問回填面試輪次時組出來的完整標籤
// 「人資面談（高階主管）（第二階段）」太長會把版面撐壞——這種窄空間只需要
// 「第幾階段面談」，完整內容還是留在彈窗的「目前狀態」文字裡看得到。
function shortStageLabel(lb){
  const m = String(lb || '').match(/第[一二三四]階段/);
  return m ? `${m[0]}面談` : lb;
}

async function loadCandidates(){
  
  try{

    const data = await res.json();

    CANDIDATES_LOADED = true;
