<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DNPMMRDEC0"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-DNPMMRDEC0');
// 全站唯一的 CTA 是 LINE 連結，把點擊送成事件才知道哪一頁真的帶得到人。
// 用事件委派掛在 document 上，之後新增頁面或改版都不用再動這段。
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href*="lin.ee"]');
  if (!a) return;
  gtag('event', 'line_cta_click', {
    page_path: location.pathname,
    link_text: (a.textContent || '').trim().slice(0, 60)
  });
});
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>正在為您開啟 LINE…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:"PingFang TC","Noto Sans TC",sans-serif;background:#fff;color:#12151a;
       text-align:center;padding:24px}
  .box{max-width:340px}
  .logo{font-size:17px;letter-spacing:.3em;font-weight:700;color:#0b3d5c;margin-bottom:18px}
  .spin{width:26px;height:26px;margin:0 auto 14px;border:3px solid #e3e7ec;border-top-color:#06c755;
        border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{font-size:14px;color:#5d6672;line-height:1.7;margin:0}
  a{display:inline-block;margin-top:16px;background:#06c755;color:#fff;text-decoration:none;
    padding:11px 24px;border-radius:8px;font-weight:700;font-size:14.5px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">STEP1NE</div>
  <div class="spin" id="sp"></div>
  <p id="msg">正在為您開啟 LINE，請稍候…</p>
  <a id="manual" href="https://lin.ee/RR4nQqm" hidden>手動開啟 LINE</a>
</div>
<script>
// 這一頁只做一件事：記下「是誰的哪則貼文帶來這次點擊」，然後把人送去 LINE。
//
// 為什麼要多這一層：直接貼 lin.ee 的話，候選人加進 LINE 之後就完全斷線——
// LINE 不會告訴我們他從哪個連結來的，所以「哪位顧問、哪則貼文真的帶來人」
// 永遠算不出來，發文成效只能看瀏覽數。
//
// ⚠️ 這一頁絕對不能把人卡住：API 掛掉、網路慢、JS 出錯，都要照樣把人送到 LINE。
//    統計掉一筆沒關係，把候選人擋在半路才是真的損失。
(function () {
  var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
  var FALLBACK = 'https://lin.ee/RR4nQqm';
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '', j = q.get('j') || '';
  var done = false;

  function go(url) {
    if (done) return;
    done = true;
    location.replace(url || FALLBACK);
  }
  // 保險絲：2 秒內沒轉走就直接送去 LINE，並露出手動按鈕
  setTimeout(function () {
    if (!done) {
      document.getElementById('sp').hidden = true;
      document.getElementById('msg').textContent = '正在開啟 LINE，如果沒有跳轉請按下方按鈕。';
      document.getElementById('manual').hidden = false;
      go(FALLBACK);
    }
  }, 2000);

  fetch(API + '/go/resolve?c=' + encodeURIComponent(c) + '&j=' + encodeURIComponent(j))
    .then(function (r) { return r.json(); })
    .then(function (d) { go(d && d.url ? d.url : FALLBACK); })
    .catch(function () { go(FALLBACK); });
})();
</script>
</body>
</html>
