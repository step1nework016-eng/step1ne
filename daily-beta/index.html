<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>顧問每日工作台（測試）</title>
<style>
:root{--hdr:#0f2a3d;--pri:#0e6f7a;--ink:#12212e;--bg:#eef3f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.tabs{flex:none;display:flex;gap:6px;align-items:flex-end;background:var(--hdr);padding:8px 12px 0;overflow-x:auto;scrollbar-width:thin}
.tabs [role=tab]{flex:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 18px;min-height:44px;border-radius:10px 10px 0 0;background:#ffffff1c;color:#fff;white-space:nowrap}
.tabs [role=tab]:hover{background:#ffffff38}
.tabs [role=tab][aria-selected=true]{background:var(--bg);color:var(--hdr)}
.tabs .note{margin-left:auto;color:#c9dbe6;font-size:13px;padding:0 6px 10px;white-space:nowrap}
.panel{flex:1;min-height:0;display:none}
.panel.on{display:block}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
@media(max-width:560px){.tabs .note{display:none}}
</style>
</head>
<body>
<div class="tabs" role="tablist" aria-label="版本">
  <button role="tab" id="t-orig" aria-selected="true" aria-controls="p-orig">原版儀表板（保留）</button>
  <button role="tab" id="t-new" aria-selected="false" aria-controls="p-new">一頁工作台（新）</button>
  <span class="note">兩個版本共用同一份瀏覽器資料，原版的企業與人選紀錄，新版也看得到</span>
</div>
<div class="panel on" id="p-orig" role="tabpanel" aria-labelledby="t-orig"></div>
<div class="panel" id="p-new" role="tabpanel" aria-labelledby="t-new"></div>
<script>
const MAP={orig:'original.html',new:'workbench.html'};
const loaded={};
function show(k){
  for(const x of Object.keys(MAP)){
    document.getElementById('t-'+x).setAttribute('aria-selected',x===k?'true':'false');
    document.getElementById('p-'+x).classList.toggle('on',x===k);
  }
  const p=document.getElementById('p-'+k);
  if(!loaded[k]){const f=document.createElement('iframe');f.src=MAP[k];f.title=k==='orig'?'原版儀表板':'一頁工作台';p.appendChild(f);loaded[k]=true}
  try{localStorage.setItem('hh-shell-tab',k)}catch(e){}
  try{history.replaceState(null,'','#'+k)}catch(e){}
}
document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>show(b.id.slice(2))));
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const ks=Object.keys(MAP);const cur=ks.findIndex(k=>document.getElementById('t-'+k).getAttribute('aria-selected')==='true');
  const nx=ks[(cur+(e.key==='ArrowRight'?1:ks.length-1))%ks.length];show(nx);document.getElementById('t-'+nx).focus();
});
let start='orig';
try{const h=location.hash.slice(1);if(MAP[h])start=h;else{const s=localStorage.getItem('hh-shell-tab');if(MAP[s])start=s}}catch(e){}
show(start);
</script>
</body>
</html>
