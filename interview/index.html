<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初步面談｜Step1ne 德仁管理顧問</title>
<!-- 面談室不需要被搜尋引擎收錄，而且網址本身就是憑證 -->
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Noto Sans TC',system-ui,sans-serif;color:#23262d;background:#fff;
  -webkit-font-smoothing:antialiased;line-height:1.75;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
a{color:#a67c3d;}

header{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:12px 18px;border-bottom:1px solid #eee7db;background:#fff;
  padding-top:calc(12px + env(safe-area-inset-top));
}
header img{height:30px;width:auto;}
header .who{min-width:0;}
header .who b{display:block;font-size:14.5px;line-height:1.3;}
header .who span{display:block;font-size:12.5px;color:#8a8d95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.firsthint{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 30px;text-align:center;}
.firsthint p{color:#8a8d95;font-size:14.5px;margin:0;max-width:280px;line-height:1.8;}
.spin{width:26px;height:26px;border:2.5px solid #eee7db;border-top-color:#a67c3d;border-radius:50%;animation:sp .9s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#log{flex:1 1 auto;overflow-y:auto;padding:20px 18px 8px;-webkit-overflow-scrolling:touch;}
.msg{max-width:min(78%,540px);margin:0 0 14px;padding:12px 16px;border-radius:18px;font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.msg.ai{background:#f6f2ea;border:1px solid #eee7db;border-bottom-left-radius:6px;}
.msg.me{background:#23262d;color:#fff;margin-left:auto;border-bottom-right-radius:6px;}
.stamp{font-family:'Space Mono',monospace;font-size:10.5px;color:#b3b5bb;margin:-8px 0 14px;}
.stamp.me{text-align:right;}

.typing{display:flex;gap:5px;align-items:center;padding:14px 18px;}
.typing i{width:7px;height:7px;border-radius:50%;background:#c9c4b8;animation:b 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

footer{
  flex:0 0 auto;border-top:1px solid #eee7db;background:#fff;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}
.bar{display:flex;gap:10px;align-items:flex-end;}
#say{
  flex:1;border:1px solid #e0d9cb;border-radius:22px;padding:11px 16px;
  font:inherit;font-size:16px;/* 16px 以下 iOS 會自動放大整頁 */
  resize:none;max-height:130px;line-height:1.6;outline:0;background:#fff;
}
#say:focus{border-color:#a67c3d;box-shadow:0 0 0 3px rgba(166,124,61,.12);}
#go{
  flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;
  background:#a67c3d;color:#fff;font-size:19px;cursor:pointer;
}
#go:disabled{background:#dcd6c9;cursor:default;}
.hint{font-size:11.5px;color:#a9aab1;margin:8px 4px 0;text-align:center;}

.notice{max-width:560px;margin:14vh auto;padding:0 26px;text-align:center;}
.notice h1{font-size:20px;margin:0 0 12px;}
.notice p{color:#5a5d64;font-size:15.5px;margin:0 0 10px;}
.pill{display:inline-block;background:#f6f2ea;border:1px solid #eee7db;border-radius:999px;padding:6px 14px;font-size:13px;color:#8a5a1a;margin-bottom:16px;}
</style>
</head>
<body>

<div id="boot" class="notice"><p>載入中…</p></div>

<header id="top" hidden>
  <img src="/assets/step1ne-logo.png" alt="Step1ne">
  <div class="who">
    <b>阿財・AI 面談助理</b>
    <span id="sub">—</span>
  </div>
</header>

<div id="hint" class="firsthint" hidden>
  <div class="spin"></div>
  <p>阿財正在看您的履歷與應徵資料，大約需要一分鐘…</p>
</div>
<div id="log" hidden></div>

<footer id="bar" hidden>
  <div class="bar">
    <textarea id="say" rows="1" placeholder="輸入訊息…" autocomplete="off"></textarea>
    <button id="go" type="button" aria-label="送出">↑</button>
  </div>
  <p class="hint">這是 AI 面談助理，對話會提供給真人顧問參考。</p>
</footer>

<script>
// 面談室。網址上的 token 就是憑證，不做登入——多一道註冊就少一半的人願意進來。
var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev';
var T = new URLSearchParams(location.search).get('t') || '';
var lastId = 0, polling = null, waiting = false, ended = false;

var $ = function (id) { return document.getElementById(id); };

function notice(title, body) {
  $('boot').hidden = false;
  $('boot').innerHTML = '<h1>' + title + '</h1><p>' + body + '</p>';
  ['top', 'log', 'bar'].forEach(function (i) { $(i).hidden = true; });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function atBottom() {
  var l = $('log');
  return l.scrollHeight - l.scrollTop - l.clientHeight < 80;
}

function add(m) {
  if (!$('hint').hidden) { $('hint').hidden = true; $('log').hidden = false; }
  var stick = atBottom();
  var mine = m.role === 'candidate';
  var d = document.createElement('div');
  d.className = 'msg ' + (mine ? 'me' : 'ai');
  d.textContent = m.content;
  $('log').appendChild(d);
  var s = document.createElement('div');
  s.className = 'stamp' + (mine ? ' me' : '');
  s.textContent = (m.created_at || '').slice(11, 16);
  $('log').appendChild(s);
  if (m.id > lastId) lastId = m.id;
  if (stick) $('log').scrollTop = $('log').scrollHeight;
}

function typing(on) {
  var t = $('t-ind');
  if (on && !t) {
    t = document.createElement('div');
    t.id = 't-ind'; t.className = 'typing';
    t.innerHTML = '<i></i><i></i><i></i>';
    $('log').appendChild(t);
    $('log').scrollTop = $('log').scrollHeight;
  } else if (!on && t) { t.remove(); }
}

function setEnded() {
  ended = true; waiting = false; typing(false);
  clearInterval(polling);
  $('say').disabled = true; $('go').disabled = true;
  $('say').placeholder = '這場面談已經結束，謝謝您';
}

async function boot() {
  if (T.length < 32) {
    return notice('連結不完整', '請從應徵完成後的頁面或我們寄給您的連結進入。');
  }
  var r, d;
  try {
    r = await fetch(API + '/chat/' + encodeURIComponent(T));
    d = await r.json();
  } catch (e) {
    return notice('連不上伺服器', '請確認網路後重新整理，或稍後再試。');
  }
  if (!d.ok) {
    return notice('找不到這場面談', '連結可能已失效。請與顧問聯繫，或重新填寫應徵表單。');
  }

  $('boot').hidden = true;
  ['top', 'log', 'bar'].forEach(function (i) { $(i).hidden = false; });
  // 開場最久（要讀履歷、職缺、產出第一句），空白畫面會讓人以為壞掉
  if (!(d.messages || []).length) { $('log').hidden = true; $('hint').hidden = false; }
  $('sub').textContent = (d.name ? d.name + '　' : '') + (d.job_title || '');

  (d.messages || []).forEach(add);

  if (d.state === 'done') return setEnded();

  // 第一次進來、還沒有任何對話：先送一個空的開場請求，讓阿財主動開口。
  // 讓候選人先講話的話，多數人會愣在那裡不知道要打什麼。
  if (!(d.messages || []).length) {
    waiting = true; typing(true);
    fetch(API + '/chat/' + encodeURIComponent(T) + '/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: '（候選人已進入面談室）' }),
    }).catch(function () {});
  }

  polling = setInterval(poll, 2000);
  poll();
}

async function poll() {
  if (ended) return;
  try {
    var r = await fetch(API + '/chat/' + encodeURIComponent(T) + '/poll?after=' + lastId);
    var d = await r.json();
    if (!d.ok) return;
    var got = (d.messages || []).filter(function (m) { return m.role !== 'candidate' || m.id > lastId; });
    if (got.length) {
      typing(false);
      got.forEach(function (m) {
        // 開場那句是給後端用的暗號，不要顯示給候選人看
        if (m.role === 'candidate' && m.content === '（候選人已進入面談室）') { if (m.id > lastId) lastId = m.id; return; }
        add(m);
      });
      if (got.some(function (m) { return m.role === 'assistant'; })) { waiting = false; }
    }
    if (waiting) typing(true);
    if (d.state === 'done') setEnded();
  } catch (e) { /* 網路瞬斷不用打擾候選人，下一輪會補回來 */ }
}

async function send() {
  var v = $('say').value.trim();
  if (!v || ended) return;
  $('say').value = ''; $('say').style.height = 'auto';
  add({ id: 0, role: 'candidate', content: v, created_at: new Date().toTimeString().slice(0, 5).padStart(16, ' ') });
  waiting = true; typing(true);
  try {
    var r = await fetch(API + '/chat/' + encodeURIComponent(T) + '/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: v }),
    });
    var d = await r.json();
    if (!d.ok && r.status === 409) setEnded();
  } catch (e) {
    typing(false); waiting = false;
    add({ id: 0, role: 'assistant', content: '（訊息沒送出去，請確認網路後再試一次）', created_at: '' });
  }
}

$('go').addEventListener('click', send);
$('say').addEventListener('keydown', function (e) {
  // 手機用送出鍵，桌機 Enter 直接送、Shift+Enter 換行
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:760px)').matches) {
    e.preventDefault(); send();
  }
});
$('say').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});

boot();
</script>
</body>
</html>
