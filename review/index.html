<!doctype html>
<html lang="zh-Hant">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DNPMMRDEC0"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-DNPMMRDEC0');
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服務心得｜Step1ne 德仁管理顧問</title>
<meta name="description" content="分享您這次求職過程的感受，幫助 Step1ne 把服務做得更好。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<!-- 2026-10-01 Jacky：給人選填服務心得的連結。樣式沿用 /apply/，同一套顏色與欄位。
     可帶參數預先填好：?c=顧問名字&j=面試職缺&o=錄取職缺&ref=識別碼（例：/review/?c=Phoebe&j=遊戲客服專員&o=遊戲客服專員） -->
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#dfe4ec;--tx:#16202e;--tx2:#4d5c72;--tx3:#7c8899;
      --ac:#2f5fd8;--rd:#c0392b;--soft:#f6f8fb;--star:#f2a516;
      --sans:-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
     line-height:1.7;-webkit-text-size-adjust:100%}
.top{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{height:34px;width:auto;display:block}
.top .brand{font-size:13px;color:var(--tx3);letter-spacing:.02em}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 64px}
h1{font-size:23px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--tx2);font-size:14px;margin:0 0 22px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin:0 0 16px;background:var(--card)}
legend{font-size:12px;color:var(--tx3);padding:0 7px;font-weight:600;letter-spacing:.04em}
label,.q{display:block;font-size:13.5px;margin:14px 0 6px;color:var(--tx2)}
fieldset > label:first-of-type,fieldset > .q:first-of-type{margin-top:0}
.req{color:var(--rd)}
input[type=text],input[type=email],textarea{width:100%;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;color:var(--tx);font-size:16px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,95,216,.12)}
textarea{resize:vertical;min-height:110px}
.hint{font-size:12.5px;color:var(--tx3);margin-top:4px}
/* 星等：五顆大按鈕，手機好按（至少 44px），鍵盤也能用 */
.stars{display:flex;gap:6px}
.stars button{width:48px;height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:26px;line-height:1;color:#c9d1dc;cursor:pointer;padding:0}
.stars button.on{color:var(--star);border-color:var(--star);background:#fff8e8}
.stars button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.star-label{font-size:13px;color:var(--tx2);margin-top:6px;min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;
  border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--tx);cursor:pointer;background:#fff}
.chips input{width:18px;height:18px;margin:0;accent-color:var(--ac)}
.chips label:has(input:checked){border-color:var(--ac);background:#eef3ff}
.opts{display:flex;flex-direction:column;gap:8px}
.opts label{margin:0;display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:11px 12px;
  border:1px solid var(--line);border-radius:10px;font-size:14.5px;color:var(--tx);cursor:pointer}
.opts input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ac);flex:none}
.opts label:has(input:checked){border-color:var(--ac);background:#eef3ff}
.opts small{display:block;color:var(--tx3);font-size:12.5px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button.submit{width:100%;min-height:52px;border:0;border-radius:11px;background:var(--ac);color:#fff;
  font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
button.submit:disabled{opacity:.6;cursor:default}
button.submit:focus-visible{outline:3px solid #16202e;outline-offset:2px}
.msg{font-size:14px;margin:10px 0 0;min-height:1.4em}
.msg.err{color:var(--rd)}
.done{display:none;text-align:center;padding:40px 8px}
.done h2{font-size:22px;margin:0 0 8px}
.done p{color:var(--tx2);margin:0 0 18px}
.line-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;
  border-radius:999px;background:#06C755;color:#fff;font-weight:700;text-decoration:none}
.foot{font-size:12px;color:var(--tx3);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a href="/"><img src="/assets/step1ne-logo.png" alt="Step1ne 德仁管理顧問"></a>
  <span class="brand">德仁管理顧問</span>
</header>
<main class="wrap">
  <div id="formBox">
    <h1>分享您的求職經驗</h1>
    <p class="lead">謝謝您這次讓 Step1ne 陪您走過求職的過程。花 2 分鐘留下感受，好的地方會繼續保持，不夠好的地方一定改進。</p>

    <form id="rv" novalidate>
      <fieldset>
        <legend>整體感受</legend>
        <span class="q" id="starQ">整體滿意度 <span class="req">*</span></span>
        <div class="stars" role="radiogroup" aria-labelledby="starQ">
          <button type="button" role="radio" aria-checked="false" data-v="1" aria-label="1 顆星，很不滿意">★</button>
          <button type="button" role="radio" aria-checked="false" data-v="2" aria-label="2 顆星，不太滿意">★</button>
          <button type="button" role="radio" aria-checked="false" data-v="3" aria-label="3 顆星，普通">★</button>
          <button type="button" role="radio" aria-checked="false" data-v="4" aria-label="4 顆星，滿意">★</button>
          <button type="button" role="radio" aria-checked="false" data-v="5" aria-label="5 顆星，非常滿意">★</button>
        </div>
        <div class="star-label" id="starLabel" aria-live="polite"></div>

        <span class="q">哪些地方最有幫助？（可複選）</span>
        <div class="chips">
          <label><input type="checkbox" name="helpful" value="職缺資訊講得清楚">職缺資訊講得清楚</label>
          <label><input type="checkbox" name="helpful" value="推薦的職缺符合需求">推薦的職缺符合需求</label>
          <label><input type="checkbox" name="helpful" value="面試前的準備">面試前的準備</label>
          <label><input type="checkbox" name="helpful" value="進度回覆即時">進度回覆即時</label>
          <label><input type="checkbox" name="helpful" value="薪資與條件溝通">薪資與條件溝通</label>
          <label><input type="checkbox" name="helpful" value="AI 線上面談方便">AI 線上面談方便</label>
          <label><input type="checkbox" name="helpful" value="到職後的關心">到職後的關心</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>您的心得</legend>
        <label for="review">想說的話 <span class="req">*</span></label>
        <textarea id="review" name="review" maxlength="3000" placeholder="例如：一開始在猶豫什麼、過程中哪件事讓您印象深刻、最後的結果如何"></textarea>
        <div class="hint">至少 10 個字。</div>

        <label for="improve">有什麼可以做得更好？</label>
        <textarea id="improve" name="improve" maxlength="2000" style="min-height:76px" placeholder="選填，直接說沒關係"></textarea>
      </fieldset>

      <fieldset>
        <legend>關於您</legend>
        <label for="name">您的稱呼 <span class="req">*</span></label>
        <input type="text" id="name" name="name" maxlength="40" autocomplete="name" placeholder="例：王小明">
        <div class="hint">只給負責的顧問看，不會公開。</div>

        <label for="job">面試的職缺 <span class="req">*</span></label>
        <input type="text" id="job" name="job" maxlength="120" placeholder="例：遊戲客服專員">

        <span class="q">錄取的職缺 <span class="req">*</span></span>
        <div class="opts">
          <label><input type="radio" name="offer" value="same"><span>就是上面面試的那個職缺</span></label>
          <label><input type="radio" name="offer" value="other"><span>錄取了其他職缺</span></label>
          <label><input type="radio" name="offer" value="none"><span>這次沒有錄取</span></label>
        </div>
        <input type="text" id="offered" name="offered" maxlength="120" placeholder="錄取的職缺名稱" hidden style="margin-top:8px">

        <label for="consultant">負責的顧問</label>
        <input type="text" id="consultant" name="consultant" maxlength="40" placeholder="選填">

        <span class="q">這則心得可以放上官網嗎？ <span class="req">*</span></span>
        <div class="opts">
          <label><input type="radio" name="consent" value="anon"><span>可以，匿名放上官網<small>不會出現名字，只寫職位類型，例：「遊戲客服專員」</small></span></label>
          <label><input type="radio" name="consent" value="surname"><span>可以，只寫姓氏<small>例：「遊戲客服專員・王先生」</small></span></label>
          <label><input type="radio" name="consent" value="private"><span>不要放<small>只作為內部改進參考</small></span></label>
        </div>

        <label for="contact">Email 或電話</label>
        <input type="text" id="contact" name="contact" maxlength="120" autocomplete="email" placeholder="選填，方便後續聯繫">

        <div class="hp" aria-hidden="true"><label>網站<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      </fieldset>

      <button type="submit" class="submit">送出心得</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="foot">德仁管理顧問有限公司（Step1ne）｜私立就業服務機構許可證號：北市就服字第 0363 號</p>
  </div>

  <div class="done" id="doneBox" role="status">
    <h2>謝謝您的分享！</h2>
    <p>已經收到了。之後有新的工作機會，或想找人聊聊職涯，隨時都可以回來找 Step1ne。</p>
    <a class="line-btn" href="https://lin.ee/XcSWPzM" target="_blank" rel="noopener">加入 LINE 官方帳號</a>
  </div>
</main>

<script>
(function () {
  var API = 'https://step1ne-recruit-api.aiagentg888.workers.dev/review/submit';
  var f = document.getElementById('rv');
  var msg = document.getElementById('msg');
  var qs = new URLSearchParams(location.search);
  // 連結可以帶顧問、職位預先填好，人選不用自己打
  if (qs.get('c')) f.consultant.value = qs.get('c').slice(0, 40);
  if (qs.get('j')) f.job.value = qs.get('j').slice(0, 120);
  if (qs.get('n')) f.name.value = qs.get('n').slice(0, 40);
  // ?o=錄取職缺：跟面試的一樣就勾「同一個」，不一樣就勾「其他」並填好
  var offeredBox = document.getElementById('offered');
  function syncOffer() {
    var o = (f.querySelector('input[name=offer]:checked') || {}).value;
    offeredBox.hidden = o !== 'other';
    if (o === 'other') offeredBox.focus();
  }
  Array.prototype.forEach.call(f.querySelectorAll('input[name=offer]'), function (r) { r.addEventListener('change', syncOffer); });
  if (qs.get('o')) {
    var ov = qs.get('o').slice(0, 120);
    if (ov === f.job.value) f.querySelector('input[name=offer][value=same]').checked = true;
    else { f.querySelector('input[name=offer][value=other]').checked = true; offeredBox.value = ov; offeredBox.hidden = false; }
  }

  var rating = 0;
  var LABELS = ['', '很不滿意', '不太滿意', '普通', '滿意', '非常滿意'];
  var stars = Array.prototype.slice.call(document.querySelectorAll('.stars button'));
  function setRating(v) {
    rating = v;
    stars.forEach(function (b) {
      var n = +b.dataset.v;
      b.classList.toggle('on', n <= v);
      b.setAttribute('aria-checked', n === v ? 'true' : 'false');
    });
    document.getElementById('starLabel').textContent = v ? v + ' 顆星・' + LABELS[v] : '';
  }
  stars.forEach(function (b, i) {
    b.addEventListener('click', function () { setRating(+b.dataset.v); });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); var n = Math.min(5, (rating || 0) + 1); setRating(n); stars[n - 1].focus(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); var m = Math.max(1, (rating || 2) - 1); setRating(m); stars[m - 1].focus(); }
    });
  });

  function err(t) { msg.textContent = t; msg.className = 'msg err'; }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = function (n) { return (f.elements[n] && f.elements[n].value || '').trim(); };
    var consent = (f.querySelector('input[name=consent]:checked') || {}).value || '';
    if (!rating) return err('請選整體滿意度（點星星）');
    if (v('review').length < 10) { f.review.focus(); return err('心得請至少寫 10 個字'); }
    if (!v('name')) { f.name.focus(); return err('請填您的稱呼'); }
    if (!v('job')) { f.job.focus(); return err('請填面試的職缺'); }
    var offer = (f.querySelector('input[name=offer]:checked') || {}).value || '';
    if (!offer) return err('請選錄取的職缺');
    if (offer === 'other' && !v('offered')) { offeredBox.focus(); return err('請填錄取的職缺名稱'); }
    var offered = offer === 'same' ? v('job') : offer === 'other' ? v('offered') : '（這次沒有錄取）';
    if (!consent) return err('請選這則心得可不可以放上官網');
    var btn = f.querySelector('button.submit');
    btn.disabled = true; btn.textContent = '送出中…'; msg.textContent = ''; msg.className = 'msg';
    fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        rating: rating, review: v('review'), improve: v('improve'), name: v('name'), job: v('job'),
        consultant: v('consultant'), offered: offered, consent: consent, contact: v('contact'), website: v('website'),
        helpful: Array.prototype.map.call(f.querySelectorAll('input[name=helpful]:checked'), function (x) { return x.value; }),
        ref: (qs.get('ref') || '').slice(0, 80), page: location.pathname + location.search
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        document.getElementById('formBox').style.display = 'none';
        document.getElementById('doneBox').style.display = 'block';
        window.scrollTo(0, 0);
        if (window.gtag) gtag('event', 'service_review_submit', { rating: rating });
      } else {
        btn.disabled = false; btn.textContent = '送出心得';
        err(d.error || '送出失敗，請再試一次');
      }
    }).catch(function () {
      btn.disabled = false; btn.textContent = '送出心得';
      err('網路不穩，請再試一次');
    });
  });
})();
</script>
</body>
</html>
